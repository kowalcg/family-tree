 found.","pl":"Rodzina Pryłowskich w Szczecinie: Aleksy (1928–2000), żona Maria (1934–2025) i syn Andrzej (1958–2013). Pryłowski to pisownia nazwiska z Dobrcza i Serocka, a Aleksy jest z pokolenia Stefana; możliwy brat lub kuzyn i jedyny szczeciński dom, o który warto zapytać. Maria zmarła w grudniu 2025 r., więc jej dzieci da się odnaleźć."}},{"id":"maria_pry","g":"Maria","s":"Pryłowska","x":"F","b":"16 Jun 1934","d":"9 Dec 2025","dp":"Szczecin","sp":["aleksy_pry"],"st":"possible","ln":"prelowski","src":"Szczecin Central Cemetery, grave 104/8/24"},{"id":"adrian_p","g":"Adrian","s":"Prełowski","x":"M","b":"c. 1936","bq":1,"d":"4 Dec 2022","dp":"Chełmno","st":"possible","ln":"prelowski","src":"e-chelmno.pl obituary, Dec 2022, aged 86","n":{"en":"A Chełmno contemporary of Stefan (1939); possible brother or first cousin.","pl":"Chełmiński rówieśnik Stefana (1939); możliwy brat lub brat stryjeczny."}},{"id":"wojciech_p","g":"Wojciech Tomasz","s":"Prełowski","x":"M","st":"verified","ln":"prelowski","liv":1},{"id":"bronislaus_p1901","g":"Bronisław","s":"Pryłowski","x":"M","b":"1901","bp":"Osielsko","d":"1920","dp":"Osielsko","f":"leo_p1877","mo":"martha_wic","st":"verified","ln":"prelowski","lk":"verified","src":"Osielsko 1901; death 1920, aged 18½"},{"id":"franz_p1903","g":"Franciszek","s":"Pryłowski","x":"M","b":"1903","bp":"Osielsko","f":"leo_p1877","mo":"martha_wic","st":"verified","ln":"prelowski","lk":"verified","src":"Osielsko 1903","n":{"en":"Born 1903: the right generation to father a child in 1939, but nothing links him to Stefan.","pl":"Urodzony w 1903 r.: właściwe pokolenie, by mieć syna w 1939 r., ale nic nie łączy go ze Stefanem."}},{"id":"leo_p1877","g":"Leon","s":"Prełowski","x":"M","b":"1877","bp":"Dobrcz","d":"1945","dp":"Osielsko","f":"adalbert_p1843","mo":"catharina_fal","sp":["martha_wic"],"st":"verified","ln":"prelowski","lk":"probable","src":"Dobrcz 1877/29 (ADP W242, photo 0108); marriage Osielsko 1899; death Osielsko 1945 (P/640/0171/14); possibly the 'Prylowski, Leo, Dobrcz' wounded in the Prussian army, casualty list 13 Jun 1917","ph":["VL-1917-06-13-Prylowski-Leo-Dobrcz-verwundet.jpg"],"n":{"en":"A 'Leo Prylowski of Dobrcz' was wounded in the Prussian army in June 1917; at 40 he would have been a Landsturm man, or the entry is a younger Leo of the same village.","pl":"„Leo Prylowski z Dobrcza” został ranny w armii pruskiej w czerwcu 1917 r.; w wieku 40 lat byłby landszturmistą, albo wpis dotyczy młodszego Leona z tej samej wsi."}},{"id":"martha_wic","g":"Marta","s":"Prełowska","m":"Wicichowska","x":"F","sp":["leo_p1877"],"st":"verified","ln":"prelowski","src":"Osielsko marriage 1899"},{"id":"adalbert_p1843","g":"Wojciech (Adalbert)","s":"Prełowski","x":"M","b":"1843","bp":"Dobrcz","d":"1917","dp":"Osielsko","f":"stanislaus_p","mo":"constantia_ros","sp":["catharina_fal"],"st":"verified","ln":"prelowski","lk":"probable","src":"Dobrcz 1843 (ADP W241/0021/128); marriage Wudzyn 1866 (W509/0014/3); death Osielsko 1917, aged 74","n":{"en":"Nine children between 1866 and 1888 at Serock, Wudzyn and Dobrcz, villages north of Bydgoszcz in the diocese of Pelplin. The registers, kept in German and Latin under Prussia, write him Adalbert.","pl":"Dziewięcioro dzieci w latach 1866–1888 w Serocku, Wudzynie i Dobrczu, wsiach na północ od Bydgoszczy w diecezji pelplińskiej. Księgi, prowadzone pod zaborem pruskim po niemiecku i łacinie, zapisują go jako Adalbert."}},{"id":"catharina_fal","g":"Katarzyna","s":"Prełowska","m":"Faleńczyk","x":"F","sp":["adalbert_p1843"],"st":"verified","ln":"prelowski","src":"Wudzyn marriage 1866"},{"id":"stanislaus_p","g":"Stanisław","s":"Prełowski","x":"M","b":"c. 1812","bq":1,"d":"1851","dp":"Dobrcz","sp":["constantia_ros"],"st":"verified","ln":"prelowski","src":"Niewieścin marriage 1831; Dobrcz death 1851, aged 39 (ADP W244/0050/21)","n":{"en":"The head of the deepest verified Prełowski chain. Married Konstancja Rościszewska at Niewieścin in 1831 and died at Dobrcz in 1851 aged 39; six children baptised at Niewieścin and Dobrcz between 1832 and 1850. Behind him the Niewieścin and Gruczno registers hold Prełowski baptisms from 1754 and 1761, not yet linked.","pl":"Głowa najgłębszego potwierdzonego łańcucha Prełowskich. Ożenił się z Konstancją Rościszewską w Niewieścinie w 1831 r. i zmarł w Dobrczu w 1851 r. w wieku 39 lat; sześcioro dzieci ochrzczonych w Niewieścinie i Dobrczu w latach 1832–1850. Za nim księgi Niewieścina i Gruczna zawierają chrzty Prełowskich od 1754 i 1761 r., jeszcze niepowiązane."}},{"id":"constantia_ros","g":"Konstancja","s":"Prełowska","m":"Rościszewska","x":"F","sp":["stanislaus_p"],"st":"verified","ln":"prelowski","src":"Niewieścin marriage 1831"},{"id":"theodor_p1890","g":"Teodor Teofil","s":"Prełowski","x":"M","b":"1890","bp":"Dobrcz","f":"andreas_p1862","mo":"katarzyna_burz","st":"verified","ln":"prelowski","lk":"verified","src":"Dobrcz 1890/65 (ADP W242/0197)"},{"id":"francisca_p1892","g":"Franciszka","s":"Prełowska","x":"F","b":"1892","bp":"Dobrcz","f":"andreas_p1862","mo":"katarzyna_burz","st":"verified","ln":"prelowski","lk":"verified","src":"Dobrcz 1892/9"},{"id":"helene_p1893","g":"Helena","s":"Prełowska","x":"F","b":"1893","bp":"Dobrcz","f":"andreas_p1862","mo":"katarzyna_burz","st":"verified","ln":"prelowski","lk":"verified","src":"Dobrcz 1893/62"},{"id":"bronislaw_p1896","g":"Bronisław","s":"Prełowski","x":"M","b":"1896","bp":"Dobrcz","f":"andreas_p1862","mo":"katarzyna_burz","st":"verified","ln":"prelowski","lk":"verified","src":"Dobrcz 1896/4"},{"id":"andreas_p1862","g":"Andrzej","s":"Prełowski","x":"M","b":"1862","bp":"Serock","f":"franz_p1837","mo":"marianna_smol","sp":["katarzyna_burz"],"st":"verified","ln":"prelowski","lk":"probable","src":"Serock 1862 (ADP W1391/009/71); Dobrcz marriage 1889/11 (W243/0049)","n":{"en":"Dobrcz births are indexed only to 1896, so any sons born 1897–1910, the generation that could father Stefan in 1939, are invisible. Edmund Prelowski (1917–2000) of nearby Koronowo may be his grandson.","pl":"Chrzty z Dobrcza są zindeksowane tylko do 1896 r., więc synowie urodzeni w latach 1897–1910, pokolenie mogące być ojcem Stefana w 1939 r., pozostają niewidoczni. Edmund Prelowski (1917–2000) z pobliskiego Koronowa może być jego wnukiem."}},{"id":"katarzyna_burz","g":"Katarzyna","s":"Prełowska","m":"Burzyńska","x":"F","sp":["andreas_p1862"],"st":"verified","ln":"prelowski","src":"Dobrcz marriage 1889/11"},{"id":"franz_p1837","g":"Franciszek","s":"Pryłowski","x":"M","b":"c. 1835","bq":1,"d":"1901","dp":"Dobrcz","sp":["marianna_smol"],"st":"verified","ln":"prelowski","src":"Wudzyn marriage 1855 (W509/0003/6); Dobrcz death 1901, aged 64 (W245/0132/8)","n":{"en":"Possibly the Franciszek baptised at Niewieścin in 1834, a son of Stanisław and Konstancja, which would join chains A and B; the ages fit but no record says so.","pl":"Być może Franciszek ochrzczony w Niewieścinie w 1834 r., syn Stanisława i Konstancji, co połączyłoby oba łańcuchy; wiek się zgadza, ale żaden akt tego nie mówi."}},{"id":"marianna_smol","g":"Marianna","s":"Pryłowska","m":"Smolińska","x":"F","sp":["franz_p1837"],"st":"verified","ln":"prelowski","src":"Wudzyn marriage 1855"},{"id":"edmund_p1917","g":"Edmund","s":"Prelowski","x":"M","b":"1917","d":"2000","dp":"Koronowo","st":"possible","ln":"prelowski","src":"Grobonet, Koronowo cemetery"},{"id":"adam_pr1891","g":"Adam","s":"Prelewski","x":"M","b":"1891","bp":"Czernikówek, par. Czernikowo","f":"feliks_pr","mo":"agnieszka_rut","sp":["julianna_pacz"],"st":"verified","ln":"prelowski","lk":"verified","src":"Czernikowo 1891/158; marriage 1910/11 (Uszyńska_Hanna)","n":{"en":"Married Julianna Paczkowska at Czernikowo in 1910, in the very parish where Helena Zakierska was born 26 years later. Their children, born 1911–1930, are past the end of the index. If one of them was Stefan's father, Stefan and Helena grew up in the same parish. A possible line, no better than the Chełmno one.","pl":"Ożenił się z Julianną Paczkowską w Czernikowie w 1910 r., w tej samej parafii, w której 26 lat później urodziła się Helena Zakierska. Ich dzieci, urodzone w latach 1911–1930, wykraczają poza indeks. Jeśli jedno z nich było ojcem Stefana, Stefan i Helena wyrośli w tej samej parafii. Linia możliwa, nie lepsza niż chełmińska."}},{"id":"julianna_pacz","g":"Julianna","s":"Prelewska","m":"Paczkowska","x":"F","sp":["adam_pr1891"],"st":"verified","ln":"prelowski","src":"Czernikowo marriage 1910/11: daughter of Jan and Jadwiga Machcińska"},{"id":"feliks_pr","g":"Feliks","s":"Prylewski","x":"M","f":"andrzej_pr","mo":"wiktoria_brz","sp":["agnieszka_rut"],"st":"verified","ln":"prelowski","lk":"verified","src":"Czernikowo marriage 1890/7"},{"id":"agnieszka_rut","g":"Agnieszka","s":"Prelewska","m":"Rutkowska","x":"F","sp":["feliks_pr"],"st":"verified","ln":"prelowski","src":"Czernikowo marriage 1890/7: daughter of Karol and Konstancja Lisińska"},{"id":"andrzej_pr","g":"Andrzej","s":"Prylewski","x":"M","sp":["wiktoria_brz"],"st":"verified","ln":"prelowski","src":"Named as groom's parents, Czernikowo marriage 1890/7"},{"id":"wiktoria_brz","g":"Wiktoria","s":"Prylewska","m":"Brzozowska","x":"F","sp":["andrzej_pr"],"st":"verified","ln":"prelowski","src":"Czernikowo marriage 1890/7"},{"id":"lucjan_p1922","g":"Lucjan","s":"Prelowski","x":"M","b":"1 Jul 1922","bp":"Bydgoszcz (Bromberg)","st":"verified","ln":"prelowski","src":"Arolsen Archives, Stutthof file 1.1.41.2 / 01014102 103.102, prisoner 24945","ph":["arolsen-lucjan-prelowski-1922-97246414-001.jpg"],"n":{"en":"A roofer from Bydgoszcz, single, sent by the Bromberg Gestapo to Stutthof concentration camp from 27 August to 29 October 1943. Relationship to the Toruń family unknown; possibly the same extended Bydgoszcz-area family.","pl":"Dekarz z Bydgoszczy, kawaler, wysłany przez bydgoskie Gestapo do obozu Stutthof od 27 sierpnia do 29 października 1943 r. Pokrewieństwo z rodziną toruńską nieznane; możliwe, że ta sama szeroka rodzina z okolic Bydgoszczy."}},{"id":"antoni_dram","g":"Antoni","s":"Dramiński","x":"M","b":"22 Nov 1897","bp":"Kosemin, par. Zawidz","d":"4 Mar 1967","dp":"Mrągowo","f":"stanislaw_dram","mo":"teofila_wis","sp":["zofia_karcz"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1922/32 (24 May 1922, bachelor aged 24, son of Stanisław and Teofila Wiśniewska); headstone Mrągowo municipal cemetery G/2/22 (probable identification); named on Teresa's death certificate","ph":["grave-mragowo-antoni-zofia-draminscy-1.jpg"],"n":{"en":"Greg's grandfather. Married Zofia Karczewska at Zawidz on 24 May 1922, he 24, she 21, both of Kosemin. After the war the family went north to Masuria like so many from this district; a headstone in Mrągowo municipal cemetery, plot G/2/22, with the couple's photograph, reads 'Dramińscy, Antoni 22 XI 1897 – 4 III 1967, Zofia 28 X 1902 – 10 XI 1963', a probable match pending the Mrągowo death acts. His brother Czesław (born 1910) fought in the Home Army and survived Stutthof.","pl":"Dziadek Grzegorza. Ożenił się z Zofią Karczewską w Zawidzu 24 maja 1922 r., on lat 24, ona 21, oboje z Kosemina. Po wojnie rodzina ruszyła na północ, na Mazury, jak wielu z tego powiatu; nagrobek na cmentarzu komunalnym w Mrągowie, kwatera G/2/22, ze zdjęciem małżonków, głosi: „Dramińscy, Antoni 22 XI 1897 – 4 III 1967, Zofia 28 X 1902 – 10 XI 1963”; identyfikacja prawdopodobna do potwierdzenia aktami zgonu z USC Mrągowo. Jego brat Czesław (ur. 1910) walczył w AK i przeżył Stutthof."}},{"id":"zofia_karcz","g":"Zofia","s":"Dramińska","m":"Karczewska","x":"F","b":"28 Oct 1902","bp":"par. Zawidz","d":"10 Nov 1963","dp":"Mrągowo","f":"ignacy_karcz","mo":"aniela_chyz","sp":["antoni_dram"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1922/32 (aged 21, daughter of Ignacy and Aniela Chyżyńska); headstone Mrągowo G/2/22 (probable)","ph":["grave-mragowo-antoni-zofia-draminscy-2.jpg"],"n":{"en":"Greg's grandmother, of the Karczewski family of Zawidz parish. Died in Mrągowo in 1963, aged 61, when Greg's mother was 28.","pl":"Babka Grzegorza, z Karczewskich z parafii Zawidz. Zmarła w Mrągowie w 1963 r., w wieku 61 lat, gdy matka Grzegorza miała 28 lat."}},{"id":"wladyslaw_dram","g":"Władysław","s":"Dramiński","x":"M","b":"c. 1893–1896","bq":1,"bp":"Kosemin","f":"stanislaw_dram","mo":"teofila_wis","st":"verified","ln":"draminski","lk":"verified","src":"Bieżuń marriage 1917/6 to Teodozja Dejewska ('Kosemin and Bieżuń')"},{"id":"czeslaw_dram","g":"Czesław","s":"Dramiński","x":"M","b":"3 Jun 1910","bp":"Kosemin, pow. Sierpc","f":"stanislaw_dram","mo":"teofila_wis","st":"verified","ln":"draminski","lk":"verified","src":"straty.pl (IPN) card 6193612: farmer, Home Army, arrested by the Gestapo 1944, Stutthof prisoner 50534, survived; Zawidz marriage 1931/10 to Marianna Żółtowska (probable)","n":{"en":"Teresa's uncle. A farmer at Kosemin and a Home Army soldier, arrested by the Gestapo in 1944 and sent to Stutthof as prisoner 50534. He survived.","pl":"Wuj Teresy. Gospodarz w Koseminie i żołnierz Armii Krajowej, aresztowany przez Gestapo w 1944 r. i wysłany do Stutthofu jako więzień nr 50534. Przeżył."}},{"id":"stanislaw_dram","g":"Stanisław","s":"Dramiński","x":"M","b":"c. 1860s","bq":1,"bp":"par. Zawidz","d":"before 1915","f":"jakub_dram","mo":"marianna_nag","sp":["teofila_wis"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1892/24; named as father in 1922/32 and 1917/6; his widow remarried at Zawidz 1915/3","n":{"en":"Greg's great-grandfather. Married Teofila Wiśniewska at Zawidz in 1892; sons Władysław, Antoni (1897) and Czesław (1910). Dead by 1915, when Teofila remarried Franciszek Safianowski.","pl":"Pradziadek Grzegorza. Ożenił się z Teofilą Wiśniewską w Zawidzu w 1892 r.; synowie Władysław, Antoni (1897) i Czesław (1910). Zmarł przed 1915 r., gdy Teofila wyszła ponownie za Franciszka Safianowskiego."}},{"id":"teofila_wis","g":"Teofila","s":"Dramińska","m":"Wiśniewska","x":"F","b":"c. 1870","bq":1,"bp":"par. Zawidz","f":"jan_wis","mo":"antonina_pior","sp":["stanislaw_dram","franciszek_saf"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriages 1892/24 and 1915/3 (widow of Stanisław)"},{"id":"franciszek_saf","g":"Franciszek","s":"Safianowski","x":"M","bp":"Izbica, gub. kaliska","sp":["teofila_wis"],"st":"verified","ln":"draminski","src":"Zawidz marriage 1915/3"},{"id":"jakub_dram","g":"Jakub","s":"Dramiński","x":"M","b":"c. 1830s","bq":1,"bp":"Kosemin (probably)","f":"michal_dram","mo":"wiktoria_dram","sp":["marianna_nag"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1857/8; his widow remarried 1875/7","n":{"en":"Greg's great-great-grandfather. Married Marianna Naguszewska at Zawidz in 1857; children Stanisław, Aniela (married 1880) and Józef (married 1885). Dead by 1875, when Marianna remarried Michał Abramowski.","pl":"Prapradziadek Grzegorza. Ożenił się z Marianną Naguszewską w Zawidzu w 1857 r.; dzieci Stanisław, Aniela (ślub 1880) i Józef (ślub 1885). Zmarł przed 1875 r., gdy Marianna wyszła ponownie za Michała Abramowskiego."}},{"id":"marianna_nag","g":"Marianna","s":"Dramińska","m":"Naguszewska","x":"F","b":"c. 1835","bq":1,"bp":"par. Zawidz","f":"jakub_nag","mo":"jadwiga_nag","sp":["jakub_dram","michal_abr"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriages 1857/8 and 1875/7"},{"id":"michal_abr","g":"Michał","s":"Abramowski","x":"M","sp":["marianna_nag"],"st":"verified","ln":"draminski","src":"Zawidz marriage 1875/7"},{"id":"aniela_szp","g":"Aniela","s":"Szpejna","m":"Dramińska","x":"F","f":"jakub_dram","mo":"marianna_nag","st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1880/4 to Jan Szpejna"},{"id":"jozef_dram_z","g":"Józef","s":"Dramiński","x":"M","f":"jakub_dram","mo":"marianna_nag","st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1885/26 to Weronika Abramowska"},{"id":"michal_dram","g":"Michał","s":"Dramiński","x":"M","b":"c. 1800","bq":1,"bp":"Dzierzno, par. Świedziebnia (possibly)","sp":["wiktoria_dram"],"st":"verified","ln":"draminski","src":"Named as father in Zawidz marriage 1857/8","n":{"en":"Greg's 3× great-grandfather, named in his son's 1857 marriage act. A Wojciech Dramiński from Dzierzno near Świedziebnia married at Zawidz in 1838 and lived at Kosemin, which suggests the family arrived there from the Dobrzyń land in the 1830s. A Michał and Anna Dramiński at Dzierzno and Zawidz between 1800 and 1828 may be an earlier generation; possible only.","pl":"Trzykrotny pradziadek Grzegorza, wymieniony w akcie ślubu syna z 1857 r. Wojciech Dramiński z Dzierzna pod Świedziebnią ożenił się w Zawidzu w 1838 r. i mieszkał w Koseminie, co wskazuje, że rodzina przybyła tam z ziemi dobrzyńskiej w latach 30. XIX w. Michał i Anna Dramińscy w Dzierznie i Zawidzu w latach 1800–1828 mogą być wcześniejszym pokoleniem; tylko możliwe."}},{"id":"wiktoria_dram","g":"Wiktoria","s":"Dramińska","x":"F","sp":["michal_dram"],"st":"verified","ln":"draminski","src":"Named as mother in Zawidz marriage 1857/8"},{"id":"wojciech_dram1838","g":"Wojciech","s":"Dramiński","x":"M","bp":"Dzierzno (Dzierżenko), par. Świedziebnia","st":"verified","ln":"draminski","src":"Zawidz marriage 1838/5 to Honorata Antoszewska, residence Kosemin","n":{"en":"The first Dramiński recorded at Kosemin, in 1838; probable kin of Michał.","pl":"Pierwszy Dramiński zapisany w Koseminie, w 1838 r.; prawdopodobny krewny Michała."}},{"id":"jakub_nag","g":"Jakub","s":"Naguszewski","x":"M","sp":["jadwiga_nag"],"st":"verified","ln":"draminski","src":"Zawidz marriages 1853/11, 1856/3, 1857/8, 1860/10"},{"id":"jadwiga_nag","g":"Jadwiga","s":"Naguszewska","m":"Siejkowicz","x":"F","sp":["jakub_nag"],"st":"verified","ln":"draminski","src":"Zawidz marriages 1860/10 (Siejkowicz) and 1875/7 (Czajeska)"},{"id":"jan_wis","g":"Jan","s":"Wiśniewski","x":"M","f":"antoni_wis","mo":"marianna_wis","sp":["antonina_pior"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1858/1"},{"id":"antonina_pior","g":"Antonina","s":"Wiśniewska","m":"Piórkowska","x":"F","f":"jozef_pior","mo":"konstancja_pior","sp":["jan_wis"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1858/1"},{"id":"antoni_wis","g":"Antoni","s":"Wiśniewski","x":"M","sp":["marianna_wis"],"st":"verified","ln":"draminski","src":"Named in Zawidz marriage 1858/1"},{"id":"marianna_wis","g":"Marianna","s":"Wiśniewska","x":"F","sp":["antoni_wis"],"st":"verified","ln":"draminski","src":"Named in Zawidz marriage 1858/1"},{"id":"jozef_pior","g":"Józef","s":"Piórkowski","x":"M","sp":["konstancja_pior"],"st":"verified","ln":"draminski","src":"Named in Zawidz marriages 1848/3, 1857/6, 1858/1"},{"id":"konstancja_pior","g":"Konstancja","s":"Piórkowska","x":"F","sp":["jozef_pior"],"st":"verified","ln":"draminski","src":"Named in Zawidz marriages 1848/3, 1857/6, 1858/1"},{"id":"ignacy_karcz","g":"Ignacy","s":"Karczewski","x":"M","b":"c. 1855–1862","bq":1,"f":"andrzej_karcz","mo":"marianna_bab","sp":["aniela_chyz"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1883/25; named as father in 1922/32","n":{"en":"Greg's great-grandfather on the Karczewski side. Married Aniela Chyżyńska at Zawidz in 1883.","pl":"Pradziadek Grzegorza po Karczewskich. Ożenił się z Anielą Chyżyńską w Zawidzu w 1883 r."}},{"id":"aniela_chyz","g":"Aniela","s":"Karczewska","m":"Chyżyńska","x":"F","b":"c. 1860","bq":1,"bp":"par. Zawidz","f":"franciszek_chyz","mo":"michalina_nal","sp":["ignacy_karcz"],"st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1883/25"},{"id":"andrzej_karcz","g":"Andrzej","s":"Karczewski","x":"M","sp":["marianna_bab"],"st":"verified","ln":"draminski","src":"Named as father in Zawidz marriage 1883/25"},{"id":"marianna_bab","g":"Marianna","s":"Karczewska","m":"Babecka","x":"F","sp":["andrzej_karcz"],"st":"verified","ln":"draminski","src":"Named as mother in Zawidz marriage 1883/25"},{"id":"franciszek_chyz","g":"Franciszek","s":"Chyżyński","x":"M","sp":["michalina_nal"],"st":"verified","ln":"draminski","src":"Named as father in Zawidz marriages 1883/25 and 1883/6"},{"id":"michalina_nal","g":"Michalina","s":"Chyżyńska","m":"Nalbert","x":"F","sp":["franciszek_chyz"],"st":"verified","ln":"draminski","src":"Named as mother in Zawidz marriages 1883/25 and 1883/6"},{"id":"konstanty_chyz","g":"Konstanty","s":"Chyżyński","x":"M","f":"franciszek_chyz","mo":"michalina_nal","st":"verified","ln":"draminski","lk":"verified","src":"Zawidz marriage 1883/6 to Anna Laskowska"},{"id":"marian_d","g":"Marian","s":"Dramiński","x":"M","b":"c. 1908–1914","bq":1,"f":"julian_d1866","mo":"janina_dab","sp":["michalina_mik"],"st":"verified","ln":"draminski","lk":"verified","src":"Marki marriage 1935/79 (Warsaw-Praga diocesan archive index)","n":{"en":"Married Michalina Miklaszewska at Marki, 10 km from Warsaw, in 1935. Before Teresa's death certificate named her parents, this couple was the leading candidate; they are now known not to be them.","pl":"Ożenił się z Michaliną Miklaszewską w Markach, 10 km od Warszawy, w 1935 r., roku urodzenia Teresy. Jedyne gospodarstwo Dramińskich u bram Warszawy w latach 30., a więc pierwszy kandydat na rodziców Teresy, choć numer aktu 79 wskazuje na ślub pod koniec roku, co czyni chronologię napiętą. Jego akt urodzenia nie został odnaleziony."}},{"id":"michalina_mik","g":"Michalina","s":"Dramińska","m":"Miklaszewska","x":"F","sp":["marian_d"],"st":"verified","ln":"draminski","src":"Marki marriage 1935/79: daughter of Bronisław and Eleonora Jastrzębska"},{"id":"julian_d1866","g":"Julian Seweryn","s":"Dramiński","x":"M","b":"1866","bp":"Cywiny Litwinki, par. Gralewo","d":"5 Nov 1919","dp":"Unieck","f":"antoni_d1840","mo":"antonina_nad","sp":["janina_dab"],"st":"verified","ln":"draminski","lk":"verified","src":"Gralewo 1866/3 (scan read); Płock św. Bartłomieja marriage 1907/112 (szukajwarchiwach 17254407); Unieck death 1919/84 (scan read)","ph":["1866-Gralewo-B3-Julian-Seweryn-Draminski.jpg","1919-Unieck-D84-Julian-Draminski.jpg"],"n":{"en":"The 1866 Gralewo register, read from the scan, records 'Antoni Dramiński, szlachcic of Cywiny Litwinki, aged 25' presenting a son born 8 January 1866 of his wife Antonina née Nadratowska, named Julian Seweryn. He married a Warsaw girl, Janina Dabińska, at Płock in 1907. The Unieck death register for 1919, also read from the scan, says he died at Chądzyny Krusze on 5 November 1919 at 8 in the evening, aged 53, 'living on his own means', leaving the widow Janina. This is the family that carried the Dramiński name from the Płońsk country to Warsaw.","pl":"Księga gralewska z 1866 r., odczytana ze skanu, notuje „Antoniego Dramińskiego, szlachcica z Cywin Litwinek, lat 25”, który przedstawia syna urodzonego 8 stycznia 1866 r. z żony Antoniny z Nadratowskich, nazwanego Julian Seweryn. W 1907 r. ożenił się w Płocku z warszawianką Janiną Dabińską. Księga zgonów Uniecka z 1919 r., także odczytana ze skanu, podaje, że zmarł w Chądzynach Kruszach 5 listopada 1919 r. o 8 wieczorem, w wieku 53 lat, „utrzymujący się z własnych funduszów”, zostawiając wdowę Janinę. To rodzina, która przeniosła nazwisko Dramiński z ziemi płońskiej do Warszawy."}},{"id":"janina_dab","g":"Janina Anna","s":"Dramińska","m":"Dabińska","x":"F","bp":"Warszawa","sp":["julian_d1866"],"st":"verified","ln":"draminski","src":"Płock marriage 1907/112: 'panna z Warszawy', daughter of Ignacy and Helena Wesołowska"},{"id":"jadwiga_d1916","g":"Jadwiga","s":"Dramińska","x":"F","b":"11 Nov 1916","bp":"Skwary Dąbrowe, par. Naruszewo","d":"1916","f":"julian_d1866","mo":"janina_dab","st":"verified","ln":"draminski","lk":"verified","src":"Naruszewo 1916/26"},{"id":"antoni_d1840","g":"Antoni Józef","s":"Dramiński","x":"M","b":"13 Jun 1840","bp":"Kraszewo Gaczułty, par. Raciąż","f":"piotr_d1813","mo":"julianna_dob","sp":["antonina_nad","weronika_kul"],"st":"verified","ln":"draminski","lk":"verified","src":"Raciąż 1840/49; Lutocin marriage 1863/5 (scan read); Radzanów marriage 1879/31 (scan)","ph":["1863-Lutocin-S5-Antoni-Draminski-x-Antonina-Nadratowska.jpg","1879-Radzanow-S31-Antoni-Draminski-x-Weronika-Kulesza.jpg"],"n":{"en":"The 1863 marriage act at Lutocin, read from the scan, calls him 'a bachelor of Cywiny in Gralewo parish, born at Kraszewo Gaczułty, son of Piotr and the late Julianna née Dobrska, part-owners' of the hamlet, aged 22; the bride Antonina Nadratowska was 19. 'Właściciele cząstkowi', part-owners, is the register's term for petty nobility holding shares of a village. Widowed, he remarried Weronika Kulesza at Radzanów in 1879.","pl":"Akt ślubu z Lutocina z 1863 r., odczytany ze skanu, nazywa go „młodzianem zamieszkałym w Cywinach parafii gralewskiej, urodzonym w Kraszewie Gaczułtach z Piotra i nieżyjącej Julianny z Dóbrskich, właścicieli cząstkowych”, lat 22; panna młoda Antonina Nadratowska miała 19 lat. „Właściciele cząstkowi” to w księgach określenie drobnej szlachty posiadającej udziały we wsi. Owdowiawszy, ożenił się ponownie z Weroniką Kuleszą w Radzanowie w 1879 r."}},{"id":"antonina_nad","g":"Antonina","s":"Dramińska","m":"Nadratowska","x":"F","b":"c. 1844","bq":1,"sp":["antoni_d1840"],"st":"verified","ln":"draminski","src":"Lutocin marriage 1863/5: daughter of Kazimierz and Antonina Malewska, aged 19"},{"id":"weronika_kul","g":"Weronika","s":"Dramińska","m":"Kulesza","x":"F","sp":["antoni_d1840"],"st":"verified","ln":"draminski","src":"Radzanów marriage 1879/31"},{"id":"wladyslaw_db","g":"Władysław Bronisław","s":"Dramiński","x":"M","f":"antoni_d1840","mo":"antonina_nad","sp":["jozefa_targ"],"st":"verified","ln":"draminski","lk":"verified","src":"Płock św. Bartłomieja marriage 1904/34 (szukajwarchiwach 17254400)","n":{"en":"Julian's brother. Married Józefa Targowska at Płock in 1904; three sons born at Dźwierzno in Ciachcin parish.","pl":"Brat Juliana. Ożenił się z Józefą Targowską w Płocku w 1904 r.; trzech synów urodzonych w Dźwierznie w parafii Ciachcin."}},{"id":"jozefa_targ","g":"Józefa Maria","s":"Dramińska","m":"Targowska","x":"F","sp":["wladyslaw_db"],"st":"verified","ln":"draminski","src":"Płock marriage 1904/34"},{"id":"jerzy_d1904","g":"Jerzy Stanisław Antoni","s":"Dramiński","x":"M","b":"10 Dec 1904","bp":"Dźwierzno, par. Ciachcin","f":"wladyslaw_db","mo":"jozefa_targ","st":"verified","ln":"draminski","lk":"verified","src":"Ciachcin 1905/22 (szukajwarchiwach 17252720); IPN inventory node 5255843","n":{"en":"Arrested by the Germans on 24 October 1939, seven weeks into the occupation; the Institute of National Remembrance holds his mother's petition to the Gestapo from 1940–42. Teresa's first cousin once removed, if the Marian line is right.","pl":"Aresztowany przez Niemców 24 października 1939 r., siedem tygodni po rozpoczęciu okupacji; Instytut Pamięci Narodowej przechowuje prośbę jego matki do Gestapo z lat 1940–42. Brat stryjeczny ojca Teresy, jeśli linia Mariana jest właściwa."}},{"id":"jan_d1907","g":"Jan Barnaba","s":"Dramiński","x":"M","b":"16 Jan 1907","bp":"Dźwierzno, par. Ciachcin","f":"wladyslaw_db","mo":"jozefa_targ","st":"verified","ln":"draminski","lk":"verified","src":"Ciachcin 1907/22; Sobowo marriage 1936/5 to Maria Knaap"},{"id":"zygmunt_d1911","g":"Zygmunt","s":"Dramiński","x":"M","b":"15 Jan 1911","bp":"Dźwierzno, par. Ciachcin","f":"wladyslaw_db","mo":"jozefa_targ","st":"verified","ln":"draminski","lk":"verified","src":"Ciachcin 1911/26"},{"id":"piotr_d1813","g":"Piotr Teodor Wiktor","s":"Dramiński","x":"M","b":"1813","bp":"Cywiny Litwinki, par. Gralewo","f":"kajetan_d1773","mo":"jozefa_bor","sp":["julianna_dob"],"st":"verified","ln":"draminski","lk":"probable","src":"Gralewo 1813/15 and /62; Raciąż marriage 1839/10 as 'Teodor Wiktor'; Glinojeck 1842/21 as 'Piotr, ekonom' (scan read)","ph":["1842-Glinojeck-B21.jpg"],"n":{"en":"An 'ekonom', estate steward, in the 1842 Glinojeck baptism of his son Władysław, read from the scan. The 1839 marriage act calls him Teodor Wiktor, son of Kajetan and Józefa Borowska; his children's baptisms call him Piotr; the 1813 Gralewo baptism of 'Piotr Teodor Wiktor' of the same couple ties the names together. One soft spot: an 1826 entry gives Kajetan's age as 43, ten years younger than the 1773 baptism implies.","pl":"„Ekonom”, zarządca majątku, w akcie chrztu syna Władysława z Glinojecka z 1842 r., odczytanym ze skanu. Akt ślubu z 1839 r. nazywa go Teodorem Wiktorem, synem Kajetana i Józefy Borowskiej; chrzty jego dzieci nazywają go Piotrem; chrzest „Piotra Teodora Wiktora” tej samej pary w Gralewie w 1813 r. wiąże te imiona. Jedno słabe miejsce: zapis z 1826 r. podaje wiek Kajetana jako 43 lata, o dziesięć mniej, niż wynika z chrztu z 1773 r."}},{"id":"julianna_dob","g":"Julianna","s":"Dramińska","m":"Dobrska","x":"F","sp":["piotr_d1813"],"st":"verified","ln":"draminski","src":"Raciąż marriage 1839/10: daughter of Bonifacy and Katarzyna Starczewska"},{"id":"wladyslaw_d1842","g":"Władysław","s":"Dramiński","x":"M","b":"1 Jul 1842","bp":"Glinojeck","d":"1843","dp":"Unieck","f":"piotr_d1813","mo":"julianna_dob","st":"verified","ln":"draminski","lk":"verified","src":"Glinojeck 1842/21 (scan read)","ph":["1842-Glinojeck-B21.jpg"]},{"id":"serafina_d1844","g":"Serafina Konstancja","s":"Dramińska","x":"F","b":"1844","bp":"Sikory, par. Unieck","f":"piotr_d1813","mo":"julianna_dob","st":"verified","ln":"draminski","lk":"verified","src":"Unieck 1844/110"},{"id":"karolina_d1847","g":"Karolina Michalina","s":"Dramińska","x":"F","b":"1847","bp":"Cywiny Litwinki, par. Gralewo","f":"piotr_d1813","mo":"julianna_dob","st":"verified","ln":"draminski","lk":"verified","src":"Gralewo 1847/63"},{"id":"kajetan_d1773","g":"Kajetan Jan","s":"Dramiński","x":"M","b":"31 Aug 1773","bp":"Gralewo","d":"1831","dp":"Gralewo","f":"franciszek_d","mo":"salomea_dob","sp":["jozefa_bor"],"st":"probable","ln":"draminski","lk":"probable","src":"Gralewo 1773/3; death 1831/117, widower; children 1813–1826 at Cywiny Litwinki","n":{"en":"Baptised at Gralewo in August 1773, a year after the first partition of Poland, and buried there as a widower in 1831, the year of the November Uprising's defeat. Children with Józefa Borowska between 1813 and 1826.","pl":"Ochrzczony w Gralewie w sierpniu 1773 r., rok po pierwszym rozbiorze, i pochowany tam jako wdowiec w 1831 r., w roku klęski powstania listopadowego. Dzieci z Józefą Borowską w latach 1813–1826."}},{"id":"jozefa_bor","g":"Józefa","s":"Dramińska","m":"Borowska","x":"F","sp":["kajetan_d1773"],"st":"probable","ln":"draminski","src":"Gralewo births 1813–1826"},{"id":"franciszek_d","g":"Franciszek","s":"Dramiński","x":"M","b":"1741","bq":1,"bp":"Gralewo","d":"1813","f":"jerzy_d","mo":"felicjanna_cyw","sp":["salomea_dob"],"st":"probable","ln":"draminski","lk":"possible","src":"Gralewo marriage 1772 (sumariusz); baptism 1741/50 'Franciszek Eustachy' son of Jerzy and Felicjanna Cywińska","n":{"en":"Married Salomea Dobrska at Gralewo in 1772, the year of the first partition. Probably the Franciszek Eustachy baptised in 1741 to Jerzy Dramiński and Felicjanna Cywińska; that identification is possible, not proven.","pl":"Ożenił się z Salomeą Dobrską w Gralewie w 1772 r., roku pierwszego rozbioru. Prawdopodobnie ten Franciszek Eustachy, którego ochrzczono w 1741 r. jako syna Jerzego Dramińskiego i Felicjanny Cywińskiej; ta identyfikacja jest możliwa, nie dowiedziona."}},{"id":"salomea_dob","g":"Salomea","s":"Dramińska","m":"Dobrska","x":"F","sp":["franciszek_d"],"st":"probable","ln":"draminski","src":"Gralewo marriage 1772"},{"id":"jerzy_d","g":"Jerzy","s":"Dramiński","x":"M","b":"c. 1700–1710","bq":1,"sp":["felicjanna_cyw"],"st":"probable","ln":"draminski","src":"Gralewo baptisms 1730/43 (Salomea) and 1741/50 (Franciszek Eustachy)","n":{"en":"Children baptised at Gralewo between 1730 and 1743, in the reign of August II and August III. The parish's oldest Dramiński baptism is 1684, and the neighbouring Krajkowo parish records Dramiński baptisms from 1609, in the reign of Sigismund III Vasa.","pl":"Dzieci chrzczone w Gralewie w latach 1730–1743, za Augusta II i Augusta III. Najstarszy chrzest Dramińskiego w tej parafii pochodzi z 1684 r., a sąsiednia parafia Krajkowo notuje chrzty Dramińskich od 1609 r., za Zygmunta III Wazy."}},{"id":"felicjanna_cyw","g":"Felicjanna","s":"Dramińska","m":"Cywińska","x":"F","sp":["jerzy_d"],"st":"probable","ln":"draminski","src":"Gralewo baptisms 1730–1743","n":{"en":"A Cywińska, of the family that gave its name to the hamlet Cywiny.","pl":"Z Cywińskich, rodu, od którego wzięła nazwę zaścianek Cywiny."}},{"id":"tymolian_d1833","g":"Tymolian Józef","s":"Dramiński","x":"M","b":"1833","bp":"Cywiny Litwinki, par. Gralewo","d":"1888","dp":"Płońsk","f":"hilary_d1793","mo":"konstancja_sok","st":"verified","ln":"draminski","lk":"verified","src":"Gralewo 1833; Płońsk death 1888; children at Ojrzanów 1867–74 with Ludwika Kaliszewska"},{"id":"hilary_d1793","g":"Eustachy Hilary","s":"Dramiński","x":"M","b":"1793","bp":"Gralewo","d":"1839","f":"adam_d1750","mo":"monika_smiec","sp":["konstancja_sok"],"st":"verified","ln":"draminski","lk":"verified","src":"Baboszewo marriage 1818/19, recorded as 'szlachta'","n":{"en":"His 1818 marriage at Baboszewo, the parish of Dramino itself, records the couple as szlachta, nobility.","pl":"Jego ślub w Baboszewie w 1818 r., w parafii samego Dramina, zapisuje parę jako szlachtę."}},{"id":"konstancja_sok","g":"Konstancja","s":"Dramińska","m":"Sokolnicka","x":"F","sp":["hilary_d1793"],"st":"verified","ln":"draminski","src":"Baboszewo marriage 1818/19"},{"id":"adam_d1750","g":"Adam","s":"Dramiński","x":"M","b":"1750","bp":"Gralewo","sp":["monika_smiec"],"st":"possible","ln":"draminski","src":"Gralewo 1750 (son of Józef and Konstancja Zaborowska); children 1781–1799"},{"id":"monika_smiec","g":"Monika","s":"Dramińska","m":"Śmiecińska","x":"F","sp":["adam_d1750"],"st":"probable","ln":"draminski","src":"Gralewo births 1781–1799"},{"id":"szczepan_d1898","g":"Szczepan","s":"Dramiński","x":"M","b":"1898","bp":"Kownaty Borowe, par. Ciechanów","f":"wladyslaw_dion","mo":"jozefa_roman","st":"verified","ln":"draminski","lk":"verified","src":"Ciechanów; marriage 1929/155 to Marianna Wysocka"},{"id":"jozef_d1903","g":"Józef","s":"Dramiński","x":"M","b":"1903","bp":"Kownaty Borowe, par. Ciechanów","f":"wladyslaw_dion","mo":"jozefa_roman","st":"verified","ln":"draminski","lk":"verified","src":"Ciechanów births"},{"id":"walenty_d1906","g":"Walenty","s":"Dramiński","x":"M","b":"1906","bp":"Kownaty Borowe, par. Ciechanów","f":"wladyslaw_dion","mo":"jozefa_roman","st":"verified","ln":"draminski","lk":"verified","src":"Ciechanów births"},{"id":"wladyslaw_dion","g":"Władysław Dionizy","s":"Dramiński","x":"M","bp":"Kownaty Borowe, par. Ciechanów","f":"jozef_dc2","sp":["jozefa_roman"],"st":"verified","ln":"draminski","lk":"possible","src":"Ciechanów marriage 1896/40; nine children 1896–1914 (1896/538 scan)","ph":["1896-Ciechanow-B538-Jan-Draminski.jpg"],"n":{"en":"Nine children at Kownaty Borowe, 12 km from Dramino, between 1896 and 1914. Any of the sons could have fathered a Teresa in 1935, but Ciechanów births after 1914 are not indexed.","pl":"Dziewięcioro dzieci w Kownatach Borowych, 12 km od Dramina, w latach 1896–1914. Każdy z synów mógł być ojcem Teresy w 1935 r., ale chrzty ciechanowskie po 1914 r. nie są zindeksowane."}},{"id":"jozefa_roman","g":"Józefa","s":"Dramińska","m":"Roman","x":"F","sp":["wladyslaw_dion"],"st":"verified","ln":"draminski","src":"Ciechanów marriage 1896/40"},{"id":"jozef_dc2","g":"Józef","s":"Dramiński","x":"M","bp":"Kownaty, par. Ciechanów","f":"stanislaw_dc1","mo":"tekla_bien","st":"possible","ln":"draminski","lk":"possible","src":"Ciechanów; married Józefa Łopacka"},{"id":"stanislaw_dc1","g":"Stanisław","s":"Dramiński","x":"M","sp":["tekla_bien"],"st":"probable","ln":"draminski","src":"Ciechanów births 1814–1836, thirteen children","n":{"en":"Thirteen children at Kownaty between 1814 and 1836. The Ciechanów line goes back to a Szymon and Katarzyna Dramiński with children 1738–1750.","pl":"Trzynaścioro dzieci w Kownatach w latach 1814–1836. Linia ciechanowska sięga Szymona i Katarzyny Dramińskich, z dziećmi w latach 1738–1750."}},{"id":"tekla_bien","g":"Tekla","s":"Dramińska","m":"Bieńkowska","x":"F","sp":["stanislaw_dc1"],"st":"probable","ln":"draminski","src":"Ciechanów births 1814–1836"},{"id":"janina_d1922","g":"Janina","s":"Dramińska","x":"F","b":"1922","bp":"Mystkowo, par. Baboszewo","f":"stanislaw_dm1","mo":"czeslawa_zjad","st":"verified","ln":"draminski","lk":"verified","src":"Baboszewo 1922/32 (scan)","ph":["1922-Baboszewo-B32-Janina-Draminska.jpg"]},{"id":"stanislaw_dm1","g":"Stanisław","s":"Dramiński","x":"M","b":"1897","bp":"Budy Osowe, par. Koziebrody","sp":["czeslawa_zjad"],"st":"verified","ln":"draminski","src":"Koziebrody 1897; children at Mystkowo 1917–1922"},{"id":"czeslawa_zjad","g":"Czesława","s":"Dramińska","m":"Zjadewicz","x":"F","sp":["stanislaw_dm1"],"st":"verified","ln":"draminski","src":"Baboszewo births 1917–1922"},{"id":"bronislaw_k","g":"Bronisław","s":"Kowalczyk","x":"M","b":"1889","bp":"Groszki, par. Kałuszyn","f":"franciszek_k1864","mo":"jozefa_baw","sp":["aleksandra_k"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn birth 1889/27; marriage 1910/57 (18 Sep 1910)","n":{"en":"Born at Groszki in 1889, the only surviving son of Franciszek and Józefa. Married Aleksandra Woźniak at Kałuszyn on 18 September 1910, and the register then follows the couple at Groszki and Groszki Stare: Marianna 1911, Janina 1913, Zofia 1915, Honorata 1918, a second Janina 1920, Czesław 1925. First cousin of Greg's grandfather Wacław: both were grandsons of Antoni Kowalczyk and Magdalena Ściechowska.","pl":"Urodzony w Groszkach w 1889 r., jedyny żyjący syn Franciszka i Józefy. 18 września 1910 r. ożenił się w Kałuszynie z Aleksandrą Woźniak, a księga śledzi potem parę w Groszkach i Groszkach Starych: Marianna 1911, Janina 1913, Zofia 1915, Honorata 1918, druga Janina 1920, Czesław 1925. Brat stryjeczny dziadka Grzegorza, Wacława: obaj byli wnukami Antoniego Kowalczyka i Magdaleny Ściechowskiej."},"d":"24 Sep 1964","dp":"Kałuszyn (buried)"},{"id":"aleksandra_k","g":"Aleksandra","s":"Kowalczyk","m":"Woźniak","x":"F","f":"franciszek_woz","mo":"ludwika_kap","sp":["bronislaw_k"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn marriage 1910/57: daughter of Franciszek Woźniak and Ludwika Kapcińska","n":{"en":"Her own baptism is not in the Mazowsze index, so her family came from a parish not yet indexed.","pl":"Jej chrztu nie ma w indeksie mazowieckim, więc rodzina pochodziła z parafii jeszcze niezindeksowanej."},"d":"5 Jun 1971","b":"c. 1890"},{"id":"franciszek_woz","g":"Franciszek","s":"Woźniak","x":"M","sp":["ludwika_kap"],"st":"verified","ln":"kowalczyk","src":"Named as bride's father, Kałuszyn marriage 1910/57"},{"id":"ludwika_kap","g":"Ludwika","s":"Woźniak","m":"Kapcińska","x":"F","sp":["franciszek_woz"],"st":"verified","ln":"kowalczyk","src":"Named as bride's mother, Kałuszyn marriage 1910/57"},{"id":"marianna_k1911","g":"Marianna","s":"Kowalczyk","x":"F","b":"1 Aug 1911","bp":"Groszki Stare","f":"bronislaw_k","mo":"aleksandra_k","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1911/174"},{"id":"janina_k1913","g":"Janina","s":"Kowalczyk","x":"F","b":"13 Dec 1913","bp":"Groszki","f":"bronislaw_k","mo":"aleksandra_k","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1913/263","n":{"en":"A second daughter was given the same name in 1920, which usually means the first Janina had died.","pl":"Drugiej córce nadano to samo imię w 1920 r., co zwykle oznacza, że pierwsza Janina zmarła."}},{"id":"zofia_k1915","g":"Zofia","s":"Kowalczyk","x":"F","b":"12 Sep 1915","bp":"Groszki","f":"bronislaw_k","mo":"aleksandra_k","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1915/228"},{"id":"honorata_k1918","g":"Honorata","s":"Kowalczyk","x":"F","b":"1918","bp":"Groszki","f":"bronislaw_k","mo":"aleksandra_k","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1918/28"},{"id":"janina_k1920","g":"Janina","s":"Kowalczyk","x":"F","b":"1920","bp":"Groszki Stare","f":"bronislaw_k","mo":"aleksandra_k","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1920/91"},{"id":"czeslaw_k1925","g":"Czesław","s":"Kowalczyk","x":"M","b":"13 May 1925","bp":"Groszki Stare","d":"29 Nov 1943","dp":"Ryczyca","f":"bronislaw_k","mo":"aleksandra_k","st":"verified","ln":"kowalczyk","lk":"verified","src":"straty.pl, IPN war-losses database; IPN files GK 174/482, GK 162/392, GK 163/45, BU 3049/206","ph":["1943-straty-pl-Czeslaw-Kowalczyk-b1925-GroszkiStare-record-p1.jpg"],"n":{"en":"Born in Groszki Stare on 13 May 1925. On 29 November 1943, aged eighteen, he was one of four Poles shot in a reprisal by German gendarmes from the Węgrów post at Ryczyca, with Aleksander Kulesza, Feliks Sopiński and Franciszek Sosiniak. Buried at the execution site and later moved to the parish cemetery at Oleksin. Henryk's second cousin: both were great-grandsons of Antoni Kowalczyk and Magdalena Ściechowska. Henryk was eleven and living in the same village. A memorial plaque on his parents' tomb at Kałuszyn (I/48/1) reads 'Czesław Kowalczyk, żył lat 18, zm. śmiercią tragiczną 23 XI 1943' — six days earlier than the 29 November in the IPN record.","pl":"Urodzony w Groszkach Starych 13 maja 1925 r. 29 listopada 1943 r., mając osiemnaście lat, został jednym z czterech Polaków rozstrzelanych w odwecie przez niemieckich żandarmów z posterunku w Węgrowie w Ryczycy, razem z Aleksandrem Kuleszą, Feliksem Sopińskim i Franciszkiem Sosiniakiem. Pochowany na miejscu egzekucji, później przeniesiony na cmentarz parafialny w Oleksinie. Kuzyn Henryka w drugiej linii: obaj byli prawnukami Antoniego Kowalczyka i Magdaleny Ściechowskiej. Henryk miał jedenaście lat i mieszkał w tej samej wsi. Tablica na grobie jego rodziców w Kałuszynie (kw. I/48/1) podaje: „Czesław Kowalczyk, żył lat 18, zm. śmiercią tragiczną 23 XI 1943” — sześć dni wcześniej niż 29 listopada w rejestrze IPN."}},{"id":"franciszek_k1864","g":"Franciszek","s":"Kowalczyk","x":"M","b":"17 May 1864","bp":"Groszki, par. Kałuszyn","d":"17 Nov 1922","dp":"Groszki","f":"antoni_k","mo":"magdalena_sciech","sp":["jozefa_baw"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn birth 1864/107; marriage 1888/26 (14 May 1888); death 1922/136, aged 59","n":{"en":"Born at Groszki in 1864, the year after the January Uprising was crushed, and died there in November 1922 at 59, three years into independent Poland. Married Józefa Bawolska on 14 May 1888. The scan of his birth entry is in the Siedlce state archive's Kałuszyn book for 1864.","pl":"Urodzony w Groszkach w 1864 r., rok po upadku powstania styczniowego, zmarł tam w listopadzie 1922 r. w wieku 59 lat, trzy lata po odzyskaniu niepodległości. 14 maja 1888 r. ożenił się z Józefą Bawolską. Skan jego aktu urodzenia jest w księdze kałuszyńskiej z 1864 r. w Archiwum Państwowym w Siedlcach."}},{"id":"jozefa_baw","g":"Józefa","s":"Kowalczyk","m":"Bawolska","x":"F","bp":"Jedlina / Słupia, pow. siedlecki","f":"jozef_baw","mo":"jozefa_mat","sp":["franciszek_k1864"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn marriage 1888/26: daughter of Józef Bawolski and Józefa Matysiak"},{"id":"jozef_baw","g":"Józef","s":"Bawolski","x":"M","sp":["jozefa_mat"],"st":"verified","ln":"kowalczyk","src":"Kałuszyn marriage 1888/26; Słupia birth 1873/46; Seroczyn marriage 1886/21"},{"id":"jozefa_mat","g":"Józefa","s":"Bawolska","m":"Matysiak","x":"F","sp":["jozef_baw"],"st":"verified","ln":"kowalczyk","src":"Kałuszyn marriage 1888/26"},{"id":"julian_k1892","g":"Julian","s":"Kowalczyk","x":"M","b":"9 Mar 1892","bp":"Groszki","d":"1892","f":"franciszek_k1864","mo":"jozefa_baw","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1892/55; death 1892/86"},{"id":"stanislawa_k1896","g":"Stanisława","s":"Kowalczyk","x":"F","b":"7 Mar 1896","bp":"Groszki","f":"franciszek_k1864","mo":"jozefa_baw","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1896/58"},{"id":"antoni_k","g":"Antoni","s":"Kowalczyk","x":"M","b":"c. 1819","bq":1,"bp":"Gójszcz, par. Kałuszyn","d":"1871","dp":"Groszki","f":"lukasz_k","mo":"katarzyna_guz","sp":["magdalena_sciech"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Grębków marriage 1842/6 (2 Feb 1842, aged 22, born Gójszcz, living Sinołęka); Kałuszyn death 1871","n":{"en":"Greg's 3× great-grandfather. Married Magdalena Ściechowska at Grębków on 2 February 1842, aged 22, a manor servant at Sinołęka; later a farmer at Groszki, where ten children were born between 1845 and 1864. Died in 1871, the year after his grandson Antoni was born.","pl":"Praprapradziadek Grzegorza. Ożenił się z Magdaleną Ściechowską w Grębkowie 2 lutego 1842 r., mając 22 lata, jako służący dworski w Sinołęce; później gospodarz w Groszkach, gdzie w latach 1845–1864 urodziło się dziesięcioro dzieci. Zmarł w 1871 r., rok po narodzinach wnuka Antoniego."}},{"id":"magdalena_sciech","g":"Magdalena","s":"Kowalczyk","m":"Ściechowska","x":"F","b":"13 Jul 1823","bp":"Sinołęka, par. Grębków","d":"1885","f":"kazimierz_sciech","mo":"elzbieta_sop","sp":["antoni_k"],"st":"verified","ln":"kowalczyk","lk":"probable","src":"Grębków birth 1823/50 (scan: unit 6084177, image 12); marriage 1842/6; death 1885"},{"id":"roch_k1845","g":"Roch","s":"Kowalczyk","x":"M","b":"1845","bp":"Groszki","f":"antoni_k","mo":"magdalena_sciech","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1845/107"},{"id":"kacper_k1851","g":"Kacper","s":"Kowalczyk","x":"M","b":"5 Jan 1851","bp":"Groszki","f":"antoni_k","mo":"magdalena_sciech","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1851/4"},{"id":"lukasz_k","g":"Łukasz","s":"Kowalczyk","x":"M","b":"c. 1787","bq":1,"d":"1836","dp":"Gójszcz","f":"andrzej_k","mo":"justyna_dom","sp":["katarzyna_guz"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn death 1836/20, Gójszcz, aged 49, son of Andrzej and Justyna Domańska","n":{"en":"Greg's 4× great-grandfather, born about 1787 under King Stanisław August, died at Gójszcz in 1836 aged 49. Children with Katarzyna Guziak baptised at Kałuszyn 1818–1822.","pl":"Czterokrotny pradziadek Grzegorza, urodzony ok. 1787 r. za Stanisława Augusta, zmarł w Gójszczu w 1836 r. w wieku 49 lat. Dzieci z Katarzyną Guziak chrzczone w Kałuszynie w latach 1818–1822."}},{"id":"katarzyna_guz","g":"Katarzyna","s":"Kowalczyk","m":"Guziak","x":"F","b":"c. 1787","bq":1,"sp":["lukasz_k"],"st":"verified","ln":"kowalczyk","src":"Mother in Kałuszyn births 1818/65, 1820/206, 1822/214"},{"id":"andrzej_k","g":"Andrzej","s":"Kowalczyk","x":"M","b":"c. 1750–1765","bq":1,"sp":["justyna_dom"],"st":"verified","ln":"kowalczyk","src":"Named as father in Łukasz's death record, Kałuszyn 1836/20","n":{"en":"The earliest Kowalczyk of Greg's line found so far, named in his son's 1836 death record. Born in the reign of August III or the early years of Stanisław August.","pl":"Najstarszy odnaleziony Kowalczyk z linii Grzegorza, wymieniony w akcie zgonu syna z 1836 r. Urodzony za Augusta III lub w pierwszych latach Stanisława Augusta."}},{"id":"justyna_dom","g":"Justyna","s":"Kowalczyk","m":"Domańska","x":"F","sp":["andrzej_k"],"st":"verified","ln":"kowalczyk","src":"Named as mother in Łukasz's death record, Kałuszyn 1836/20"},{"id":"kazimierz_sciech","g":"Kazimierz","s":"Ściechowski","x":"M","b":"c. 1795","bq":1,"bp":"Sinołęka","d":"1832","f":"andrzej_sciech","mo":"katarzyna_kacz","sp":["elzbieta_sop"],"st":"probable","ln":"kowalczyk","lk":"probable","src":"Father of Magdalena 1823/50, Seweryn 1828/3, Jakub 1830/67 at Grębków"},{"id":"elzbieta_sop","g":"Elżbieta","s":"Ściechowska","m":"Sopińska","x":"F","b":"c. 1800","bq":1,"f":"jozef_sop","mo":"marianna_grab","sp":["kazimierz_sciech"],"st":"probable","ln":"kowalczyk","lk":"probable","src":"Mother in Grębków birth 1823/50; remarried Wawrzyniec Łachniak, Grębków 1835/9","n":{"en":"Widowed in 1832, she remarried Wawrzyniec Łachniak of Groszki in 1835: the Ściechowski, Kowalczyk and Łachniak families of Groszki and Sinołęka were intermarried for a century.","pl":"Owdowiała w 1832 r., w 1835 r. wyszła za Wawrzyńca Łachniaka z Groszek: Ściechowscy, Kowalczykowie i Łachniakowie z Groszek i Sinołęki żenili się między sobą przez sto lat."}},{"id":"jozef_sop","g":"Józef","s":"Sopiński","x":"M","sp":["marianna_grab"],"st":"probable","ln":"kowalczyk","src":"Named in Grębków marriage 1835/9"},{"id":"marianna_grab","g":"Marianna","s":"Sopińska","m":"Grabarczyk","x":"F","sp":["jozef_sop"],"st":"probable","ln":"kowalczyk","src":"Named in Grębków marriage 1835/9"},{"id":"andrzej_sciech","g":"Andrzej","s":"Ściechowski","x":"M","b":"c. 1750","bq":1,"d":"1826","dp":"Sinołęka","f":"bartlomiej_sciech","mo":"ewa_sciech","sp":["katarzyna_kacz"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Grębków marriage 1792/6 (29 Jan 1792, Sinołęka); death 1826/26","n":{"en":"Married Katarzyna Kaczmarczyk at Grębków on 29 January 1792, between the Constitution of 3 May and the second partition.","pl":"Ożenił się z Katarzyną Kaczmarczyk w Grębkowie 29 stycznia 1792 r., między Konstytucją 3 maja a drugim rozbiorem."}},{"id":"katarzyna_kacz","g":"Katarzyna","s":"Ściechowska","m":"Kaczmarczyk","x":"F","sp":["andrzej_sciech"],"st":"verified","ln":"kowalczyk","src":"Grębków marriage 1792/6; named in Andrzej's death 1826/26"},{"id":"bartlomiej_sciech","g":"Bartłomiej","s":"Ściechowski","x":"M","b":"c. 1720s","bq":1,"sp":["ewa_sciech"],"st":"verified","ln":"kowalczyk","src":"Named in Andrzej's death record, Grębków 1826/26","n":{"en":"The deepest name on Greg's side so far: Bartłomiej Ściechowski, father of a man born about 1750, so himself born in the 1720s under August II.","pl":"Najgłębsze imię po stronie Grzegorza: Bartłomiej Ściechowski, ojciec człowieka urodzonego ok. 1750 r., sam więc urodzony w latach 20. XVIII w., za Augusta II."}},{"id":"ewa_sciech","g":"Ewa","s":"Ściechowska","x":"F","sp":["bartlomiej_sciech"],"st":"verified","ln":"kowalczyk","src":"Named in Andrzej's death record, Grębków 1826/26"},{"id":"scholastyka_k1857","g":"Scholastyka","s":"Kowalczyk","x":"F","b":"10 Feb 1857","bp":"Groszki","f":"antoni_k","mo":"magdalena_sciech","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1857/17; marriage 1886/28 to Antoni Bryda"},{"id":"katarzyna_k1859","g":"Katarzyna","s":"Kowalczyk","x":"F","b":"27 Jun 1859","bp":"Groszki","d":"1881","f":"antoni_k","mo":"magdalena_sciech","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1859/104; death 1881/23"},{"id":"anna_k1860","g":"Anna","s":"Kowalczyk","x":"F","b":"4 Jul 1860","bp":"Groszki","f":"antoni_k","mo":"magdalena_sciech","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1860/86; marriage 1884/30 to Tomasz Gójski"},{"id":"paulina_k","g":"Paulina","s":"Kowalczyk","x":"F","d":"1886","f":"antoni_k","mo":"magdalena_sciech","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn marriage 1873/32 to Aleksander Szczepaniak; death 1886/108"},{"id":"marianna_kb","g":"Marianna","s":"Kowalczyk","x":"F","d":"1921","f":"antoni_k","mo":"magdalena_sciech","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn marriage 1884/28 to Jan Bantyrek; death 1921/31"},{"id":"antoni_k2","g":"Antoni","s":"Kowalczyk","x":"M","b":"14 Mar 1870","bp":"Groszki, par. Kałuszyn","f":"jan_kb","mo":"anna_kolak","sp":["feliksa_lach"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn birth 1870/75; marriage 1892/8, scan read (Kałuszyn 26 Jan/7 Feb 1892: Antoni, bachelor 21, of Groszki, son of the late Jan Kowalczyk and Anna née Kołak × Feliksa Łachniak, spinster 23, daughter of Walenty Łachniak and Helena née Kania, landholders of Groszki)","n":{"en":"Greg's great-grandfather. Married Feliksa Łachniak at Kałuszyn on 7 February 1892; ten children at Groszki between 1892 and 1911, among them Wacław (1899) and Aleksander (1911), the latter listed in the war-losses database.","pl":"Pradziadek Grzegorza. Ożenił się z Feliksą Łachniak w Kałuszynie 7 lutego 1892 r.; dziesięcioro dzieci w Groszkach w latach 1892–1911, wśród nich Wacław (1899) i Aleksander (1911), ten ostatni w bazie strat wojennych."}},{"id":"feliksa_lach","g":"Feliksa","s":"Kowalczyk","m":"Łachniak","x":"F","b":"14 Oct 1868","bp":"Groszki, par. Kałuszyn","f":"walenty_lach","mo":"helena_kania","sp":["antoni_k2"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn birth 1868/166; marriage 1892/8 (scan read: daughter of Walenty Łachniak and Helena née Kania, aged 23); mother of Wacław, act 1899/194 (scan read, aged 30)","n":{"en":"Greg's great-grandmother, of the Łachniak family of Groszki, house 6, recorded in the village since the 1790s.","pl":"Prababka Grzegorza, z Łachniaków z Groszek, dom nr 6, notowanych we wsi od lat 90. XVIII w."}},{"id":"marianna_k1892","g":"Marianna","s":"Kowalczyk","x":"F","b":"21 Dec 1892","bp":"Groszki","f":"antoni_k2","mo":"feliksa_lach","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1892/247"},{"id":"jan_k1894","g":"Jan","s":"Kowalczyk","x":"M","b":"5 Sep 1894","bp":"Groszki","f":"antoni_k2","mo":"feliksa_lach","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1894/185"},{"id":"antoni_k1896","g":"Antoni","s":"Kowalczyk","x":"M","b":"1 Jun 1896","bp":"Groszki","f":"antoni_k2","mo":"feliksa_lach","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1896/129"},{"id":"bronislawa_k1898","g":"Bronisława","s":"Kowalczyk","x":"F","b":"14 Oct 1898","bp":"Groszki","f":"antoni_k2","mo":"feliksa_lach","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1898/230"},{"id":"jozef_k1902","g":"Józef","s":"Kowalczyk","x":"M","b":"15 Feb 1902","bp":"Groszki","f":"antoni_k2","mo":"feliksa_lach","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1902/60"},{"id":"stanislaw_k1904","g":"Stanisław","s":"Kowalczyk","x":"M","b":"10 Jan 1904","bp":"Groszki","f":"antoni_k2","mo":"feliksa_lach","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1904/27"},{"id":"edward_k1906","g":"Edward","s":"Kowalczyk","x":"M","b":"29 Sep 1906","bp":"Groszki","f":"antoni_k2","mo":"feliksa_lach","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1906/230"},{"id":"marianna_k1908","g":"Marianna","s":"Kowalczyk","x":"F","b":"21 Mar 1908","bp":"Groszki","f":"antoni_k2","mo":"feliksa_lach","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1908/88"},{"id":"jan_kb","g":"Jan","s":"Kowalczyk","x":"M","b":"19 Oct 1842","bp":"Sinołęka, par. Grębków","d":"1886","dp":"Groszki","f":"antoni_k","mo":"magdalena_sciech","sp":["anna_kolak"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Grębków birth 1842/87 ('father a manor servant'); Kałuszyn marriage 1862/30; death 1886/26","n":{"en":"Greg's great-great-grandfather, born at Sinołęka eight months after his parents' wedding, when his father was a servant on the manor farm. Married Anna Kołak of Milew at Kałuszyn in 1862 and farmed at Groszki. Anna died in 1884; a Jan Kowalczyk remarried Julianna Kraśna at Wiśniew the same year, possibly him. Died in 1886.","pl":"Prapradziadek Grzegorza, urodzony w Sinołęce osiem miesięcy po ślubie rodziców, gdy ojciec był służącym dworskim. W 1862 r. ożenił się w Kałuszynie z Anną Kołak z Milewa i gospodarzył w Groszkach. Anna zmarła w 1884 r.; w tym samym roku jakiś Jan Kowalczyk ożenił się ponownie w Wiśniewie z Julianną Kraśną, być może on. Zmarł w 1886 r."}},{"id":"anna_kolak","g":"Anna","s":"Kowalczyk","m":"Kołak","x":"F","b":"1845","bp":"Milew, par. Kałuszyn","d":"1884","f":"idzi_kolak","mo":"katarzyna_szczep","sp":["jan_kb"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn birth 1845/50 (twin of Wojciech); marriage 1862/30","n":{"en":"A twin, born at Milew in 1845.","pl":"Bliźniaczka, urodzona w Milewie w 1845 r."}},{"id":"idzi_kolak","g":"Idzi","s":"Kołak","x":"M","b":"c. 1799","bq":1,"d":"1858","dp":"Grodzisk","f":"andrzej_kolak","mo":"franciszka_kolak","sp":["katarzyna_szczep"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn death 1858/73, aged 59, son of Andrzej and Franciszka"},{"id":"katarzyna_szczep","g":"Katarzyna","s":"Kołak","m":"Szczepaniak","x":"F","b":"c. 1806","bq":1,"d":"1862","sp":["idzi_kolak"],"st":"verified","ln":"kowalczyk","src":"Mother in Kałuszyn births 1830–1847 (Milew, index); death Kałuszyn 1862/147, scan read (widow, née Szczepaniak, aged 56)"},{"id":"andrzej_kolak","g":"Andrzej","s":"Kołak","x":"M","sp":["franciszka_kolak"],"st":"verified","ln":"kowalczyk","src":"Named in Idzi's death record 1858/73"},{"id":"franciszka_kolak","g":"Franciszka","s":"Kołak","x":"F","sp":["andrzej_kolak"],"st":"verified","ln":"kowalczyk","src":"Named in Idzi's death record 1858/73"},{"id":"walenty_lach","g":"Walenty","s":"Łachniak","x":"M","b":"7 Feb 1825","bp":"Groszki, house 6","f":"tomasz_lach","mo":"marianna_kolak_l","sp":["helena_kania"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn birth 1825/51; marriage 1850/8"},{"id":"helena_kania","g":"Helena","s":"Łachniak","m":"Kania","x":"F","b":"c. 1830","bq":1,"f":"kacper_kania","mo":"kunegunda_kania","sp":["walenty_lach"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn marriage 1850/8, aged 20, daughter of Kacper and Kunegunda"},{"id":"kacper_kania","g":"Kacper","s":"Kania","x":"M","sp":["kunegunda_kania"],"st":"verified","ln":"kowalczyk","src":"Named in Kałuszyn marriage 1850/8"},{"id":"kunegunda_kania","g":"Kunegunda","s":"Kania","x":"F","sp":["kacper_kania"],"st":"verified","ln":"kowalczyk","src":"Named in Kałuszyn marriage 1850/8"},{"id":"tomasz_lach","g":"Tomasz","s":"Łachniak","x":"M","b":"c. 1773–1776","bq":1,"bp":"Groszki","sp":["marianna_kolak_l"],"st":"verified","ln":"kowalczyk","src":"Grębków marriage 1797 (aged 21, of Groszki) to Marianna Ściechowska; father of Walenty per three records","n":{"en":"The oldest Łachniak of Groszki in the registers, born about 1776 in the last years of the Commonwealth.","pl":"Najstarszy Łachniak z Groszek w księgach, urodzony ok. 1776 r., w ostatnich latach Rzeczypospolitej."}},{"id":"marianna_kolak_l","g":"Marianna","s":"Łachniak","m":"Kołak","x":"F","b":"c. 1789","bq":1,"d":"1850 (?)","sp":["tomasz_lach"],"st":"verified","ln":"kowalczyk","src":"Mother of Walenty per three Kałuszyn records"},{"id":"aleksander_k1911","g":"Aleksander Piotr","s":"Kowalczyk","x":"M","b":"6 Apr 1911","bp":"Groszki Stare","f":"antoni_k2","mo":"feliksa_lach","st":"verified","ln":"kowalczyk","lk":"verified","src":"Kałuszyn 1911/94; straty.pl","n":{"en":"Wacław's youngest brother, Greg's great-uncle; listed in the war-losses database.","pl":"Najmłodszy brat Wacława, stryjeczny dziadek Grzegorza; w bazie strat wojennych."}},{"id":"aleksander_k1887","g":"Aleksander","s":"Kowalczyk","x":"M","b":"1887","d":"1951","dp":"Kałuszyn","st":"possible","ln":"kowalczyk","src":"kaluszyn.grobonet.com, Kałuszyn parish cemetery","n":{"en":"Buried at Kałuszyn; two years older than Bronisław, but born before Franciszek and Józefa married in May 1888, so not their son. Possible kin from one of the other Groszki households.","pl":"Pochowany w Kałuszynie; dwa lata starszy od Bronisława, ale urodzony przed ślubem Franciszka i Józefy w maju 1888 r., więc nie ich syn. Możliwy krewny z innego gospodarstwa w Groszkach."}},{"id":"stanislaw_k1922","g":"Stanisław","s":"Kowalczyk","x":"M","b":"11 Nov 1922","bp":"Groszki","st":"possible","ln":"kowalczyk","src":"straty.pl: birthplace and residence 'Groszki'"},{"id":"wladyslaw_z1924","g":"Władysław","s":"Zakierski","x":"M","b":"11 Aug 1924","d":"8 Jul 2006","dp":"Toruń","f":"waclaw_z","mo":"julianna_hinc","st":"verified","ln":"zakierski","lk":"possible","src":"Headstone read, Toruń WNMP cemetery (ul. Wybickiego) grave 7/6/29, shared with Antoni Zakierski (1916–2011) — https://cmentarnik.net/torun-wnmp-wybickiego/7/6/29","n":{"en":"Buried in one grave with Antoni Zakierski, Julian's brother. Born in 1924, between Wacław (Jan 1922) and Józef (1927), he fits as another late child of Wacław Zakierski and Julianna Hinc, which would make him Helena's uncle. Possible only: no birth act (Czernikowo scans online stop in 1922).","pl":"Pochowany w jednym grobie z Antonim Zakierskim, bratem Juliana. Urodzony w 1924 r., między Wacławem (styczeń 1922) a Józefem (1927), pasuje jako kolejne późne dziecko Wacława Zakierskiego i Julianny Hinc, a więc wuj Heleny. Tylko możliwe: brak aktu urodzenia (skany czernikowskie w sieci kończą się na 1922 r.)."}},{"id":"helena_z1920","g":"Helena","s":"Zakierska","x":"F","b":"10 Mar 1920","d":"15 Feb 2000","dp":"Toruń","sp":["antoni_z1916"],"st":"verified","ln":"zakierski","src":"Headstone read, Toruń WNMP cemetery (ul. Wybickiego) grave 7/6/29 — https://cmentarnik.net/torun-wnmp-wybickiego/7/6/29","n":{"en":"Named first on the Zakierski stone she shares with Antoni (1916–2011) and Władysław (1924–2006). Probably Antoni's wife (POSSIBLE); her maiden name is not on the stone. The Ciesielski couple (Rozalia, Antoni) named at the foot of the same stone may be her parents — unproven.","pl":"Wymieniona jako pierwsza na nagrobku Zakierskich, który dzieli z Antonim (1916–2011) i Władysławem (1924–2006). Prawdopodobnie żona Antoniego (MOŻLIWE); nazwiska panieńskiego brak na kamieniu. Małżonkowie Ciesielscy (Rozalia, Antoni) na dole tego samego nagrobka mogą być jej rodzicami — niepotwierdzone."}},{"id":"jan_z1958","g":"Jan","s":"Zakierski","x":"M","b":"15 Oct 1958","d":"11 Jun 1986","dp":"Toruń","f":"waclaw_z1922","mo":"irena_z1930","st":"verified","ln":"zakierski","lk":"probable","src":"ecemetery.eu, Toruń-Podgórz Nowy Cmentarz, grave with Wacław (1922–2011) and Irena (1930–2003) Zakierscy — https://www.ecemetery.eu/en/cemetery/torun-nowy-cmentarz/grave/detail/3776016","n":{"en":"Buried with Wacław Zakierski (Julian's brother, married 1954) and Irena; born four years after that marriage, so most likely their son — Helena's first cousin and Barbara's first cousin once removed. Died aged 27.","pl":"Pochowany z Wacławem Zakierskim (bratem Juliana, ślub 1954) i Ireną; urodzony cztery lata po ślubie, więc najpewniej ich syn — brat cioteczny Heleny, a dla Barbary kuzyn w drugim pokoleniu. Zmarł w wieku 27 lat."}},{"id":"malgorzata_z1962","g":"Małgorzata","s":"Zakierska","x":"F","b":"16 Oct 1962","d":"2 Nov 2023","dp":"Toruń","f":"waclaw_z1922","mo":"irena_z1930","st":"verified","ln":"zakierski","lk":"probable","src":"ecemetery.eu, Toruń-Podgórz Nowy Cmentarz — https://www.ecemetery.eu/en/cemetery/torun-nowy-cmentarz/grave/detail/3776016; headstone photo scans/zakierski/2023-Torun-Podgorz-NowyCmentarz-headstone-Malgorzata-Zakierska-1962-2023.jpg","n":{"en":"In the same grave as Wacław (1922–2011), Irena (1930–2003) and Jan (1958–1986); most likely their daughter, i.e. Helena's first cousin. She kept the Zakierska surname (unmarried, or a daughter-in-law — not ruled out).","pl":"W tym samym grobie co Wacław (1922–2011), Irena (1930–2003) i Jan (1958–1986); najpewniej ich córka, czyli siostra cioteczna Heleny. Nosiła nazwisko Zakierska (niezamężna albo synowa — nie wykluczono)."}},{"id":"jozef_z1927","g":"Józef","s":"Zakierski","x":"M","b":"18 Nov 1927","d":"18 Aug 2007","dp":"Toruń","sp":["feliksa_z1928"],"st":"verified","ln":"zakierski","src":"ecemetery.eu, Toruń-Podgórz Stary Cmentarz, grave 4031483 — https://www.ecemetery.eu/en/cemetery/torun-stary-cmentarz/grave/detail/4031483","n":{"en":"Born in 1927 he cannot be a son of Julian and Zofia (both born 1909) and is not 'the youngest' after Helena (1936). His date sits neatly between Władysław (1924) and Adam (1930), so he is POSSIBLY another son of Wacław Zakierski and Julianna Hinc — Helena's uncle, buried in Podgórz like his brother Wacław. Unproven.","pl":"Urodzony w 1927 r. nie może być synem Juliana i Zofii (oboje ur. 1909) ani „najmłodszym” po Helenie (1936). Data mieści się między Władysławem (1924) a Adamem (1930), więc MOŻLIWE, że to kolejny syn Wacława Zakierskiego i Julianny Hinc — wuj Heleny, pochowany na Podgórzu jak jego brat Wacław. Niepotwierdzone."}},{"id":"feliksa_z1928","g":"Feliksa","s":"Zakierska","x":"F","b":"3 Dec 1928","bp":"Ligowo","d":"4 Mar 2004","dp":"Toruń","sp":["jozef_z1927"],"st":"verified","ln":"zakierski","src":"ecemetery.eu grave 4031483 (https://www.ecemetery.eu/en/cemetery/torun-stary-cmentarz/grave/detail/4031483); straty.pl (IPN) card id 2032340: Feliksa Zakierska b. 1928-12-03 Ligowo, father Jan, mother Aniela","n":{"en":"Shares the grave with Józef Zakierski (1927–2007); the war-losses card with the same birth date gives her parents as Jan and Aniela and birthplace Ligowo. The card lists no maiden name, so it is unclear whether she was born a Zakierska (then Józef's sister) or married into the name (then his wife). Treated as wife, POSSIBLE.","pl":"Dzieli grób z Józefem Zakierskim (1927–2007); karta strat z tą samą datą urodzenia podaje rodziców Jan i Aniela oraz miejsce Ligowo. Brak nazwiska panieńskiego, więc nie wiadomo, czy urodziła się Zakierską (wtedy siostra Józefa), czy weszła do rodziny przez ślub (wtedy żona). Przyjęto: żona, MOŻLIWE."}},{"id":"waclaw_z1940","g":"Wacław Jan","s":"Zakierski","x":"M","b":"11 Apr 1940","d":"14 Jun 2024","dp":"Gdynia","sp":["regina_z1936"],"st":"verified","ln":"zakierski","src":"Grobonet, Cmentarz Komunalny Gdynia ul. Spokojna, 73/12/3 (https://grobonet.com/p/gdynia/206289/waclaw-zakierski-1940-gdynia; index types 1940-01-11, the plaque reads 11.04.1940)","n":{"en":"Wacław Jan Zakierski, born 11 April 1940, died 14 June 2024, buried in Gdynia with Regina (1936–2026). He was first considered as Helena's brother Wacław, but the family remembers Wacław as older than Helena (born 1936), so this is a different man; relationship to the family unknown.","pl":"Wacław Jan Zakierski, ur. 11 kwietnia 1940, zm. 14 czerwca 2024, pochowany w Gdyni z Reginą (1936–2026). Początkowo brany pod uwagę jako brat Heleny, ale rodzina pamięta Wacława jako starszego od Heleny (ur. 1936), więc to inna osoba; pokrewieństwo nieznane."}},{"id":"regina_z1936","g":"Regina","s":"Zakierska","x":"F","b":"3 Feb 1936","d":"10 Apr 2026","dp":"Gdynia","sp":["waclaw_z1940"],"st":"verified","ln":"zakierski","src":"Grobonet, Gdynia ul. Spokojna 73/12/3 (https://grobonet.com/p/gdynia/234307/regina-zakierska-1936-gdynia); plaque read"},{"id":"waclaw_d1930","g":"Wacław","s":"Dramiński","x":"M","b":"27 Mar 1930","d":"22 Jan 1988","dp":"Węgój, gm. Biskupiec","sp":["danuta_d1936"],"st":"verified","ln":"draminski","src":"Grobonet, parish cemetery Węgój 6/1/7 (https://grobonet.com/p/wegoj/36/waclaw-draminski-1930-wegoj); headstone read","n":{"en":"POSSIBLE brother of Teresa: born 1930, within Antoni and Zofia Dramiński's childbearing years (married 1922), and buried at Węgój near Biskupiec — about 35 km from their Mrągowo grave and 20 km from Barczewo, where Teresa died. The surname is rare in Warmia-Masuria, but the stone names no parents. Nearby in the same row: Władysław Dramiński (1953–2007) and Grzegorz Dariusz Dramiński (1971–2016), possibly his son and grandson.","pl":"MOŻLIWY brat Teresy: urodzony w 1930 r., w latach, gdy Antoni i Zofia Dramińscy (ślub 1922) mieli dzieci, pochowany w Węgoju koło Biskupca — ok. 35 km od ich grobu w Mrągowie i 20 km od Barczewa, gdzie zmarła Teresa. Nazwisko na Warmii i Mazurach jest rzadkie, ale nagrobek nie podaje rodziców. W tym samym rzędzie: Władysław Dramiński (1953–2007) i Grzegorz Dariusz Dramiński (1971–2016), może syn i wnuk."}},{"id":"danuta_d1936","g":"Danuta","s":"Dramińska","x":"F","b":"21 Apr 1936","d":"9 May 2022","dp":"Węgój, gm. Biskupiec","sp":["waclaw_d1930"],"st":"verified","ln":"draminski","src":"Grobonet, parish cemetery Węgój 6/1/7 (same grave as Wacław Dramiński 1930–1988)"}];

{id:"stutthof",kind:"wartime",ln:"prelowski",file:"scans/arolsen-lucjan-prelowski-1922-97246414-001.jpg",year:1943,people:["lucjan_p1922"],rel:"possible-kin",t:{en:"Stutthof file of Lucjan Prelowski, born 1922 in Bydgoszcz",pl:"Teczka Stutthof Lucjana Prelowskiego, ur. 1922 w Bydgoszczy"},d:{en:"Roofer, single, sent by the Bromberg Gestapo to Stutthof, prisoner 24945, 27 Aug to 29 Oct 1943.",pl:"Dekarz, kawaler, skierowany przez bydgoskie Gestapo do Stutthofu, nr 24945, 27 VIII–29 X 1943."},src:"Arolsen Archives 1.1.41.2 / 01014102 103.102"},
{id:"straty_cz",kind:"wartime",ln:"kowalczyk",file:"scans/1943-straty-pl-Czeslaw-Kowalczyk-b1925-GroszkiStare-record-p1.jpg",year:1943,people:["czeslaw_k1925","bronislaw_k","aleksandra_k"],rel:"verified-line",t:{en:"IPN war-losses card of Czesław Kowalczyk, born 13 May 1925 in Groszki Stare",pl:"Karta IPN strat osobowych Czesława Kowalczyka, ur. 13 V 1925 w Groszkach Starych"},d:{en:"Father Bronisław, mother Aleksandra. Shot at Ryczyca on 29 Nov 1943 by gendarmes of the Węgrów post with three other Poles; reburied at Oleksin. Eight IPN source files are cited on the card.",pl:"Ojciec Bronisław, matka Aleksandra. Rozstrzelany w Ryczycy 29 XI 1943 r. przez żandarmów z posterunku w Węgrowie wraz z trzema innymi Polakami; pochowany ponownie w Oleksinie. Karta cytuje osiem teczek źródłowych IPN."},src:"straty.pl (IPN)"},
{id:"gral1866",kind:"record",ln:"draminski",file:"scans/1866-Gralewo-B3-Julian-Seweryn-Draminski.jpg",year:1866,people:["julian_d1866","antoni_d1840","antonina_nad"],rel:"possible-kin",t:{en:"Gralewo baptisms 1866, act 3: Julian Seweryn Dramiński",pl:"Chrzty Gralewo 1866, akt 3: Julian Seweryn Dramiński"},d:{en:"'Antoni Dramiński, szlachcic of Cywiny Litwinki, aged 25' presents a son born 8 January 1866 of Antonina née Nadratowska, 24. Written in Polish, two years before the Russian authorities imposed Cyrillic.",pl:"„Antoni Dramiński, szlachcic z Cywin Litwinek, lat 25” przedstawia syna urodzonego 8 stycznia 1866 r. z Antoniny z Nadratowskich, lat 24. Po polsku, dwa lata przed narzuceniem przez władze rosyjskie cyrylicy."},src:"metryki.genealodzy.pl, Gralewo 1866, plik 003-006"},
{id:"un1919",kind:"record",ln:"draminski",file:"scans/1919-Unieck-D84-Julian-Draminski.jpg",year:1919,people:["julian_d1866","janina_dab"],rel:"possible-kin",t:{en:"Unieck deaths 1919, act 84: Julian Dramiński, aged 53",pl:"Zgony Unieck 1919, akt 84: Julian Dramiński, lat 53"},d:{en:"Died at Chądzyny Krusze on 5 November 1919 at 8 pm, born at Cywiny, son of Antoni and Antonina née Nadratowska, 'living on his own means', leaving the widow Janina née Dabińska.",pl:"Zmarł w Chądzynach Kruszach 5 listopada 1919 r. o 8 wieczorem, urodzony w Cywinach, syn Antoniego i Antoniny z Nadratowskich, „utrzymujący się z własnych funduszów”, pozostawił wdowę Janinę z Dabińskich."},src:"metryki.genealodzy.pl, Unieck 1919, plik 083-086"},
{id:"lut1863",kind:"record",ln:"draminski",file:"scans/1863-Lutocin-S5-Antoni-Draminski-x-Antonina-Nadratowska.jpg",year:1863,people:["antoni_d1840","antonina_nad","piotr_d1813","julianna_dob"],rel:"possible-kin",t:{en:"Lutocin marriages 1863, act 5: Antoni Dramiński and Antonina Nadratowska",pl:"Śluby Lutocin 1863, akt 5: Antoni Dramiński i Antonina Nadratowska"},d:{en:"4 February 1863, two weeks after the January Uprising began. Groom 'a bachelor of Cywiny in Gralewo parish, born at Kraszewo Gaczułty, son of Piotr and the late Julianna née Dobrska, part-owners', aged 22; bride 19.",pl:"4 lutego 1863 r., dwa tygodnie po wybuchu powstania styczniowego. Pan młody „młodzian zamieszkały w Cywinach parafii gralewskiej, urodzony w Kraszewie Gaczułtach z Piotra i nieżyjącej Julianny z Dóbrskich, właścicieli cząstkowych”, lat 22; panna lat 19."},src:"Skanoteka / AP Mława, Lutocin 1863"},
{id:"glin1842",kind:"record",ln:"draminski",file:"scans/1842-Glinojeck-B21.jpg",year:1842,people:["wladyslaw_d1842","piotr_d1813","julianna_dob"],rel:"possible-kin",t:{en:"Glinojeck baptisms 1842, act 21: Władysław, son of Piotr Dramiński, steward",pl:"Chrzty Glinojeck 1842, akt 21: Władysław, syn Piotra Dramińskiego, ekonoma"},d:{en:"'Appeared Piotr Dramiński, ekonom … of Julianna née Dobrska … Władysław.' Born 1 July 1842; the boy died the next year at Unieck.",pl:"„Stawił się Piotr Dramiński, ekonom … z Julianny z Dobrskich … Władysław”. Ur. 1 lipca 1842 r.; chłopiec zmarł rok później w Uniecku."},src:"Skanoteka / AP Mława, Glinojeck 1842"},
{id:"rad1879",kind:"record",ln:"draminski",file:"scans/1879-Radzanow-S31-Antoni-Draminski-x-Weronika-Kulesza.jpg",year:1879,people:["antoni_d1840","weronika_kul"],rel:"possible-kin",t:{en:"Radzanów marriages 1879, act 31: Antoni Dramiński, widower, and Weronika Kulesza",pl:"Śluby Radzanów 1879, akt 31: Antoni Dramiński, wdowiec, i Weronika Kulesza"},d:{en:"Antoni's second marriage, recorded in Russian as the law then required.",pl:"Drugi ślub Antoniego, zapisany po rosyjsku, jak nakazywało ówczesne prawo."},src:"Skanoteka / AP Mława, Radzanów 1879"},
{id:"ciech1896",kind:"record",ln:"draminski",file:"scans/1896-Ciechanow-B538-Jan-Draminski.jpg",year:1896,people:["wladyslaw_dion","jozefa_roman"],rel:"possible-kin",t:{en:"Ciechanów baptisms 1896, act 538: Jan, first child of Władysław Dionizy Dramiński and Józefa Roman",pl:"Chrzty Ciechanów 1896, akt 538: Jan, pierwsze dziecko Władysława Dionizego Dramińskiego i Józefy Roman"},d:{en:"Kownaty Borowe, 12 km from Dramino, the village the surname comes from.",pl:"Kownaty Borowe, 12 km od Dramina, wsi, od której pochodzi nazwisko."},src:"Skanoteka, Ciechanów 1896"},
{id:"bab1922",kind:"record",ln:"draminski",file:"scans/1922-Baboszewo-B32-Janina-Draminska.jpg",year:1922,people:["janina_d1922","stanislaw_dm1","czeslawa_zjad"],rel:"possible-kin",t:{en:"Baboszewo baptisms 1922, act 32: Janina Dramińska of Mystkowo",pl:"Chrzty Baboszewo 1922, akt 32: Janina Dramińska z Mystkowa"},d:{en:"Baboszewo is the parish of Dramino itself. The first register of free Poland in this family.",pl:"Baboszewo to parafia samego Dramina. Pierwszy zapis tej rodziny w wolnej Polsce."},src:"Skanoteka, Baboszewo 1922"},
{id:"ziel1920",kind:"record",ln:"draminski",file:"scans/1920-Zielona-B108-Stanislaw-Czeslaw-Draminski-Detroit.jpg",year:1920,people:[],rel:"possible-kin",t:{en:"Zielona baptisms 1920: a Dramiński child of the family back from Detroit",pl:"Chrzty Zielona 1920: dziecko Dramińskich z rodziny wróconej z Detroit"},d:{en:"The Osówka (near Mława) Dramińskis, who spent 1910–1920 in Detroit and came home. A candidate family for Teresa.",pl:"Dramińscy z Osówki pod Mławą, którzy lata 1910–1920 spędzili w Detroit i wrócili. Rodzina-kandydat dla Teresy."},src:"Skanoteka, Zielona 1920"},
{id:"grave_wi",kind:"grave",ln:"zakierski",file:"scans/2011-Torun-Podgorz-NowyCmentarz-headstone-Waclaw-1922-2011-Irena-1930-2003-Zakierscy.jpg",year:2011,people:["waclaw_z1922","irena_z1930"],rel:"possible-kin",t:{en:"Headstone, Toruń-Podgórz: Wacław Zakierski 1922–2011 and Irena Zakierska 1930–2003",pl:"Nagrobek, Toruń-Podgórz: Wacław Zakierski 1922–2011 i Irena Zakierska 1930–2003"},d:{en:"Nowy Cmentarz of SS Peter and Paul parish, sector 8, row 3, plot 7, with porcelain portraits. Helena's brother was also named Wacław, but he was born after 1930, so this Wacław (1922) is probably a cousin. Helena will know the faces.",pl:"Nowy Cmentarz parafii śś. Piotra i Pawła, sektor 8, rząd 3, grób 7, z porcelanowymi portretami. Brat Heleny też miał na imię Wacław, ale urodził się po 1930 r., więc ten Wacław (1922) to zapewne kuzyn. Helena rozpozna twarze."},src:"ecemetery.eu, grave 3776016"},
{id:"grave_wi2",kind:"grave",ln:"zakierski",file:"scans/2011-Torun-Podgorz-NowyCmentarz-grave3776016-wide-1.jpg",year:2011,people:["waclaw_z1922","irena_z1930"],rel:"possible-kin",t:{en:"The same grave, whole view",pl:"Ten sam grób, widok ogólny"},d:{en:"Also buried here: Jan Zakierski 1958–1986 and Małgorzata Zakierska 1962–2023.",pl:"Spoczywają tu także Jan Zakierski 1958–1986 i Małgorzata Zakierska 1962–2023."},src:"ecemetery.eu, grave 3776016"},
{id:"grave_jf",kind:"grave",ln:"zakierski",file:"scans/2007-Torun-Podgorz-StaryCmentarz-headstone-Jozef-1927-2007-Feliksa-1928-2004-Zakierscy-1.jpg",year:2007,people:[],rel:"possible-kin",t:{en:"Headstone, Toruń-Podgórz Stary Cmentarz: Józef Zakierski 1927–2007 and Feliksa Zakierska 1928–2004",pl:"Nagrobek, Toruń-Podgórz Stary Cmentarz: Józef Zakierski 1927–2007 i Feliksa Zakierska 1928–2004"},d:{en:"Sector B, row 10A, plot 2. Possibly the Józef born 1909 at Mazowsze parish is a different man; this Józef was born 18 Nov 1927.",pl:"Sektor B, rząd 10A, grób 2. Ten Józef urodził się 18 XI 1927 r."},src:"ecemetery.eu, grave 4031483"},

{id:"gr_az",kind:"grave",ln:"draminski",file:"scans/grave-mragowo-antoni-zofia-draminscy-1.jpg",year:1967,people:["antoni_dram","zofia_karcz"],rel:"verified-line",t:{en:"Headstone of Antoni and Zofia Dramiński, Mrągowo municipal cemetery, plot G/2/22",pl:"Nagrobek Antoniego i Zofii Dramińskich, cmentarz komunalny w Mrągowie, kwatera G/2/22"},d:{en:"'Dramińscy, Antoni 22 XI 1897 – 4 III 1967, Zofia 28 X 1902 – 10 XI 1963', with the couple's photograph. The ages fit the 1922 Zawidz marriage act exactly (24 and 21); probable identification, to be confirmed by the Mrągowo death acts.",pl:"„Dramińscy, Antoni 22 XI 1897 – 4 III 1967, Zofia 28 X 1902 – 10 XI 1963”, ze zdjęciem małżonków. Wiek dokładnie pasuje do aktu ślubu z Zawidza z 1922 r. (24 i 21 lat); identyfikacja prawdopodobna, do potwierdzenia aktami zgonu z USC Mrągowo."},src:"grobonet Mrągowo"},

{id:"cert_h",kind:"record",ln:"kowalczyk",file:"scans/cert-1989-usc-olsztyn-witold-henryk-kowalczyk.jpg",year:1989,people:["henryk","waclaw_k","marianna_bucz","teresa"],rel:"verified-line",t:{en:"Death certificate of Witold Henryk Kowalczyk, USC Olsztyn, 1989",pl:"Odpis skrócony aktu zgonu Witolda Henryka Kowalczyka, USC Olsztyn, 1989"},d:{en:"Born 31 Oct 1932 at Groszki Stare; died Olsztyn 27 Sep 1989 at 22:50; married to Teresa née Dramińska; parents Wacław Kowalczyk and Marianna Buczyńska. Act 2862011/00/AZ/1989/225437, copy issued 22 Feb 2017. Supplied by Greg.",pl:"Ur. 31 X 1932 w Groszkach Starych; zm. Olsztyn 27 IX 1989 o 22:50; żonaty z Teresą z d. Dramińską; rodzice Wacław Kowalczyk i Marianna Buczyńska. Akt 2862011/00/AZ/1989/225437, odpis z 22 II 2017. Dostarczył Grzegorz."},src:"USC Olsztyn"},
