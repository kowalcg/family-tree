<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Drzewo rodzinne Kowalczyk, Dramiński, Prełowski, Zakierski / Family tree">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rodzina Kowalczyk Prełowski</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Lato:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: brick-and-lime daylight page; header with language + text-size; view tabs; chart (hourglass tree or ancestor fan) beside a person drawer; galleries below. Tokens only, both themes. */
:root{
  --bg:#F4EEE4; --surface:#FFFBF5; --surface2:#F1E9DC; --fg:#241B16; --muted:#6B5F55; --rule:#B9AFA3; --rule2:#DED5C8;
  --brick:#9E3B2A; --brick2:#6E2418; --glaze:#2F4A3E; --ochre:#B5742F; --violet:#5A4A7A; --vistula:#3E6B8A; --oak:#7A6A3A;
  --lk:#9E3B2A; --ld:#B5742F; --lp:#3E6B8A; --lz:#2F4A3E; /* line hues: kowalczyk, draminski, prelowski, zakierski */
  --family:#3E6B8A; --verified:#2E6B45; --probable:#B5742F; --possible:#8A5A8E; --unknown:#8E857B;
  --display:"Cormorant Garamond",Georgia,serif; --body:"Lato","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",Menlo,monospace;
  --fs:18px; --brickline:rgba(158,59,42,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1B1512; --surface:#2A211C; --surface2:#33291F; --fg:#F3E9DC; --muted:#B9A997; --rule:#5A4C40; --rule2:#3E342B; --brick:#D5704F; --brick2:#E8A64A; --glaze:#4F8A72; --ochre:#D9A24A; --violet:#9E8CC4; --vistula:#7FA8C6; --oak:#B3A06A; --lk:#D5704F; --ld:#D9A24A; --lp:#7FA8C6; --lz:#4F8A72; --family:#7FA8C6; --verified:#62B882; --probable:#D9A24A; --possible:#C49AC9; --unknown:#7D7268; --brickline:rgba(255,255,255,.05); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1B1512; --surface:#2A211C; --surface2:#33291F; --fg:#F3E9DC; --muted:#B9A997; --rule:#5A4C40; --rule2:#3E342B; --brick:#D5704F; --brick2:#E8A64A; --glaze:#4F8A72; --ochre:#D9A24A; --violet:#9E8CC4; --vistula:#7FA8C6; --oak:#B3A06A; --lk:#D5704F; --ld:#D9A24A; --lp:#7FA8C6; --lz:#4F8A72; --family:#7FA8C6; --verified:#62B882; --probable:#D9A24A; --possible:#C49AC9; --unknown:#7D7268; --brickline:rgba(255,255,255,.05); color-scheme:dark }
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.5;margin:0;min-height:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto}
button{font-family:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
/* header */
header{padding-block:22px 10px;display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:2px solid var(--brick)}
header h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,5vw,60px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
header h1 .amp{font-style:italic;font-weight:500;color:var(--brick)}
header .lede{margin:8px 0 0;max-width:64ch;color:var(--muted);font-size:1rem}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);padding:9px 14px;min-height:48px;font-weight:700;font-size:.9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button+button{border-left:1.5px solid var(--rule)}
@media (max-width:760px){header{grid-template-columns:1fr}.ctl{justify-content:flex-start}}
/* tabs */
nav{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px 12px}
nav button{min-height:48px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--rule);background:var(--surface);color:var(--fg);font-weight:700;font-size:.95rem;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--brick);border-color:var(--brick);color:#fff}
/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px}
@media (max-width:1000px){.stage{grid-template-columns:minmax(0,1fr)}}
.chart{position:relative;background:var(--surface);border:1.5px solid var(--rule2);border-radius:12px;overflow:hidden;min-height:620px}
.chart svg{display:block;width:100%;height:700px;touch-action:pan-y pinch-zoom}
@media (max-width:760px){.chart svg{height:72vh;min-height:480px}.chart{min-height:0}}
.zoomgrp{display:inline-flex;gap:4px;margin-left:auto}
.step{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);border-radius:9px;background:var(--surface);padding:0 6px 0 10px;min-height:44px}
.step .lbl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.03em}
.step b{min-width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
.step button{min-height:36px;min-width:36px;border:0;background:transparent;font-size:1.2rem;font-weight:700;color:var(--fg);padding:0;border-radius:6px;cursor:pointer}
.step button:hover{background:var(--surface2)}
.zoomgrp button{font-size:1.25rem}
@media (max-width:760px){.legend{display:none}.crumb{display:none}.node .badge{display:none}}
.bar{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px}
.bar button,.bar select{min-height:44px;min-width:44px;padding:6px 12px;border-radius:9px;border:1.5px solid var(--rule);background:var(--surface);color:var(--fg);font-weight:700;font-size:.9rem;cursor:pointer}
.bar select{font-weight:400}
.crumb{position:absolute;left:12px;bottom:10px;font-size:.85rem;color:var(--muted);max-width:70%;pointer-events:none}
.legend{position:absolute;right:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--muted);background:color-mix(in srgb,var(--surface) 90%,transparent);padding:6px 10px;border-radius:8px;border:1px solid var(--rule2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
/* svg nodes */
.node{cursor:pointer}
.node .card{fill:var(--surface);stroke:var(--rule);stroke-width:1.5}
.node.main .card{stroke:var(--brick);stroke-width:3;fill:var(--surface2)}
.node:hover .card{stroke:var(--fg)}
.node text{font-family:var(--body);fill:var(--fg);font-size:16px}
.node .nm{font-weight:700;font-size:17px}
.node .ln{font-family:var(--display);font-weight:600;font-size:19px}
.node .dt{font-size:15px;fill:var(--muted)}
.node .ini{font-family:var(--display);font-weight:700;font-size:18px;fill:#fff}
.node.gap .card{stroke-dasharray:6 4;fill:var(--bg)}
.node.gap text{fill:var(--muted);font-style:italic}
.link{fill:none;stroke:var(--rule);stroke-width:2.2}
.link.pos{stroke-dasharray:6 5}
.link.prob{stroke-dasharray:14 5}
.link.direct{stroke:var(--brick);stroke-width:3}
.node .badge{font-family:var(--mono);font-size:9px;fill:var(--brick);letter-spacing:.06em;opacity:.85}
.banner{position:absolute;left:12px;right:12px;top:64px;background:var(--surface2);border:1.5px solid var(--ochre);border-radius:10px;padding:10px 14px;font-size:.92rem;z-index:3}
.banner b{color:var(--ochre)}
@media (max-width:760px){.banner{top:110px}}
.mar{stroke:var(--brick);stroke-width:2.2;fill:none}
.gen{font-family:var(--mono);font-size:13px;fill:var(--muted);letter-spacing:.08em;paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.wedge{cursor:pointer;stroke:var(--surface);stroke-width:1.5}
.wedge.gap{fill:var(--bg);stroke:var(--rule);stroke-dasharray:4 3;cursor:default}
.wedge:hover{filter:brightness(1.12)}
.wl{font-family:var(--body);font-size:15px;fill:#fff;pointer-events:none;font-weight:700}
.wl.sm{font-size:13px}
.wld{font-family:var(--body);font-size:13px;fill:rgba(255,255,255,.85);pointer-events:none}
.wl.dark,.wld.dark{fill:var(--fg)}
.ctr{font-family:var(--display);font-weight:700;font-size:20px;fill:var(--fg);text-anchor:middle}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* drawer */
aside{background:var(--surface);border:1.5px solid var(--rule2);border-radius:12px;padding:22px;min-width:0;align-self:start;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
@media (max-width:1000px){aside{position:static;max-height:none}}
.mono{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px;color:#fff;margin-bottom:10px}
aside h2{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;line-height:1.1;text-wrap:balance}
aside .maiden{color:var(--muted);font-style:italic;font-family:var(--display);font-size:1.2rem;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:5px 10px;border-radius:6px;color:#fff}
.tag.o{background:transparent;color:var(--fg);border:1.5px solid var(--rule)}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.95rem}
dt{color:var(--muted)}dd{margin:0}
aside p{font-size:.95rem;margin:14px 0 0}
.kin{font-family:var(--display);font-style:italic;font-size:1.05rem;color:var(--brick);margin:0 0 8px}
.src{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--rule2);word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:.9rem;min-height:40px;border:1.5px solid var(--rule);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer}
.chips button:hover{border-color:var(--brick)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts button{min-height:44px;padding:8px 14px;border-radius:9px;border:1.5px solid var(--brick);background:transparent;color:var(--brick);font-weight:700;cursor:pointer}
.acts button.pri{background:var(--brick);color:#fff}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumbs button{border:1.5px solid var(--rule);border-radius:8px;padding:0;background:var(--surface2);cursor:pointer;width:96px;height:72px;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
/* panels */
.panel{background:var(--surface);border:1.5px solid var(--rule2);border-radius:12px;padding:26px;min-width:0}
.panel h3{font-family:var(--display);font-weight:700;font-size:2rem;margin:0 0 8px;letter-spacing:-.01em}
.panel p,.panel li{max-width:72ch}
.panel .lead{color:var(--muted);margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:18px}
.story{border:1.5px solid var(--rule2);border-radius:12px;overflow:hidden;background:var(--surface2);display:flex;flex-direction:column}
.story img{width:100%;height:190px;object-fit:cover;display:block;background:var(--rule2)}
.story .b{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.story h4{margin:0;font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.15}
.story .k{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story p{margin:0;font-size:.95rem}
.story .acts{margin-top:auto}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.filters button{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--rule);background:var(--surface);color:var(--fg);font-weight:700;font-size:.85rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.doc{border:1.5px solid var(--rule2);border-radius:10px;overflow:hidden;background:var(--surface2);cursor:pointer;padding:0;text-align:left;color:var(--fg);display:flex;flex-direction:column}
.doc img{width:100%;height:150px;object-fit:cover;display:block;background:var(--rule2)}
.doc .b{padding:10px 12px 12px}
.doc .y{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.doc .t{font-weight:700;font-size:.92rem;line-height:1.25;margin-top:2px}
.pill{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:4px;margin-top:6px;color:#fff}
/* lightbox */
dialog{border:0;border-radius:14px;padding:0;max-width:min(96vw,1400px);width:96vw;background:#1B1512;color:#F3E9DC;box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,14,10,.9)}
.lb{display:grid;grid-template-rows:auto 1fr auto;height:92vh}
.lb .top{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid #4a3c33}
.lb .top h4{margin:0;font-family:var(--display);font-size:1.3rem;flex:1;min-width:0}
.lb .top button,.lb .nav button{min-width:48px;min-height:48px;border-radius:9px;border:1.5px solid #6b5a4e;background:#2A211C;color:#F3E9DC;font-size:1.2rem;font-weight:700;cursor:pointer}
.lb .view{overflow:auto;position:relative;background:#120e0b;cursor:grab}
.lb .view img{display:block;transform-origin:0 0;max-width:none}
.lb .cap{padding:12px 16px;border-top:1px solid #4a3c33;font-size:.95rem;max-height:30vh;overflow:auto}
.lb .cap .s{font-family:var(--mono);font-size:.78rem;color:#B9A997;margin-top:6px}
.lb .nav{display:flex;gap:8px}
/* timeline & map */
.tl{list-style:none;margin:16px 0 0;padding:0;border-left:3px solid var(--rule2)}
.tl li{position:relative;padding:0 0 16px 24px}
.tl li::before{content:"";position:absolute;left:-8px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--brick)}
.tl li.ctx::before{background:var(--rule)}
.tl .y{font-family:var(--mono);font-size:.82rem;color:var(--muted);display:block}
.tl li.ctx{color:var(--muted)}
.map svg{width:100%;height:auto;max-width:100%;display:block;margin-top:14px}
.map .land{fill:color-mix(in srgb,var(--vistula) 10%,var(--surface));stroke:var(--vistula);stroke-width:1}
.map .pt{cursor:pointer}
.map text{font-family:var(--body);font-size:13px;fill:var(--fg);pointer-events:none}
.map .cap{fill:var(--muted);font-size:12px}
.map .cand{fill:none;stroke:var(--ochre);stroke-width:2;stroke-dasharray:4 3}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:16px}
.stats div{border-left:3px solid var(--brick);padding:4px 0 4px 12px}
.stats b{display:block;font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.todo{border:1.5px solid var(--rule2);border-radius:10px;padding:14px 16px;background:var(--surface2);margin-top:10px}
.todo b{font-family:var(--display);font-size:1.15rem}
.note{font-size:.88rem;color:var(--muted)}
.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(92vw,720px);background:#1B1512;color:#F3E9DC;border-radius:14px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.4);z-index:20;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.tour p{margin:0;font-size:1.05rem;line-height:1.4}
.tour .k{font-family:var(--mono);font-size:.75rem;color:#E8A64A;letter-spacing:.08em}
.tour .nav{display:flex;gap:6px}
.tour button{min-width:48px;min-height:48px;border-radius:9px;border:1.5px solid #6b5a4e;background:#2A211C;color:#F3E9DC;font-weight:700;cursor:pointer}

/* ===== layout v4: left rail, full-width chart, overlay drawer ===== */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1.5px solid var(--rule2);display:flex;flex-direction:column;gap:14px;padding:16px 14px max(16px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.brand .bt{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.05;letter-spacing:-.01em}
.brand .bt .amp{font-style:italic;font-weight:500;color:var(--brick)}
.brand .bs{font-size:.78rem;color:var(--muted);margin-top:4px}
.side nav{display:flex;flex-direction:column;gap:6px;padding:0}
.side nav button{text-align:left;width:100%;min-height:46px;padding:8px 14px;border-radius:9px;border:1.5px solid transparent;background:transparent;color:var(--fg);font-weight:700;font-size:1rem;cursor:pointer}
.side nav button:hover{background:var(--surface2)}
.side nav button[aria-pressed="true"]{background:var(--brick);color:#fff}
.ctrls{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1.5px solid var(--rule2)}
.ctl-h{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.ctrls select{width:100%;min-height:46px;padding:6px 10px;border-radius:9px;border:1.5px solid var(--rule);background:var(--surface);color:var(--fg);font:inherit}
.ctrls .step{width:100%;justify-content:space-between}
.ctrls button.wide{width:100%;min-height:46px;border-radius:9px;border:1.5px solid var(--rule);background:var(--surface);color:var(--fg);font-weight:700;cursor:pointer}
.ctrls button.wide.pri{background:var(--brick);border-color:var(--brick);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1.5px solid var(--rule2)}
.main{min-width:0}
.treeview{position:relative;height:100vh}
.chart{position:relative;height:100%;min-height:0;border:0;border-radius:0;background:var(--surface)}
.chart svg{height:100%}
.zoomgrp{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;margin:0;z-index:4}
.zoomgrp button{width:48px;height:48px;border-radius:9px;border:1.5px solid var(--rule);background:var(--surface);color:var(--fg);font-size:1.3rem;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.bar{display:none}
.legend{left:12px;right:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));max-width:min(70%,560px)}
.crumb{left:12px;bottom:auto;top:12px;font-size:.95rem;font-weight:700;color:var(--fg);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:6px 10px;border-radius:8px;max-width:60%}
.banner{top:52px;left:12px;right:auto;max-width:min(90%,620px)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);max-height:none;border:0;border-left:1.5px solid var(--rule2);border-radius:0;transform:translateX(102%);transition:transform .3s ease;z-index:6;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding:22px 22px 60px}
.treeview.open .drawer{transform:none}
.drawerx{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);background:var(--surface);color:var(--fg);font-size:1.1rem;font-weight:700;cursor:pointer;z-index:7;display:none}
.treeview.open .drawerx{display:block}
.pad{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.menubtn{display:none;position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:40;min-height:46px;padding:8px 14px;border-radius:9px;border:1.5px solid var(--rule);background:var(--surface);color:var(--fg);font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}

<script>
// ===== FAMILY DATA — every person carries st (status) and lk (confidence of the link to the parents shown) =====
// st: family | verified | probable | possible | unknown ; lk: verified | probable | possible
// Sources use the Geneteka citation form: year/act, parish, indexer, unless stated otherwise.
const PEOPLE = [
// ---------- Generation 0–1: Greg & Barbara, children ----------
{id:"alex",g:"Alexander Grzegorz",s:"Kowalczyk",x:"M",b:"1 Jul 1998",bp:"Mississauga, Ontario",f:"greg",mo:"barbara",st:"family",ln:"kowalczyk"},
{id:"patricia",g:"Patricia",s:"Kowalczyk",x:"F",b:"21 Jul 1992",bp:"Mississauga, Ontario",f:"greg",mo:"barbara",st:"family",ln:"kowalczyk"},
{id:"greg",g:"Grzegorz Dariusz",s:"Kowalczyk",x:"M",b:"2 Jan 1970",bp:"Giżycko",f:"henryk",mo:"teresa",sp:["barbara"],st:"family",ln:"kowalczyk",lk:"verified",
 n:{en:"Born in Giżycko; the family lived in Kętrzyn until 1975, then Olsztyn. Left communist Poland for Germany on 20 August 1989, married Barbara on 23 August 1991, and emigrated to Canada on 25 May 1992. Mechanical engineer, later e-commerce entrepreneur in Oakville, Ontario.",pl:"Urodzony w Giżycku; rodzina mieszkała w Kętrzynie do 1975 r., potem w Olsztynie. Wyjechał z komunistycznej Polski do Niemiec 20 sierpnia 1989 r., 23 sierpnia 1991 r. ożenił się z Barbarą, a 25 maja 1992 r. wyemigrował do Kanady. Inżynier mechanik, później przedsiębiorca e-commerce w Oakville w Ontario."}},
{id:"barbara",g:"Barbara Maria",s:"Kowalczyk",m:"Prełowska",x:"F",b:"30 Nov 1966",bp:"Toruń",f:"stefan",mo:"helena",sp:["greg"],st:"family",ln:"prelowski",lk:"family",
 n:{en:"One of five Prełowski sisters: Janina, Anna, Aleksandra, Agnieszka and Barbara.",pl:"Jedna z pięciu sióstr Prełowskich: Janina, Anna, Aleksandra, Agnieszka i Barbara."}},
{id:"wieslaw",g:"Wiesław",s:"Kowalczyk",x:"M",bp:"Kętrzyn",f:"henryk",mo:"teresa",st:"family",ln:"kowalczyk",lk:"family"},
{id:"janina",g:"Janina",s:"Błażejewska",m:"Prełowska",x:"F",f:"stefan",mo:"helena",sp:["slawomir"],st:"family",ln:"prelowski",lk:"family"},
{id:"slawomir",g:"Sławomir",s:"Błażejewski",x:"M",sp:["janina"],st:"family"},
{id:"anna",g:"Anna",s:"Smoleń",m:"Prełowska",x:"F",f:"stefan",mo:"helena",sp:["damian"],st:"family",ln:"prelowski",lk:"family",n:{en:"Married Damian Smoleń; the marriage ended. Son Valentin.",pl:"Zamężna z Damianem Smoleniem; małżeństwo rozwiązane. Syn Valentin."}},
{id:"damian",g:"Damian",s:"Smoleń",x:"M",sp:["anna"],st:"family"},
{id:"valentin",g:"Valentin",s:"Smoleń",x:"M",f:"damian",mo:"anna",st:"family",lk:"family"},
{id:"aleksandra",g:"Aleksandra",s:"Prełowska",x:"F",f:"stefan",mo:"helena",st:"family",ln:"prelowski",lk:"family"},
{id:"agnieszka",g:"Agnieszka",s:"Zakierska",m:"Prełowska",x:"F",b:"1975",bq:1,f:"stefan",mo:"helena",sp:["tomek"],st:"family",ln:"prelowski",lk:"family",
 n:{en:"The youngest sister. Married Tomek Zakierski, her mother Helena's maiden name; with a surname this rare and this local, a cousin link between the two Zakierski families is likely and worth checking. Three daughters, among them Agata.",pl:"Najmłodsza z sióstr. Wyszła za Tomka Zakierskiego, a to nazwisko panieńskie jej matki Heleny; przy tak rzadkim i lokalnym nazwisku pokrewieństwo obu rodzin Zakierskich jest prawdopodobne i warte sprawdzenia. Trzy córki, wśród nich Agata."}},
{id:"tomek",g:"Tomasz (Tomek)",s:"Zakierski",x:"M",sp:["agnieszka"],st:"family",ln:"zakierski",n:{en:"Shares the surname of his mother-in-law Helena née Zakierska. Relationship, if any, to Helena's Steklin family not yet established.",pl:"Nosi nazwisko panieńskie swojej teściowej Heleny. Ewentualne pokrewieństwo z Zakierskimi ze Steklina jeszcze nieustalone."}},
{id:"agata",g:"Agata",s:"Zakierska",x:"F",f:"tomek",mo:"agnieszka",st:"family",lk:"family",n:{en:"One of three daughters; the other two names still to be added.",pl:"Jedna z trzech córek; imiona dwu pozostałych do uzupełnienia."}},

// ---------- Generation 2: the parents ----------
{id:"henryk",g:"Witold Henryk",s:"Kowalczyk",x:"M",b:"31 Oct 1932",bp:"Groszki Stare, par. Kałuszyn",d:"27 Sep 1989",dp:"Olsztyn",f:"waclaw_k",mo:"marianna_bucz",sp:["teresa"],st:"verified",ln:"kowalczyk",lk:"verified",src:"Death certificate, USC Olsztyn, act 2862011/00/AZ/1989/225437 (copy issued 22 Feb 2017)",ph:["cert-1989-usc-olsztyn-witold-henryk-kowalczyk.jpg","grave-olsztyn-gutkowo-witold-teresa-kowalczyk-1.jpg"],
 n:{en:"Known in the family as Henryk; the registry has him as Witold Henryk. Born 31 October 1932 at Groszki Stare, son of Wacław Kowalczyk and Marianna Buczyńska, as his death certificate states. Settled after the war in Kętrzyn, the former Rastenburg, and moved to Olsztyn in 1975. Died in Olsztyn on 27 September 1989 at 22:50, five weeks after Greg left for Germany. His father Wacław, born at Groszki in 1899, carries the line back through the Kałuszyn and Grębków registers to the 1750s.",pl:"W rodzinie Henryk; w aktach Witold Henryk. Urodzony 31 października 1932 r. w Groszkach Starych, syn Wacława Kowalczyka i Marianny Buczyńskiej, jak podaje jego akt zgonu. Po wojnie osiadł w Kętrzynie, dawnym Rastenburgu, a w 1975 r. przeniósł się do Olsztyna. Zmarł w Olsztynie 27 września 1989 r. o 22:50, pięć tygodni po wyjeździe Grzegorza do Niemiec. Jego ojciec Wacław, urodzony w Groszkach w 1899 r., prowadzi linię przez księgi Kałuszyna i Grębkowa aż do lat 50. XVIII w."}},
{id:"waclaw_k",g:"Wacław",s:"Kowalczyk",x:"M",b:"28 Sep 1899",bp:"Groszki, par. Kałuszyn",f:"antoni_k2",mo:"feliksa_lach",sp:["marianna_bucz"],st:"verified",ln:"kowalczyk",lk:"probable",src:"Kałuszyn birth 1899/194 (28 Sep 1899, parents Antoni and Feliksa Łachniak); named as father on Henryk's death certificate, USC Olsztyn 1989",
 n:{en:"Greg's grandfather. The Kałuszyn register has exactly one Wacław Kowalczyk of Groszki in the right generation: born 28 September 1899, fourth of ten children of Antoni Kowalczyk and Feliksa Łachniak. The identification with the Wacław named on Henryk's death certificate is probable; his marriage to Marianna Buczyńska (about 1925–1932) lies after the index ends and sits in the Kałuszyn registry office.",pl:"Dziadek Grzegorza. Księga kałuszyńska zna dokładnie jednego Wacława Kowalczyka z Groszek we właściwym pokoleniu: urodzonego 28 września 1899 r., czwarte z dziesięciorga dzieci Antoniego Kowalczyka i Feliksy Łachniak. Identyfikacja z Wacławem z aktu zgonu Henryka jest prawdopodobna; jego ślub z Marianną Buczyńską (ok. 1925–1932) wypada po końcu indeksu i czeka w USC Kałuszyn."}},
{id:"marianna_bucz",g:"Marianna",s:"Kowalczyk",m:"Buczyńska",x:"F",sp:["waclaw_k"],st:"verified",ln:"kowalczyk",src:"Named as mother on the death certificate of Witold Henryk Kowalczyk, USC Olsztyn 1989",n:{en:"Greg's grandmother, born a Buczyńska. Her family's parish is not yet known.",pl:"Babka Grzegorza, z domu Buczyńska. Parafia jej rodziny jeszcze nieznana."}},
{id:"teresa",g:"Teresa",s:"Kowalczyk",m:"Dramińska",x:"F",b:"26 Sep 1935",bp:"Kosemin, par. Zawidz, pow. Sierpc",d:"18 Feb 2017",dp:"Barczewo",f:"antoni_dram",mo:"zofia_karcz",sp:["henryk"],st:"verified",ln:"draminski",lk:"verified",src:"Death certificate, USC Barczewo, act 2814013/00/AZ/2017/337436; headstone, Olsztyn-Gutkowo parish cemetery, plot I/IV/07",ph:["cert-2017-usc-barczewo-teresa-kowalczyk-draminska.jpg","grave-olsztyn-gutkowo-witold-teresa-kowalczyk-1.jpg"],
 n:{en:"Born 26 September 1935 at Kosemin in Zawidz parish, Sierpc county, in the northern Mazowsze country where the Dramiński name has lived since the 1600s; daughter of Antoni Dramiński and Zofia Karczewska. Widowed in 1989, she died at Barczewo near Olsztyn on 18 February 2017 and rests with Henryk in the Gutkowo parish cemetery in Olsztyn, plot I/IV/07; the headstone reads 'Witold *31.10.1932 +27.9.1989, Teresa *26.09.1935 +18.02.2017'.",pl:"Urodzona 26 września 1935 r. w Koseminie w parafii Zawidz, powiat sierpecki, na północnym Mazowszu, gdzie nazwisko Dramiński żyje od XVII w.; córka Antoniego Dramińskiego i Zofii Karczewskiej. Owdowiała w 1989 r., zmarła w Barczewie pod Olsztynem 18 lutego 2017 r. i spoczywa z Henrykiem na cmentarzu parafialnym w Gutkowie w Olsztynie, kwatera I/IV/07; na nagrobku: „Witold *31.10.1932 +27.9.1989, Teresa *26.09.1935 +18.02.2017”."}},
{id:"stefan",g:"Stefan",s:"Prełowski",x:"M",b:"4 Jan 1939",bp:"Szczecin area (per family)",bpq:1,d:"15 Jul 2025",dp:"Toruń",f:"prelowski_nn_son",sp:["helena"],st:"family",ln:"prelowski",lk:"possible",src:"Family; grave plaque, Toruń św. Jerzego cemetery, plot K/10/21 (cmentarnik.net, indexed as 'Perłowski')",ph:["grave-torun-swjerzego-stefan-prelowski-1939-2025-plaque.jpg","grave-torun-swjerzego-stefan-prelowski-1939-2025-wide.jpg"],
 n:{en:"Born, as the family remembers it, somewhere in the Szczecin area. He came to Toruń only for his two years of compulsory military service, met Helena there, married and stayed. His surname is written Prelowski, Prełowski or Przełowski in different papers; in the registers it is Prełowski, and every one of its 46 living bearers today lives in the Toruń or Gdańsk voivodeships, none near Szczecin. In January 1939 Szczecin was German Stettin, so either the family moved west after 1945 and he was born in the old Pomeranian homeland, or the name on his papers differs. The Chełmno household at Rybacka 3, where an older Stefan Prełowski was born in 1910, is shown as a possible origin only. He died on 15 July 2025 and rests in plot K/10/21 of St George's cemetery in Toruń, beside Helena's parents; in November 2025 the Zakierski family had a mass said for him at Mała Nieszawka. His army service book, if the family still has it, states his birthplace and parents. His marriage record from the Toruń registry office names his parents and birthplace and is the single most useful document to order.",pl:"Urodzony, jak pamięta rodzina, gdzieś w okolicach Szczecina. Do Torunia trafił tylko na dwa lata obowiązkowej służby wojskowej, tam poznał Helenę, ożenił się i został. Nazwisko pisane jest w dokumentach Prelowski, Prełowski lub Przełowski; w księgach brzmi Prełowski, a wszystkich 46 żyjących dziś osób tego nazwiska mieszka w województwach toruńskim i gdańskim, nikt pod Szczecinem. W styczniu 1939 r. Szczecin był niemieckim Stettinem, więc albo rodzina przeniosła się na zachód po 1945 r., a on urodził się w dawnej pomorskiej ojczyźnie, albo nazwisko w jego dokumentach brzmi inaczej. Dom przy Rybackiej 3 w Chełmnie, gdzie w 1910 r. urodził się starszy Stefan Prełowski, pokazany jest tylko jako możliwe pochodzenie. Zmarł 15 lipca 2025 r. i spoczywa w kwaterze K/10/21 cmentarza św. Jerzego w Toruniu, obok rodziców Heleny; w listopadzie 2025 r. rodzina Zakierskich zamówiła za niego mszę w Małej Nieszawce. Jego książeczka wojskowa, jeśli rodzina ją ma, podaje miejsce urodzenia i rodziców. Jego akt małżeństwa z USC Toruń podaje rodziców i miejsce urodzenia i jest najważniejszym dokumentem do zamówienia."}},
{id:"helena",g:"Helena",s:"Prełowska",m:"Zakierska",x:"F",b:"9 Aug 1936",bp:"Osówka, par. Czernikowo",f:"julian_z1909",mo:"zofia",sp:["stefan"],st:"family",ln:"zakierski",lk:"family",
 n:{en:"Born in Osówka, a hamlet of St Bartholomew's parish, Czernikowo, 28 km south-east of Toruń, and moved to Toruń as a young woman. Her surname has about 300 bearers in Poland, two thirds of them in this one district. Her father Julian Zakierski was born at Steklin, 3 km from Osówka, on 21 November 1909, a son of Wacław Zakierski and Julianna Hinc, and died in Toruń on 2 October 1994. Her mother was Zofia; her maiden name is still to be found. Siblings: Irena, Wacław and Józef.",pl:"Urodzona w Osówce, przysiółku parafii św. Bartłomieja w Czernikowie, 28 km na południowy wschód od Torunia; jako młoda kobieta przeniosła się do Torunia. Jej nazwisko nosi ok. 300 osób w Polsce, dwie trzecie w tym jednym powiecie. Jej ojciec Julian Zakierski urodził się w Steklinie, 3 km od Osówki, 21 listopada 1909 r., jako syn Wacława Zakierskiego i Julianny Hinc, i zmarł w Toruniu 2 października 1994 r. Matką była Zofia; jej nazwisko panieńskie pozostaje do ustalenia. Rodzeństwo: Irena, Wacław i Józef."}},

// ---------- ZAKIERSKI: Helena's home chain (Czernikowo parish) ----------
{id:"zofia",g:"Zofia",s:"Zakierska",m:"?",x:"F",b:"14 Nov 1909",d:"10 Feb 2002",dp:"Toruń",sp:["julian_z1909"],st:"verified",ln:"zakierski",src:"Headstone, Toruń św. Jerzego cemetery, cathedral-parish section, plot K/10/20 (cmentarnik.net/g/389710); identified as Helena's mother by Greg",ph:["grave-torun-swjerzego-julian-zofia-zakierscy-inscription.jpg","grave-torun-swjerzego-julian-zofia-zakierscy-wide.jpg"],n:{en:"Helena's mother. Born 14 November 1909, three days before her future husband, and died in Toruń on 10 February 2002 at 92. She rests with Julian under one grey granite stone inscribed 'Zakierscy' in the cathedral-parish section of St George's cemetery on Gałczyńskiego street, plot K/10/20. The stone gives no maiden name; her death act at USC Toruń (February 2002) or Helena's 1936 birth act will, and will open a whole new line. The parish has asked the grave holder to renew the lease.",pl:"Matka Heleny. Urodzona 14 listopada 1909 r., trzy dni przed swoim przyszłym mężem, zmarła w Toruniu 10 lutego 2002 r. w wieku 92 lat. Spoczywa z Julianem pod jednym szarym granitowym nagrobkiem z napisem „Zakierscy” w części parafii katedralnej cmentarza św. Jerzego przy ul. Gałczyńskiego, kwatera K/10/20. Na kamieniu nie ma nazwiska panieńskiego; poda je akt zgonu z USC Toruń (luty 2002) albo akt urodzenia Heleny z 1936 r. i otworzy całą nową linię. Parafia prosi dysponenta grobu o przedłużenie opłaty."}},

{id:"waclaw_z",g:"Wacław",s:"Zakierski",x:"M",b:"c. 1882–1886",bq:1,bp:"par. Wola Trutowo (probably)",bpq:1,f:"marian_zd1",mo:"franciszka_kal",sp:["julianna_hinc"],st:"verified",ln:"zakierski",lk:"verified",src:"Czernikowo marriage 1905/12 (indexed 'Zakerski'): son of Marian Zakierski and Franciszka Kalinowska, to Julia Hinc, daughter of Leonard and Katarzyna Plewa; children at Steklin and Szkleniec 1906–1930",
 n:{en:"Helena's grandfather. Married Julia Hinc of Steklin at Czernikowo in 1905 and farmed at Steklin and Szkleniec, 3 km from Osówka, where Kazimiera (1906), Czesław (1907), Julian (1909), Jan (1911), Antoni (1916) and Adam (1930) were born. His own baptism, about 1882–1886, lies in the Wola Trutowo register for 1867–1889, which no index has yet covered; that book at the Włocławek branch of the state archive is the next pull. In the 1911 death entry for little Jan the clerk wrote the father's name as 'Wojciech', a slip that misled the first search.",pl:"Dziadek Heleny. W 1905 r. ożenił się w Czernikowie z Julią Hinc ze Steklina i gospodarzył w Steklinie i Szkleńcu, 3 km od Osówki, gdzie urodzili się Kazimiera (1906), Czesław (1907), Julian (1909), Jan (1911), Antoni (1916) i Adam (1930). Jego własny chrzest, ok. 1882–1886, kryje się w księdze Woli Trutowo z lat 1867–1889, której żaden indeks jeszcze nie objął; ta księga w oddziale włocławskim Archiwum Państwowego to następna kwerenda. W akcie zgonu małego Jana z 1911 r. pisarz wpisał ojca jako „Wojciecha”, co zmyliło pierwsze poszukiwania."}},
{id:"julianna_hinc",g:"Julia (Julianna)",s:"Zakierska",m:"Hinc",x:"F",b:"1889",bp:"Steklin, par. Czernikowo",f:"leonard_hinc",mo:"katarzyna_plewa",sp:["waclaw_z"],st:"verified",ln:"zakierski",lk:"verified",src:"Czernikowo birth 1889/188 (Czarkowski_Jarosław); marriage 1905/12",n:{en:"Helena's grandmother, born at Steklin in 1889, the youngest of nine children of Leonard Hinc and Katarzyna Plewa. Married at sixteen. The Hinc family, Roman Catholic despite the German-sounding name, had lived at Obrowo and Steklin in Czernikowo parish since at least the 1770s.",pl:"Babka Heleny, urodzona w Steklinie w 1889 r., najmłodsza z dziewięciorga dzieci Leonarda Hinca i Katarzyny Plewy. Wyszła za mąż w wieku szesnastu lat. Hincowie, katolicy mimo niemiecko brzmiącego nazwiska, mieszkali w Obrowie i Steklinie w parafii Czernikowo co najmniej od lat 70. XVIII w."}},
{id:"kazimiera_z1906",g:"Kazimiera",s:"Zakierska",x:"F",b:"1906",bp:"Steklin, par. Czernikowo",f:"waclaw_z",mo:"julianna_hinc",st:"verified",ln:"zakierski",lk:"verified",src:"Czernikowo 1906/4 (Uszyńska_Hanna)"},
{id:"czeslaw_z1907",g:"Czesław",s:"Zakierski",x:"M",b:"3 Nov 1907",bp:"Steklin, par. Czernikowo",d:"9 Feb 2002",dp:"Lipno",f:"waclaw_z",mo:"julianna_hinc",st:"verified",ln:"zakierski",lk:"verified",src:"Czernikowo 1907/163; death noted by indexer: Lipno act 43/2002",n:{en:"Helena's uncle. Lived to 94 and died in Lipno in 2002.",pl:"Stryj Heleny. Dożył 94 lat; zmarł w Lipnie w 2002 r."}},
{id:"julian_z1909",g:"Julian",s:"Zakierski",x:"M",b:"21 Nov 1909",bp:"Steklin, par. Czernikowo",d:"2 Oct 1994",dp:"Toruń",f:"waclaw_z",mo:"julianna_hinc",sp:["zofia"],st:"verified",ln:"zakierski",lk:"verified",src:"Czernikowo birth 1909/214 (Uszyńska_Hanna); death: USC Toruń act 1514/1994; headstone Toruń św. Jerzego K/10/20 (birth given there as 17 Nov 1909); identified as Helena's father by Greg, Nov 2026",ph:["grave-torun-swjerzego-julian-zofia-zakierscy-inscription.jpg"],n:{en:"Helena's father. Born at Steklin on 21 November 1909, act 214 of the Czernikowo register, son of Wacław Zakierski and Julianna Hinc; married Zofia; father of Irena, Wacław, Józef and Helena. Died in Toruń on 2 October 1994, act 1514, and lies with Zofia in St George's cemetery, plot K/10/20; the stone gives his birth as 17 November, the baptism index 21 November. The family's memory and the parish record meet in this one man, and through him Helena's line runs back, record by record, to Gabryel Zakierski born about 1739.",pl:"Ojciec Heleny. Urodzony w Steklinie 21 listopada 1909 r., akt 214 księgi czernikowskiej, syn Wacława Zakierskiego i Julianny Hinc; mąż Zofii; ojciec Ireny, Wacława, Józefa i Heleny. Zmarł w Toruniu 2 października 1994 r., akt 1514, i spoczywa z Zofią na cmentarzu św. Jerzego, kwatera K/10/20; kamień podaje datę urodzenia 17 listopada, indeks chrztów 21 listopada. Pamięć rodziny i akt parafialny spotykają się w tej jednej osobie, a przez niego linia Heleny biegnie, akt po akcie, do Gabryela Zakierskiego urodzonego ok. 1739 r."}},
{id:"jan_z1911",g:"Jan",s:"Zakierski",x:"M",b:"1911",bp:"Szkleniec, par. Czernikowo",d:"11 Mar 1911",f:"waclaw_z",mo:"julianna_hinc",st:"verified",ln:"zakierski",lk:"verified",src:"Czernikowo 1911/54; death 1911/16, aged two weeks"},
{id:"antoni_z1916",g:"Antoni",s:"Zakierski",x:"M",b:"1916",bp:"Szkleniec, par. Czernikowo",f:"waclaw_z",mo:"julianna_hinc",st:"verified",ln:"zakierski",lk:"verified",src:"straty.pl (IPN) card: parents Wacław and Julianna, Szkleniec",n:{en:"Found in the war-losses database, which proves the Steklin couple were still having children after the parish index ends in 1911. The same hamlet, Szkleniec, as little Jan in 1911.",pl:"Odnaleziony w bazie strat wojennych, co dowodzi, że para ze Steklina miała dzieci także po 1911 r., gdy kończy się indeks parafialny. Ten sam przysiółek, Szkleniec, co mały Jan w 1911 r."}},
{id:"adam_z1930",g:"Adam",s:"Zakierski",x:"M",b:"1930",bp:"Szkleniec, par. Czernikowo",f:"waclaw_z",mo:"julianna_hinc",st:"verified",ln:"zakierski",lk:"probable",src:"straty.pl (IPN) card: parents Wacław and Julianna, Szkleniec",n:{en:"A child of a Wacław and Julianna Zakierski at Szkleniec as late as 1930. If this is still Julianna Hinc she was about 45; it may instead be a son Wacław married to another Julianna. Either way the Zakierski family was at Szkleniec and Steklin, 3 km from Osówka, right up to Helena's birth in 1936.",pl:"Dziecko Wacława i Julianny Zakierskich w Szkleńcu jeszcze w 1930 r. Jeśli to wciąż Julianna Hinc, miała ok. 45 lat; może to być też syn Wacław żonaty z inną Julianną. Tak czy inaczej, Zakierscy mieszkali w Szkleńcu i Steklinie, 3 km od Osówki, aż do narodzin Heleny w 1936 r."}},
{id:"jan_z1841",g:"Jan",s:"Zakierski",x:"M",b:"c. 1841",bq:1,bp:"Steklinek, par. Czernikowo",f:"wojciech_z",mo:"jozefa_z",sp:["marcjanna_turn"],st:"verified",ln:"zakierski",lk:"verified",src:"Czernikowo marriage 1881/11 (Uszyńska_Hanna): widower aged 40, son of Wojciech and Józefa",
 n:{en:"A widower of 40 when he married Marcjanna Turnowska at Czernikowo on 8 May 1881. First thought to be Wacław's father; the 1905 marriage act shows Wacław was Marian's son, so Jan is a Zakierski of the same hamlet, kin not yet placed.",pl:"Czterdziestoletni wdowiec, gdy 8 maja 1881 r. ożenił się w Czernikowie z Marcjanną Turnowską. Początkowo uznany za ojca Wacława; akt ślubu z 1905 r. pokazuje, że Wacław był synem Mariana, więc Jan to Zakierski z tego samego przysiółka, krewny jeszcze nieumiejscowiony."}},
{id:"marcjanna_turn",g:"Marcjanna",s:"Zakierska",m:"Turnowska",x:"F",b:"c. 1842",bq:1,sp:["jan_z1841"],st:"verified",ln:"zakierski",src:"Czernikowo marriage 1881/11: daughter of Józef Turnowski and Marianna Bątkowska, aged 39"},
{id:"wojciech_z",g:"Wojciech",s:"Zakierski",x:"M",b:"c. 1800–1815",bq:1,sp:["jozefa_z"],st:"verified",ln:"zakierski",src:"Named as the groom's father in Czernikowo marriage 1881/11",n:{en:"Named only as father of the groom in the 1881 marriage act; possibly the Wojciech Zakierski who died at Mazowsze parish in 1847.",pl:"Znany tylko jako ojciec pana młodego z aktu ślubu z 1881 r.; być może ten Wojciech Zakierski, który zmarł w parafii Mazowsze w 1847 r."}},
{id:"jozefa_z",g:"Józefa",s:"Zakierska",x:"F",sp:["wojciech_z"],st:"verified",ln:"zakierski",src:"Named as the groom's mother in Czernikowo marriage 1881/11"},

{id:"mateusz_z1783",g:"Mateusz",s:"Zakierski",x:"M",b:"c. 1783",bq:1,d:"30 Jan 1813",dp:"Obrowo",f:"franciszek_z18",mo:"agnieszka_z18",sp:["magdalena_gaw"],st:"verified",ln:"zakierski",lk:"verified",src:"Czernikowo marriage 1809/10 (groom 22, son of Franciszek and Agnieszka); death 1813/43, aged 30",n:{en:"Married Magdalena Gaworkiewicz at Czernikowo on 13 November 1809 and died at 30, two days after his daughter Apolonia was born. The oldest Zakierski family unit in Helena's parish; how it connects to the Steklinek line is not yet shown by any record.",pl:"Ożenił się z Magdaleną Gaworkiewicz w Czernikowie 13 listopada 1809 r. i zmarł w wieku 30 lat, dwa dni po narodzinach córki Apolonii. Najstarsza rodzina Zakierskich w parafii Heleny; jak łączy się z linią ze Steklinka, nie pokazuje jeszcze żaden akt."}},

{id:"gabryel_z",g:"Gabryel",s:"Zakierski",x:"M",b:"c. 1739",bq:1,d:"26 Jun 1819",dp:"Witowąż, par. Czernikowo",sp:["ewa_pawl"],st:"probable",ln:"zakierski",src:"Czernikowo death 1819/3, widower aged 80; marriage Działyń 1774/92",n:{en:"The oldest Zakierski found in the Czernikowo country, born about 1739, in the reign of August III. Married Ewa Pawłowska at Działyń in 1774, baptised sons at Chrostkowo in the 1780s, and died a widower of 80 at Witowąż in 1819. That the 1774 groom and the 1819 widower are the same man is probable, not proven.",pl:"Najstarszy Zakierski odnaleziony w okolicach Czernikowa, urodzony ok. 1739 r., za Augusta III. Ożenił się z Ewą Pawłowską w Działyniu w 1774 r., chrzcił synów w Chrostkowie w latach 80. XVIII w. i zmarł jako 80-letni wdowiec w Witowężu w 1819 r. Tożsamość pana młodego z 1774 r. i wdowca z 1819 r. jest prawdopodobna, nie dowiedziona."}},

{id:"boleslaw_z1903",g:"Bolesław",s:"Zakierski",x:"M",b:"25 Oct 1903",bp:"Rudawa",d:"Sep 1939 (declared dead 1946)",f:"antoni_zc2",mo:"franciszka_bad",st:"verified",ln:"zakierski",lk:"verified",src:"straty.pl, IPN By 115/202: reservist, lived Czernikowo, missing September 1939; death declared by Lipno court 1946",n:{en:"Lived in Czernikowo, mobilised as a reservist in 1939 and never came back; the Lipno court declared him dead in 1946. From the Mazowsze-parish branch of the family.",pl:"Mieszkał w Czernikowie; zmobilizowany jako rezerwista w 1939 r., nie wrócił; sąd w Lipnie uznał go za zmarłego w 1946 r. Z gałęzi rodziny z parafii Mazowsze."}},

{id:"zofia_brzoz",g:"Zofia Leokadia",s:"Zakierska",m:"Brzozowska",x:"F",sp:["wladyslaw_z1875"],st:"verified",ln:"zakierski",src:"Dobrzejewice marriage 1899/1",n:{en:"The only Zofia married to a Zakierski anywhere in the index. Born about 1880, she is a generation too old to be Helena's mother.",pl:"Jedyna Zofia zamężna z Zakierskim w całym indeksie. Urodzona ok. 1880 r., jest o pokolenie za stara, by być matką Heleny."}},
{id:"jozefat_z1854",g:"Józefat Franciszek",s:"Zakierski",x:"M",b:"1854",bp:"Mazowsze",d:"1909",dp:"Dobrzejewice",f:"jozef_zb1",mo:"agnieszka_rom",sp:["marcjanna_fyd","antonina_lew"],st:"verified",ln:"zakierski",lk:"probable",src:"Mazowsze 1854/2; marriages Dobrzejewice 1874/12 and Czernikowo 1898/23; death Dobrzejewice 1909/49",n:{en:"Married twice and fathered fourteen children at Dobrzejewice between 1875 and 1910, eight of whom died young. The largest Zakierski household in the Toruń country.",pl:"Dwukrotnie żonaty, spłodził w Dobrzejewicach czternaścioro dzieci w latach 1875–1910, z których ośmioro zmarło młodo. Największe gospodarstwo Zakierskich w ziemi toruńskiej."}},

{id:"marian_zd1",g:"Marian",s:"Zakierski",x:"M",b:"c. 1857",bq:1,bp:"Trutowo, par. Wola Trutowo",d:"1897",dp:"Lipno",f:"mikolaj_z",mo:"urszula_gaj",sp:["franciszka_kal","katarzyna_pelk"],st:"verified",ln:"zakierski",lk:"verified",src:"Ciechocin marriage 1881/10 ('Zakerski') to Franciszka Kalinowska; Ciechocin marriage 1887/25 to Katarzyna Pełkowska; Lipno death 1897/29",
 n:{en:"Helena's great-grandfather. Married Franciszka Kalinowska at Ciechocin in 1881; she died young, and in 1887 he married Katarzyna Pełkowska. Children from both marriages, Wacław among the first. Died at Lipno in 1897, about forty.",pl:"Pradziadek Heleny. W 1881 r. ożenił się w Ciechocinie z Franciszką Kalinowską; zmarła młodo, a w 1887 r. ożenił się z Katarzyną Pełkowską. Dzieci z obu małżeństw, Wacław z pierwszego. Zmarł w Lipnie w 1897 r., około czterdziestki."}},

{id:"mikolaj_z",g:"Mikołaj",s:"Zakierski",x:"M",b:"c. 1818",bq:1,bp:"Trutowo",f:"andrzej_z_tr",mo:"jadwiga_ks",sp:["urszula_gaj"],st:"verified",ln:"zakierski",lk:"possible",src:"Wola Trutowo marriage 1844/4; births 1847/8, 1852/5, 1866/15; 'ojciec gospodarz'",n:{en:"Helena's great-great-grandfather, a farmer (gospodarz) at Trutowo, married Urszula Gajewska at Wola Trutowo in 1844. Children Józef (1847, died in infancy), Antoni (1852), Marian (about 1857), Józefa (1866). Possibly a son of Andrzej Zakierski and Jadwiga Ksęczewska of Trutowo, whose son Wawrzyniec was baptised there in 1826.",pl:"Prapradziadek Heleny, gospodarz w Trutowie, w 1844 r. ożenił się w Woli Trutowo z Urszulą Gajewską. Dzieci: Józef (1847, zmarł w niemowlęctwie), Antoni (1852), Marian (ok. 1857), Józefa (1866). Możliwe, że syn Andrzeja Zakierskiego i Jadwigi Ksęczewskiej z Trutowa, których syna Wawrzyńca ochrzczono tam w 1826 r."}},

{id:"andrzej_z_tr",g:"Andrzej (Jędrzej)",s:"Zakierski",x:"M",b:"c. 1778",bq:1,bp:"Trutowo",sp:["jadwiga_ks"],st:"possible",ln:"zakierski",src:"Wola Trutowo birth 1826/44 (Wawrzeniec, son of Jędrzej and Jadwiga Ksęczewska); summary entries 1803–1807 with a wife Wiktoria",n:{en:"The oldest Zakierski of Trutowo in the registers, with children recorded from 1803. Possible father of Mikołaj.",pl:"Najstarszy Zakierski z Trutowa w księgach, z dziećmi notowanymi od 1803 r. Możliwy ojciec Mikołaja."}},

{id:"marcin_hinc1",g:"Marcin",s:"Hinc",x:"M",b:"c. 1775",bq:1,bp:"Obrowo, par. Czernikowo",sp:["maryanna_tarl"],st:"verified",ln:"zakierski",src:"Named as father in Czernikowo marriages 1820/15 and 1831/4",n:{en:"The oldest Hinc found: a farmer at Obrowo in the last years of the Commonwealth, named as father in his children's marriage acts of 1820 and 1831. Helena's 4× great-grandfather, and Alexander's and Patricia's 7× great-grandfather.",pl:"Najstarszy odnaleziony Hinc: gospodarz w Obrowie w ostatnich latach Rzeczypospolitej, wymieniony jako ojciec w aktach ślubów dzieci z 1820 i 1831 r. Czterokrotny pradziadek Heleny, a siedmiokrotny pradziadek Alexandra i Patricii."}},

{id:"johann_z1914",g:"Jan (Johann)",s:"Zakierski",x:"M",bp:"Ostrowite (Osterbitz), Golub",d:"Nov 1914",st:"verified",ln:"zakierski",src:"German WWI casualty list Preußen 79, issue 203, 17 Nov 1914, p. 2673: 'Zakierski, Johann, Osterbitz, Kr. Briesen, IR 42, tot'",ph:["VL-1914-11-17-Zakierski-Johann-Osterbitz-tot.jpg"],n:{en:"Killed in the Prussian army in the autumn of 1914, from Ostrowite near Golub, 15 km from Czernikowo but across the old border: a Zakierski on the Prussian side while Helena's family lived on the Russian side. Possible kin.",pl:"Poległ w armii pruskiej jesienią 1914 r.; z Ostrowitego pod Golubiem, 15 km od Czernikowa, ale po drugiej stronie dawnej granicy: Zakierski po stronie pruskiej, gdy rodzina Heleny żyła po rosyjskiej. Możliwi krewni."}},
{id:"waclaw_z1922",g:"Wacław",s:"Zakierski",x:"M",b:"15 Jan 1922",d:"20 Jul 2011",dp:"Toruń",st:"possible",ln:"zakierski",src:"ecemetery.eu, Toruń-Podgórz Nowy Cmentarz, sector 8 row 3 plot 7",n:{en:"Buried at the Podgórz parish cemetery in Toruń with Irena Zakierska (1930–2003). Born 1922, he is too old to be Helena's brother Wacław, whose father Julian was born in 1909; possibly a cousin from another Steklin or Toruń branch. Possible kin; not proven.",pl:"Pochowany na cmentarzu parafialnym na Podgórzu w Toruniu razem z Ireną Zakierską (1930–2003). Urodzony w 1922 r., jest za stary na brata Heleny, Wacława, którego ojciec Julian urodził się w 1909 r.; może kuzyn z innej gałęzi steklińskiej lub toruńskiej. Możliwi krewni; niepotwierdzone."}},

// ---------- PREŁOWSKI ----------
{id:"prelowski_nn_son",g:"?",s:"Prełowski",x:"M",b:"c. 1900–1912",bq:1,bp:"Chełmno",bpq:1,f:"prelowski_nn",mo:"marta_szcz",st:"possible",ln:"prelowski",lk:"possible",src:"Hypothesis from the Arolsen card of Stefan Prełowski (1910): father died 1912, mother at Rybacka 3",
 n:{en:"Stefan's father, name unknown. The leading hypothesis is a son of the Chełmno household at Rybacka 3: the father, a farm labourer, died in 1912, so all the children were born 1900–1912, exactly the generation to have a son in 1939. The family still lives at that address today. A possible link, not a proven one; Barbara's full birth certificate (USC Toruń) names Stefan's parents and would replace this box with real names.",pl:"Ojciec Stefana, imię nieznane. Wiodąca hipoteza: syn z domu przy Rybackiej 3 w Chełmnie; ojciec rodziny, robotnik rolny, zmarł w 1912 r., więc wszystkie dzieci urodziły się w latach 1900–1912, dokładnie w pokoleniu, które mogło mieć syna w 1939 r. Rodzina mieszka pod tym adresem do dziś. Powiązanie możliwe, nie dowiedzione; odpis zupełny aktu urodzenia Barbary (USC Toruń) podaje rodziców Stefana i zastąpiłby to pole prawdziwymi imionami."}},
{id:"prelowski_nn",g:"? (farm labourer)",s:"Prełowski",x:"M",d:"1912",dp:"Chełmno",sp:["marta_szcz"],st:"verified",ln:"prelowski",src:"Arolsen Archives, Buchenwald prisoner card of Stefan Prełowski, 1.1.5.3 / 01010503 001.403.466",n:{en:"Known only from his son's concentration-camp card: 'father: farm labourer, name unknown, died 1912'.",pl:"Znany tylko z karty obozowej syna: „ojciec: robotnik rolny, imię nieznane, zm. 1912”."}},
{id:"marta_szcz",g:"Marta",s:"Prełowska",m:"Szczęsna",x:"F",bp:"Chełmno",sp:["prelowski_nn"],st:"verified",ln:"prelowski",src:"Arolsen Archives, Buchenwald card: 'Mutter: Marta geb. Szczęsna, wohnhaft Kulm/W., Fischerstr. 3'",ph:["arolsen-stefan-prelowski-1910-53423225-001.jpg"],
 n:{en:"A widow from 1912, still living at Rybacka 3 (Fischerstraße 3) in Chełmno in 1940 when her son was registered at Buchenwald. The same address houses a Prełowski family today.",pl:"Wdowa od 1912 r., w 1940 r. wciąż mieszkała przy Rybackiej 3 (Fischerstraße 3) w Chełmnie, gdy jej syna rejestrowano w Buchenwaldzie. Pod tym samym adresem mieszka dziś rodzina Prełowskich."}},
{id:"stefan_p1910",g:"Stefan",s:"Prełowski",x:"M",b:"3 Sep 1910",bp:"Chełmno (Kulm)",f:"prelowski_nn",mo:"marta_szcz",st:"verified",ln:"prelowski",lk:"verified",src:"Auschwitz Museum list of the first transport, 14 Jun 1940, no. 614; Arolsen Buchenwald file 128398; Chełmno gymnasium report 1928/29, matura list no. 13",ph:["arolsen-stefan-prelowski-1910-53423225-001.jpg","arolsen-stefan-prelowski-1910-53423225-002.jpg","arolsen-stefan-prelowski-1910-53423224-001.jpg"],
 n:{en:"Not Barbara's father, who was born in 1939, but very possibly his uncle. Passed his matura at the Chełmno boys' gymnasium in 1929, became a carpenter and moved to Lwów. Arrested in the spring of 1940, he was on the first transport of Polish prisoners to Auschwitz on 14 June 1940, prisoner number 614. Transferred to Gross-Rosen (no. 76190) and on 10 February 1945 to Buchenwald (no. 128398), two months before that camp was liberated. His fate after April 1945 is not yet known; the Arolsen Archives accept inquiries.",pl:"Nie ojciec Barbary, który urodził się w 1939 r., ale bardzo możliwe, że jego stryj. Zdał maturę w chełmińskim gimnazjum męskim w 1929 r., został cieślą i przeniósł się do Lwowa. Aresztowany wiosną 1940 r., znalazł się w pierwszym transporcie polskich więźniów do Auschwitz 14 czerwca 1940 r., numer obozowy 614. Przeniesiony do Gross-Rosen (nr 76190), a 10 lutego 1945 r. do Buchenwaldu (nr 128398), dwa miesiące przed wyzwoleniem obozu. Jego los po kwietniu 1945 r. nie jest jeszcze znany; Archiwum Arolsen przyjmuje zapytania."}},
{id:"kazimierz_p1896",g:"Kazimierz",s:"Prełowski",x:"M",b:"26 Feb 1896",bp:"Chełmno",bpq:1,d:"26 May 1967",dp:"Chełmno",f:"prelowski_nn",mo:"marta_szcz",st:"verified",ln:"prelowski",lk:"possible",src:"Find a Grave 267706315, Chełmno parish cemetery, sector 1/19/4",n:{en:"Buried in the Chełmno parish cemetery next to Tomasz. Born 1896, in the generation of the children of the Rybacka 3 household; the link to NN Prełowski and Marta Szczęsna is possible, not proven.",pl:"Pochowany na cmentarzu parafialnym w Chełmnie obok Tomasza. Urodzony w 1896 r., w pokoleniu dzieci z domu przy Rybackiej 3; powiązanie z NN Prełowskim i Martą Szczęsną jest możliwe, nie dowiedzione."}},
{id:"jan_p1899",g:"Jan",s:"Prełowski",x:"M",b:"5 Feb 1899",bp:"Chełmno",bpq:1,d:"9 Jun 1963",dp:"Chełmno",f:"prelowski_nn",mo:"marta_szcz",st:"verified",ln:"prelowski",lk:"possible",src:"Find a Grave 267706313, Chełmno parish cemetery 2/104/10; Chełmno address list c. 1925 (Jan Prełowski, Rybacka 6)",ph:["KPBC_Adresy_miasta_Chelmna_ok1925_s27_Prelowski_Jan_Prelowska_Marja_Rybacka6_crop.jpg"],n:{en:"The Jan Prełowski of Rybacka 6 in the 1925 Chełmno address list, and the Jan Prełowski of Chełmno in a 1949 court notice. Born 1899, died 1963.",pl:"Ten Jan Prełowski z Rybackiej 6 z chełmińskiej księgi adresowej z 1925 r. i Jan Prełowski z Chełmna z ogłoszenia sądowego z 1949 r. Urodzony w 1899 r., zmarł w 1963 r."}},
{id:"stanislaw_p1900",g:"Stanisław",s:"Prełowski",x:"M",b:"31 Oct 1900",bp:"Chełmno",bpq:1,d:"25 Dec 1955",dp:"Szczecin",f:"prelowski_nn",mo:"marta_szcz",st:"verified",ln:"prelowski",lk:"possible",src:"Find a Grave 266715673, Szczecin Central Cemetery, plot 25B-7-10 (photo)",ph:["grave-szczecin-stanislaw-prelowski-1900-1955.jpg"],n:{en:"A Prełowski of the Chełmno generation who ended his life in Szczecin, the city Barbara's family names as Stefan's birthplace. Born 1900, he was 38 when Stefan was born in January 1939, and his household moving to Szczecin after 1945 would explain the family memory exactly. The Szczecin municipal register lists him as the only Prełowski in the city, buried alone, so the trail stops at the stone. A possible father of Stefan, not a proven one; the Toruń marriage record would confirm or dismiss it.",pl:"Prełowski z pokolenia chełmińskiego, który zakończył życie w Szczecinie, mieście, które rodzina Barbary wskazuje jako miejsce urodzenia Stefana. Urodzony w 1900 r., miał 38 lat, gdy w styczniu 1939 r. urodził się Stefan, a przeprowadzka jego domu do Szczecina po 1945 r. dokładnie tłumaczyłaby pamięć rodzinną. Rejestr cmentarzy komunalnych Szczecina wykazuje go jako jedynego Prełowskiego w mieście, pochowanego samotnie, więc ślad urywa się na kamieniu. Możliwy ojciec Stefana, nie dowiedziony; toruński akt małżeństwa to potwierdzi albo wykluczy."}},
{id:"tomasz_p1902",g:"Tomasz",s:"Prełowski",x:"M",b:"19 Mar 1902",bp:"Chełmno",bpq:1,d:"24 May 1977",dp:"Chełmno",f:"prelowski_nn",mo:"marta_szcz",st:"verified",ln:"prelowski",lk:"possible",src:"Find a Grave 267706316, Chełmno parish cemetery, sector 1/19/5",n:{en:"Buried beside Kazimierz in the Chełmno parish cemetery.",pl:"Pochowany obok Kazimierza na cmentarzu parafialnym w Chełmnie."}},
{id:"josef_p_ww1",g:"Józef",s:"Prełowski",x:"M",bp:"Chełmno (Culm)",st:"verified",ln:"prelowski",src:"German WWI casualty list (Verlustliste) Preußen 350, issue 727, 11 Oct 1915, p. 9279: 'Prelowski, Josef, Culm, Infanterie-Regiment Plantier, verwundet'",ph:["VL-1915-10-11-Prelowski-Josef-Culm-verwundet.jpg"],n:{en:"A Józef Prełowski of Chełmno wounded in the Prussian army in 1915, the first military record of the Chełmno household. Two further 'Prelowski' entries of 1914 are in Infantry Regiment 21, the Toruń garrison regiment. Relationship to the Rybacka 3 family possible, not proven.",pl:"Józef Prełowski z Chełmna ranny w armii pruskiej w 1915 r., pierwszy ślad wojskowy domu chełmińskiego. Dwa dalsze wpisy „Prelowski” z 1914 r. dotyczą 21. pułku piechoty, pułku garnizonu toruńskiego. Pokrewieństwo z rodziną z Rybackiej 3 możliwe, nie dowiedzione."}},
{id:"anzelm_p1932",g:"Anzelm",s:"Prełowski",x:"M",b:"2 Dec 1932",d:"14 Sep 2017",dp:"Chełmno",st:"possible",ln:"prelowski",src:"Find a Grave 267706311, Chełmno parish cemetery",n:{en:"Of Stefan's own generation in Chełmno; a possible brother or first cousin, like Adrian.",pl:"Z pokolenia Stefana w Chełmnie; możliwy brat lub brat stryjeczny, jak Adrian."}},
{id:"jozef_p1890",g:"Józef",s:"Prełowski",x:"M",b:"1890",d:"1973",dp:"Toruń",sp:["anna_p1892"],st:"possible",ln:"prelowski",src:"Headstone, Toruń św. Jerzego cemetery, WNMP section, plot K/9/4",ph:["grave-torun-swjerzego-jozef-prelowski-1890-1973.jpg"],n:{en:"Buried in the same Toruń cemetery as Stefan, in the next section, beside Anna Prełowska (1892–1971). Possibly the Józef Prełowski, musician, listed in the Toruń address books of 1923 and 1936. Of the right generation to be Stefan's grandparents' or parents' kin; relationship not established.",pl:"Pochowany na tym samym toruńskim cmentarzu co Stefan, w sąsiedniej części, obok Anny Prełowskiej (1892–1971). Być może ten Józef Prełowski, muzyk, z toruńskich ksiąg adresowych z 1923 i 1936 r. Z pokolenia dziadków lub rodziców Stefana; pokrewieństwo nieustalone."}},
{id:"anna_p1892",g:"Anna",s:"Prełowska",x:"F",b:"1892",d:"1971",dp:"Toruń",sp:["jozef_p1890"],st:"possible",ln:"prelowski",src:"Headstone, Toruń św. Jerzego cemetery, WNMP section, plot K/9/3",ph:["grave-torun-swjerzego-anna-prelowska-1892-1971.jpg"]},
{id:"stanislaw_p1940",g:"Stanisław",s:"Prełowski",x:"M",b:"1940",d:"2017",dp:"Toruń",st:"possible",ln:"prelowski",src:"Headstone, Toruń św. Jerzego cemetery, WNMP section, plot T/4/19 (with Jadwiga Pawlicka)",ph:["grave-torun-swjerzego-stanislaw-prelowski-1940-2017.jpg"],n:{en:"One year younger than Stefan and buried in the same cemetery; a possible brother. Helena will know.",pl:"O rok młodszy od Stefana, pochowany na tym samym cmentarzu; możliwy brat. Helena będzie wiedzieć."}},
{id:"aleksy_pry",g:"Aleksy",s:"Pryłowski",x:"M",b:"4 Jun 1928",d:"13 Aug 2000",dp:"Szczecin",sp:["maria_pry"],st:"possible",ln:"prelowski",src:"Szczecin Central Cemetery, grave 104/8/24 (municipal register)",n:{en:"A Pryłowski family in Szczecin: Aleksy (1928–2000), his wife Maria (1934–2025) and son Andrzej (1958–2013). Pryłowski is the Dobrcz and Serock spelling of the name, and Aleksy is of Stefan's generation; a possible brother or cousin and the one Szczecin household worth asking about. Maria died in December 2025, so her children can be found.",pl:"Rodzina Pryłowskich w Szczecinie: Aleksy (1928–2000), żona Maria (1934–2025) i syn Andrzej (1958–2013). Pryłowski to pisownia nazwiska z Dobrcza i Serocka, a Aleksy jest z pokolenia Stefana; możliwy brat lub kuzyn i jedyny szczeciński dom, o który warto zapytać. Maria zmarła w grudniu 2025 r., więc jej dzieci da się odnaleźć."}},
{id:"maria_pry",g:"Maria",s:"Pryłowska",x:"F",b:"16 Jun 1934",d:"9 Dec 2025",dp:"Szczecin",sp:["aleksy_pry"],st:"possible",ln:"prelowski",src:"Szczecin Central Cemetery, grave 104/8/24"},
{id:"adrian_p",g:"Adrian",s:"Prełowski",x:"M",b:"c. 1936",bq:1,d:"4 Dec 2022",dp:"Chełmno",st:"possible",ln:"prelowski",src:"e-chelmno.pl obituary, Dec 2022, aged 86",n:{en:"A Chełmno contemporary of Stefan (1939); possible brother or first cousin.",pl:"Chełmiński rówieśnik Stefana (1939); możliwy brat lub brat stryjeczny."}},
{id:"wojciech_p",g:"Wojciech Tomasz",s:"Prełowski",x:"M",bp:"Chełmno, ul. Rybacka 3",st:"verified",ln:"prelowski",src:"KRS and business registers (Chompłyt; Kopernika sp. z o.o.), Rybacka 3, Chełmno",n:{en:"Lives today at the same Rybacka 3 where Marta Prełowska lived in 1940. The person most likely to know how Stefan (1939) fits the family.",pl:"Mieszka dziś pod tym samym adresem Rybacka 3, pod którym w 1940 r. mieszkała Marta Prełowska. Osoba, która najpewniej wie, jak Stefan (1939) należy do rodziny."}},

{id:"franz_p1903",g:"Franciszek",s:"Pryłowski",x:"M",b:"1903",bp:"Osielsko",f:"leo_p1877",mo:"martha_wic",st:"verified",ln:"prelowski",lk:"verified",src:"Osielsko 1903",n:{en:"Born 1903: the right generation to father a child in 1939, but nothing links him to Stefan.",pl:"Urodzony w 1903 r.: właściwe pokolenie, by mieć syna w 1939 r., ale nic nie łączy go ze Stefanem."}},
{id:"leo_p1877",g:"Leon",s:"Prełowski",x:"M",b:"1877",bp:"Dobrcz",d:"1945",dp:"Osielsko",f:"adalbert_p1843",mo:"catharina_fal",sp:["martha_wic"],st:"verified",ln:"prelowski",lk:"probable",src:"Dobrcz 1877/29 (ADP W242, photo 0108); marriage Osielsko 1899; death Osielsko 1945 (P/640/0171/14); possibly the 'Prylowski, Leo, Dobrcz' wounded in the Prussian army, casualty list 13 Jun 1917",ph:["VL-1917-06-13-Prylowski-Leo-Dobrcz-verwundet.jpg"],n:{en:"A 'Leo Prylowski of Dobrcz' was wounded in the Prussian army in June 1917; at 40 he would have been a Landsturm man, or the entry is a younger Leo of the same village.",pl:"„Leo Prylowski z Dobrcza” został ranny w armii pruskiej w czerwcu 1917 r.; w wieku 40 lat byłby landszturmistą, albo wpis dotyczy młodszego Leona z tej samej wsi."}},

{id:"adalbert_p1843",g:"Wojciech (Adalbert)",s:"Prełowski",x:"M",b:"1843",bp:"Dobrcz",d:"1917",dp:"Osielsko",f:"stanislaus_p",mo:"constantia_ros",sp:["catharina_fal"],st:"verified",ln:"prelowski",lk:"probable",src:"Dobrcz 1843 (ADP W241/0021/128); marriage Wudzyn 1866 (W509/0014/3); death Osielsko 1917, aged 74",n:{en:"Nine children between 1866 and 1888 at Serock, Wudzyn and Dobrcz, villages north of Bydgoszcz in the diocese of Pelplin. The registers, kept in German and Latin under Prussia, write him Adalbert.",pl:"Dziewięcioro dzieci w latach 1866–1888 w Serocku, Wudzynie i Dobrczu, wsiach na północ od Bydgoszczy w diecezji pelplińskiej. Księgi, prowadzone pod zaborem pruskim po niemiecku i łacinie, zapisują go jako Adalbert."}},
{id:"catharina_fal",g:"Katarzyna",s:"Prełowska",m:"Faleńczyk",x:"F",sp:["adalbert_p1843"],st:"verified",ln:"prelowski",src:"Wudzyn marriage 1866"},
{id:"stanislaus_p",g:"Stanisław",s:"Prełowski",x:"M",b:"c. 1812",bq:1,d:"1851",dp:"Dobrcz",sp:["constantia_ros"],st:"verified",ln:"prelowski",src:"Niewieścin marriage 1831; Dobrcz death 1851, aged 39 (ADP W244/0050/21)",n:{en:"The head of the deepest verified Prełowski chain. Married Konstancja Rościszewska at Niewieścin in 1831 and died at Dobrcz in 1851 aged 39; six children baptised at Niewieścin and Dobrcz between 1832 and 1850. Behind him the Niewieścin and Gruczno registers hold Prełowski baptisms from 1754 and 1761, not yet linked.",pl:"Głowa najgłębszego potwierdzonego łańcucha Prełowskich. Ożenił się z Konstancją Rościszewską w Niewieścinie w 1831 r. i zmarł w Dobrczu w 1851 r. w wieku 39 lat; sześcioro dzieci ochrzczonych w Niewieścinie i Dobrczu w latach 1832–1850. Za nim księgi Niewieścina i Gruczna zawierają chrzty Prełowskich od 1754 i 1761 r., jeszcze niepowiązane."}},
{id:"constantia_ros",g:"Konstancja",s:"Prełowska",m:"Rościszewska",x:"F",sp:["stanislaus_p"],st:"verified",ln:"prelowski",src:"Niewieścin marriage 1831"},

{id:"bronislaw_p1896",g:"Bronisław",s:"Prełowski",x:"M",b:"1896",bp:"Dobrcz",f:"andreas_p1862",mo:"katarzyna_burz",st:"verified",ln:"prelowski",lk:"verified",src:"Dobrcz 1896/4"},
{id:"andreas_p1862",g:"Andrzej",s:"Prełowski",x:"M",b:"1862",bp:"Serock",f:"franz_p1837",mo:"marianna_smol",sp:["katarzyna_burz"],st:"verified",ln:"prelowski",lk:"probable",src:"Serock 1862 (ADP W1391/009/71); Dobrcz marriage 1889/11 (W243/0049)",n:{en:"Dobrcz births are indexed only to 1896, so any sons born 1897–1910, the generation that could father Stefan in 1939, are invisible. Edmund Prelowski (1917–2000) of nearby Koronowo may be his grandson.",pl:"Chrzty z Dobrcza są zindeksowane tylko do 1896 r., więc synowie urodzeni w latach 1897–1910, pokolenie mogące być ojcem Stefana w 1939 r., pozostają niewidoczni. Edmund Prelowski (1917–2000) z pobliskiego Koronowa może być jego wnukiem."}},

{id:"franz_p1837",g:"Franciszek",s:"Pryłowski",x:"M",b:"c. 1835",bq:1,d:"1901",dp:"Dobrcz",sp:["marianna_smol"],st:"verified",ln:"prelowski",src:"Wudzyn marriage 1855 (W509/0003/6); Dobrcz death 1901, aged 64 (W245/0132/8)",n:{en:"Possibly the Franciszek baptised at Niewieścin in 1834, a son of Stanisław and Konstancja, which would join chains A and B; the ages fit but no record says so.",pl:"Być może Franciszek ochrzczony w Niewieścinie w 1834 r., syn Stanisława i Konstancji, co połączyłoby oba łańcuchy; wiek się zgadza, ale żaden akt tego nie mówi."}},

{id:"adam_pr1891",g:"Adam",s:"Prelewski",x:"M",b:"1891",bp:"Czernikówek, par. Czernikowo",f:"feliks_pr",mo:"agnieszka_rut",sp:["julianna_pacz"],st:"verified",ln:"prelowski",lk:"verified",src:"Czernikowo 1891/158; marriage 1910/11 (Uszyńska_Hanna)",n:{en:"Married Julianna Paczkowska at Czernikowo in 1910, in the very parish where Helena Zakierska was born 26 years later. Their children, born 1911–1930, are past the end of the index. If one of them was Stefan's father, Stefan and Helena grew up in the same parish. A possible line, no better than the Chełmno one.",pl:"Ożenił się z Julianną Paczkowską w Czernikowie w 1910 r., w tej samej parafii, w której 26 lat później urodziła się Helena Zakierska. Ich dzieci, urodzone w latach 1911–1930, wykraczają poza indeks. Jeśli jedno z nich było ojcem Stefana, Stefan i Helena wyrośli w tej samej parafii. Linia możliwa, nie lepsza niż chełmińska."}},

{id:"lucjan_p1922",g:"Lucjan",s:"Prelowski",x:"M",b:"1 Jul 1922",bp:"Bydgoszcz (Bromberg)",st:"verified",ln:"prelowski",src:"Arolsen Archives, Stutthof file 1.1.41.2 / 01014102 103.102, prisoner 24945",ph:["arolsen-lucjan-prelowski-1922-97246414-001.jpg"],n:{en:"A roofer from Bydgoszcz, single, sent by the Bromberg Gestapo to Stutthof concentration camp from 27 August to 29 October 1943. Relationship to the Toruń family unknown; possibly the same extended Bydgoszcz-area family.",pl:"Dekarz z Bydgoszczy, kawaler, wysłany przez bydgoskie Gestapo do obozu Stutthof od 27 sierpnia do 29 października 1943 r. Pokrewieństwo z rodziną toruńską nieznane; możliwe, że ta sama szeroka rodzina z okolic Bydgoszczy."}},

// ---------- DRAMIŃSKI: Teresa's line, Zawidz parish (Kosemin) ----------
{id:"antoni_dram",g:"Antoni",s:"Dramiński",x:"M",b:"22 Nov 1897",bp:"Kosemin, par. Zawidz",d:"4 Mar 1967",dp:"Mrągowo",f:"stanislaw_dram",mo:"teofila_wis",sp:["zofia_karcz"],st:"verified",ln:"draminski",lk:"verified",src:"Zawidz marriage 1922/32 (24 May 1922, bachelor aged 24, son of Stanisław and Teofila Wiśniewska); headstone Mrągowo municipal cemetery G/2/22 (probable identification); named on Teresa's death certificate",ph:["grave-mragowo-antoni-zofia-draminscy-1.jpg"],
 n:{en:"Greg's grandfather. Married Zofia Karczewska at Zawidz on 24 May 1922, he 24, she 21, both of Kosemin. After the war the family went north to Masuria like so many from this district; a headstone in Mrągowo municipal cemetery, plot G/2/22, with the couple's photograph, reads 'Dramińscy, Antoni 22 XI 1897 – 4 III 1967, Zofia 28 X 1902 – 10 XI 1963', a probable match pending the Mrągowo death acts. His brother Czesław (born 1910) fought in the Home Army and survived Stutthof.",pl:"Dziadek Grzegorza. Ożenił się z Zofią Karczewską w Zawidzu 24 maja 1922 r., on lat 24, ona 21, oboje z Kosemina. Po wojnie rodzina ruszyła na północ, na Mazury, jak wielu z tego powiatu; nagrobek na cmentarzu komunalnym w Mrągowie, kwatera G/2/22, ze zdjęciem małżonków, głosi: „Dramińscy, Antoni 22 XI 1897 – 4 III 1967, Zofia 28 X 1902 – 10 XI 1963”; identyfikacja prawdopodobna do potwierdzenia aktami zgonu z USC Mrągowo. Jego brat Czesław (ur. 1910) walczył w AK i przeżył Stutthof."}},
{id:"zofia_karcz",g:"Zofia",s:"Dramińska",m:"Karczewska",x:"F",b:"28 Oct 1902",bp:"par. Zawidz",d:"10 Nov 1963",dp:"Mrągowo",f:"ignacy_karcz",mo:"aniela_chyz",sp:["antoni_dram"],st:"verified",ln:"draminski",lk:"verified",src:"Zawidz marriage 1922/32 (aged 21, daughter of Ignacy and Aniela Chyżyńska); headstone Mrągowo G/2/22 (probable)",ph:["grave-mragowo-antoni-zofia-draminscy-2.jpg"],n:{en:"Greg's grandmother, of the Karczewski family of Zawidz parish. Died in Mrągowo in 1963, aged 61, when Greg's mother was 28.",pl:"Babka Grzegorza, z Karczewskich z parafii Zawidz. Zmarła w Mrągowie w 1963 r., w wieku 61 lat, gdy matka Grzegorza miała 28 lat."}},
{id:"wladyslaw_dram",g:"Władysław",s:"Dramiński",x:"M",b:"c. 1893–1896",bq:1,bp:"Kosemin",f:"stanislaw_dram",mo:"teofila_wis",st:"verified",ln:"draminski",lk:"verified",src:"Bieżuń marriage 1917/6 to Teodozja Dejewska ('Kosemin and Bieżuń')"},
{id:"czeslaw_dram",g:"Czesław",s:"Dramiński",x:"M",b:"3 Jun 1910",bp:"Kosemin, pow. Sierpc",f:"stanislaw_dram",mo:"teofila_wis",st:"verified",ln:"draminski",lk:"verified",src:"straty.pl (IPN) card 6193612: farmer, Home Army, arrested by the Gestapo 1944, Stutthof prisoner 50534, survived; Zawidz marriage 1931/10 to Marianna Żółtowska (probable)",n:{en:"Teresa's uncle. A farmer at Kosemin and a Home Army soldier, arrested by the Gestapo in 1944 and sent to Stutthof as prisoner 50534. He survived.",pl:"Wuj Teresy. Gospodarz w Koseminie i żołnierz Armii Krajowej, aresztowany przez Gestapo w 1944 r. i wysłany do Stutthofu jako więzień nr 50534. Przeżył."}},
{id:"stanislaw_dram",g:"Stanisław",s:"Dramiński",x:"M",b:"c. 1860s",bq:1,bp:"par. Zawidz",d:"before 1915",f:"jakub_dram",mo:"marianna_nag",sp:["teofila_wis"],st:"verified",ln:"draminski",lk:"verified",src:"Zawidz marriage 1892/24; named as father in 1922/32 and 1917/6; his widow remarried at Zawidz 1915/3",n:{en:"Greg's great-grandfather. Married Teofila Wiśniewska at Zawidz in 1892; sons Władysław, Antoni (1897) and Czesław (1910). Dead by 1915, when Teofila remarried Franciszek Safianowski.",pl:"Pradziadek Grzegorza. Ożenił się z Teofilą Wiśniewską w Zawidzu w 1892 r.; synowie Władysław, Antoni (1897) i Czesław (1910). Zmarł przed 1915 r., gdy Teofila wyszła ponownie za Franciszka Safianowskiego."}},
{id:"teofila_wis",g:"Teofila",s:"Dramińska",m:"Wiśniewska",x:"F",b:"c. 1870",bq:1,bp:"par. Zawidz",f:"jan_wis",mo:"antonina_pior",sp:["stanislaw_dram","franciszek_saf"],st:"verified",ln:"draminski",lk:"verified",src:"Zawidz marriages 1892/24 and 1915/3 (widow of Stanisław)"},
{id:"franciszek_saf",g:"Franciszek",s:"Safianowski",x:"M",bp:"Izbica, gub. kaliska",sp:["teofila_wis"],st:"verified",ln:"draminski",src:"Zawidz marriage 1915/3"},
{id:"jakub_dram",g:"Jakub",s:"Dramiński",x:"M",b:"c. 1830s",bq:1,bp:"Kosemin (probably)",f:"michal_dram",mo:"wiktoria_dram",sp:["marianna_nag"],st:"verified",ln:"draminski",lk:"verified",src:"Zawidz marriage 1857/8; his widow remarried 1875/7",n:{en:"Greg's great-great-grandfather. Married Marianna Naguszewska at Zawidz in 1857; children Stanisław, Aniela (married 1880) and Józef (married 1885). Dead by 1875, when Marianna remarried Michał Abramowski.",pl:"Prapradziadek Grzegorza. Ożenił się z Marianną Naguszewską w Zawidzu w 1857 r.; dzieci Stanisław, Aniela (ślub 1880) i Józef (ślub 1885). Zmarł przed 1875 r., gdy Marianna wyszła ponownie za Michała Abramowskiego."}},

{id:"jozef_dram_z",g:"Józef",s:"Dramiński",x:"M",f:"jakub_dram",mo:"marianna_nag",st:"verified",ln:"draminski",lk:"verified",src:"Zawidz marriage 1885/26 to Weronika Abramowska"},
{id:"michal_dram",g:"Michał",s:"Dramiński",x:"M",b:"c. 1800",bq:1,bp:"Dzierzno, par. Świedziebnia (possibly)",sp:["wiktoria_dram"],st:"verified",ln:"draminski",src:"Named as father in Zawidz marriage 1857/8",n:{en:"Greg's 3× great-grandfather, named in his son's 1857 marriage act. A Wojciech Dramiński from Dzierzno near Świedziebnia married at Zawidz in 1838 and lived at Kosemin, which suggests the family arrived there from the Dobrzyń land in the 1830s. A Michał and Anna Dramiński at Dzierzno and Zawidz between 1800 and 1828 may be an earlier generation; possible only.",pl:"Trzykrotny pradziadek Grzegorza, wymieniony w akcie ślubu syna z 1857 r. Wojciech Dramiński z Dzierzna pod Świedziebnią ożenił się w Zawidzu w 1838 r. i mieszkał w Koseminie, co wskazuje, że rodzina przybyła tam z ziemi dobrzyńskiej w latach 30. XIX w. Michał i Anna Dramińscy w Dzierznie i Zawidzu w latach 1800–1828 mogą być wcześniejszym pokoleniem; tylko możliwe."}},
{id:"wiktoria_dram",g:"Wiktoria",s:"Dramińska",x:"F",sp:["michal_dram"],st:"verified",ln:"draminski",src:"Named as mother in Zawidz marriage 1857/8"},

{id:"marian_d",g:"Marian",s:"Dramiński",x:"M",b:"c. 1908–1914",bq:1,f:"julian_d1866",mo:"janina_dab",sp:["michalina_mik"],st:"verified",ln:"draminski",lk:"verified",src:"Marki marriage 1935/79 (Warsaw-Praga diocesan archive index)",
 n:{en:"Married Michalina Miklaszewska at Marki, 10 km from Warsaw, in 1935. Before Teresa's death certificate named her parents, this couple was the leading candidate; they are now known not to be them.",pl:"Ożenił się z Michaliną Miklaszewską w Markach, 10 km od Warszawy, w 1935 r., roku urodzenia Teresy. Jedyne gospodarstwo Dramińskich u bram Warszawy w latach 30., a więc pierwszy kandydat na rodziców Teresy, choć numer aktu 79 wskazuje na ślub pod koniec roku, co czyni chronologię napiętą. Jego akt urodzenia nie został odnaleziony."}},
{id:"michalina_mik",g:"Michalina",s:"Dramińska",m:"Miklaszewska",x:"F",sp:["marian_d"],st:"verified",ln:"draminski",src:"Marki marriage 1935/79: daughter of Bronisław and Eleonora Jastrzębska"},
{id:"julian_d1866",g:"Julian Seweryn",s:"Dramiński",x:"M",b:"1866",bp:"Cywiny Litwinki, par. Gralewo",d:"5 Nov 1919",dp:"Unieck",f:"antoni_d1840",mo:"antonina_nad",sp:["janina_dab"],st:"verified",ln:"draminski",lk:"verified",src:"Gralewo 1866/3 (scan read); Płock św. Bartłomieja marriage 1907/112 (szukajwarchiwach 17254407); Unieck death 1919/84 (scan read)",ph:["1866-Gralewo-B3-Julian-Seweryn-Draminski.jpg","1919-Unieck-D84-Julian-Draminski.jpg"],
 n:{en:"The 1866 Gralewo register, read from the scan, records 'Antoni Dramiński, szlachcic of Cywiny Litwinki, aged 25' presenting a son born 8 January 1866 of his wife Antonina née Nadratowska, named Julian Seweryn. He married a Warsaw girl, Janina Dabińska, at Płock in 1907. The Unieck death register for 1919, also read from the scan, says he died at Chądzyny Krusze on 5 November 1919 at 8 in the evening, aged 53, 'living on his own means', leaving the widow Janina. This is the family that carried the Dramiński name from the Płońsk country to Warsaw.",pl:"Księga gralewska z 1866 r., odczytana ze skanu, notuje „Antoniego Dramińskiego, szlachcica z Cywin Litwinek, lat 25”, który przedstawia syna urodzonego 8 stycznia 1866 r. z żony Antoniny z Nadratowskich, nazwanego Julian Seweryn. W 1907 r. ożenił się w Płocku z warszawianką Janiną Dabińską. Księga zgonów Uniecka z 1919 r., także odczytana ze skanu, podaje, że zmarł w Chądzynach Kruszach 5 listopada 1919 r. o 8 wieczorem, w wieku 53 lat, „utrzymujący się z własnych funduszów”, zostawiając wdowę Janinę. To rodzina, która przeniosła nazwisko Dramiński z ziemi płońskiej do Warszawy."}},
{id:"janina_dab",g:"Janina Anna",s:"Dramińska",m:"Dabińska",x:"F",bp:"Warszawa",sp:["julian_d1866"],st:"verified",ln:"draminski",src:"Płock marriage 1907/112: 'panna z Warszawy', daughter of Ignacy and Helena Wesołowska"},

{id:"antoni_d1840",g:"Antoni Józef",s:"Dramiński",x:"M",b:"13 Jun 1840",bp:"Kraszewo Gaczułty, par. Raciąż",f:"piotr_d1813",mo:"julianna_dob",sp:["antonina_nad","weronika_kul"],st:"verified",ln:"draminski",lk:"verified",src:"Raciąż 1840/49; Lutocin marriage 1863/5 (scan read); Radzanów marriage 1879/31 (scan)",ph:["1863-Lutocin-S5-Antoni-Draminski-x-Antonina-Nadratowska.jpg","1879-Radzanow-S31-Antoni-Draminski-x-Weronika-Kulesza.jpg"],
 n:{en:"The 1863 marriage act at Lutocin, read from the scan, calls him 'a bachelor of Cywiny in Gralewo parish, born at Kraszewo Gaczułty, son of Piotr and the late Julianna née Dobrska, part-owners' of the hamlet, aged 22; the bride Antonina Nadratowska was 19. 'Właściciele cząstkowi', part-owners, is the register's term for petty nobility holding shares of a village. Widowed, he remarried Weronika Kulesza at Radzanów in 1879.",pl:"Akt ślubu z Lutocina z 1863 r., odczytany ze skanu, nazywa go „młodzianem zamieszkałym w Cywinach parafii gralewskiej, urodzonym w Kraszewie Gaczułtach z Piotra i nieżyjącej Julianny z Dóbrskich, właścicieli cząstkowych”, lat 22; panna młoda Antonina Nadratowska miała 19 lat. „Właściciele cząstkowi” to w księgach określenie drobnej szlachty posiadającej udziały we wsi. Owdowiawszy, ożenił się ponownie z Weroniką Kuleszą w Radzanowie w 1879 r."}},

{id:"wladyslaw_db",g:"Władysław Bronisław",s:"Dramiński",x:"M",f:"antoni_d1840",mo:"antonina_nad",sp:["jozefa_targ"],st:"verified",ln:"draminski",lk:"verified",src:"Płock św. Bartłomieja marriage 1904/34 (szukajwarchiwach 17254400)",n:{en:"Julian's brother. Married Józefa Targowska at Płock in 1904; three sons born at Dźwierzno in Ciachcin parish.",pl:"Brat Juliana. Ożenił się z Józefą Targowską w Płocku w 1904 r.; trzech synów urodzonych w Dźwierznie w parafii Ciachcin."}},

{id:"jerzy_d1904",g:"Jerzy Stanisław Antoni",s:"Dramiński",x:"M",b:"10 Dec 1904",bp:"Dźwierzno, par. Ciachcin",f:"wladyslaw_db",mo:"jozefa_targ",st:"verified",ln:"draminski",lk:"verified",src:"Ciachcin 1905/22 (szukajwarchiwach 17252720); IPN inventory node 5255843",n:{en:"Arrested by the Germans on 24 October 1939, seven weeks into the occupation; the Institute of National Remembrance holds his mother's petition to the Gestapo from 1940–42. Teresa's first cousin once removed, if the Marian line is right.",pl:"Aresztowany przez Niemców 24 października 1939 r., siedem tygodni po rozpoczęciu okupacji; Instytut Pamięci Narodowej przechowuje prośbę jego matki do Gestapo z lat 1940–42. Brat stryjeczny ojca Teresy, jeśli linia Mariana jest właściwa."}},

{id:"piotr_d1813",g:"Piotr Teodor Wiktor",s:"Dramiński",x:"M",b:"1813",bp:"Cywiny Litwinki, par. Gralewo",f:"kajetan_d1773",mo:"jozefa_bor",sp:["julianna_dob"],st:"verified",ln:"draminski",lk:"probable",src:"Gralewo 1813/15 and /62; Raciąż marriage 1839/10 as 'Teodor Wiktor'; Glinojeck 1842/21 as 'Piotr, ekonom' (scan read)",ph:["1842-Glinojeck-B21.jpg"],
 n:{en:"An 'ekonom', estate steward, in the 1842 Glinojeck baptism of his son Władysław, read from the scan. The 1839 marriage act calls him Teodor Wiktor, son of Kajetan and Józefa Borowska; his children's baptisms call him Piotr; the 1813 Gralewo baptism of 'Piotr Teodor Wiktor' of the same couple ties the names together. One soft spot: an 1826 entry gives Kajetan's age as 43, ten years younger than the 1773 baptism implies.",pl:"„Ekonom”, zarządca majątku, w akcie chrztu syna Władysława z Glinojecka z 1842 r., odczytanym ze skanu. Akt ślubu z 1839 r. nazywa go Teodorem Wiktorem, synem Kajetana i Józefy Borowskiej; chrzty jego dzieci nazywają go Piotrem; chrzest „Piotra Teodora Wiktora” tej samej pary w Gralewie w 1813 r. wiąże te imiona. Jedno słabe miejsce: zapis z 1826 r. podaje wiek Kajetana jako 43 lata, o dziesięć mniej, niż wynika z chrztu z 1773 r."}},
