, "src": "https://wmbc.olsztyn.pl/dlibra/publication/edition/956"}, {"kind": "photo", "file": "img/wave6/gizycko_1974_biblioteka_gabloty_wmbc.jpg", "place": "gizycko", "year": 1974, "t": {"en": "Display cases outside the library, Giżycko, 1974", "pl": "Gabloty przed biblioteką, Giżycko, 1974"}, "d": {"en": "", "pl": ""}, "credit": "Unknown author / Public domain (Warmińsko-Mazurska Biblioteka Cyfrowa, Regional Public Library Olsztyn)", "src": "https://wmbc.olsztyn.pl/dlibra/publication/edition/957"}, {"kind": "map", "file": "img/wave6/map_MTB_1926_Lotzen_Gizycko.jpg", "place": "gizycko", "year": 1926, "t": {"en": "Messtischblatt 1:25,000, sheet 1996 Lötzen, 1926", "pl": "Mapa 1:25 000 (Messtischblatt) 1996 Lötzen, 1926"}, "d": {"en": "Lötzen town between lakes Löwentin (Niegocin) and Kissain (Kisajno).", "pl": "Lötzen między jeziorami Löwentin (Niegocin) i Kissain (Kisajno)."}, "credit": "Reichsamt für Landesaufnahme, scan BYU Library / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/German_maps/series/025K_TK25/1996_Loetzen_1926_BYU.jpg"}, {"kind": "video", "place": "gizycko", "year": 1949, "t": {"en": "Na jeziorach mazurskich (PKF 39/49)", "pl": "Na jeziorach mazurskich (PKF 39/49)"}, "d": {"en": "Sailing boats on the Masurian lakes; filmed at the Main Office of Physical Culture centre in Giżycko. Issue date 22 Sep 1949.", "pl": "Żaglówki na jeziorach mazurskich; ośrodek GUKF w Giżycku. Data wydania 22.09.1949."}, "credit": "PKF / WFDiF (rights WFDiF)", "src": "https://repozytorium.fn.org.pl/?q=pl/node/5602", "url": "https://repozytorium.fn.org.pl/?q=pl/node/5602", "embed": null, "duration": null}, {"kind": "video", "place": "gizycko", "year": 1952, "t": {"en": "Na Jeziorze Niegocińskim (PKF 13/52)", "pl": "Na Jeziorze Niegocińskim (PKF 13/52)"}, "d": {"en": "Ice-yacht races on Lake Niegocin at Giżycko, filmed 19 Mar 1952.", "pl": "Wyścigi bojerów na Niegocinie w Giżycku, zdjęcia 19.03.1952."}, "credit": "PKF / WFDiF (rights WFDiF)", "src": "https://repozytorium.fn.org.pl/?q=pl/node/7285", "url": "https://repozytorium.fn.org.pl/?q=pl/node/7285", "embed": null, "duration": "01:32"}, {"kind": "video", "place": "gizycko", "year": 1953, "t": {"en": "Ptasie wyspy (PKF 29/53)", "pl": "Ptasie wyspy (PKF 29/53)"}, "d": {"en": "Ornithologists ringing gulls on the reedy lakes; place of action given as Giżycko. Issue 7 Jul 1953.", "pl": "Ornitolodzy obrączkują mewy; miejsce akcji: Giżycko. Wydanie 7.07.1953."}, "credit": "PKF / WFDiF (rights WFDiF)", "src": "https://repozytorium.fn.org.pl/?q=pl/node/7640", "url": "https://repozytorium.fn.org.pl/?q=pl/node/7640", "embed": null, "duration": "02:11"}, {"kind": "video", "place": "gizycko", "year": 1935, "t": {"en": "Ostpreußen: Urlaub in Masuren, 1935", "pl": "Prusy Wschodnie: urlop na Mazurach, 1935"}, "d": {"en": "Excerpt from the DVD edition 'Ostpreußen – Panorama einer Provinz'; Masurian lakes holiday film, not specific to Lötzen.", "pl": "Fragment wydania DVD „Ostpreußen – Panorama einer Provinz”; Mazury ogólnie, nie tylko Lötzen."}, "credit": "be.bra verlag (publisher's channel)", "src": "https://www.youtube.com/watch?v=HSg4oIfzs-I", "url": "https://www.youtube.com/watch?v=HSg4oIfzs-I", "embed": "https://www.youtube-nocookie.com/embed/HSg4oIfzs-I", "duration": "02:07"}]}, {"id": "ketrzyn", "name": {"en": "Kętrzyn", "pl": "Kętrzyn"}, "de": "Rastenburg", "lat": 54.0767, "lon": 21.3753, "summary": {"en": "Kętrzyn was founded by the Teutonic Order as Rastenburg on an old Prussian stronghold and chartered in 1357. Its landmark is St George's, a 14th-century church built like a fortress, with battlements and crystal vaults. In 1940–44 Hitler's headquarters, the Wolfsschanze, stood in the forest 8 km away. In 1945 the Red Army burned the old town and castle. Settlers came from the lost eastern lands, and Ukrainians were deported here in 1947. The town took the name of the historian Wojciech Kętrzyński in 1946. Henryk Kowalczyk settled here after the war, and the family lived here until 1975; Greg's brother Wiesław was born here. In those years the town was rebuilding. The castle reopened as a museum in 1967, St George's (Catholic since 1946) received a Vilnius-style Ostra Brama chapel in 1962, and the Wolfsschanze ruins had drawn tourists since 1959. Kętrzyn remained a county town until the 1975 reform.", "pl": "Kętrzyn założyli Krzyżacy jako Rastenburg na miejscu pruskiego grodu, a prawa miejskie otrzymał w 1357 r. Jego symbolem jest XIV-wieczny kościół św. Jerzego, zbudowany jak twierdza, z blankami i sklepieniami kryształowymi. W latach 1940–1944 w lesie 8 km od miasta działała kwatera Hitlera Wilczy Szaniec. W 1945 r. Armia Czerwona spaliła stare miasto i zamek. Przybyli osadnicy z utraconych Kresów, a w 1947 r. wysiedleni w akcji „Wisła” Ukraińcy. W 1946 r. miasto przyjęło imię historyka Wojciecha Kętrzyńskiego. Henryk Kowalczyk osiadł tu po wojnie, a rodzina mieszkała tu do 1975 r.; tu urodził się brat Grzegorza, Wiesław. Miasto się wtedy odbudowywało. Zamek w 1967 r. stał się muzeum, kościół św. Jerzego (katolicki od 1946 r.) otrzymał w 1962 r. kaplicę na wzór Ostrej Bramy, a ruiny Wilczego Szańca od 1959 r. przyciągały turystów. Kętrzyn był miastem powiatowym aż do reformy z 1975 r."}, "timeline": [{"y": 1329, "en": "Teutonic watchtower at Rast", "pl": "krzyżacka strażnica w Rast"}, {"y": 1357, "en": "town charter, 11 Nov", "pl": "przywilej lokacyjny, 11 listopada"}, {"y": 1359, "en": "St George's church begun", "pl": "początek budowy kościoła św. Jerzego"}, {"y": 1515, "en": "crystal vaults completed", "pl": "ukończenie sklepień kryształowych"}, {"y": 1895, "en": "St Catherine's built", "pl": "budowa kościoła św. Katarzyny"}, {"y": 1941, "en": "Wolfsschanze in use by Hitler", "pl": "Wilczy Szaniec używany przez Hitlera"}, {"y": 1944, "en": "20 July plot at Wolfsschanze", "pl": "zamach 20 lipca w Wilczym Szańcu"}, {"y": 1945, "en": "Red Army burns old town and castle (~40% destroyed)", "pl": "Armia Czerwona pali stare miasto i zamek (ok. 40% zniszczeń)"}, {"y": 1946, "en": "named Kętrzyn, 7 May; St George's becomes Catholic", "pl": "nazwa Kętrzyn, 7 maja; kościół św. Jerzego przejęty przez katolików"}, {"y": 1947, "en": "Akcja \"Wisła\" settlers arrive", "pl": "przybycie przesiedleńców z akcji „Wisła”"}, {"y": 1950, "en": "population over 11,000", "pl": "ponad 11 tys. mieszkańców"}, {"y": 1959, "en": "Wolfsschanze opens to visitors", "pl": "Wilczy Szaniec udostępniony zwiedzającym"}, {"y": 1962, "en": "Ostra Brama baptistery in St George's", "pl": "baptysterium na wzór Ostrej Bramy w kościele św. Jerzego"}, {"y": 1962, "en": "castle rebuilt as museum and library", "pl": "odbudowa zamku na muzeum i bibliotekę"}, {"y": 1970, "en": "Marian image of St George's crowned, 15 Nov", "pl": "koronacja obrazu maryjnego w kościele św. Jerzego, 15 listopada"}, {"y": 1975, "en": "powiat abolished, 1 Jun; family moves to Olsztyn (data.js)", "pl": "likwidacja powiatu, 1 czerwca; rodzina przenosi się do Olsztyna"}], "family": [{"person": "henryk", "from": null, "to": 1975, "role": {"en": "settled here after the war; lived here until 1975", "pl": "osiadł tu po wojnie; mieszkał do 1975 r."}}, {"person": "teresa", "from": null, "to": 1975, "role": {"en": "lived here until 1975", "pl": "mieszkała tu do 1975 r."}}, {"person": "wieslaw", "from": null, "to": null, "role": {"en": "born here", "pl": "tu się urodził"}}, {"person": "greg", "from": 1970, "to": 1975, "role": {"en": "childhood home until 1975", "pl": "dom dzieciństwa do 1975 r."}}], "sources": ["https://pl.wikipedia.org/wiki/Wojew%C3%B3dztwo_olszty%C5%84skie_(1975%E2%80%931998)", "https://pl.wikipedia.org/wiki/K%C4%99trzyn", "https://encyklopedia.warmia.mazury.pl/index.php/K%C4%99trzyn", "https://ome-lexikon.uni-oldenburg.de/orte/rastenburg-ketrzyn", "https://pl.wikipedia.org/wiki/Bazylika_%C5%9Bw._Jerzego_w_K%C4%99trzynie", "https://pl.wikipedia.org/wiki/Ko%C5%9Bci%C3%B3%C5%82_%C5%9Bw._Katarzyny_w_K%C4%99trzynie", "https://pl.wikipedia.org/wiki/Wilczy_Szaniec", "https://en.wikipedia.org/wiki/K%C4%99trzyn"], "group": "greg", "media": [{"kind": "photo", "file": "img/wave6/ketrzyn_rastenburg_widok_1910.jpg", "place": "ketrzyn", "year": 1910, "t": {"en": "Rastenburg (Kętrzyn), view towards the castle, postcard 1910", "pl": "Rastenburg (Kętrzyn), widok na zamek, pocztówka 1910"}, "d": {"en": "", "pl": ""}, "credit": "Lisbeth Kuessner, Rastenburg / Public domain (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Rastenburg,_Ostpreu%C3%9Fen_-_Stadtansicht_(2)_(Zeno_Ansichtskarten).jpg"}, {"kind": "photo", "file": "img/wave6/ketrzyn_rastenburg_staw_mlynski_1909.jpg", "place": "ketrzyn", "year": 1909, "t": {"en": "Rastenburg (Kętrzyn), mill pond, postcard 1909", "pl": "Rastenburg (Kętrzyn), staw młyński, pocztówka 1909"}, "d": {"en": "", "pl": ""}, "credit": "Unknown author / Public domain (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Rastenburg,_Ostpreu%C3%9Fen_-_M%C3%BChlenteich;_Rastenburg_(Zeno_Ansichtskarten).jpg"}, {"kind": "photo", "file": "img/wave6/ketrzyn_1978_wop.jpg", "place": "ketrzyn", "year": 1978, "t": {"en": "Border Protection Forces officers in Kętrzyn, 1978", "pl": "Oficerowie WOP w Kętrzynie, 1978"}, "d": {"en": "Officers of the WOP (border guard) unit stationed in Kętrzyn, saluting.", "pl": "Oficerowie jednostki WOP stacjonującej w Kętrzynie."}, "credit": "Żołnierz WOP / Public domain (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Border_Protection_Forces_in_K%C4%99trzyn,_1978_01.jpg"}, {"kind": "photo", "file": "img/wave6/ketrzyn_1967_biblioteka_czytelnia_wmbc.jpg", "place": "ketrzyn", "year": 1967, "t": {"en": "Adult reading room, Kętrzyn public library, 1967", "pl": "Czytelnia dla dorosłych, biblioteka w Kętrzynie, 1967"}, "d": {"en": "Photographed 27 September 1967 (note on the back of the print).", "pl": "Zdjęcie z 27.09.1967 (nota na odwrocie)."}, "credit": "Unknown author / Public domain (Warmińsko-Mazurska Biblioteka Cyfrowa, Regional Public Library Olsztyn)", "src": "https://wmbc.olsztyn.pl/dlibra/publication/edition/1032"}, {"kind": "map", "file": "img/wave6/map_WIG_1930_Rastenburg_Ketrzyn_Gizycko.jpg", "place": "ketrzyn", "year": 1930, "t": {"en": "Military map 1:100,000, sheet 105 Rastenburg, 1930: Kętrzyn to Giżycko", "pl": "Mapa WIG 1:100 000, arkusz 105 Rastenburg (Rastembork), 1930: od Kętrzyna po Giżycko"}, "d": {"en": "Polish WIG reprint (P32 S33). Rastenburg at left, Lötzen at lower right between the lakes.", "pl": "Wydanie WIG (P32 S33). Rastenburg z lewej, Lötzen w prawym dolnym rogu między jeziorami."}, "credit": "Wojskowy Instytut Geograficzny / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/WIG_maps/series/100K_300dpi/P32_S33_105_RASTENBURG_(Rastembork)_1930_300dpi_(1).jpg"}, {"kind": "map", "file": "img/wave6/map_MTB_1938_Rastenburg_Ketrzyn.jpg", "place": "ketrzyn", "year": 1938, "t": {"en": "Messtischblatt 1:25,000, sheet 1994 Rastenburg, 1938", "pl": "Mapa 1:25 000 (Messtischblatt) 1994 Rastenburg, 1938"}, "d": {"en": "Rastenburg town and the forest at Görlitz (Gierłoż) to the east.", "pl": "Rastenburg i las koło Görlitz (Gierłoży) na wschodzie."}, "credit": "Reichsamt für Landesaufnahme / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/German_maps/series/025K_TK25/1994_Rastenburg_1938.jpg"}]}, {"id": "olsztyn", "name": {"en": "Olsztyn", "pl": "Olsztyn"}, "de": "Allenstein", "lat": 53.7764, "lon": 20.4878, "summary": {"en": "Olsztyn, the German Allenstein, was founded by the Warmian chapter in 1353. The Red Army burned 40% of it in January 1945. It then became the capital of Warmia and Masuria and grew from 23,000 people to over 160,000 by 1990. When the Kowalczyks arrived in 1975, the city had just become capital of a reshaped voivodeship of 12,327 km². It was a young, fast-growing city of concrete-panel estates, the agricultural-technical academy at Kortowo, the 1973 planetarium and above all the Stomil tyre factory, with about 4,800 workers in 1980. Stomil's strike of 22 August 1980 began Olsztyn's Solidarity. On 14 December 1981, the day after martial law was declared, some 400 Stomil workers struck again, were removed by force and saw four leaders jailed. Greg spent his school years here and left in August 1989, as communism ended.", "pl": "Olsztyn, niemiecki Allenstein, założyła kapituła warmińska w 1353 r. W styczniu 1945 r. Armia Czerwona spaliła 40% miasta. Stało się ono potem stolicą Warmii i Mazur i urosło z 23 tys. mieszkańców do ponad 160 tys. w 1990 r. Gdy Kowalczykowie przyjechali w 1975 r., miasto właśnie zostało stolicą nowego województwa o powierzchni 12 327 km². Było młode i szybko rosło: osiedla z wielkiej płyty, Akademia Rolniczo-Techniczna w Kortowie, planetarium z 1973 r., a przede wszystkim fabryka opon Stomil, która w 1980 r. zatrudniała ok. 4800 osób. Strajk w Stomilu 22 sierpnia 1980 r. zapoczątkował olsztyńską „Solidarność”. 14 grudnia 1981 r., dzień po ogłoszeniu stanu wojennego, ok. 400 pracowników Stomilu znów zastrajkowało; zostali usunięci z zakładu, a czterech przywódców trafiło do więzienia. Grzegorz spędził tu lata szkolne i wyjechał w sierpniu 1989 r., gdy upadał komunizm."}, "timeline": [{"y": 1353, "en": "town founded", "pl": "założenie miasta"}, {"y": 1945, "en": "taken by the Red Army, 22 Jan; ~40% burned", "pl": "zajęcie przez Armię Czerwoną, 22 stycznia; spalone ok. 40%"}, {"y": 1946, "en": "voivodeship capital, ~23,000 people", "pl": "stolica województwa, ok. 23 tys. mieszkańców"}, {"y": 1950, "en": "WSR (agricultural college) founded, 31 May", "pl": "założenie WSR, 31 maja"}, {"y": 1966, "en": "boundary extended (Gutkowo, Likusy parts), 1 Jan", "pl": "poszerzenie granic (części Gutkowa i Likus), 1 stycznia"}, {"y": 1967, "en": "OZOS Stomil inaugurated, 28 Oct", "pl": "otwarcie OZOS Stomil, 28 października"}, {"y": 1969, "en": "WSR becomes Akademia Rolniczo-Techniczna, 1 Oct", "pl": "WSR przemianowana na Akademię Rolniczo-Techniczną, 1 października"}, {"y": 1973, "en": "planetarium opens", "pl": "otwarcie planetarium"}, {"y": 1975, "en": "capital of the new, smaller voivodeship, 1 Jun; Kowalczyk family arrives (data.js)", "pl": "stolica nowego, mniejszego województwa, 1 czerwca; przyjazd Kowalczyków"}, {"y": 1979, "en": "first block on Nagórki estate occupied", "pl": "zasiedlenie pierwszego bloku na Nagórkach"}, {"y": 1980, "en": "Stomil strike, 22–24 Aug; Solidarity union of ~3,000 founded, 1 Oct", "pl": "strajk w Stomilu, 22–24 sierpnia; związek „Solidarność” (ok. 3000 osób), 1 października"}, {"y": 1981, "en": "martial law, 13 Dec; Stomil strike broken, 14 Dec", "pl": "stan wojenny, 13 grudnia; stłumienie strajku w Stomilu, 14 grudnia"}, {"y": 1987, "en": "Gutkowo (291.73 ha) and Likusy added to the city, 14 Nov", "pl": "włączenie do miasta 291,73 ha Gutkowa i Likus, 14 listopada"}, {"y": 1989, "en": "Solidarity regional committee formed, 12 Feb; Greg leaves, 20 Aug; Henryk dies, 27 Sep (data.js)", "pl": "komitet regionalny „Solidarności”, 12 lutego; wyjazd Grzegorza, 20 sierpnia; śmierć Henryka, 27 września"}], "family": [{"person": "greg", "from": 1975, "to": 1989, "role": {"en": "grew up here; left Poland 20 Aug 1989", "pl": "tu dorastał; wyjechał z Polski 20 sierpnia 1989"}}, {"person": "henryk", "from": 1975, "to": 1989, "role": {"en": "lived here; died here 27 Sep 1989", "pl": "mieszkał tu; zmarł 27 września 1989"}}, {"person": "teresa", "from": 1975, "to": null, "role": {"en": "lived here from 1975", "pl": "mieszkała tu od 1975 r."}}], "sources": ["https://pl.wikipedia.org/wiki/Gutkowo_(Olsztyn)", "https://pl.wikipedia.org/wiki/Kościół_św._Wawrzyńca_w_Olsztynie", "https://api.sejm.gov.pl/eli/acts/DU/1965/333/text.pdf", "https://api.sejm.gov.pl/eli/acts/MP/1987/290/text.pdf", "https://pl.wikipedia.org/wiki/Historia_Olsztyna", "https://pl.wikipedia.org/wiki/Olsztyn", "https://en.wikipedia.org/wiki/Olsztyn", "https://pl.wikipedia.org/wiki/Wojew%C3%B3dztwo_olszty%C5%84skie_(
