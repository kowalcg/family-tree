<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Drzewo rodzinne Kowalczyk, Dramiński, Prełowski, Zakierski / Family tree">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rodzina Kowalczyk Prełowski</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%239E3B2A%27/%3E%3Ctext x=%2732%27 y=%2743%27 text-anchor=%27middle%27 font-family=%27Georgia,serif%27 font-weight=%27700%27 font-size=%2732%27 fill=%27%23FFFBF5%27%3EK%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout v5: left rail (desktop) or bottom tab bar (phone); full-height tree workspace with native-scroll canvas, toolbar on top, person drawer sliding over the chart. Palette: Toruń brick and lime, Vistula slate, Kujawy ochre, glazed green. */
:root{
  --bg:#F4EEE4; --canvas:#EFE7DA; --surface:#FFFBF5; --surface2:#F3EADD; --fg:#241B16; --muted:#6B5F55; --rule:#B9AFA3; --rule2:#DED5C8;
  --line:#C8BCAE; --line2:#9C8F82;
  --brick:#9E3B2A; --ochre:#B5742F; --glaze:#2F4A3E; --vistula:#3E6B8A;
  --lk:#A8442F; --ld:#B07A1E; --lp:#3E6B8A; --lz:#3E7058;
  --family:#3E6B8A; --verified:#2E7A4E; --probable:#B5742F; --possible:#8A5A8E; --unknown:#8E857B;
  --display:"Cormorant Garamond",Georgia,serif; --body:"Lato","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",Menlo,monospace;
  --fs:18px; --cf:1; --rail:250px; --tab:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#17120F; --canvas:#1C1612; --surface:#261E19; --surface2:#30261F; --fg:#F3E9DC; --muted:#B5A595; --rule:#5A4C40; --rule2:#3A3029; --line:#4E4238; --line2:#8A7A6B; --brick:#E07A57; --ochre:#E0A64F; --glaze:#5FA084; --vistula:#86AED0; --lk:#D9704F; --ld:#D39A3C; --lp:#6E9CC4; --lz:#5E9E80; --family:#86AED0; --verified:#62B882; --probable:#E0A64F; --possible:#C49AC9; --unknown:#7D7268; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#17120F; --canvas:#1C1612; --surface:#261E19; --surface2:#30261F; --fg:#F3E9DC; --muted:#B5A595; --rule:#5A4C40; --rule2:#3A3029; --line:#4E4238; --line2:#8A7A6B; --brick:#E07A57; --ochre:#E0A64F; --glaze:#5FA084; --vistula:#86AED0; --lk:#D9704F; --ld:#D39A3C; --lp:#6E9CC4; --lz:#5E9E80; --family:#86AED0; --verified:#62B882; --probable:#E0A64F; --possible:#C49AC9; --unknown:#7D7268; color-scheme:dark }
*{box-sizing:border-box}
html{font-size:var(--fs)}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh;min-height:100dvh}
/* rail */
.rail{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:4px;padding:20px 14px 16px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--rule2);overflow:auto;z-index:20}
.brand{padding:2px 8px 14px;cursor:pointer}
.brand .bt{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1;letter-spacing:-.01em}
.brand .bt em{font-style:italic;font-weight:500;color:var(--brick)}
.brand .bs{font-size:.74rem;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.navb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:46px;padding:8px 12px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:.95rem;cursor:pointer}
.navb:hover{background:var(--surface2)}
.navb[aria-current="true"]{background:var(--brick);color:#fff}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:42px;font-weight:700;font-size:.86rem;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button+button{border-left:1.5px solid var(--rule)}
.seg.full{display:flex}.seg.full button{flex:1}
.langseg{margin:0 4px 12px;border-color:var(--brick)}
.tabbar .lt{display:inline-flex;align-items:center;justify-content:center;width:30px;height:22px;border:1.5px solid currentColor;border-radius:7px;font-size:.72rem;font-weight:800;letter-spacing:.03em}
.tabbar button.langb{color:var(--brick)}
.stage{min-width:0;position:relative}
.view[hidden]{display:none!important}
/* pages */
.page{max-width:1180px;margin:0 auto;padding:34px max(20px,env(safe-area-inset-right,0px)) 80px max(20px,env(safe-area-inset-left,0px))}
.page h2.h{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.5vw,2.8rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em;text-wrap:balance}
.page .lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.panel h3{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4vw,2.5rem);margin:0 0 8px;letter-spacing:-.01em;line-height:1.05}
.panel p,.panel li{max-width:72ch}
.sec{margin-top:40px}
.sec>h3{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0 0 14px}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:end;padding-bottom:26px;border-bottom:2px solid var(--brick)}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,7vw,4.8rem);line-height:.95;margin:0;letter-spacing:-.02em}
.hero h1 em{font-style:italic;font-weight:500;color:var(--brick)}
.hero p{color:var(--muted);margin:14px 0 0;max-width:58ch;font-size:1.05rem}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpis div{border-left:3px solid var(--brick);padding:2px 0 2px 12px}
.kpis b{display:block;font-family:var(--display);font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.kpis span{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.starts{display:flex;flex-wrap:wrap;gap:10px}
.startb{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 18px 8px 10px;border-radius:14px;border:1.5px solid var(--rule2);background:var(--surface);cursor:pointer;font-weight:700;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.startb:hover{border-color:var(--brick)}
.startb .mono{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:1.05rem}
.startb small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.startb.play{background:var(--brick);border-color:var(--brick);color:#fff}
.startb.play small{color:rgba(255,255,255,.85)}
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.lcard{border-radius:16px;overflow:hidden;background:var(--surface);border:1.5px solid var(--rule2);display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.lcard .im{height:150px;background:var(--rule2) center/cover no-repeat;position:relative}
.lcard .im::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:var(--lc)}
.lcard .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.lcard .k{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.lcard h4{margin:0;font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.05}
.lcard .pl{font-size:.92rem;color:var(--muted)}
.lcard .st{display:flex;gap:16px;margin:4px 0 2px}
.lcard .st b{font-family:var(--display);font-size:1.6rem;line-height:1;display:block}
.lcard .st span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.lcard .old{font-size:.88rem}
.lcard .old b{font-weight:700}
.lcard .acts{margin-top:auto;display:flex;gap:8px;padding-top:8px}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--surface);font-weight:700;font-size:.9rem;cursor:pointer}
.btn:hover{border-color:var(--brick)}
.btn.pri{background:var(--brick);border-color:var(--brick);color:#fff}
.todo{border:1.5px solid var(--rule2);border-radius:12px;padding:14px 16px;background:var(--surface);margin-top:10px}
.todo b{font-family:var(--display);font-size:1.15rem}
@media (max-width:820px){.hero{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
/* tree workspace */
.tree{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overflow:clip}
.drawer:not(.vis){visibility:hidden}
.tree.open .drawer{visibility:visible}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule2);background:var(--surface);z-index:13;position:relative}
.who{display:flex;align-items:center;gap:10px;min-width:0;margin-right:4px}
.who .mono{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;flex:none}
.who .nm{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.who .sub{font-size:.74rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tsp{flex:1}
.search{position:relative;flex:0 1 280px;min-width:180px}
.search input{width:100%;min-height:44px;padding:8px 12px 8px 38px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);color:var(--fg);font:inherit;font-size:.95rem}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
.results{position:absolute;top:calc(100% + 6px);left:0;width:max(100%,320px);background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.25);max-height:60vh;overflow:auto;z-index:40;padding:4px}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;cursor:pointer;font-size:.92rem;border-radius:8px}
.results button:hover,.results button.act{background:var(--surface2)}
.results .dt{width:10px;height:10px;border-radius:50%;flex:none}
.results .y{color:var(--muted);font-size:.8rem;margin-left:auto;white-space:nowrap}
.results .none{padding:12px;color:var(--muted);font-size:.9rem}
.step{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--rule);border-radius:10px;background:var(--surface);padding:0 4px 0 10px;min-height:44px}
.step .lbl{font-size:.78rem;font-weight:700;color:var(--muted);margin-right:4px}
.step b{min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
.step button{width:34px;height:34px;border:0;background:transparent;font-size:1.2rem;font-weight:700;border-radius:8px;cursor:pointer}
.step button:hover{background:var(--surface2)}
.step button:disabled{opacity:.3;cursor:default}
.banner{padding:10px 16px;background:var(--surface2);border-bottom:1.5px solid var(--ochre);font-size:.92rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:7}
.banner b{color:var(--ochre)}
.banner .btn{min-height:36px;padding:4px 12px}
.scroller{position:relative;flex:1;overflow:hidden;background:var(--canvas);touch-action:none;overscroll-behavior:contain;cursor:grab;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(color-mix(in srgb,var(--rule) 45%,transparent) 1px,transparent 1.2px);background-size:22px 22px}
.scroller.drag{cursor:grabbing;user-select:none}
.sizer{position:relative}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.canvas>svg{position:absolute;left:0;top:0;overflow:visible;transition:opacity .25s}
.canvas>svg.fade{opacity:0}
.e{fill:none;stroke:var(--line2);stroke-width:2}
.e.sib{stroke:var(--line);stroke-width:1.8}
.e.direct{stroke:var(--brick);stroke-width:3}
.e.pos{stroke-dasharray:7 6}.e.prob{stroke-dasharray:14 6}
.mar{fill:none;stroke:var(--line2);stroke-width:2.4}
.mar.direct{stroke:var(--brick);stroke-width:3}
.ring{fill:var(--surface);stroke:var(--brick);stroke-width:2}
/* cards */
.card{position:absolute;display:flex;align-items:center;gap:.6em;padding:.45em .55em .45em .8em;border-radius:12px;background:var(--surface);border:1.5px solid var(--rule2);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.07);cursor:pointer;
  transition:left .55s cubic-bezier(.2,.75,.2,1),top .55s cubic-bezier(.2,.75,.2,1),opacity .35s,box-shadow .2s,border-color .2s,transform .2s;overflow:hidden;font-size:calc(16.5px*var(--cf));user-select:none}
.card:hover{border-color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.16);transform:translateY(-1px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--lc)}
.card.direct{border-color:color-mix(in srgb,var(--brick) 55%,var(--rule2))}
.card.root{border-color:var(--brick);border-width:2.5px;background:var(--surface2)}
.card.sel{box-shadow:0 0 0 4px color-mix(in srgb,var(--ochre) 60%,transparent),0 8px 24px rgba(0,0,0,.16)}
.card .mono{flex:none;width:2.3em;height:2.3em;border-radius:50%;display:grid;place-items:center;background:var(--lc);color:#fff;font-family:var(--display);font-weight:700;font-size:1em}
.card .tx{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.16}
.card .g,.card .s{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
@media (max-width:699px){.card:not(.ghost) .mono{display:none}.card{padding-left:.9em}}
.card .g{font-weight:700;font-size:.95em;line-height:1.12}
.card .s{font-family:var(--display);font-weight:700;font-size:1.12em;line-height:1.08}
.card .mn{font-family:var(--display);font-style:italic;font-size:.9em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.card .s i{font-weight:500;font-size:.82em;color:var(--muted)}
.card .d{font-size:.85em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15em}
.card .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--st)}
.card .xp{flex:none;position:relative;width:36px;height:36px;padding:0;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:900;color:var(--brick);font-size:15px;background:var(--surface);cursor:pointer}
.card .xp::after{content:"";position:absolute;inset:-5px;border-radius:50%}
.card .xp:hover{border-color:var(--brick);background:var(--surface2)}
.card.ghost{background:color-mix(in srgb,var(--surface) 55%,transparent);border-style:dashed;box-shadow:none;border-color:var(--rule)}
.card.ghost::before{display:none}
.card.ghost .tx{color:var(--muted)}
.card.ghost .s{font-family:var(--body);font-size:.88em}
.card.ghost .mono{background:transparent;border:1.5px dashed var(--rule);color:var(--muted)}
.card.morec{justify-content:center;text-align:center;border-style:dashed;background:var(--surface2);font-weight:700;color:var(--brick)}
.card.morec::before{display:none}
.card.stub{font-size:calc(13px*var(--cf))}
.fwrap{position:relative}
.fbtn{display:inline-flex;align-items:center;gap:6px}
.fbtn.on{border-color:var(--ochre);color:var(--ochre)}
.fcount{background:var(--ochre);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 7px;font-weight:900}
.fpop{position:absolute;top:calc(100% + 8px);left:0;width:min(420px,92vw);background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:14px 16px;z-index:45}
.fpop h5{margin:10px 0 8px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fpop h5:first-child{margin-top:0}
.fgrid{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--rule);background:transparent;font-weight:700;font-size:.86rem;cursor:pointer;opacity:.55;text-decoration:line-through}
.fchip.on{opacity:1;text-decoration:none;background:var(--surface2);border-color:var(--fg)}
.fchip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fbot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule2)}
.fbot .note{flex:1}
@media (max-width:900px){.fwrap{order:3}.fpop{position:fixed;left:8px;right:8px;top:auto;bottom:calc(var(--tab) + 10px);width:auto}}
/* fan */
.wedge{cursor:pointer;stroke:var(--canvas);stroke-width:2}
.wedge:hover{filter:brightness(1.12)}
.wedge.gap{fill:transparent;stroke:var(--rule);stroke-dasharray:4 4;cursor:default}
.wedge.sel{stroke:var(--ochre);stroke-width:4}
.wedge:focus{outline:none}.wedge:focus-visible{stroke:var(--brick);stroke-width:5}
.wl{font-family:var(--body);fill:#fff;pointer-events:none;font-weight:700}
.wld{font-family:var(--body);fill:rgba(255,255,255,.86);pointer-events:none}
/* overlays */
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:6;align-items:center}
.zoom button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--rule);background:var(--surface);font-size:1.35rem;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15);display:grid;place-items:center}
.zoom button:hover{border-color:var(--brick)}
.zoom .pct{font-size:.7rem;color:var(--muted);font-family:var(--mono);background:var(--surface);padding:1px 6px;border-radius:6px}
.legendw{position:absolute;left:14px;bottom:14px;z-index:6;max-width:calc(100% - 100px)}
.legend{background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--rule2);border-radius:12px;padding:10px 12px;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
.legend .ln{width:22px;height:0;border-top:3px solid var(--brick);border-radius:0}
.legend .ld{width:22px;height:0;border-top:2px dashed var(--line2);border-radius:0}
.legend .x{border:0;background:transparent;font-weight:700;cursor:pointer;color:var(--muted);padding:0 2px}
.legbtn{min-height:38px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--rule);background:var(--surface);font-weight:700;font-size:.82rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.hintc{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:.84rem;padding:8px 14px;border-radius:999px;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .4s;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
/* drawer */
.drawer{position:absolute;top:var(--tbarH,0px);right:0;bottom:0;width:min(430px,100%);background:var(--surface);border-left:1.5px solid var(--rule2);box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(104%);transition:transform .32s cubic-bezier(.2,.75,.2,1);z-index:12;overflow:auto;overscroll-behavior:contain;padding:18px 22px 40px}
.tree.open .drawer{transform:none}
@media (min-width:901px){.tree.open .banner{padding-right:450px}.tree.open .zoom{right:444px}}
.grab{display:none}

.vfacade,.vlink{position:relative;display:flex;align-items:flex-end;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1.5px solid var(--rule2);cursor:pointer;padding:0;text-align:left;text-decoration:none;color:#FFF8EE;background:linear-gradient(135deg,#3a2a20,#1d1511 60%,#4a2a1e)}
.vfacade img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.vfacade:hover,.vlink:hover{border-color:var(--brick)}
.vplay{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:var(--brick);color:#fff;display:grid;place-items:center;font-size:1.6rem;padding-left:5px;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.vplay.sm{width:54px;height:54px;font-size:1.25rem}
.vcap{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px;padding:12px 14px;width:100%;background:linear-gradient(to top,rgba(10,7,5,.85),transparent)}
.vcap b{font-size:.98rem;line-height:1.25}.vcap small{opacity:.85}
.vext{font-size:.85rem;font-weight:700;color:#FFD9B8;margin-top:2px}
.vframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block;background:#000}
.help{border:1.5px solid var(--ochre);border-radius:14px;padding:4px 20px 14px;background:color-mix(in srgb,var(--ochre) 8%,var(--surface));margin-top:30px}
.help .psec{margin-top:16px}.help li{margin:6px 0}
.help summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.psrc{padding-left:1.4em;font-size:.9rem;word-break:break-word}.psrc li{margin:4px 0}
.psrc a{color:var(--vistula)}
.plchips button{display:inline-flex;align-items:center;gap:6px}
.jbtn{display:inline-flex;align-items:center;gap:6px}
/* gallery */
.frow{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;margin-top:10px}
.flbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:8.5em}
.frow .filters{margin-top:0;flex:1;min-width:0}
.filters button{min-height:44px}
.filters button .n{font-weight:400;opacity:.75;margin-left:2px}
.filters button:disabled{opacity:.4;cursor:default}
.decs{display:flex;align-items:flex-end;gap:3px;flex:1;min-width:0;overflow-x:auto;padding-bottom:4px}
.decs button{font:inherit;cursor:pointer;border:1.5px solid var(--rule);background:var(--surface);border-radius:8px}
.decs .dall{min-height:44px;padding:6px 12px;font-weight:700;font-size:.85rem;align-self:stretch}
.dbar{flex:1 0 42px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3px 0;position:relative}
.dbar .bar{width:62%;background:var(--vistula);border-radius:3px 3px 0 0;max-height:52px;display:block}
.dbar .dl{font-size:.66rem;font-weight:700;margin-top:3px;letter-spacing:-.02em}.dbar .dn{font-size:.68rem;color:var(--muted);min-height:1em}
.dbar[aria-pressed="true"],.decs .dall[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dbar[aria-pressed="true"] .bar{background:var(--ochre)}.dbar[aria-pressed="true"] .dn{color:var(--bg)}
.dbar:disabled{opacity:.35;cursor:default}
.achips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.achips button{flex:none;font:inherit;font-weight:700;font-size:.88rem;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer}
.achips .clr{background:var(--surface);color:var(--fg);border-color:var(--rule)}
.gcount{color:var(--muted);margin:14px 0 0}
.fbtn2{display:inline-flex;align-items:center;gap:8px;margin-top:4px}
.vtile{position:relative;display:block;height:150px;background:linear-gradient(135deg,#3a2a20,#1d1511 60%,#4a2a1e)}
.vtile img{height:150px}
.vbadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--brick);color:#fff;display:grid;place-items:center;font-size:1.2rem;padding-left:4px}
.vdur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:.78rem;font-weight:700;padding:1px 6px;border-radius:5px}
.sheet.tall{max-height:82vh;max-height:82dvh;overflow:auto}
.sheet .shh{display:flex;align-items:center;justify-content:space-between}
.sheet .shh h3{margin:0;font-family:var(--display);font-size:1.5rem}
.sheet .gfilters .frow{flex-direction:column;align-items:stretch}
.sheet .shf{position:sticky;bottom:-20px;display:flex;gap:8px;justify-content:flex-end;padding:12px 0 4px;background:var(--surface);margin-top:8px}
.lbvid{max-width:min(1100px,100%);margin:0 auto;padding:16px}
.lbvid .film .fd,.lbvid .film .fcr{color:#E9DCCB}
.lbpl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lbpl .btn{background:#2A211C;color:#F3E9DC;border-color:#6b5a4e}
#lbS a{color:#FFD9B8}
@media (max-width:700px){.flbl{min-width:0}.phero .phb{padding:16px}.pgrid{grid-template-columns:1fr 1fr;gap:10px}.pcard img,.pcard .noimg{height:110px}.pcard .pt{font-size:1.15rem}.films{grid-template-columns:1fr}.ptl li{grid-template-columns:4.6em minmax(0,1fr)}}
@media (max-width:380px){.pgrid{grid-template-columns:1fr}}
</style>

<script>
// PEOPLE: published copy, built by build.py from src/data.js. Living relatives are redacted (redact.js).
const PEOPLE = [{"id":"alex","g":"Alexander Grzegorz","s":"Kowalczyk","x":"M","b":"1998","bp":"Mississauga, Ontario","f":"greg","mo":"barbara","st":"family","ln":"kowalczyk"},{"id":"patricia","g":"Patricia","s":"Kowalczyk","x":"F","b":"1992","bp":"Mississauga, Ontario","f":"greg","mo":"barbara","st":"family","ln":"kowalczyk"},{"id":"greg","g":"Grzegorz Dariusz","s":"Kowalczyk","x":"M","b":"2 Jan 1970","bp":"Giżycko","f":"henryk","mo":"teresa","sp":["barbara"],"st":"family","ln":"kowalczyk","lk":"verified","n":{"en":"Born in Giżycko; the family lived in Kętrzyn until 1975, then Olsztyn. Left communist Poland for Germany on 20 August 1989, married Barbara on 23 August 1991, and emigrated to Canada on 25 May 1992. Mechanical engineer, later e-commerce entrepreneur in Oakville, Ontario.","pl":"Urodzony w Giżycku; rodzina mieszkała w Kętrzynie do 1975 r., potem w Olsztynie. Wyjechał z komunistycznej Polski do Niemiec 20 sierpnia 1989 r., 23 sierpnia 1991 r. ożenił się z Barbarą, a 25 maja 1992 r. wyemigrował do Kanady. Inżynier mechanik, później przedsiębiorca e-commerce w Oakville w Ontario."}},{"id":"barbara","g":"Barbara Maria","s":"Kowalczyk","m":"Prełowska","x":"F","b":"30 Nov 1966","bp":"Toruń","f":"stefan","mo":"helena","sp":["greg"],"st":"family","ln":"prelowski","lk":"family","n":{"en":"One of five Prełowski sisters: Janina, Anna, Aleksandra, Agnieszka and Barbara.","pl":"Jedna z pięciu sióstr Prełowskich: Janina, Anna, Aleksandra, Agnieszka i Barbara."}},{"id":"wieslaw","g":"Wiesław","s":"Kowalczyk","x":"M","f":"henryk","mo":"teresa","st":"family","ln":"kowalczyk","lk":"family","liv":1},{"id":"janina","g":"Janina","s":"Błażejewska","m":"Prełowska","x":"F","f":"stefan","mo":"helena","sp":["slawomir"],"st":"family","ln":"prelowski","lk":"family","liv":1},{"id":"slawomir","g":"Sławomir","s":"Błażejewski","x":"M","sp":["janina"],"st":"family","liv":1},{"id":"anna","g":"Anna","s":"Smoleń","m":"Prełowska","x":"F","f":"stefan","mo":"helena","sp":["damian"],"st":"family","ln":"prelowski","lk":"family","liv":1},{"id":"damian","g":"Damian","s":"Smoleń","x":"M","sp":["anna"],"st":"family","liv":1},{"id":"valentin","g":"Valentin","s":"Smoleń","x":"M","f":"damian","mo":"anna","st":"family","lk":"family","liv":1},{"id":"aleksandra","g":"Aleksandra","s":"Prełowska","x":"F","f":"stefan","mo":"helena","st":"family","ln":"prelowski","lk":"family","liv":1},{"id":"agnieszka","g":"Agnieszka","s":"Zakierska","m":"Prełowska","x":"F","f":"stefan","mo":"helena","sp":["tomek"],"st":"family","ln":"prelowski","lk":"family","liv":1},{"id":"tomek","g":"Tomasz (Tomek)","s":"Zakierski","x":"M","sp":["agnieszka"],"st":"family","ln":"zakierski","liv":1},{"id":"agata","g":"Agata","s":"Zakierska","x":"F","f":"tomek","mo":"agnieszka","st":"family","lk":"family","liv":1},{"id":"marta_z","g":"Marta","s":"Zakierska","x":"F","f":"tomek","mo":"agnieszka","st":"family","lk":"family","liv":1},{"id":"michal_b","g":"Michał","s":"Błażejewski","x":"M","f":"slawomir","mo":"janina","st":"family","lk":"family","liv":1},{"id":"zuzanna_w","g":"Zuzanna","s":"Woziewska","m":"Błażejewska","x":"F","f":"slawomir","mo":"janina","st":"family","lk":"family","liv":1},{"id":"sebastian_k","g":"Sebastian","s":"Kowalczyk","x":"M","f":"wieslaw","st":"family","ln":"kowalczyk","lk":"family","liv":1},{"id":"artur_k","g":"Artur","s":"Kowalczyk","x":"M","f":"wieslaw","st":"family","ln":"kowalczyk","lk":"family","liv":1},{"id":"henryk","g":"Witold Henryk","s":"Kowalczyk","x":"M","b":"31 Oct 1932","bp":"Groszki Stare, par. Kałuszyn","d":"27 Sep 1989","dp":"Olsztyn","f":"waclaw_k","mo":"marianna_bucz","sp":["teresa"],"st":"verified","ln":"kowalczyk","lk":"verified","src":"Death certificate, USC Olsztyn, act 2862011/00/AZ/1989/225437 (copy issued 22 Feb 2017)","ph":["cert-1989-usc-olsztyn-witold-henryk-kowalczyk.jpg","grave-olsztyn-gutkowo-witold-teresa-kowalczyk-1.jpg"],"n":{"en":"Known in the family as Henryk; the registry has him as Witold Henryk. Born 31 October 1932 at Groszki Stare, son of Wacław Kowalczyk and Marianna Buczyńska, as his death certificate states. Settled after the war in Kętrzyn, the former Rastenburg, and moved to Olsztyn in 1975. Died in Olsztyn on 27 September 1989 at 22:50, five weeks after Greg left for Germany. His father Wacław, born at Groszki in 1899, carries the line back through the Kałuszyn and Grębków registers to the 1750s.","pl":"W rodzinie Henryk; w aktach Witold Henryk. Urodzony 31 października 1932 r. w Groszkach Starych, syn Wacława Kowalczyka i Marianny Buczyńskiej, jak podaje jego akt zgonu. Po wojnie osiadł w Kętrzynie, dawnym Rastenburgu, a w 1975 r. przeniósł się do Olsztyna. Zmarł w Olsztynie 27 września 1989 r. o 22:50, pięć tygodni po wyjeździe Grzegorza do Niemiec. Jego ojciec Wacław, urodzony w Groszkach w 1899 r., prowadzi linię przez księgi Kałuszyna i Grębkowa aż do lat 50. XVIII w."}},{"id":"waclaw_k","g":"Wacław","s":"Kowalczyk","x":"M","b":"10 Oct 1899","bp":"Groszki, par. Kałuszyn","f":"antoni_k2","mo":"feliksa_lach","sp":["marianna_bucz"],"st":"verified","ln":"kowalczyk","lk":"probable","src":"Kałuszyn birth 1899/194, scan read (born Groszki 10 Oct 1899 N.S. / 28 Sep O.S.; father Antoni Kowalczyk, 28, labourer of Groszki; mother Feliksa née Łachniak, 30; godparents Jan Woźniak and Florentyna Wysocka); named as father on Henryk's death certificate, USC Olsztyn 1989","n":{"en":"Greg's grandfather. The Kałuszyn register has exactly one Wacław Kowalczyk of Groszki in the right generation: born 28 September 1899, fourth of ten children of Antoni Kowalczyk and Feliksa Łachniak. The identification with the Wacław named on Henryk's death certificate is probable; his marriage to Marianna Buczyńska (about 1925–1932) lies after the index ends and sits in the Kałuszyn registry office.","pl":"Dziadek Grzegorza. Księga kałuszyńska zna dokładnie jednego Wacława Kowalczyka z Groszek we właściwym pokoleniu: urodzonego 28 września 1899 r., czwarte z dziesięciorga dzieci Antoniego Kowalczyka i Feliksy Łachniak. Identyfikacja z Wacławem z aktu zgonu Henryka jest prawdopodobna; jego ślub z Marianną Buczyńską (ok. 1925–1932) wypada po końcu indeksu i czeka w USC Kałuszyn."}},{"id":"marianna_bucz","g":"Marianna","s":"Kowalczyk","m":"Buczyńska","x":"F","sp":["waclaw_k"],"st":"verified","ln":"kowalczyk","src":"Named as mother on the death certificate of Witold Henryk Kowalczyk, USC Olsztyn 1989","n":{"en":"Greg's grandmother, born a Buczyńska. Her family's parish is not yet known.","pl":"Babka Grzegorza, z domu Buczyńska. Parafia jej rodziny jeszcze nieznana."}},{"id":"teresa","g":"Teresa","s":"Kowalczyk","m":"Dramińska","x":"F","b":"26 Sep 1935","bp":"Kosemin, par. Zawidz, pow. Sierpc","d":"18 Feb 2017","dp":"Barczewo","f":"antoni_dram","mo":"zofia_karcz","sp":["henryk"],"st":"verified","ln":"draminski","lk":"verified","src":"Death certificate, USC Barczewo, act 2814013/00/AZ/2017/337436; headstone, Olsztyn-Gutkowo parish cemetery, plot I/IV/07","ph":["cert-2017-usc-barczewo-teresa-kowalczyk-draminska.jpg","grave-olsztyn-gutkowo-witold-teresa-kowalczyk-1.jpg"],"n":{"en":"Born 26 September 1935 at Kosemin in Zawidz parish, Sierpc county, in the northern Mazowsze country where the Dramiński name has lived since the 1600s; daughter of Antoni Dramiński and Zofia Karczewska. Widowed in 1989, she died at Barczewo near Olsztyn on 18 February 2017 and rests with Henryk in the Gutkowo parish cemetery in Olsztyn, plot I/IV/07; the headstone reads 'Witold *31.10.1932 +27.9.1989, Teresa *26.09.1935 +18.02.2017'.","pl":"Urodzona 26 września 1935 r. w Koseminie w parafii Zawidz, powiat sierpecki, na północnym Mazowszu, gdzie nazwisko Dramiński żyje od XVII w.; córka Antoniego Dramińskiego i Zofii Karczewskiej. Owdowiała w 1989 r., zmarła w Barczewie pod Olsztynem 18 lutego 2017 r. i spoczywa z Henrykiem na cmentarzu parafialnym w Gutkowie w Olsztynie, kwatera I/IV/07; na nagrobku: „Witold *31.10.1932 +27.9.1989, Teresa *26.09.1935 +18.02.2017”."}},{"id":"stefan","g":"Stefan","s":"Prełowski","x":"M","b":"4 Jan 1939","bp":"Szczecin area (per family)","bpq":1,"d":"15 Jul 2025","dp":"Toruń","f":"prelowski_nn_son","sp":["helena"],"st":"family","ln":"prelowski","lk":"possible","src":"Family; grave plaque, Toruń św. Jerzego cemetery, plot K/10/21 (cmentarnik.net, indexed as 'Perłowski')","ph":["grave-torun-swjerzego-stefan-prelowski-1939-2025-plaque.jpg","grave-torun-swjerzego-stefan-prelowski-1939-2025-wide.jpg"],"n":{"en":"Born, as the family remembers it, somewhere in the Szczecin area. He came to Toruń only for his two years of compulsory military service, met Helena there, married and stayed. His surname is written Prelowski, Prełowski or Przełowski in different papers; in the registers it is Prełowski, and every one of its 46 living bearers today lives in the Toruń or Gdańsk voivodeships, none near Szczecin. In January 1939 Szczecin was German Stettin, so either the family moved west after 1945 and he was born in the old Pomeranian homeland, or the name on his papers differs. The Chełmno household at Rybacka 3, where an older Stefan Prełowski was born in 1910, is shown as a possible origin only. He died on 15 July 2025 and rests in plot K/10/21 of St George's cemetery in Toruń, beside Helena's parents; in November 2025 the Zakierski family had a mass said for him at Mała Nieszawka. His army service book, if the family still has it, states his birthplace and parents. His marriage record from the Toruń registry office names his parents and birthplace and is the single most useful document to order.","pl":"Urodzony, jak pamięta rodzina, gdzieś w okolicach Szczecina. Do Torunia trafił tylko na dwa lata obowiązkowej służby wojskowej, tam poznał Helenę, ożenił się i został. Nazwisko pisane jest w dokumentach Prelowski, Prełowski lub Przełowski; w księgach brzmi Prełowski, a wszystkich 46 żyjących dziś osób tego nazwiska mieszka w województwach toruńskim i gdańskim, nikt pod Szczecinem. W styczniu 1939 r. Szczecin był niemieckim Stettinem, więc albo rodzina przeniosła się na zachód po 1945 r., a on urodził się w dawnej pomorskiej ojczyźnie, albo nazwisko w jego dokumentach brzmi inaczej. Dom przy Rybackiej 3 w Chełmnie, gdzie w 1910 r. urodził się starszy Stefan Prełowski, pokazany jest tylko jako możliwe pochodzenie. Zmarł 15 lipca 2025 r. i spoczywa w kwaterze K/10/21 cmentarza św. Jerzego w Toruniu, obok rodziców Heleny; w listopadzie 2025 r. rodzina Zakierskich zamówiła za niego mszę w Małej Nieszawce. Jego książeczka wojskowa, jeśli rodzina ją ma, podaje miejsce urodzenia i rodziców. Jego akt małżeństwa z USC Toruń podaje rodziców i miejsce urodzenia i jest najważniejszym dokumentem do zamówienia."}},{"id":"helena","g":"Helena","s":"Prełowska","m":"Zakierska","x":"F","b":"9 Aug 1936","bp":"Osówka, par. Czernikowo","f":"julian_z1909","mo":"zofia","sp":["stefan"],"st":"family","ln":"zakierski","lk":"family","n":{"en":"Born in Osówka, a hamlet of St Bartholomew's parish, Czernikowo, 28 km south-east of Toruń, and moved to Toruń as a young woman. Her surname has about 300 bearers in Poland, two thirds of them in this one district. Her father Julian Zakierski was born at Steklin, 3 km from Osówka, on 21 November 1909, a son of Wacław Zakierski and Julianna Hinc, and died in Toruń on 2 October 1994. Her mother was Zofia; her maiden name is still to be found. Siblings: Irena, an older brother Wacław and a younger brother Jan, who lived in Mała Nieszawka.","pl":"Urodzona w Osówce, przysiółku parafii św. Bartłomieja w Czernikowie, 28 km na południowy wschód od Torunia; jako młoda kobieta przeniosła się do Torunia. Jej nazwisko nosi ok. 300 osób w Polsce, dwie trzecie w tym jednym powiecie. Jej ojciec Julian Zakierski urodził się w Steklinie, 3 km od Osówki, 21 listopada 1909 r., jako syn Wacława Zakierskiego i Julianny Hinc, i zmarł w Toruniu 2 października 1994 r. Matką była Zofia; jej nazwisko panieńskie pozostaje do ustalenia. Rodzeństwo: Irena, starszy brat Wacław i młodszy brat Jan, który mieszkał w Małej Nieszawce."}},{"id":"zofia","g":"Zofia","s":"Zakierska","m":"?","x":"F","b":"14 Nov 1909","d":"10 Feb 2002","dp":"Toruń","sp":["julian_z1909"],"st":"verified","ln":"zakierski","src":"Headstone, Toruń św. Jerzego cemetery, cathedral-parish section, plot K/10/20 (cmentarnik.net/g/389710); identified as Helena's mother by Greg","ph":["grave-torun-swjerzego-julian-zofia-zakierscy-inscription.jpg","grave-torun-swjerzego-julian-zofia-zakierscy-wide.jpg"],"n":{"en":"Helena's mother. Born 14 November 1909, three days before her future husband, and died in Toruń on 10 February 2002 at 92. She rests with Julian under one grey granite stone inscribed 'Zakierscy' in the cathedral-parish section of St George's cemetery on Gałczyńskiego street, plot K/10/20. The stone gives no maiden name; her death act at USC Toruń (February 2002) or Helena's 1936 birth act will, and will open a whole new line. The parish has asked the grave holder to renew the lease.","pl":"Matka Heleny. Urodzona 14 listopada 1909 r., trzy dni przed swoim przyszłym mężem, zmarła w Toruniu 10 lutego 2002 r. w wieku 92 lat. Spoczywa z Julianem pod jednym szarym granitowym nagrobkiem z napisem „Zakierscy” w części parafii katedralnej cmentarza św. Jerzego przy ul. Gałczyńskiego, kwatera K/10/20. Na kamieniu nie ma nazwiska panieńskiego; poda je akt zgonu z USC Toruń (luty 2002) albo akt urodzenia Heleny z 1936 r. i otworzy całą nową linię. Parafia prosi dysponenta grobu o przedłużenie opłaty."}},{"id":"waclaw_z","g":"Wacław","s":"Zakierski","x":"M","b":"c. 1880–1882","bq":1,"bp":"par. Wola Trutowo (probably)","bpq":1,"f":"marian_zd1","mo":"franciszka_kal","sp":["julianna_hinc"],"st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo marriage 1905/12 (indexed 'Zakerski'): son of Marian Zakierski and Franciszka Kalinowska, to Julia Hinc, daughter of Leonard and Katarzyna Plewa; children at Steklin and Szkleniec 1906–1930","n":{"en":"Helena's grandfather. Married Julia Hinc of Steklin at Czernikowo in 1905 and farmed at Steklin and Szkleniec, 3 km from Osówka, where Kazimiera (1906), Czesław (1907), Julian (1909), Jan (1911), Antoni (1916) and Adam (1930) were born. His own baptism, about 1882–1886, lies in the Wola Trutowo register for 1867–1889, which no index has yet covered; that book at the Włocławek branch of the state archive is the next pull. In the 1911 death entry for little Jan the clerk wrote the father's name as 'Wojciech', a slip that misled the first search.","pl":"Dziadek Heleny. W 1905 r. ożenił się w Czernikowie z Julią Hinc ze Steklina i gospodarzył w Steklinie i Szkleńcu, 3 km od Osówki, gdzie urodzili się Kazimiera (1906), Czesław (1907), Julian (1909), Jan (1911), Antoni (1916) i Adam (1930). Jego własny chrzest, ok. 1882–1886, kryje się w księdze Woli Trutowo z lat 1867–1889, której żaden indeks jeszcze nie objął; ta księga w oddziale włocławskim Archiwum Państwowego to następna kwerenda. W akcie zgonu małego Jana z 1911 r. pisarz wpisał ojca jako „Wojciecha”, co zmyliło pierwsze poszukiwania."}},{"id":"julianna_hinc","g":"Julia (Julianna)","s":"Zakierska","m":"Hinc","x":"F","b":"1889","bp":"Steklin, par. Czernikowo","f":"leonard_hinc","mo":"katarzyna_plewa","sp":["waclaw_z"],"st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo birth 1889/188 (index); marriage 1905/12 (index); mother in Czernikowo births 1911/54 and 1922/13 and death 1911/16 (scans read, 'Julianna z Hinców/Chinców')","n":{"en":"Helena's grandmother, born at Steklin in 1889, the youngest of nine children of Leonard Hinc and Katarzyna Plewa. Married at sixteen. The Hinc family, Roman Catholic despite the German-sounding name, had lived at Obrowo and Steklin in Czernikowo parish since at least the 1770s.","pl":"Babka Heleny, urodzona w Steklinie w 1889 r., najmłodsza z dziewięciorga dzieci Leonarda Hinca i Katarzyny Plewy. Wyszła za mąż w wieku szesnastu lat. Hincowie, katolicy mimo niemiecko brzmiącego nazwiska, mieszkali w Obrowie i Steklinie w parafii Czernikowo co najmniej od lat 70. XVIII w."}},{"id":"kazimiera_z1906","g":"Kazimiera","s":"Zakierska","x":"F","b":"1906","bp":"Steklin, par. Czernikowo","f":"waclaw_z","mo":"julianna_hinc","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1906/4 (Uszyńska_Hanna)"},{"id":"czeslaw_z1907","g":"Czesław","s":"Zakierski","x":"M","b":"3 Nov 1907","bp":"Steklin, par. Czernikowo","d":"9 Feb 2002","dp":"Lipno","f":"waclaw_z","mo":"julianna_hinc","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1907/163; death noted by indexer: Lipno act 43/2002","n":{"en":"Helena's uncle. Lived to 94 and died in Lipno in 2002.","pl":"Stryj Heleny. Dożył 94 lat; zmarł w Lipnie w 2002 r."}},{"id":"julian_z1909","g":"Julian","s":"Zakierski","x":"M","b":"21 Nov 1909","bp":"Steklin, par. Czernikowo","d":"2 Oct 1994","dp":"Toruń","f":"waclaw_z","mo":"julianna_hinc","sp":["zofia"],"st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo birth 1909/214 (Uszyńska_Hanna); death: USC Toruń act 1514/1994; headstone Toruń św. Jerzego K/10/20 (birth given there as 17 Nov 1909); identified as Helena's father by Greg, Nov 2026","ph":["grave-torun-swjerzego-julian-zofia-zakierscy-inscription.jpg"],"n":{"en":"Helena's father. Born at Steklin on 21 November 1909, act 214 of the Czernikowo register, son of Wacław Zakierski and Julianna Hinc; married Zofia; father of Irena, Wacław, Helena and Jan. Died in Toruń on 2 October 1994, act 1514, and lies with Zofia in St George's cemetery, plot K/10/20; the stone gives his birth as 17 November, the baptism index 21 November. The family's memory and the parish record meet in this one man, and through him Helena's line runs back, record by record, to Gabryel Zakierski born about 1739.","pl":"Ojciec Heleny. Urodzony w Steklinie 21 listopada 1909 r., akt 214 księgi czernikowskiej, syn Wacława Zakierskiego i Julianny Hinc; mąż Zofii; ojciec Ireny, Wacława, Heleny i Jana. Zmarł w Toruniu 2 października 1994 r., akt 1514, i spoczywa z Zofią na cmentarzu św. Jerzego, kwatera K/10/20; kamień podaje datę urodzenia 17 listopada, indeks chrztów 21 listopada. Pamięć rodziny i akt parafialny spotykają się w tej jednej osobie, a przez niego linia Heleny biegnie, akt po akcie, do Gabryela Zakierskiego urodzonego ok. 1739 r."}},{"id":"jan_z1911","g":"Jan","s":"Zakierski","x":"M","b":"24 Feb 1911","bp":"Szkleniec, par. Czernikowo","d":"10 Mar 1911","f":"waclaw_z","mo":"julianna_hinc","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1911/54; death 1911/16, aged two weeks"},{"id":"antoni_z1916","g":"Antoni","s":"Zakierski","x":"M","b":"13 Aug 1916","bp":"Szkleniec, par. Czernikowo","f":"waclaw_z","mo":"julianna_hinc","st":"verified","ln":"zakierski","lk":"verified","src":"straty.pl (IPN) card: parents Wacław and Julianna, Szkleniec","n":{"en":"Found in the war-losses database, which proves the Steklin couple were still having children after the parish index ends in 1911. The same hamlet, Szkleniec, as little Jan in 1911.","pl":"Odnaleziony w bazie strat wojennych, co dowodzi, że para ze Steklina miała dzieci także po 1911 r., gdy kończy się indeks parafialny. Ten sam przysiółek, Szkleniec, co mały Jan w 1911 r."},"d":"2 Dec 2011","dp":"Toruń","sp":["helena_z1920"],"ph":["zakierski/2011-Torun-WNMP-Wybickiego-7-6-29-headstone-Antoni-1916-2011-Helena-1920-2000-Wladyslaw-1924-2006-Zakierscy-inscription.jpg"]},{"id":"adam_z1930","g":"Adam","s":"Zakierski","x":"M","b":"21 Oct 1930","bp":"Szkleniec, par. Czernikowo","f":"waclaw_z","mo":"julianna_hinc","st":"verified","ln":"zakierski","lk":"probable","src":"straty.pl (IPN) card: parents Wacław and Julianna, Szkleniec","n":{"en":"A child of a Wacław and Julianna Zakierski at Szkleniec as late as 1930. If this is still Julianna Hinc she was about 45; it may instead be a son Wacław married to another Julianna. Either way the Zakierski family was at Szkleniec and Steklin, 3 km from Osówka, right up to Helena's birth in 1936.","pl":"Dziecko Wacława i Julianny Zakierskich w Szkleńcu jeszcze w 1930 r. Jeśli to wciąż Julianna Hinc, miała ok. 45 lat; może to być też syn Wacław żonaty z inną Julianną. Tak czy inaczej, Zakierscy mieszkali w Szkleńcu i Steklinie, 3 km od Osówki, aż do narodzin Heleny w 1936 r."},"d":"3 Mar 2001"},{"id":"jan_z1841","g":"Jan","s":"Zakierski","x":"M","b":"c. 1841","bq":1,"bp":"Steklinek, par. Czernikowo","f":"wojciech_z","mo":"jozefa_z","sp":["marcjanna_turn"],"st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo marriage 1881/11 (Uszyńska_Hanna): widower aged 40, son of Wojciech and Józefa","n":{"en":"A widower of 40 when he married Marcjanna Turnowska at Czernikowo on 8 May 1881. First thought to be Wacław's father; the 1905 marriage act shows Wacław was Marian's son, so Jan is a Zakierski of the same hamlet, kin not yet placed.","pl":"Czterdziestoletni wdowiec, gdy 8 maja 1881 r. ożenił się w Czernikowie z Marcjanną Turnowską. Początkowo uznany za ojca Wacława; akt ślubu z 1905 r. pokazuje, że Wacław był synem Mariana, więc Jan to Zakierski z tego samego przysiółka, krewny jeszcze nieumiejscowiony."}},{"id":"marcjanna_turn","g":"Marcjanna","s":"Zakierska","m":"Turnowska","x":"F","b":"c. 1842","bq":1,"sp":["jan_z1841"],"st":"verified","ln":"zakierski","src":"Czernikowo marriage 1881/11: daughter of Józef Turnowski and Marianna Bątkowska, aged 39"},{"id":"wojciech_z","g":"Wojciech","s":"Zakierski","x":"M","b":"c. 1800–1815","bq":1,"sp":["jozefa_z"],"st":"verified","ln":"zakierski","src":"Named as the groom's father in Czernikowo marriage 1881/11","n":{"en":"Named only as father of the groom in the 1881 marriage act; possibly the Wojciech Zakierski who died at Mazowsze parish in 1847.","pl":"Znany tylko jako ojciec pana młodego z aktu ślubu z 1881 r.; być może ten Wojciech Zakierski, który zmarł w parafii Mazowsze w 1847 r."}},{"id":"jozefa_z","g":"Józefa","s":"Zakierska","x":"F","sp":["wojciech_z"],"st":"verified","ln":"zakierski","src":"Named as the groom's mother in Czernikowo marriage 1881/11"},{"id":"apolonia_z1813","g":"Apolonia Katarzyna","s":"Zakierska","x":"F","b":"28 Jan 1813","bp":"Obrowo, par. Czernikowo","f":"mateusz_z1783","mo":"magdalena_gaw","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1813/50 (Uszyńska_Hanna)"},{"id":"mateusz_z1783","g":"Mateusz","s":"Zakierski","x":"M","b":"c. 1783","bq":1,"d":"30 Jan 1813","dp":"Obrowo","f":"franciszek_z18","mo":"agnieszka_z18","sp":["magdalena_gaw"],"st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo marriage 1809/10 (groom 22, son of Franciszek and Agnieszka); death 1813/43, aged 30","n":{"en":"Married Magdalena Gaworkiewicz at Czernikowo on 13 November 1809 and died at 30, two days after his daughter Apolonia was born. The oldest Zakierski family unit in Helena's parish; how it connects to the Steklinek line is not yet shown by any record.","pl":"Ożenił się z Magdaleną Gaworkiewicz w Czernikowie 13 listopada 1809 r. i zmarł w wieku 30 lat, dwa dni po narodzinach córki Apolonii. Najstarsza rodzina Zakierskich w parafii Heleny; jak łączy się z linią ze Steklinka, nie pokazuje jeszcze żaden akt."}},{"id":"magdalena_gaw","g":"Magdalena","s":"Zakierska","m":"Gaworkiewicz","x":"F","sp":["mateusz_z1783"],"st":"verified","ln":"zakierski","src":"Czernikowo marriage 1809/10: daughter of Zygmunt and Katarzyna"},{"id":"franciszek_z18","g":"Franciszek","s":"Zakierski","x":"M","sp":["agnieszka_z18"],"st":"verified","ln":"zakierski","src":"Named as groom's father, Czernikowo marriage 1809/10"},{"id":"agnieszka_z18","g":"Agnieszka","s":"Zakierska","x":"F","sp":["franciszek_z18"],"st":"verified","ln":"zakierski","src":"Named as groom's mother, Czernikowo marriage 1809/10"},{"id":"jakub_z1783","g":"Jakub","s":"Zakierski","x":"M","b":"1783","bp":"Głęboczek, par. Chrostkowo","f":"gabryel_z","mo":"ewa_pawl","st":"verified","ln":"zakierski","lk":"verified","src":"Chrostkowo 1783"},{"id":"bartlomiej_z1786","g":"Bartłomiej","s":"Zakierski","x":"M","b":"1786","bp":"Głęboczek, par. Chrostkowo","f":"gabryel_z","mo":"ewa_pawl","st":"verified","ln":"zakierski","lk":"verified","src":"Chrostkowo 1786"},{"id":"gabryel_z","g":"Gabryel","s":"Zakierski","x":"M","b":"c. 1739","bq":1,"d":"26 Jun 1819","dp":"Witowąż, par. Czernikowo","sp":["ewa_pawl"],"st":"probable","ln":"zakierski","src":"Czernikowo death 1819/3, widower aged 80; marriage Działyń 1774/92","n":{"en":"The oldest Zakierski found in the Czernikowo country, born about 1739, in the reign of August III. Married Ewa Pawłowska at Działyń in 1774, baptised sons at Chrostkowo in the 1780s, and died a widower of 80 at Witowąż in 1819. That the 1774 groom and the 1819 widower are the same man is probable, not proven.","pl":"Najstarszy Zakierski odnaleziony w okolicach Czernikowa, urodzony ok. 1739 r., za Augusta III. Ożenił się z Ewą Pawłowską w Działyniu w 1774 r., chrzcił synów w Chrostkowie w latach 80. XVIII w. i zmarł jako 80-letni wdowiec w Witowężu w 1819 r. Tożsamość pana młodego z 1774 r. i wdowca z 1819 r. jest prawdopodobna, nie dowiedziona."}},{"id":"ewa_pawl","g":"Ewa","s":"Zakierska","m":"Pawłowska","x":"F","sp":["gabryel_z"],"st":"verified","ln":"zakierski","src":"Działyń marriage 1774/92"},{"id":"antoni_zc2","g":"Antoni","s":"Zakierski","x":"M","f":"jan_zc2","mo":"katarzyna_dab","sp":["franciszka_bad"],"st":"verified","ln":"zakierski","lk":"probable","src":"Mazowsze marriage 1890/1"},{"id":"franciszka_bad","g":"Franciszka","s":"Zakierska","m":"Bądkowska","x":"F","sp":["antoni_zc2"],"st":"verified","ln":"zakierski","src":"Mazowsze marriage 1890/1"},{"id":"jan_zc2","g":"Jan","s":"Zakierski","x":"M","sp":["katarzyna_dab"],"st":"probable","ln":"zakierski","src":"Mazowsze parish; children married 1881–1890"},{"id":"katarzyna_dab","g":"Katarzyna","s":"Zakierska","m":"Dąbrowska","x":"F","sp":["jan_zc2"],"st":"probable","ln":"zakierski","src":"Mazowsze parish"},{"id":"franciszka_z1894","g":"Franciszka","s":"Zakierska","x":"F","b":"1894","bp":"par. Mazowsze","f":"antoni_zc2","mo":"franciszka_bad","st":"verified","ln":"zakierski","lk":"verified","src":"Mazowsze 1894/19; Chodecz marriage 1922/100"},{"id":"boleslaw_z1903","g":"Bolesław","s":"Zakierski","x":"M","b":"25 Oct 1903","bp":"Rudawa","d":"Sep 1939 (declared dead 1946)","f":"antoni_zc2","mo":"franciszka_bad","st":"verified","ln":"zakierski","lk":"verified","src":"straty.pl, IPN By 115/202: reservist, lived Czernikowo, missing September 1939; death declared by Lipno court 1946","n":{"en":"Lived in Czernikowo, mobilised as a reservist in 1939 and never came back; the Lipno court declared him dead in 1946. From the Mazowsze-parish branch of the family.","pl":"Mieszkał w Czernikowie; zmobilizowany jako rezerwista w 1939 r., nie wrócił; sąd w Lipnie uznał go za zmarłego w 1946 r. Z gałęzi rodziny z parafii Mazowsze."}},{"id":"waleria_z1899","g":"Waleria","s":"Zakierska","x":"F","b":"1899","bp":"Dobrzejewice","f":"wladyslaw_z1875","mo":"zofia_brzoz","st":"verified","ln":"zakierski","lk":"verified","src":"Dobrzejewice 1899/79 (Maciej_L)"},{"id":"wladyslawa_z1901","g":"Władysława","s":"Zakierska","x":"F","b":"1901","bp":"Dobrzejewice","f":"wladyslaw_z1875","mo":"zofia_brzoz","st":"verified","ln":"zakierski","lk":"verified","src":"Dobrzejewice 1901/33"},{"id":"monika_z1902","g":"Monika","s":"Zakierska","x":"F","b":"1902","bp":"Dobrzejewice","f":"wladyslaw_z1875","mo":"zofia_brzoz","st":"verified","ln":"zakierski","lk":"verified","src":"Dobrzejewice 1902/75"},{"id":"wladyslaw_z1875","g":"Władysław","s":"Zakierski","x":"M","b":"1875","bp":"Dobrzejewice","f":"jozefat_z1854","mo":"marcjanna_fyd","sp":["zofia_brzoz"],"st":"verified","ln":"zakierski","lk":"verified","src":"Dobrzejewice 1875/35; marriage 1899/1"},{"id":"zofia_brzoz","g":"Zofia Leokadia","s":"Zakierska","m":"Brzozowska","x":"F","sp":["wladyslaw_z1875"],"st":"verified","ln":"zakierski","src":"Dobrzejewice marriage 1899/1","n":{"en":"The only Zofia married to a Zakierski anywhere in the index. Born about 1880, she is a generation too old to be Helena's mother.","pl":"Jedyna Zofia zamężna z Zakierskim w całym indeksie. Urodzona ok. 1880 r., jest o pokolenie za stara, by być matką Heleny."}},{"id":"jozefat_z1854","g":"Józefat Franciszek","s":"Zakierski","x":"M","b":"1854","bp":"Mazowsze","d":"1909","dp":"Dobrzejewice","f":"jozef_zb1","mo":"agnieszka_rom","sp":["marcjanna_fyd","antonina_lew"],"st":"verified","ln":"zakierski","lk":"probable","src":"Mazowsze 1854/2; marriages Dobrzejewice 1874/12 and Czernikowo 1898/23; death Dobrzejewice 1909/49","n":{"en":"Married twice and fathered fourteen children at Dobrzejewice between 1875 and 1910, eight of whom died young. The largest Zakierski household in the Toruń country.","pl":"Dwukrotnie żonaty, spłodził w Dobrzejewicach czternaścioro dzieci w latach 1875–1910, z których ośmioro zmarło młodo. Największe gospodarstwo Zakierskich w ziemi toruńskiej."}},{"id":"marcjanna_fyd","g":"Marcjanna","s":"Zakierska","m":"Fydrych","x":"F","d":"1897","sp":["jozefat_z1854"],"st":"verified","ln":"zakierski","src":"Dobrzejewice marriage 1874/12; death 1897/53"},{"id":"antonina_lew","g":"Antonina Walentyna","s":"Zakierska","m":"Lewandowska","x":"F","sp":["jozefat_z1854"],"st":"verified","ln":"zakierski","src":"Czernikowo marriage 1898/23 (births index her as Radomska)"},{"id":"jozef_zb1","g":"Józef","s":"Zakierski","x":"M","sp":["agnieszka_rom"],"st":"probable","ln":"zakierski","src":"Parents in Mazowsze 1854/2 and Ruże 1858/66"},{"id":"agnieszka_rom","g":"Agnieszka","s":"Zakierska","m":"Romanowska","x":"F","sp":["jozef_zb1"],"st":"probable","ln":"zakierski","src":"Mazowsze 1854/2, Ruże 1858/66"},{"id":"jozef_z1909","g":"Józef","s":"Zakierski","x":"M","b":"1909","bp":"par. Mazowsze","f":"jan_zc1jr","mo":"antonina_hard","st":"verified","ln":"zakierski","lk":"verified","src":"Mazowsze 1909/109 (Czarkowski_Jarosław)","n":{"en":"Possibly the Józef Zakierski (1909–1995) buried at Toruń Central Cemetery.","pl":"Być może ten Józef Zakierski (1909–1995), który spoczywa na Cmentarzu Centralnym w Toruniu."}},{"id":"jan_zc1jr","g":"Jan","s":"Zakierski","x":"M","f":"jan_zc1","mo":"jozefa_karol","sp":["antonina_hard"],"st":"verified","ln":"zakierski","lk":"verified","src":"Mazowsze marriage 1909/9"},{"id":"antonina_hard","g":"Antonina","s":"Zakierska","m":"Hardanowska","x":"F","sp":["jan_zc1jr"],"st":"verified","ln":"zakierski","src":"Mazowsze marriage 1909/9: daughter of Marian and Marianna Jarzębowska"},{"id":"jan_zc1","g":"Jan","s":"Zakierski","x":"M","sp":["jozefa_karol"],"st":"verified","ln":"zakierski","src":"Mazowsze marriage 1878/4"},{"id":"jozefa_karol","g":"Józefa","s":"Zakierska","m":"Karolewska","x":"F","sp":["jan_zc1"],"st":"verified","ln":"zakierski","src":"Mazowsze marriage 1878/4"},{"id":"felicjan_z1892","g":"Felicjan","s":"Zakierski","x":"M","b":"1892","bp":"par. Wola Trutowo","f":"marian_zd1","mo":"katarzyna_pelk","st":"verified","ln":"zakierski","lk":"verified","src":"Wola Trutowo 1892/35"},{"id":"jan_z1895","g":"Jan","s":"Zakierski","x":"M","b":"1895","bp":"par. Wola Trutowo","f":"marian_zd1","mo":"katarzyna_pelk","st":"verified","ln":"zakierski","lk":"verified","src":"Wola Trutowo 1895/19"},{"id":"marian_zd1","g":"Marian","s":"Zakierski","x":"M","b":"c. 1857","bq":1,"bp":"Trutowo, par. Wola Trutowo","d":"1897","dp":"Lipno","f":"mikolaj_z","mo":"urszula_gaj","sp":["franciszka_kal","katarzyna_pelk"],"st":"verified","ln":"zakierski","lk":"verified","src":"Ciechocin marriage 1881/10 ('Zakerski') to Franciszka Kalinowska; Ciechocin marriage 1887/25 to Katarzyna Pełkowska; Lipno death 1897/29","n":{"en":"Helena's great-grandfather. Married Franciszka Kalinowska at Ciechocin in 1881; she died young, and in 1887 he married Katarzyna Pełkowska. Children from both marriages, Wacław among the first. Died at Lipno in 1897, about forty.","pl":"Pradziadek Heleny. W 1881 r. ożenił się w Ciechocinie z Franciszką Kalinowską; zmarła młodo, a w 1887 r. ożenił się z Katarzyną Pełkowską. Dzieci z obu małżeństw, Wacław z pierwszego. Zmarł w Lipnie w 1897 r., około czterdziestki."}},{"id":"franciszka_kal","g":"Franciszka","s":"Zakierska","m":"Kalinowska","x":"F","b":"1860","bp":"par. Ciechocin","d":"c. 1884","f":"andrzej_kal","mo":"anna_dab","sp":["marian_zd1"],"st":"verified","ln":"zakierski","lk":"verified","src":"Ciechocin birth 1860/74; marriage 1881/10","n":{"en":"Helena's great-grandmother, dead by 1887 when Marian remarried.","pl":"Prababka Heleny, zmarła przed 1887 r., gdy Marian ożenił się ponownie."}},{"id":"andrzej_kal","g":"Andrzej","s":"Kalinowski","x":"M","sp":["anna_dab"],"st":"verified","ln":"zakierski","src":"Ciechocin marriage 1856/13 (son of Józef and Rozalia)"},{"id":"anna_dab","g":"Anna","s":"Kalinowska","m":"Dąbrowska","x":"F","sp":["andrzej_kal"],"st":"verified","ln":"zakierski","src":"Ciechocin marriage 1856/13 (daughter of Kazimierz and Marianna)"},{"id":"katarzyna_pelk","g":"Katarzyna","s":"Zakierska","m":"Pełkowska","x":"F","sp":["marian_zd1"],"st":"verified","ln":"zakierski","src":"Ciechocin marriage 1887/25"},{"id":"mikolaj_z","g":"Mikołaj","s":"Zakierski","x":"M","b":"c. 1818","bq":1,"bp":"Trutowo","f":"andrzej_z_tr","mo":"jadwiga_ks","sp":["urszula_gaj"],"st":"verified","ln":"zakierski","lk":"possible","src":"Wola Trutowo marriage 1844/4; births 1847/8, 1852/5, 1866/15; 'ojciec gospodarz'","n":{"en":"Helena's great-great-grandfather, a farmer (gospodarz) at Trutowo, married Urszula Gajewska at Wola Trutowo in 1844. Children Józef (1847, died in infancy), Antoni (1852), Marian (about 1857), Józefa (1866). Possibly a son of Andrzej Zakierski and Jadwiga Ksęczewska of Trutowo, whose son Wawrzyniec was baptised there in 1826.","pl":"Prapradziadek Heleny, gospodarz w Trutowie, w 1844 r. ożenił się w Woli Trutowo z Urszulą Gajewską. Dzieci: Józef (1847, zmarł w niemowlęctwie), Antoni (1852), Marian (ok. 1857), Józefa (1866). Możliwe, że syn Andrzeja Zakierskiego i Jadwigi Ksęczewskiej z Trutowa, których syna Wawrzyńca ochrzczono tam w 1826 r."}},{"id":"urszula_gaj","g":"Urszula","s":"Zakierska","m":"Gajewska","x":"F","sp":["mikolaj_z"],"st":"verified","ln":"zakierski","src":"Wola Trutowo births"},{"id":"jozef_z1847","g":"Józef","s":"Zakierski","x":"M","b":"1847","bp":"Trutowo","d":"1848","f":"mikolaj_z","mo":"urszula_gaj","st":"verified","ln":"zakierski","lk":"verified","src":"Wola Trutowo 1847/8; death 1848/13, aged one","n":{"en":"Died aged one; the Józef Zakierski who married in Buffalo, New York, in 1887 was therefore another man of the name.","pl":"Zmarł w wieku roku; Józef Zakierski, który w 1887 r. ożenił się w Buffalo w stanie Nowy Jork, był więc innym człowiekiem tego nazwiska."}},{"id":"andrzej_z_tr","g":"Andrzej (Jędrzej)","s":"Zakierski","x":"M","b":"c. 1778","bq":1,"bp":"Trutowo","sp":["jadwiga_ks"],"st":"possible","ln":"zakierski","src":"Wola Trutowo birth 1826/44 (Wawrzeniec, son of Jędrzej and Jadwiga Ksęczewska); summary entries 1803–1807 with a wife Wiktoria","n":{"en":"The oldest Zakierski of Trutowo in the registers, with children recorded from 1803. Possible father of Mikołaj.","pl":"Najstarszy Zakierski z Trutowa w księgach, z dziećmi notowanymi od 1803 r. Możliwy ojciec Mikołaja."}},{"id":"jadwiga_ks","g":"Jadwiga","s":"Zakierska","m":"Ksęczewska","x":"F","sp":["andrzej_z_tr"],"st":"verified","ln":"zakierski","src":"Wola Trutowo birth 1826/44"},{"id":"leonard_hinc","g":"Leonard (Leon)","s":"Hinc","x":"M","b":"c. 1847","bq":1,"bp":"Steklin, par. Czernikowo","f":"marcin_hinc2","mo":"anna_kost","sp":["katarzyna_plewa"],"st":"verified","ln":"zakierski","lk":"probable","src":"Czernikowo marriage 1870/5 (bachelor aged 23, Steklin, 7 Feb 1870); children 1873–1889","n":{"en":"Helena's great-grandfather on the Hinc side. Married Katarzyna Plewa at Czernikowo on 7 February 1870; nine children at Steklin, the youngest Julia, who married Wacław Zakierski.","pl":"Pradziadek Heleny po Hincach. 7 lutego 1870 r. ożenił się w Czernikowie z Katarzyną Plewą; dziewięcioro dzieci w Steklinie, najmłodsza Julia, która wyszła za Wacława Zakierskiego."}},{"id":"katarzyna_plewa","g":"Katarzyna","s":"Hinc","m":"Plewa","x":"F","b":"1846","bp":"Steklin","f":"mateusz_plewa","mo":"jadwiga_jan","sp":["leonard_hinc"],"st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo birth 1846/62; marriage 1870/5 (aged 23, daughter of Mateusz and Jadwiga Janicka)"},{"id":"mateusz_plewa","g":"Mateusz","s":"Plewa","x":"M","sp":["jadwiga_jan"],"st":"verified","ln":"zakierski","src":"Czernikowo births 1844/50, 1846/62, 1850/22, 1852/79"},{"id":"jadwiga_jan","g":"Jadwiga","s":"Plewa","m":"Janicka","x":"F","sp":["mateusz_plewa"],"st":"verified","ln":"zakierski","src":"Czernikowo births 1844–1852"},{"id":"adam_hinc1873","g":"Adam","s":"Hinc","x":"M","b":"1873","bp":"Steklin","f":"leonard_hinc","mo":"katarzyna_plewa","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1873/66; Ciechocin marriage 1898/17"},{"id":"zofia_hinc1876","g":"Zofia","s":"Hinc","x":"F","b":"1876","bp":"Steklin","f":"leonard_hinc","mo":"katarzyna_plewa","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1876/83; marriage 1896/4 to Szczepan Bejger"},{"id":"jozefa_hinc1880","g":"Józefa Weronika","s":"Hinc","x":"F","b":"1880","bp":"Steklinek","f":"leonard_hinc","mo":"katarzyna_plewa","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1880/21; marriage 1904/25 to Wincenty Wiśniewski"},{"id":"marianna_hinc1882","g":"Marianna","s":"Hinc","x":"F","b":"11 Dec 1882","bp":"Steklin","f":"leonard_hinc","mo":"katarzyna_plewa","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1882/141"},{"id":"marta_hinc1888","g":"Marta","s":"Hinc","x":"F","b":"1888","bp":"Steklin","f":"leonard_hinc","mo":"katarzyna_plewa","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1888/36"},{"id":"marcin_hinc2","g":"Marcin","s":"Hinc","x":"M","b":"1825","bp":"Obrowo, par. Czernikowo","d":"1902","dp":"Steklin","f":"andrzej_hinc","mo":"katarzyna_rum","sp":["anna_kost"],"st":"probable","ln":"zakierski","lk":"probable","src":"Czernikowo birth 1825/86 (son of Andrzej and Katarzyna Rumieńska); death 1902, aged 75","n":{"en":"Born at Obrowo in 1825, died at Steklin in 1902 aged 75. Helena's great-great-grandfather on the Hinc side.","pl":"Urodzony w Obrowie w 1825 r., zmarł w Steklinie w 1902 r. w wieku 75 lat. Prapradziadek Heleny po Hincach."}},{"id":"anna_kost","g":"Anna","s":"Hinc","m":"Kostecka","x":"F","b":"c. 1818","bq":1,"d":"1905","dp":"Steklin","sp":["marcin_hinc2"],"st":"verified","ln":"zakierski","src":"Czernikowo death 1905/27, Steklin, aged 87, daughter of Jan and Anna"},{"id":"michal_hinc1854","g":"Michał","s":"Hinc","x":"M","b":"1854","bp":"Steklin","f":"marcin_hinc2","mo":"anna_kost","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo marriage 1873/10 to Antonina Antkowska"},{"id":"jakub_hinc1867","g":"Jakub","s":"Hinc","x":"M","b":"1867","bp":"Steklin","f":"marcin_hinc2","mo":"anna_kost","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo 1867/58 ('Chinc')"},{"id":"andrzej_hinc","g":"Andrzej","s":"Hinc","x":"M","b":"19 Nov 1801","bp":"par. Czernikowo","f":"marcin_hinc1","mo":"maryanna_tarl","sp":["katarzyna_rum"],"st":"probable","ln":"zakierski","lk":"probable","src":"Czernikowo summary book 1801 (card 273); marriage 1825/4","n":{"en":"Baptised in November 1801 and married Katarzyna Rumieńska at Czernikowo in 1825, the year his son Marcin was born.","pl":"Ochrzczony w listopadzie 1801 r.; w 1825 r. ożenił się w Czernikowie z Katarzyną Rumieńską, w roku narodzin syna Marcina."}},{"id":"katarzyna_rum","g":"Katarzyna","s":"Hinc","m":"Rumieńska","x":"F","sp":["andrzej_hinc"],"st":"verified","ln":"zakierski","src":"Czernikowo marriage 1825/4 (daughter of Roch and Barbara)"},{"id":"marcin_hinc1","g":"Marcin","s":"Hinc","x":"M","b":"c. 1775","bq":1,"bp":"Obrowo, par. Czernikowo","sp":["maryanna_tarl"],"st":"verified","ln":"zakierski","src":"Named as father in Czernikowo marriages 1820/15 and 1831/4","n":{"en":"The oldest Hinc found: a farmer at Obrowo in the last years of the Commonwealth, named as father in his children's marriage acts of 1820 and 1831. Helena's 4× great-grandfather, and Alexander's and Patricia's 7× great-grandfather.","pl":"Najstarszy odnaleziony Hinc: gospodarz w Obrowie w ostatnich latach Rzeczypospolitej, wymieniony jako ojciec w aktach ślubów dzieci z 1820 i 1831 r. Czterokrotny pradziadek Heleny, a siedmiokrotny pradziadek Alexandra i Patricii."}},{"id":"maryanna_tarl","g":"Maryanna","s":"Hinc","m":"Tarłowska","x":"F","sp":["marcin_hinc1"],"st":"verified","ln":"zakierski","src":"Czernikowo marriage 1831/4"},{"id":"stanislaw_hinc1805","g":"Stanisław","s":"Hinc","x":"M","b":"c. 1805","bq":1,"d":"1880","f":"marcin_hinc1","mo":"maryanna_tarl","st":"verified","ln":"zakierski","lk":"verified","src":"Czernikowo marriage 1831/4 to Magdalena Skulska; 1872/31 as widower"},{"id":"johann_z1914","g":"Jan (Johann)","s":"Zakierski","x":"M","bp":"Ostrowite (Osterbitz), Golub","d":"Nov 1914","st":"verified","ln":"zakierski","src":"German WWI casualty list Preußen 79, issue 203, 17 Nov 1914, p. 2673: 'Zakierski, Johann, Osterbitz, Kr. Briesen, IR 42, tot'","ph":["VL-1914-11-17-Zakierski-Johann-Osterbitz-tot.jpg"],"n":{"en":"Killed in the Prussian army in the autumn of 1914, from Ostrowite near Golub, 15 km from Czernikowo but across the old border: a Zakierski on the Prussian side while Helena's family lived on the Russian side. Possible kin.","pl":"Poległ w armii pruskiej jesienią 1914 r.; z Ostrowitego pod Golubiem, 15 km od Czernikowa, ale po drugiej stronie dawnej granicy: Zakierski po stronie pruskiej, gdy rodzina Heleny żyła po rosyjskiej. Możliwi krewni."}},{"id":"waclaw_z1922","g":"Wacław","s":"Zakierski","x":"M","b":"15 Jan 1922","d":"20 Jul 2011","dp":"Toruń","st":"verified","ln":"zakierski","src":"Czernikowo birth 1922/13 (scan read; margin: death USC Toruń 1218/2011, marriage 31/1954 Czernikowo); ecemetery.eu, Toruń-Podgórz Nowy Cmentarz, sector 8 row 3 plot 7","n":{"en":"Julian Zakierski's youngest known brother, so Helena's uncle — not her brother. Born at Szkleniec on 15 January 1922, the son of Wacław Zakierski and Julianna Hinc. A note in the margin of his birth entry records his death in Toruń on 20 July 2011 (USC Toruń act 1218/2011), the same date as on the Podgórz headstone he shares with Irena (1930–2003).","pl":"Najmłodszy znany brat Juliana Zakierskiego, a więc wuj Heleny, nie jej brat. Urodzony w Szkleńcu 15 stycznia 1922 r. jako syn Wacława Zakierskiego i Julianny z Hinców. Adnotacja na marginesie aktu urodzenia odnotowuje jego zgon w Toruniu 20 lipca 2011 r. (USC Toruń, akt 1218/2011), tę samą datę co na nagrobku na Podgórzu, który dzieli z Ireną (1930–2003)."},"f":"waclaw_z","mo":"julianna_hinc","lk":"verified","bp":"Szkleniec, par. Czernikowo"},{"id":"irena_z1930","g":"Irena","s":"Zakierska","x":"F","b":"25 May 1930","d":"9 Feb 2003","dp":"Toruń","st":"possible","ln":"zakierski","src":"ecemetery.eu, Toruń-Podgórz Nowy Cmentarz, same grave as Wacław 1922–2011","sp":["waclaw_z1922"]},{"id":"irena_sib","g":"Irena","s":"Zakierska","x":"F","f":"julian_z1909","mo":"zofia","st":"family","ln":"zakierski","lk":"family","liv":1},{"id":"waclaw_sib","g":"Wacław","s":"Zakierski","x":"M","f":"julian_z1909","mo":"zofia","st":"family","ln":"zakierski","lk":"family","liv":1},{"id":"jozef_sib","g":"Jan","s":"Zakierski","x":"M","f":"julian_z1909","mo":"zofia","st":"family","ln":"zakierski","lk":"family","liv":1},{"id":"prelowski_nn_son","g":"?","s":"Prełowski","x":"M","b":"c. 1900–1912","bq":1,"bp":"Chełmno","bpq":1,"f":"prelowski_nn","mo":"marta_szcz","st":"possible","ln":"prelowski","lk":"possible","src":"Hypothesis from the Arolsen card of Stefan Prełowski (1910): father died 1912, mother at Rybacka 3","n":{"en":"Stefan's father, name unknown. The leading hypothesis is a son of the Chełmno household at Rybacka 3: the father, a farm labourer, died in 1912, so all the children were born 1900–1912, exactly the generation to have a son in 1939. A possible link, not a proven one; Barbara's full birth certificate (USC Toruń) names Stefan's parents and would replace this box with real names.","pl":"Ojciec Stefana, imię nieznane. Wiodąca hipoteza: syn z domu przy Rybackiej 3 w Chełmnie; ojciec rodziny, robotnik rolny, zmarł w 1912 r., więc wszystkie dzieci urodziły się w latach 1900–1912, dokładnie w pokoleniu, które mogło mieć syna w 1939 r. Powiązanie możliwe, nie dowiedzione; odpis zupełny aktu urodzenia Barbary (USC Toruń) podaje rodziców Stefana i zastąpiłby to pole prawdziwymi imionami."}},{"id":"prelowski_nn","g":"? (farm labourer)","s":"Prełowski","x":"M","d":"1912","dp":"Chełmno","sp":["marta_szcz"],"st":"verified","ln":"prelowski","src":"Arolsen Archives, Buchenwald prisoner card of Stefan Prełowski, 1.1.5.3 / 01010503 001.403.466","n":{"en":"Known only from his son's concentration-camp card: 'father: farm labourer, name unknown, died 1912'.","pl":"Znany tylko z karty obozowej syna: „ojciec: robotnik rolny, imię nieznane, zm. 1912”."}},{"id":"marta_szcz","g":"Marta","s":"Prełowska","m":"Szczęsna","x":"F","bp":"Chełmno","sp":["prelowski_nn"],"st":"verified","ln":"prelowski","src":"Arolsen Archives, Buchenwald card: 'Mutter: Marta geb. Szczęsna, wohnhaft Kulm/W., Fischerstr. 3'","ph":["arolsen-stefan-prelowski-1910-53423225-001.jpg"],"n":{"en":"A widow from 1912, still living at Rybacka 3 (Fischerstraße 3) in Chełmno in 1940 when her son was registered at Buchenwald.","pl":"Wdowa od 1912 r., w 1940 r. wciąż mieszkała przy Rybackiej 3 (Fischerstraße 3) w Chełmnie, gdy jej syna rejestrowano w Buchenwaldzie."}},{"id":"stefan_p1910","g":"Stefan","s":"Prełowski","x":"M","b":"3 Sep 1910","bp":"Chełmno (Kulm)","f":"prelowski_nn","mo":"marta_szcz","st":"verified","ln":"prelowski","lk":"verified","src":"Auschwitz Museum list of the first transport, 14 Jun 1940, no. 614; Arolsen Buchenwald file 128398; Chełmno gymnasium report 1928/29, matura list no. 13","ph":["arolsen-stefan-prelowski-1910-53423225-001.jpg","arolsen-stefan-prelowski-1910-53423225-002.jpg","arolsen-stefan-prelowski-1910-53423224-001.jpg"],"n":{"en":"Not Barbara's father, who was born in 1939, but very possibly his uncle. Passed his matura at the Chełmno boys' gymnasium in 1929, became a carpenter and moved to Lwów. Arrested in the spring of 1940, he was on the first transport of Polish prisoners to Auschwitz on 14 June 1940, prisoner number 614. Transferred to Gross-Rosen (no. 76190) and on 10 February 1945 to Buchenwald (no. 128398), two months before that camp was liberated. His fate after April 1945 is not yet known; the Arolsen Archives accept inquiries.","pl":"Nie ojciec Barbary, który urodził się w 1939 r., ale bardzo możliwe, że jego stryj. Zdał maturę w chełmińskim gimnazjum męskim w 1929 r., został cieślą i przeniósł się do Lwowa. Aresztowany wiosną 1940 r., znalazł się w pierwszym transporcie polskich więźniów do Auschwitz 14 czerwca 1940 r., numer obozowy 614. Przeniesiony do Gross-Rosen (nr 76190), a 10 lutego 1945 r. do Buchenwaldu (nr 128398), dwa miesiące przed wyzwoleniem obozu. Jego los po kwietniu 1945 r. nie jest jeszcze znany; Archiwum Arolsen przyjmuje zapytania."}},{"id":"kazimierz_p1896","g":"Kazimierz","s":"Prełowski","x":"M","b":"26 Feb 1896","bp":"Chełmno","bpq":1,"d":"26 May 1967","dp":"Chełmno","f":"prelowski_nn","mo":"marta_szcz","st":"verified","ln":"prelowski","lk":"possible","src":"Find a Grave 267706315, Chełmno parish cemetery, sector 1/19/4","n":{"en":"Buried in the Chełmno parish cemetery next to Tomasz. Born 1896, in the generation of the children of the Rybacka 3 household; the link to NN Prełowski and Marta Szczęsna is possible, not proven.","pl":"Pochowany na cmentarzu parafialnym w Chełmnie obok Tomasza. Urodzony w 1896 r., w pokoleniu dzieci z domu przy Rybackiej 3; powiązanie z NN Prełowskim i Martą Szczęsną jest możliwe, nie dowiedzione."}},{"id":"jan_p1899","g":"Jan","s":"Prełowski","x":"M","b":"5 Feb 1899","bp":"Chełmno","bpq":1,"d":"9 Jun 1963","dp":"Chełmno","f":"prelowski_nn","mo":"marta_szcz","st":"verified","ln":"prelowski","lk":"possible","src":"Find a Grave 267706313, Chełmno parish cemetery 2/104/10; Chełmno address list c. 1925 (Jan Prełowski, Rybacka 6)","ph":["KPBC_Adresy_miasta_Chelmna_ok1925_s27_Prelowski_Jan_Prelowska_Marja_Rybacka6_crop.jpg"],"n":{"en":"The Jan Prełowski of Rybacka 6 in the 1925 Chełmno address list, and the Jan Prełowski of Chełmno in a 1949 court notice. Born 1899, died 1963.","pl":"Ten Jan Prełowski z Rybackiej 6 z chełmińskiej księgi adresowej z 1925 r. i Jan Prełowski z Chełmna z ogłoszenia sądowego z 1949 r. Urodzony w 1899 r., zmarł w 1963 r."}},{"id":"stanislaw_p1900","g":"Stanisław","s":"Prełowski","x":"M","b":"31 Oct 1900","bp":"Chełmno","bpq":1,"d":"25 Dec 1955","dp":"Szczecin","f":"prelowski_nn","mo":"marta_szcz","st":"verified","ln":"prelowski","lk":"possible","src":"Find a Grave 266715673, Szczecin Central Cemetery, plot 25B-7-10 (photo)","ph":["grave-szczecin-stanislaw-prelowski-1900-1955.jpg"],"n":{"en":"A Prełowski of the Chełmno generation who ended his life in Szczecin, the city Barbara's family names as Stefan's birthplace. Born 1900, he was 38 when Stefan was born in January 1939, and his household moving to Szczecin after 1945 would explain the family memory exactly. The Szczecin municipal register lists him as the only Prełowski in the city, buried alone, so the trail stops at the stone. A possible father of Stefan, not a proven one; the Toruń marriage record would confirm or dismiss it.","pl":"Prełowski z pokolenia chełmińskiego, który zakończył życie w Szczecinie, mieście, które rodzina Barbary wskazuje jako miejsce urodzenia Stefana. Urodzony w 1900 r., miał 38 lat, gdy w styczniu 1939 r. urodził się Stefan, a przeprowadzka jego domu do Szczecina po 1945 r. dokładnie tłumaczyłaby pamięć rodzinną. Rejestr cmentarzy komunalnych Szczecina wykazuje go jako jedynego Prełowskiego w mieście, pochowanego samotnie, więc ślad urywa się na kamieniu. Możliwy ojciec Stefana, nie dowiedziony; toruński akt małżeństwa to potwierdzi albo wykluczy."}},{"id":"tomasz_p1902","g":"Tomasz","s":"Prełowski","x":"M","b":"19 Mar 1902","bp":"Chełmno","bpq":1,"d":"24 May 1977","dp":"Chełmno","f":"prelowski_nn","mo":"marta_szcz","st":"verified","ln":"prelowski","lk":"possible","src":"Find a Grave 267706316, Chełmno parish cemetery, sector 1/19/5","n":{"en":"Buried beside Kazimierz in the Chełmno parish cemetery.","pl":"Pochowany obok Kazimierza na cmentarzu parafialnym w Chełmnie."}},{"id":"josef_p_ww1","g":"Józef","s":"Prełowski","x":"M","bp":"Chełmno (Culm)","st":"verified","ln":"prelowski","src":"German WWI casualty list (Verlustliste) Preußen 350, issue 727, 11 Oct 1915, p. 9279: 'Prelowski, Josef, Culm, Infanterie-Regiment Plantier, verwundet'","ph":["VL-1915-10-11-Prelowski-Josef-Culm-verwundet.jpg"],"n":{"en":"A Józef Prełowski of Chełmno wounded in the Prussian army in 1915, the first military record of the Chełmno household. Two further 'Prelowski' entries of 1914 are in Infantry Regiment 21, the Toruń garrison regiment. Relationship to the Rybacka 3 family possible, not proven.","pl":"Józef Prełowski z Chełmna ranny w armii pruskiej w 1915 r., pierwszy ślad wojskowy domu chełmińskiego. Dwa dalsze wpisy „Prelowski” z 1914 r. dotyczą 21. pułku piechoty, pułku garnizonu toruńskiego. Pokrewieństwo z rodziną z Rybackiej 3 możliwe, nie dowiedzione."}},{"id":"anzelm_p1932","g":"Anzelm","s":"Prełowski","x":"M","b":"2 Dec 1932","d":"14 Sep 2017","dp":"Chełmno","st":"possible","ln":"prelowski","src":"Find a Grave 267706311, Chełmno parish cemetery","n":{"en":"Of Stefan's own generation in Chełmno; a possible brother or first cousin, like Adrian.","pl":"Z pokolenia Stefana w Chełmnie; możliwy brat lub brat stryjeczny, jak Adrian."}},{"id":"jozef_p1890","g":"Józef","s":"Prełowski","x":"M","b":"7 Jul 1890","d":"31 May 1973","dp":"Toruń","sp":["anna_p1892"],"st":"possible","ln":"prelowski","src":"Headstone, Toruń św. Jerzego cemetery, WNMP section, plot K/9/4","ph":["grave-torun-swjerzego-jozef-prelowski-1890-1973.jpg"],"n":{"en":"Buried in the same Toruń cemetery as Stefan, in the next section, beside Anna Prełowska (1892–1971). Possibly the Józef Prełowski, musician, listed in the Toruń address books of 1923 and 1936. Of the right generation to be Stefan's grandparents' or parents' kin; relationship not established.","pl":"Pochowany na tym samym toruńskim cmentarzu co Stefan, w sąsiedniej części, obok Anny Prełowskiej (1892–1971). Być może ten Józef Prełowski, muzyk, z toruńskich ksiąg adresowych z 1923 i 1936 r. Z pokolenia dziadków lub rodziców Stefana; pokrewieństwo nieustalone."}},{"id":"anna_p1892","g":"Anna","s":"Prełowska","x":"F","b":"30 Nov 1892","d":"23 Oct 1971","dp":"Toruń","sp":["jozef_p1890"],"st":"possible","ln":"prelowski","src":"Headstone, Toruń św. Jerzego cemetery, WNMP section, plot K/9/3","ph":["grave-torun-swjerzego-anna-prelowska-1892-1971.jpg"]},{"id":"stanislaw_p1940","g":"Stanisław","s":"Prełowski","x":"M","b":"23 Mar 1940","d":"1 Apr 2017","dp":"Toruń","st":"possible","ln":"prelowski","src":"Headstone, Toruń św. Jerzego cemetery, WNMP section, plot T/4/19 (with Jadwiga Pawlicka)","ph":["grave-torun-swjerzego-stanislaw-prelowski-1940-2017.jpg"],"n":{"en":"One year younger than Stefan and buried in the same cemetery; a possible brother. Helena will know.","pl":"O rok młodszy od Stefana, pochowany na tym samym cmentarzu; możliwy brat. Helena będzie wiedzieć."}},{"id":"aleksy_pry","g":"Aleksy","s":"Pryłowski","x":"M","b":"4 Jun 1928","d":"13 Aug 2000","dp":"Szczecin","sp":["maria_pry"],"st":"possible","ln":"prelowski","src":"Szczecin Central Cemetery, grave 104/8/24 (municipal register)","n":{"en":"A Pryłowski family in Szczecin: Aleksy (1928–2000), his wife Maria (1934–2025) and son Andrzej (1958–2013). Pryłowski is the Dobrcz and Serock spelling of the name, and Aleksy is of Stefan's generation; a possible brother or cousin and the one Szczecin household worth asking about. Maria died in December 2025, so her children can be
