{id:"kajetan_d1773",g:"Kajetan Jan",s:"Dramiński",x:"M",b:"31 Aug 1773",bp:"Gralewo",d:"1831",dp:"Gralewo",f:"franciszek_d",mo:"salomea_dob",sp:["jozefa_bor"],st:"probable",ln:"draminski",lk:"probable",src:"Gralewo 1773/3; death 1831/117, widower; children 1813–1826 at Cywiny Litwinki",n:{en:"Baptised at Gralewo in August 1773, a year after the first partition of Poland, and buried there as a widower in 1831, the year of the November Uprising's defeat. Children with Józefa Borowska between 1813 and 1826.",pl:"Ochrzczony w Gralewie w sierpniu 1773 r., rok po pierwszym rozbiorze, i pochowany tam jako wdowiec w 1831 r., w roku klęski powstania listopadowego. Dzieci z Józefą Borowską w latach 1813–1826."}},

{id:"franciszek_d",g:"Franciszek",s:"Dramiński",x:"M",b:"1741",bq:1,bp:"Gralewo",d:"1813",f:"jerzy_d",mo:"felicjanna_cyw",sp:["salomea_dob"],st:"probable",ln:"draminski",lk:"possible",src:"Gralewo marriage 1772 (sumariusz); baptism 1741/50 'Franciszek Eustachy' son of Jerzy and Felicjanna Cywińska",n:{en:"Married Salomea Dobrska at Gralewo in 1772, the year of the first partition. Probably the Franciszek Eustachy baptised in 1741 to Jerzy Dramiński and Felicjanna Cywińska; that identification is possible, not proven.",pl:"Ożenił się z Salomeą Dobrską w Gralewie w 1772 r., roku pierwszego rozbioru. Prawdopodobnie ten Franciszek Eustachy, którego ochrzczono w 1741 r. jako syna Jerzego Dramińskiego i Felicjanny Cywińskiej; ta identyfikacja jest możliwa, nie dowiedziona."}},
{id:"salomea_dob",g:"Salomea",s:"Dramińska",m:"Dobrska",x:"F",sp:["franciszek_d"],st:"probable",ln:"draminski",src:"Gralewo marriage 1772"},
{id:"jerzy_d",g:"Jerzy",s:"Dramiński",x:"M",b:"c. 1700–1710",bq:1,sp:["felicjanna_cyw"],st:"probable",ln:"draminski",src:"Gralewo baptisms 1730/43 (Salomea) and 1741/50 (Franciszek Eustachy)",n:{en:"Children baptised at Gralewo between 1730 and 1743, in the reign of August II and August III. The parish's oldest Dramiński baptism is 1684, and the neighbouring Krajkowo parish records Dramiński baptisms from 1609, in the reign of Sigismund III Vasa.",pl:"Dzieci chrzczone w Gralewie w latach 1730–1743, za Augusta II i Augusta III. Najstarszy chrzest Dramińskiego w tej parafii pochodzi z 1684 r., a sąsiednia parafia Krajkowo notuje chrzty Dramińskich od 1609 r., za Zygmunta III Wazy."}},
{id:"felicjanna_cyw",g:"Felicjanna",s:"Dramińska",m:"Cywińska",x:"F",sp:["jerzy_d"],st:"probable",ln:"draminski",src:"Gralewo baptisms 1730–1743",n:{en:"A Cywińska, of the family that gave its name to the hamlet Cywiny.",pl:"Z Cywińskich, rodu, od którego wzięła nazwę zaścianek Cywiny."}},

{id:"bronislaw_k",g:"Bronisław",s:"Kowalczyk",x:"M",b:"1889",bp:"Groszki, par. Kałuszyn",f:"franciszek_k1864",mo:"jozefa_baw",sp:["aleksandra_k"],st:"verified",ln:"kowalczyk",lk:"verified",src:"Kałuszyn birth 1889/27; marriage 1910/57 (18 Sep 1910)",
 n:{en:"Born at Groszki in 1889, the only surviving son of Franciszek and Józefa. Married Aleksandra Woźniak at Kałuszyn on 18 September 1910, and the register then follows the couple at Groszki and Groszki Stare: Marianna 1911, Janina 1913, Zofia 1915, Honorata 1918, a second Janina 1920, Czesław 1925. First cousin of Greg's grandfather Wacław: both were grandsons of Antoni Kowalczyk and Magdalena Ściechowska.",pl:"Urodzony w Groszkach w 1889 r., jedyny żyjący syn Franciszka i Józefy. 18 września 1910 r. ożenił się w Kałuszynie z Aleksandrą Woźniak, a księga śledzi potem parę w Groszkach i Groszkach Starych: Marianna 1911, Janina 1913, Zofia 1915, Honorata 1918, druga Janina 1920, Czesław 1925. Brat stryjeczny dziadka Grzegorza, Wacława: obaj byli wnukami Antoniego Kowalczyka i Magdaleny Ściechowskiej."}},
{id:"aleksandra_k",g:"Aleksandra",s:"Kowalczyk",m:"Woźniak",x:"F",f:"franciszek_woz",mo:"ludwika_kap",sp:["bronislaw_k"],st:"verified",ln:"kowalczyk",lk:"verified",src:"Kałuszyn marriage 1910/57: daughter of Franciszek Woźniak and Ludwika Kapcińska",n:{en:"Her own baptism is not in the Mazowsze index, so her family came from a parish not yet indexed.",pl:"Jej chrztu nie ma w indeksie mazowieckim, więc rodzina pochodziła z parafii jeszcze niezindeksowanej."}},

{id:"czeslaw_k1925",g:"Czesław",s:"Kowalczyk",x:"M",b:"13 May 1925",bp:"Groszki Stare",d:"29 Nov 1943",dp:"Ryczyca",f:"bronislaw_k",mo:"aleksandra_k",st:"verified",ln:"kowalczyk",lk:"verified",src:"straty.pl, IPN war-losses database; IPN files GK 174/482, GK 162/392, GK 163/45, BU 3049/206",ph:["1943-straty-pl-Czeslaw-Kowalczyk-b1925-GroszkiStare-record-p1.jpg"],
 n:{en:"Born in Groszki Stare on 13 May 1925. On 29 November 1943, aged eighteen, he was one of four Poles shot in a reprisal by German gendarmes from the Węgrów post at Ryczyca, with Aleksander Kulesza, Feliks Sopiński and Franciszek Sosiniak. Buried at the execution site and later moved to the parish cemetery at Oleksin. Henryk's second cousin: both were great-grandsons of Antoni Kowalczyk and Magdalena Ściechowska. Henryk was eleven and living in the same village.",pl:"Urodzony w Groszkach Starych 13 maja 1925 r. 29 listopada 1943 r., mając osiemnaście lat, został jednym z czterech Polaków rozstrzelanych w odwecie przez niemieckich żandarmów z posterunku w Węgrowie w Ryczycy, razem z Aleksandrem Kuleszą, Feliksem Sopińskim i Franciszkiem Sosiniakiem. Pochowany na miejscu egzekucji, później przeniesiony na cmentarz parafialny w Oleksinie. Brat cioteczny ojca Henryka w drugim stopniu: obaj byli prawnukami Antoniego Kowalczyka i Magdaleny Ściechowskiej. Henryk miał jedenaście lat i mieszkał w tej samej wsi."}},
{id:"franciszek_k1864",g:"Franciszek",s:"Kowalczyk",x:"M",b:"17 May 1864",bp:"Groszki, par. Kałuszyn",d:"17 Nov 1922",dp:"Groszki",f:"antoni_k",mo:"magdalena_sciech",sp:["jozefa_baw"],st:"verified",ln:"kowalczyk",lk:"verified",src:"Kałuszyn birth 1864/107; marriage 1888/26 (14 May 1888); death 1922/136, aged 59",
 n:{en:"Born at Groszki in 1864, the year after the January Uprising was crushed, and died there in November 1922 at 59, three years into independent Poland. Married Józefa Bawolska on 14 May 1888. The scan of his birth entry is in the Siedlce state archive's Kałuszyn book for 1864.",pl:"Urodzony w Groszkach w 1864 r., rok po upadku powstania styczniowego, zmarł tam w listopadzie 1922 r. w wieku 59 lat, trzy lata po odzyskaniu niepodległości. 14 maja 1888 r. ożenił się z Józefą Bawolską. Skan jego aktu urodzenia jest w księdze kałuszyńskiej z 1864 r. w Archiwum Państwowym w Siedlcach."}},

 n:{en:"Greg's 3× great-grandfather. Married Magdalena Ściechowska at Grębków on 2 February 1842, aged 22, a manor servant at Sinołęka; later a farmer at Groszki, where ten children were born between 1845 and 1864. Died in 1871, the year after his grandson Antoni was born.",pl:"Praprapradziadek Grzegorza. Ożenił się z Magdaleną Ściechowską w Grębkowie 2 lutego 1842 r., mając 22 lata, jako służący dworski w Sinołęce; później gospodarz w Groszkach, gdzie w latach 1845–1864 urodziło się dziesięcioro dzieci. Zmarł w 1871 r., rok po narodzinach wnuka Antoniego."}},

{id:"antoni_k2",g:"Antoni",s:"Kowalczyk",x:"M",b:"14 Mar 1870",bp:"Groszki, par. Kałuszyn",f:"jan_kb",mo:"anna_kolak",sp:["feliksa_lach"],st:"verified",ln:"kowalczyk",lk:"verified",src:"Kałuszyn birth 1870/75; marriage 1892/8 (7 Feb 1892, Groszki)",n:{en:"Greg's great-grandfather. Married Feliksa Łachniak at Kałuszyn on 7 February 1892; ten children at Groszki between 1892 and 1911, among them Wacław (1899) and Aleksander (1911), the latter listed in the war-losses database.",pl:"Pradziadek Grzegorza. Ożenił się z Feliksą Łachniak w Kałuszynie 7 lutego 1892 r.; dziesięcioro dzieci w Groszkach w latach 1892–1911, wśród nich Wacław (1899) i Aleksander (1911), ten ostatni w bazie strat wojennych."}},

{id:"ausch",kind:"wartime",ln:"prelowski",file:"scans/1940-Auschwitz-ofiary-auschwitz-org-Stefan-Prelowski-b1910-prisoner-614.jpg",year:1940,people:["stefan_p1910"],rel:"possible-kin",t:{en:"Auschwitz Museum victims' database: Prełowski Stefan, no. 614",pl:"Baza ofiar Muzeum Auschwitz: Prełowski Stefan, nr 614"},d:{en:"Arrived 14 June 1940 on the first transport of Polish prisoners, from Tarnów prison, 728 men numbered 31 to 758.",pl:"Przybył 14 czerwca 1940 r. pierwszym transportem polskich więźniów, z więzienia w Tarnowie, 728 mężczyzn o numerach od 31 do 758."},src:"ofiary.auschwitz.org/victims/184674"},
{id:"stutthof",kind:"wartime",ln:"prelowski",file:"scans/arolsen-lucjan-prelowski-1922-97246414-001.jpg",year:1943,people:["lucjan_p1922"],rel:"possible-kin",t:{en:"Stutthof file of Lucjan Prelowski, born 1922 in Bydgoszcz",pl:"Teczka Stutthof Lucjana Prelowskiego, ur. 1922 w Bydgoszczy"},d:{en:"Roofer, single, sent by the Bromberg Gestapo to Stutthof, prisoner 24945, 27 Aug to 29 Oct 1943.",pl:"Dekarz, kawaler, skierowany przez bydgoskie Gestapo do Stutthofu, nr 24945, 27 VIII–29 X 1943."},src:"Arolsen Archives 1.1.41.2 / 01014102 103.102"},
{id:"straty_cz",kind:"wartime",ln:"kowalczyk",file:"scans/1943-straty-pl-Czeslaw-Kowalczyk-b1925-GroszkiStare-record-p1.jpg",year:1943,people:["czeslaw_k1925","bronislaw_k","aleksandra_k"],rel:"verified-line",t:{en:"IPN war-losses card of Czesław Kowalczyk, born 13 May 1925 in Groszki Stare",pl:"Karta IPN strat osobowych Czesława Kowalczyka, ur. 13 V 1925 w Groszkach Starych"},d:{en:"Father Bronisław, mother Aleksandra. Shot at Ryczyca on 29 Nov 1943 by gendarmes of the Węgrów post with three other Poles; reburied at Oleksin. Eight IPN source files are cited on the card.",pl:"Ojciec Bronisław, matka Aleksandra. Rozstrzelany w Ryczycy 29 XI 1943 r. przez żandarmów z posterunku w Węgrowie wraz z trzema innymi Polakami; pochowany ponownie w Oleksinie. Karta cytuje osiem teczek źródłowych IPN."},src:"straty.pl (IPN)"},
{id:"gral1866",kind:"record",ln:"draminski",file:"scans/1866-Gralewo-B3-Julian-Seweryn-Draminski.jpg",year:1866,people:["julian_d1866","antoni_d1840","antonina_nad"],rel:"possible-kin",t:{en:"Gralewo baptisms 1866, act 3: Julian Seweryn Dramiński",pl:"Chrzty Gralewo 1866, akt 3: Julian Seweryn Dramiński"},d:{en:"'Antoni Dramiński, szlachcic of Cywiny Litwinki, aged 25' presents a son born 8 January 1866 of Antonina née Nadratowska, 24. Written in Polish, two years before the Russian authorities imposed Cyrillic.",pl:"„Antoni Dramiński, szlachcic z Cywin Litwinek, lat 25” przedstawia syna urodzonego 8 stycznia 1866 r. z Antoniny z Nadratowskich, lat 24. Po polsku, dwa lata przed narzuceniem przez władze rosyjskie cyrylicy."},src:"metryki.genealodzy.pl, Gralewo 1866, plik 003-006"},
{id:"un1919",kind:"record",ln:"draminski",file:"scans/1919-Unieck-D84-Julian-Draminski.jpg",year:1919,people:["julian_d1866","janina_dab"],rel:"possible-kin",t:{en:"Unieck deaths 1919, act 84: Julian Dramiński, aged 53",pl:"Zgony Unieck 1919, akt 84: Julian Dramiński, lat 53"},d:{en:"Died at Chądzyny Krusze on 5 November 1919 at 8 pm, born at Cywiny, son of Antoni and Antonina née Nadratowska, 'living on his own means', leaving the widow Janina née Dabińska.",pl:"Zmarł w Chądzynach Kruszach 5 listopada 1919 r. o 8 wieczorem, urodzony w Cywinach, syn Antoniego i Antoniny z Nadratowskich, „utrzymujący się z własnych funduszów”, pozostawił wdowę Janinę z Dabińskich."},src:"metryki.genealodzy.pl, Unieck 1919, plik 083-086"},
{id:"lut1863",kind:"record",ln:"draminski",file:"scans/1863-Lutocin-S5-Antoni-Draminski-x-Antonina-Nadratowska.jpg",year:1863,people:["antoni_d1840","antonina_nad","piotr_d1813","julianna_dob"],rel:"possible-kin",t:{en:"Lutocin marriages 1863, act 5: Antoni Dramiński and Antonina Nadratowska",pl:"Śluby Lutocin 1863, akt 5: Antoni Dramiński i Antonina Nadratowska"},d:{en:"4 February 1863, two weeks after the January Uprising began. Groom 'a bachelor of Cywiny in Gralewo parish, born at Kraszewo Gaczułty, son of Piotr and the late Julianna née Dobrska, part-owners', aged 22; bride 19.",pl:"4 lutego 1863 r., dwa tygodnie po wybuchu powstania styczniowego. Pan młody „młodzian zamieszkały w Cywinach parafii gralewskiej, urodzony w Kraszewie Gaczułtach z Piotra i nieżyjącej Julianny z Dóbrskich, właścicieli cząstkowych”, lat 22; panna lat 19."},src:"Skanoteka / AP Mława, Lutocin 1863"},
{id:"glin1842",kind:"record",ln:"draminski",file:"scans/1842-Glinojeck-B21.jpg",year:1842,people:["wladyslaw_d1842","piotr_d1813","julianna_dob"],rel:"possible-kin",t:{en:"Glinojeck baptisms 1842, act 21: Władysław, son of Piotr Dramiński, steward",pl:"Chrzty Glinojeck 1842, akt 21: Władysław, syn Piotra Dramińskiego, ekonoma"},d:{en:"'Appeared Piotr Dramiński, ekonom … of Julianna née Dobrska … Władysław.' Born 1 July 1842; the boy died the next year at Unieck.",pl:"„Stawił się Piotr Dramiński, ekonom … z Julianny z Dobrskich … Władysław”. Ur. 1 lipca 1842 r.; chłopiec zmarł rok później w Uniecku."},src:"Skanoteka / AP Mława, Glinojeck 1842"},
{id:"rad1879",kind:"record",ln:"draminski",file:"scans/1879-Radzanow-S31-Antoni-Draminski-x-Weronika-Kulesza.jpg",year:1879,people:["antoni_d1840","weronika_kul"],rel:"possible-kin",t:{en:"Radzanów marriages 1879, act 31: Antoni Dramiński, widower, and Weronika Kulesza",pl:"Śluby Radzanów 1879, akt 31: Antoni Dramiński, wdowiec, i Weronika Kulesza"},d:{en:"Antoni's second marriage, recorded in Russian as the law then required.",pl:"Drugi ślub Antoniego, zapisany po rosyjsku, jak nakazywało ówczesne prawo."},src:"Skanoteka / AP Mława, Radzanów 1879"},
{id:"ciech1896",kind:"record",ln:"draminski",file:"scans/1896-Ciechanow-B538-Jan-Draminski.jpg",year:1896,people:["wladyslaw_dion","jozefa_roman"],rel:"possible-kin",t:{en:"Ciechanów baptisms 1896, act 538: Jan, first child of Władysław Dionizy Dramiński and Józefa Roman",pl:"Chrzty Ciechanów 1896, akt 538: Jan, pierwsze dziecko Władysława Dionizego Dramińskiego i Józefy Roman"},d:{en:"Kownaty Borowe, 12 km from Dramino, the village the surname comes from.",pl:"Kownaty Borowe, 12 km od Dramina, wsi, od której pochodzi nazwisko."},src:"Skanoteka, Ciechanów 1896"},
{id:"bab1922",kind:"record",ln:"draminski",file:"scans/1922-Baboszewo-B32-Janina-Draminska.jpg",year:1922,people:["janina_d1922","stanislaw_dm1","czeslawa_zjad"],rel:"possible-kin",t:{en:"Baboszewo baptisms 1922, act 32: Janina Dramińska of Mystkowo",pl:"Chrzty Baboszewo 1922, akt 32: Janina Dramińska z Mystkowa"},d:{en:"Baboszewo is the parish of Dramino itself. The first register of free Poland in this family.",pl:"Baboszewo to parafia samego Dramina. Pierwszy zapis tej rodziny w wolnej Polsce."},src:"Skanoteka, Baboszewo 1922"},
{id:"ziel1920",kind:"record",ln:"draminski",file:"scans/1920-Zielona-B108-Stanislaw-Czeslaw-Draminski-Detroit.jpg",year:1920,people:[],rel:"possible-kin",t:{en:"Zielona baptisms 1920: a Dramiński child of the family back from Detroit",pl:"Chrzty Zielona 1920: dziecko Dramińskich z rodziny wróconej z Detroit"},d:{en:"The Osówka (near Mława) Dramińskis, who spent 1910–1920 in Detroit and came home. A candidate family for Teresa.",pl:"Dramińscy z Osówki pod Mławą, którzy lata 1910–1920 spędzili w Detroit i wrócili. Rodzina-kandydat dla Teresy."},src:"Skanoteka, Zielona 1920"},
{id:"grave_wi",kind:"grave",ln:"zakierski",file:"scans/2011-Torun-Podgorz-NowyCmentarz-headstone-Waclaw-1922-2011-Irena-1930-2003-Zakierscy.jpg",year:2011,people:["waclaw_z1922","irena_z1930"],rel:"possible-kin",t:{en:"Headstone, Toruń-Podgórz: Wacław Zakierski 1922–2011 and Irena Zakierska 1930–2003",pl:"Nagrobek, Toruń-Podgórz: Wacław Zakierski 1922–2011 i Irena Zakierska 1930–2003"},d:{en:"Nowy Cmentarz of SS Peter and Paul parish, sector 8, row 3, plot 7, with porcelain portraits. Helena's brother was also named Wacław, but he was born after 1930, so this Wacław (1922) is probably a cousin. Helena will know the faces.",pl:"Nowy Cmentarz parafii śś. Piotra i Pawła, sektor 8, rząd 3, grób 7, z porcelanowymi portretami. Brat Heleny też miał na imię Wacław, ale urodził się po 1930 r., więc ten Wacław (1922) to zapewne kuzyn. Helena rozpozna twarze."},src:"ecemetery.eu, grave 3776016"},
{id:"grave_wi2",kind:"grave",ln:"zakierski",file:"scans/2011-Torun-Podgorz-NowyCmentarz-grave3776016-wide-1.jpg",year:2011,people:["waclaw_z1922","irena_z1930"],rel:"possible-kin",t:{en:"The same grave, whole view",pl:"Ten sam grób, widok ogólny"},d:{en:"Also buried here: Jan Zakierski 1958–1986 and Małgorzata Zakierska 1962–2023.",pl:"Spoczywają tu także Jan Zakierski 1958–1986 i Małgorzata Zakierska 1962–2023."},src:"ecemetery.eu, grave 3776016"},
{id:"grave_jf",kind:"grave",ln:"zakierski",file:"scans/2007-Torun-Podgorz-StaryCmentarz-headstone-Jozef-1927-2007-Feliksa-1928-2004-Zakierscy-1.jpg",year:2007,people:[],rel:"possible-kin",t:{en:"Headstone, Toruń-Podgórz Stary Cmentarz: Józef Zakierski 1927–2007 and Feliksa Zakierska 1928–2004",pl:"Nagrobek, Toruń-Podgórz Stary Cmentarz: Józef Zakierski 1927–2007 i Feliksa Zakierska 1928–2004"},d:{en:"Sector B, row 10A, plot 2. Possibly the Józef born 1909 at Mazowsze parish is a different man; this Józef was born 18 Nov 1927.",pl:"Sektor B, rząd 10A, grób 2. Ten Józef urodził się 18 XI 1927 r."},src:"ecemetery.eu, grave 4031483"},
{id:"gr_wt",kind:"grave",ln:"kowalczyk",file:"scans/grave-olsztyn-gutkowo-witold-teresa-kowalczyk-1.jpg",year:2017,people:["henryk","teresa"],rel:"verified-line",t:{en:"Headstone of Greg's parents, Olsztyn-Gutkowo parish cemetery, plot I/IV/07",pl:"Nagrobek rodziców Grzegorza, cmentarz parafialny Olsztyn-Gutkowo, kwatera I/IV/07"},d:{en:"'Witold *31.10.1932 +27.9.1989, Teresa *26.09.1935 +18.02.2017'. The dates match both death certificates exactly.",pl:"„Witold *31.10.1932 +27.9.1989, Teresa *26.09.1935 +18.02.2017”. Daty dokładnie zgadzają się z oboma aktami zgonu."},src:"grobonet Olsztyn-Gutkowo"},

{id:"gr_az",kind:"grave",ln:"draminski",file:"scans/grave-mragowo-antoni-zofia-draminscy-1.jpg",year:1967,people:["antoni_dram","zofia_karcz"],rel:"verified-line",t:{en:"Headstone of Antoni and Zofia Dramiński, Mrągowo municipal cemetery, plot G/2/22",pl:"Nagrobek Antoniego i Zofii Dramińskich, cmentarz komunalny w Mrągowie, kwatera G/2/22"},d:{en:"'Dramińscy, Antoni 22 XI 1897 – 4 III 1967, Zofia 28 X 1902 – 10 XI 1963', with the couple's photograph. The ages fit the 1922 Zawidz marriage act exactly (24 and 21); probable identification, to be confirmed by the Mrągowo death acts.",pl:"„Dramińscy, Antoni 22 XI 1897 – 4 III 1967, Zofia 28 X 1902 – 10 XI 1963”, ze zdjęciem małżonków. Wiek dokładnie pasuje do aktu ślubu z Zawidza z 1922 r. (24 i 21 lat); identyfikacja prawdopodobna, do potwierdzenia aktami zgonu z USC Mrągowo."},src:"grobonet Mrągowo"},
{id:"gr_az2",kind:"grave",ln:"draminski",file:"scans/grave-mragowo-antoni-zofia-draminscy-2.jpg",year:1967,people:["antoni_dram","zofia_karcz"],rel:"verified-line",t:{en:"The Dramiński grave in Mrągowo, close-up",pl:"Grób Dramińskich w Mrągowie, zbliżenie"},d:{en:"",pl:""},src:"grobonet Mrągowo"},
{id:"cert_h",kind:"record",ln:"kowalczyk",file:"scans/cert-1989-usc-olsztyn-witold-henryk-kowalczyk.jpg",year:1989,people:["henryk","waclaw_k","marianna_bucz","teresa"],rel:"verified-line",t:{en:"Death certificate of Witold Henryk Kowalczyk, USC Olsztyn, 1989",pl:"Odpis skrócony aktu zgonu Witolda Henryka Kowalczyka, USC Olsztyn, 1989"},d:{en:"Born 31 Oct 1932 at Groszki Stare; died Olsztyn 27 Sep 1989 at 22:50; married to Teresa née Dramińska; parents Wacław Kowalczyk and Marianna Buczyńska. Act 2862011/00/AZ/1989/225437, copy issued 22 Feb 2017. Supplied by Greg.",pl:"Ur. 31 X 1932 w Groszkach Starych; zm. Olsztyn 27 IX 1989 o 22:50; żonaty z Teresą z d. Dramińską; rodzice Wacław Kowalczyk i Marianna Buczyńska. Akt 2862011/00/AZ/1989/225437, odpis z 22 II 2017. Dostarczył Grzegorz."},src:"USC Olsztyn"},
{id:"cert_t",kind:"record",ln:"draminski",file:"scans/cert-2017-usc-barczewo-teresa-kowalczyk-draminska.jpg",year:2017,people:["teresa","antoni_dram","zofia_karcz"],rel:"verified-line",t:{en:"Death certificate of Teresa Kowalczyk née Dramińska, USC Barczewo, 2017",pl:"Odpis skrócony aktu zgonu Teresy Kowalczyk z d. Dramińskiej, USC Barczewo, 2017"},d:{en:"Born 26 Sep 1935 at Kosemin; died Barczewo 18 Feb 2017 at 08:25; widow; parents Antoni Dramiński and Zofia Karczewska. Act 2814013/00/AZ/2017/337436. Supplied by Greg.",pl:"Ur. 26 IX 1935 w Koseminie; zm. Barczewo 18 II 2017 o 08:25; wdowa; rodzice Antoni Dramiński i Zofia Karczewska. Akt 2814013/00/AZ/2017/337436. Dostarczył Grzegorz."},src:"USC Barczewo"},

// ================= FAN =================
function drawFan(svg,g,W,H){
  const deepest=(id,d)=>{ const p=P[id]; let m=d; if(p.f) m=Math.max(m,deepest(p.f,d+1)); if(p.mo) m=Math.max(m,deepest(p.mo,d+1)); return m; }; const GENS=Math.min(7,Math.max(3,deepest(main,0)));
  function anc(id,depth){ const p=id?P[id]:null; const n={id,depth,children:[]}; if(depth<GENS){ n.children=[anc(p&&p.f?p.f:null,depth+1),anc(p&&p.mo?p.mo:null,depth+1)]; n.children.forEach(c=>c.value=1); } else n.value=1; return n; }
  const root=d3.hierarchy(anc(main,0)).sum(d=>d.children&&d.children.length?0:1);
  const R=Math.min(W/2-20,H-60); const ring=[70,80,78,74,70,66,62,58];
  const rs=[0]; for(let i=0;i<=GENS;i++) rs.push(rs[i]+ring[i]*(R/ (ring.slice(0,GENS+1).reduce((a,b)=>a+b,0))));
  d3.partition().size([Math.PI,1])(root);
  const cx=W/2, cy=H-30; g.attr("transform",`translate(${cx},${cy})`); zoomBeh.on("zoom",e=>g.attr("transform",`translate(${cx+e.transform.x},${cy+e.transform.y}) scale(${e.transform.k})`));
  const arc=d3.arc().startAngle(d=>d.x0-Math.PI/2).endAngle(d=>d.x1-Math.PI/2).innerRadius(d=>rs[d.depth]).outerRadius(d=>rs[d.depth+1]-2);
  const nodes=root.descendants().filter(d=>d.depth>0);
  const w=g.selectAll(".wedge").data(nodes).join("path").attr("class",d=>"wedge"+(d.data.id?"":" gap")).attr("d",arc).attr("fill",d=>d.data.id?LINEC[lineOf(P[d.data.id])]:"var(--bg)").attr("opacity",d=>d.data.id?(P[d.data.id].st==="verified"||P[d.data.id].st==="family"?1:P[d.data.id].st==="probable"?.8:.6):1)
    .on("click",(e,d)=>{ if(d.data.id) setMain(d.data.id,{mode:"fan"}); });
  w.append("title").text(d=>d.data.id?fullname(P[d.data.id])+" · "+t("st_"+P[d.data.id].st):t("gap_note"));
  // labels
  g.selectAll(".wl").data(nodes.filter(d=>d.data.id)).join("text").attr("class",d=>"wl"+(d.depth>3?" sm":"")).attr("transform",d=>{ const th=((d.x0+d.x1)/2)*180/Math.PI-180; const r=(rs[d.depth]+rs[d.depth+1])/2; return `rotate(${th}) translate(${r},0) rotate(${th<-90?180:0})`; }).attr("text-anchor","middle").attr("dy",d=>d.depth<=2?"-.2em":".35em")
    .text(d=>{ const p=P[d.data.id]; const ringW=rs[d.depth+1]-rs[d.depth]; const arcLen=(d.x1-d.x0)*(rs[d.depth]+rs[d.depth+1])/2; const s=d.depth<=2?p.g.split(" ")[0]+" "+(p.m||p.s):(p.m||p.s); const maxC=Math.floor(ringW/7.5); if(arcLen<18) return ""; return s.length>maxC?s.slice(0,Math.max(3,maxC-1))+"…":s; });
  g.selectAll(".wld").data(nodes.filter(d=>d.data.id&&d.depth<=2)).join("text").attr("class","wld").attr("transform",d=>{ const th=((d.x0+d.x1)/2)*180/Math.PI-180; const r=(rs[d.depth]+rs[d.depth+1])/2; return `rotate(${th}) translate(${r},0) rotate(${th<-90?180:0})`; }).attr("text-anchor","middle").attr("dy","1.1em").text(d=>{ const p=P[d.data.id]; const b=yr(p.b),dd=yr(p.d); return b?b+(dd?"–"+dd:""):""; });
  // centre
  showBanner(); const mp=P[main]; g.append("circle").attr("r",rs[1]-4).attr("fill",LINEC[lineOf(mp)]).attr("stroke","var(--brick)").attr("stroke-width",3).style("cursor","pointer").on("click",()=>drawDrawer());
  g.append("text").attr("class","ini").attr("y",-6).attr("text-anchor","middle").attr("font-size",28).attr("fill","#fff").attr("font-family","var(--display)").attr("font-weight",700).text(initials(mp));
  g.append("text").attr("y",16).attr("text-anchor","middle").attr("fill","#fff").attr("font-size",13).attr("font-family","var(--body)").text(mp.g.split(" ")[0]);
  // children chips below centre
  const ch=(kids[main]||[]); if(ch.length){ const cg=g.append("g").attr("transform",`translate(0,${rs[1]+14})`); ch.slice(0,6).forEach((c,i)=>{ const x=(i-(Math.min(ch.length,6)-1)/2)*118; const b=cg.append("g").attr("transform",`translate(${x},0)`).style("cursor","pointer").on("click",()=>setMain(c,{mode:"fan"})); b.append("rect").attr("x",-55).attr("y",-12).attr("width",110).attr("height",24).attr("rx",12).attr("fill","var(--surface2)").attr("stroke","var(--rule)"); b.append("text").attr("text-anchor","middle").attr("y",5).attr("font-size",13).attr("fill","var(--fg)").attr("font-family","var(--body)").text("▼ "+clip(P[c].g.split(" ")[0],12)); }); }
  fit=()=>{ const k=Math.min(1,(W-20)/(2*R+40)); svg.transition().duration(400).call(zoomBeh.transform,d3.zoomIdentity.translate(0,(H-30)*(1-k)).scale(k)); };
  document.getElementById("crumb").textContent=fullname(mp)+" · "+GENS+" "+t("gens_n");
  document.getElementById("legend").innerHTML=Object.entries(LINEC).map(([k,c])=>`<span><i style="background:${c}"></i>${t("ln_"+k)}</span>`).join("")+`<span>${L==="pl"?"jaśniejsze = mniej pewne":"paler = less certain"}</span>`;
}

  <div class="tags"><span class="tag" style="background:${STC[p.st]}">${t("st_"+p.st)}</span>${p.lk&&(p.f||p.mo)?`<span class="tag o">${t("lk")}: ${t("st_"+p.lk).toLowerCase()}</span>`:""}<span class="tag o" style="border-color:${LINEC[lineOf(p)]}">${t("ln_"+lineOf(p))}</span></div>
  <dl>${p.b?`<dt>${t("born")}</dt><dd>${esc(p.b)}${p.bq?' <span style="color:var(--muted)">(?)</span>':""}</dd>`:""}${p.bp?`<dt>${t("place")}</dt><dd>${esc(p.bp)}${p.bpq?' <span style="color:var(--muted)">(?)</span>':""}</dd>`:""}${p.d?`<dt>${t("died")}</dt><dd>${esc(p.d)}${p.dp?", "+esc(p.dp):""}</dd>`:""}
  ${(p.sp||[]).length?`<dt>${t("spouse")}</dt><dd class="chips">${p.sp.map(chip).join("")}</dd>`:""}
  ${(p.f||p.mo)?`<dt>${t("parents")}</dt><dd class="chips">${[p.f,p.mo].filter(Boolean).map(chip).join("")}</dd>`:""}
  ${sibs.length?`<dt>${t("siblings")}</dt><dd class="chips">${sibs.map(chip).join("")}</dd>`:""}
  ${ch.length?`<dt>${t("children")}</dt><dd class="chips">${ch.map(chip).join("")}</dd>`:""}</dl>
  ${p.n?`<p>${tx(p.n)}</p>`:""}
  ${(docs.length||ph.length)?`<div class="thumbs">${docs.map(x=>`<button data-doc="${x.id}" title="${esc(tx(x.t))}"><img loading="lazy" src="${x.file}" alt=""></button>`).join("")}${ph.filter(f=>!docs.some(x=>x.file===f)).map(f=>`<button data-img="${f}"><img loading="lazy" src="${f}" alt=""></button>`).join("")}</div>`:""}
  <div class="acts"><button class="pri" data-mode="${mode==="tree"?"fan":"tree"}">${mode==="tree"?t("infan"):t("focus")}</button><button data-home="1">${L==="pl"?"Licz pokrewieństwo od tej osoby":"Count relationships from here"}</button></div>

  document.getElementById("v-tree").classList.add("open"); d.scrollTop=0;
  d.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setMain(b.dataset.go));

  d.querySelector("[data-mode]").onclick=e=>{ mode=e.target.dataset.mode; render(); };

const STORIES=[
 {id:"s1",ln:"zakierski",st:"verified",img:"img/czernikowo_kosciol_sw_bartlomieja_2008_a.jpg",p:"julian_z1909",t:{pl:"Julian ze Steklina: ojciec Heleny odnaleziony w księdze",en:"Julian of Steklin: Helena's father found in the register"},d:{pl:"Akt 214 księgi chrztów Czernikowa z 1909 r.: Julian Zakierski, urodzony 21 listopada w Steklinie, 3 km od Osówki, syn Wacława Zakierskiego i Julianny z Hinców. Grzegorz pamięta go jako ojca Heleny i męża Zofii; indeks toruński dodaje, że zmarł w Toruniu 2 października 1994 r. (akt 1514). Przez Juliana linia Heleny biegnie potwierdzonymi aktami do dziadków Wacława i Julii z Hinców (ślub Czernikowo 1905), do Mariana Zakierskiego i Franciszki Kalinowskiej (ślub Ciechocin 1881), do Mikołaja i Urszuli Gajewskiej (ślub Wola Trutowo 1844), a po Hincach przez Leonarda, Marcina i Andrzeja do Marcina Hinca z Obrowa, ok. 1775 r. Zostało jedno pytanie: nazwisko panieńskie Zofii.",en:"Act 214 of the Czernikowo baptism register for 1909: Julian Zakierski, born 21 November at Steklin, 3 km from Osówka, son of Wacław Zakierski and Julianna née Hinc. Greg remembers him as Helena's father and Zofia's husband; the Toruń index adds that he died in Toruń on 2 October 1994 (act 1514). Through Julian, Helena's line runs on verified records to the grandparents Wacław and Julia Hinc (married Czernikowo 1905), to Marian Zakierski and Franciszka Kalinowska (married Ciechocin 1881), to Mikołaj and Urszula Gajewska (married Wola Trutowo 1844), and on the Hinc side through Leonard, Marcin and Andrzej to Marcin Hinc of Obrowo, about 1775. One question remains: Zofia's maiden name."}},
 {id:"s0",ln:"zakierski",st:"verified",img:"scans/grave-torun-swjerzego-julian-zofia-zakierscy-inscription.jpg",p:"zofia",t:{pl:"Julian i Zofia, kwatera K/10/20",en:"Julian and Zofia, plot K/10/20"},d:{pl:"Na cmentarzu św. Jerzego przy ul. Gałczyńskiego w Toruniu, w części parafii katedralnej, pod jednym szarym granitem spoczywają rodzice Heleny: Julian Zakierski, 17 XI 1909 – 2 X 1994, i Zofia Zakierska, 14 XI 1909 – 10 II 2002. Urodzili się w odstępie trzech dni. W sąsiedniej kwaterze K/10/21 stoi krzyż Stefana Prełowskiego, 4 I 1939 – 15 VII 2025. Parafia prosi o przedłużenie opłaty za grób; nazwisko panieńskie Zofii nie jest na kamieniu i czeka w USC Toruń.",en:"In St George's cemetery on Gałczyńskiego street in Toruń, cathedral-parish section, Helena's parents rest under one grey granite stone: Julian Zakierski, 17 Nov 1909 – 2 Oct 1994, and Zofia Zakierska, 14 Nov 1909 – 10 Feb 2002. They were born three days apart. In the next plot, K/10/21, stands the cross of Stefan Prełowski, 4 Jan 1939 – 15 Jul 2025. The parish asks for the grave lease to be renewed; Zofia's maiden name is not on the stone and waits at the Toruń registry."}},
 {id:"s2",ln:"zakierski",st:"verified",img:"scans/2011-Torun-Podgorz-NowyCmentarz-headstone-Waclaw-1922-2011-Irena-1930-2003-Zakierscy.jpg",p:"waclaw_z1922",t:{pl:"Wacław i Irena na Podgórzu",en:"Wacław and Irena at Podgórz"},d:{pl:"Na cmentarzu parafii śś. Piotra i Pawła w Toruniu stoi nagrobek z porcelanowymi portretami: Wacław Zakierski 1922–2011 i Irena Zakierska 1930–2003. Brat Heleny też miał na imię Wacław, ale jako syn Juliana (ur. 1909) urodził się po 1930 r.; ten Wacław z 1922 r. to raczej kuzyn. Helena rozpozna twarze od razu. Grób jest opłacony do 2033 r.",en:"In the cemetery of SS Peter and Paul in Toruń stands a headstone with porcelain portraits: Wacław Zakierski 1922–2011 and Irena Zakierska 1930–2003. Helena's brother was also a Wacław, but as a son of Julian (born 1909) he was born after 1930; this Wacław of 1922 is more likely a cousin. Helena will recognise the faces at once. The grave is paid up to 2033."}},
 {id:"s3",ln:"zakierski",st:"verified",img:"img/czernikowo_stacja_kolejowa.jpg",p:"gabryel_z",t:{pl:"Gabryel, urodzony za Sasów",en:"Gabryel, born under the Saxon kings"},d:{pl:"Najstarszy Zakierski z okolic Czernikowa: Gabryel, urodzony ok. 1739 r., ożenił się z Ewą Pawłowską w Działyniu w 1774 r., dwa lata po pierwszym rozbiorze, i zmarł jako 80-letni wdowiec w Witowężu w 1819 r. Mateusz Zakierski (1783–1813) z Obrowa zmarł dwa dni po narodzinach córki Apolonii. Nazwisko nosi dziś ok. 300 osób, dwie trzecie w tym jednym powiecie.",en:"The oldest Zakierski in the Czernikowo country: Gabryel, born about 1739, married Ewa Pawłowska at Działyń in 1774, two years after the first partition, and died a widower of 80 at Witowąż in 1819. Mateusz Zakierski (1783–1813) of Obrowo died two days after his daughter Apolonia was born. About 300 people carry the name today, two thirds of them in this one district."}},
 {id:"s4",ln:"prelowski",st:"verified",img:"scans/arolsen-stefan-prelowski-1910-53423225-001.jpg",p:"stefan_p1910",t:{pl:"Numer 614: Stefan Prełowski w pierwszym transporcie do Auschwitz",en:"Number 614: Stefan Prełowski on the first transport to Auschwitz"},d:{pl:"14 czerwca 1940 r. z więzienia w Tarnowie wyruszył pierwszy transport polskich więźniów do Auschwitz. Numer 614 dostał Stefan Prełowski, cieśla, ur. 3 września 1910 r. w Chełmnie, przed wojną mieszkający we Lwowie. Przeżył Auschwitz, Gross-Rosen i Buchenwald, dokąd trafił 10 lutego 1945 r. Jego karta obozowa z Archiwum Arolsen podaje matkę: Marta z d. Szczęsna, Chełmno, Rybacka 3. Pod tym adresem rodzina Prełowskich mieszka do dziś. To nie ojciec Barbary (ur. 1939), ale przy nazwisku, które nosi 46 osób w Polsce, bardzo możliwe, że stryj, po którym młodszy Stefan dostał imię.",en:"On 14 June 1940 the first transport of Polish prisoners left Tarnów prison for Auschwitz. Number 614 went to Stefan Prełowski, a carpenter born 3 September 1910 in Chełmno, living in Lwów before the war. He survived Auschwitz, Gross-Rosen and Buchenwald, where he arrived on 10 February 1945. His camp card in the Arolsen Archives names his mother: Marta née Szczęsna, Chełmno, Rybacka 3. A Prełowski family lives at that address to this day. Not Barbara's father (born 1939), but with a surname carried by 46 people in all of Poland, very possibly the uncle the younger Stefan was named after."}},
 {id:"s5",ln:"prelowski",st:"verified",img:"img/torun_pocztowka_brama_mostowa_ok1900.jpg",p:"stanislaus_p",t:{pl:"Prełowscy znad Wisły pod Bydgoszczą, 1754–1945",en:"The Prełowskis of the Vistula bend, 1754–1945"},d:{pl:"W księgach diecezji pelplińskiej, pisanych po łacinie i niemiecku, Prełowscy (Prelowski, Pryłowski) pojawiają się w Gruczniu w 1754 r. i Niewieścinie w 1761 r. Stanisław (ok. 1812–1851) ożenił się w Niewieścinie w 1831 r.; jego syn Wojciech (1843–1917) miał dziewięcioro dzieci w Serocku, Wudzynie i Dobrczu; wnuk Leon (1877–1945) zmarł w Osielsku w roku końca wojny. Cztery pokolenia potwierdzone, z numerami ksiąg i zdjęć w archiwum w Pelplinie. Czy Stefan (1939) stąd pochodzi, nie wiadomo; rodzina mówi o okolicach Szczecina.",en:"In the Pelplin diocese registers, kept in Latin and German, the Prełowskis (Prelowski, Pryłowski) appear at Gruczno in 1754 and Niewieścin in 1761. Stanisław (c. 1812–1851) married at Niewieścin in 1831; his son Wojciech (1843–1917) had nine children at Serock, Wudzyn and Dobrcz; grandson Leon (1877–1945) died at Osielsko in the year the war ended. Four verified generations, with book and photo numbers in the Pelplin archive. Whether Stefan (1939) descends from them is unknown; the family speaks of the Szczecin area."}},
 {id:"s6",ln:"draminski",st:"verified",img:"scans/1863-Lutocin-S5-Antoni-Draminski-x-Antonina-Nadratowska.jpg",p:"franciszek_d",t:{pl:"Szlachta z Cywin Litwinek, od 1609 roku",en:"Petty nobility of Cywiny Litwinki, since 1609"},d:{pl:"Nazwisko Dramiński pochodzi od wsi Dramino pod Płońskiem i jest poświadczone w 1574 r. W księgach rodzina jest „szlachtą” i „właścicielami cząstkowymi”, czyli drobną szlachtą dzielącą zaścianek. Sąsiednia parafia Krajkowo notuje chrzty Dramińskich od 1609 r., za Zygmunta III. Łańcuch od Franciszka i Salomei Dobrskiej (ślub Gralewo 1772) przez Kajetana (1773), Piotra (1813), Antoniego (1840) i Juliana (1866) do Mariana, który w 1935 r. ożenił się w Markach pod Warszawą, liczy sześć pokoleń; dwa ogniwa odczytano ze skanów. Herbarze przypisują Dramińskim herb Suchekomnaty.",en:"The surname Dramiński comes from the village Dramino near Płońsk and is attested in 1574. In the registers the family is 'szlachta' and 'part-owners', petty nobility sharing a hamlet. The neighbouring parish of Krajkowo records Dramiński baptisms from 1609, under Sigismund III. The chain from Franciszek and Salomea Dobrska (married Gralewo 1772) through Kajetan (1773), Piotr (1813), Antoni (1840) and Julian (1866) to Marian, who married at Marki near Warsaw in 1935, runs six generations; two links were read from the scans. Armorials assign the Dramińskis the Suchekomnaty coat of arms."}},
 {id:"s7",ln:"draminski",st:"verified",img:"scans/grave-mragowo-antoni-zofia-draminscy-1.jpg",p:"antoni_dram",t:{pl:"Zawidz, 24 maja 1922: ślub dziadków",en:"Zawidz, 24 May 1922: the grandparents' wedding"},d:{pl:"Kosemin leży w parafii Zawidz w powiecie sierpeckim, a księga ślubów Zawidza zna dzień, w którym Antoni Dramiński, lat 24, poślubił Zofię Karczewską, lat 21: 24 maja 1922 r., akt 32. Ten sam akt podaje ich rodziców, Stanisława Dramińskiego z Teofilą Wiśniewską i Ignacego Karczewskiego z Anielą Chyżyńską, a wcześniejsze śluby z 1892, 1883, 1858 i 1857 r. prowadzą do Jakuba Dramińskiego, Marianny Naguszewskiej, Michała i Wiktorii. Po wojnie Antoni i Zofia osiedli w Mrągowie; na ich nagrobku jest wspólne zdjęcie. Brat Antoniego, Czesław, żołnierz AK, przeżył Stutthof.",en:"Kosemin lies in Zawidz parish, Sierpc county, and the Zawidz marriage register knows the day Antoni Dramiński, 24, married Zofia Karczewska, 21: 24 May 1922, act 32. The same act names their parents, Stanisław Dramiński and Teofila Wiśniewska, Ignacy Karczewski and Aniela Chyżyńska, and earlier marriages of 1892, 1883, 1858 and 1857 lead to Jakub Dramiński, Marianna Naguszewska, Michał and Wiktoria. After the war Antoni and Zofia settled in Mrągowo; their headstone carries a photograph of the two of them. Antoni's brother Czesław, a Home Army soldier, survived Stutthof."}},
 {id:"s15",ln:"kowalczyk",st:"verified",img:"scans/grave-olsztyn-gutkowo-witold-teresa-kowalczyk-1.jpg",p:"waclaw_k",t:{pl:"Groszki od Andrzeja do Alexandra: osiem pokoleń",en:"Groszki from Andrzej to Alexander: eight generations"},d:{pl:"Z aktem zgonu Henryka w ręku księgi Kałuszyna i Grębkowa dały linię bez przerwy: Wacław Kowalczyk, ur. 28 września 1899 r. w Groszkach; jego rodzice Antoni (1870) i Feliksa Łachniak, ślub 1892; dziadkowie Jan (1842, Sinołęka) i Anna Kołak, ślub 1862; pradziadkowie Antoni z Gójszcza i Magdalena Ściechowska, ślub w Grębkowie 2 lutego 1842 r.; Łukasz Kowalczyk (ok. 1787–1836) z Katarzyną Guziak; i Andrzej Kowalczyk z Justyną Domańską, urodzeni w połowie XVIII wieku. Po stronie Ściechowskich Andrzej (ok. 1750–1826) ożenił się w 1792 r., a jego ojciec Bartłomiej przyszedł na świat za Augusta II. Rodzina Bronisława okazała się rodziną stryjeczną: Wacław i Bronisław byli braćmi stryjecznymi.",en:"With Henryk's death certificate in hand, the Kałuszyn and Grębków registers gave an unbroken line: Wacław Kowalczyk, born 28 September 1899 at Groszki; his parents Antoni (1870) and Feliksa Łachniak, married 1892; grandparents Jan (1842, Sinołęka) and Anna Kołak, married 1862; great-grandparents Antoni of Gójszcz and Magdalena Ściechowska, married at Grębków on 2 February 1842; Łukasz Kowalczyk (c. 1787–1836) and Katarzyna Guziak; and Andrzej Kowalczyk and Justyna Domańska, born in the mid-1700s. On the Ściechowski side Andrzej (c. 1750–1826) married in 1792, and his father Bartłomiej was born under August II. Bronisław's family turned out to be cousins: Wacław and Bronisław were first cousins."}},
 {id:"s14",ln:"kowalczyk",st:"verified",img:"scans/cert-1989-usc-olsztyn-witold-henryk-kowalczyk.jpg",p:"henryk",t:{pl:"Dwa akty zgonu, cztery imiona dziadków",en:"Two death certificates, four grandparents' names"},d:{pl:"Grzegorz odnalazł odpisy aktów zgonu rodziców. Akt z USC Olsztyn: Witold Henryk Kowalczyk, ur. 31 października 1932 r. w Groszkach Starych, zm. 27 września 1989 r., syn Wacława Kowalczyka i Marianny Buczyńskiej. Akt z USC Barczewo: Teresa Kowalczyk z d. Dramińska, ur. 26 września 1935 r. w Koseminie pod Żurominem, zm. 18 lutego 2017 r., córka Antoniego Dramińskiego i Zofii Karczewskiej. Dwie kartki zamknęły dwie największe luki i poprawiły drzewo: Henryk nie był synem Bronisława, a Teresa nie pochodziła spod Warszawy, lecz z serca ziemi dramińskiej.",en:"Greg found his parents' death certificates. USC Olsztyn: Witold Henryk Kowalczyk, born 31 October 1932 at Groszki Stare, died 27 September 1989, son of Wacław Kowalczyk and Marianna Buczyńska. USC Barczewo: Teresa Kowalczyk née Dramińska, born 26 September 1935 at Kosemin near Żuromin, died 18 February 2017, daughter of Antoni Dramiński and Zofia Karczewska. Two sheets of paper closed the two biggest gaps and corrected the tree: Henryk was not Bronisław's son, and Teresa came not from near Warsaw but from the heart of the Dramiński country."}},
 {id:"s8",ln:"kowalczyk",st:"verified",img:"scans/1943-straty-pl-Czeslaw-Kowalczyk-b1925-GroszkiStare-record-p1.jpg",p:"czeslaw_k1925",t:{pl:"Ryczyca, 29 listopada 1943",en:"Ryczyca, 29 November 1943"},d:{pl:"Czesław Kowalczyk, ur. 13 maja 1925 r. w Groszkach Starych, syn Bronisława i Aleksandry, miał osiemnaście lat, gdy niemieccy żandarmi z posterunku w Węgrowie rozstrzelali go w odwecie w Ryczycy razem z trzema sąsiadami. Pochowano go na miejscu, potem rodzina przeniosła ciało na cmentarz parafialny. Henryk miał wtedy jedenaście lat i mieszkał w tej samej wsi; Czesław był sąsiadem i zapewne kuzynem.",en:"Czesław Kowalczyk, born 13 May 1925 in Groszki Stare, son of Bronisław and Aleksandra, was eighteen when German gendarmes from the Węgrów post shot him in a reprisal at Ryczyca with three neighbours. He was buried where he fell; the family later moved him to the parish cemetery. Henryk was eleven and living in the same village; Czesław was a neighbour and probably a cousin."}},
 {id:"s9",ln:"kowalczyk",st:"verified",img:"img/ketrzyn_rastenburg_pocztowka_stary_rynek.jpg",p:"antoni_k",t:{pl:"Kowalczykowie z Groszek od 1857 roku",en:"The Kowalczyks of Groszki since 1857"},d:{pl:"Księgi parafii Kałuszyn znają w Groszkach kilka gospodarstw Kowalczyków: Antoniego i Magdalenę Ściechowską (dzieci od 1857 r.), ich syna Franciszka (1864–1922) z Józefą Bawolską, wnuka Bronisława z Aleksandrą Woźniak (ślub 1910), a także Jana i Annę Kołak (ślub 1862) z synem Antonim. Dziadkowie Grzegorza, Wacław Kowalczyk i Marianna Buczyńska, należą zapewne do jednego z nich; ich akty są teraz szukane. Nie znaleziono niczego, co wskazywałoby na ukraińskie pochodzenie: to katolickie Mazowsze, od Kałuszyna po Siedlce.",en:"The Kałuszyn parish books know several Kowalczyk households at Groszki: Antoni and Magdalena Ściechowska (children from 1857), their son Franciszek (1864–1922) and Józefa Bawolska, grandson Bronisław and Aleksandra Woźniak (married 1910), and Jan and Anna Kołak (married 1862) with their son Antoni. Greg's grandparents, Wacław Kowalczyk and Marianna Buczyńska, most likely belong to one of them; their records are now being searched. Nothing found points to Ukrainian descent: this is Catholic Mazowsze, from Kałuszyn to Siedlce."}},
 {id:"s10",ln:"zakierski",st:"possible",img:"scans/KPBC_Gazeta_Pomorska_1949-05-18_s5_Teresa_Zakierska_swietlica_crop.jpg",p:"helena",t:{pl:"Zakierscy w gazetach, 1925–1976",en:"Zakierskis in the newspapers, 1925–1976"},d:{pl:"Dwadzieścia jeden notatek prasowych z bibliotek cyfrowych: stolarz Piotr Zakierski nagrodzony za stół (1925), Helena Zakierska z Bydgoszczy w obozie pracy w maju 1945 r., Maria Zakierska szukająca synów trzy tygodnie po wojnie, Teresa Zakierska kierująca świetlicą dziecięcą fabryki narzędzi (1949), studentka UMK Zakierska ucząca tańca wiejskie koło ZMP (1949), wynalazek Wincentego Zakierskiego (1954). Zgodność nazwiska, bez dowodu pokrewieństwa; Helena może wiedzieć, kto to.",en:"Twenty-one press notices from the digital libraries: cabinet-maker Piotr Zakierski prized for a table (1925), Helena Zakierska of Bydgoszcz in a labour camp in May 1945, Maria Zakierska looking for her sons three weeks after the war, Teresa Zakierska running a tool factory's children's day-room (1949), a Toruń student Zakierska teaching a village youth circle to dance (1949), Wincenty Zakierski's invention (1954). Surname matches without proof of kinship; Helena may know who they were."}},
 {id:"s13",ln:"prelowski",st:"possible",img:"scans/grave-szczecin-stanislaw-prelowski-1900-1955.jpg",p:"stanislaw_p1900",t:{pl:"„Ze Szczecina”: Stanisław Prełowski, 1900–1955",en:"'From Szczecin': Stanisław Prełowski, 1900–1955"},d:{pl:"Rodzina pamięta, że Stefan urodził się „gdzieś pod Szczecinem”, choć w styczniu 1939 r. miasto było niemieckie, a wszyscy żyjący Prełowscy mieszkają pod Toruniem i Gdańskiem. Jest jedno wyjaśnienie: na Cmentarzu Centralnym w Szczecinie spoczywa Stanisław Prełowski, ur. 31 października 1900, zm. 25 grudnia 1955, z pokolenia chełmińskich braci Kazimierza (1896), Jana (1899) i Tomasza (1902). Gdyby Stefan urodził się w ziemi chełmińskiej w 1939 r., a jego rodzina przeniosła się po wojnie do Szczecina, pamięć rodzinna i akta zgadzałyby się co do joty. Możliwe, nie dowiedzione; rozstrzygnie akt ślubu z USC Toruń.",en:"The family remembers that Stefan was born 'somewhere near Szczecin', though in January 1939 the city was German and every living Prełowski lives near Toruń or Gdańsk. There is one explanation: in Szczecin Central Cemetery lies Stanisław Prełowski, born 31 October 1900, died 25 December 1955, of the generation of the Chełmno brothers Kazimierz (1896), Jan (1899) and Tomasz (1902). If Stefan was born in the Chełmno country in 1939 and his family moved to Szczecin after the war, family memory and the records would agree to the letter. Possible, not proven; the marriage record from the Toruń registry will decide."}},
 {id:"s11",ln:"prelowski",st:"possible",img:"scans/KPBC_Adresy_miasta_Chelmna_ok1925_s27_Prelowski_Jan_Prelowska_Marja_Rybacka6_crop.jpg",p:"marta_szcz",t:{pl:"Rybacka 3, Chełmno: sto lat pod jednym adresem",en:"Rybacka 3, Chełmno: a century at one address"},d:{pl:"Księga adresowa Chełmna z ok. 1925 r. notuje Jana Prełowskiego i Marję Prełowską, właścicielkę domu, przy Rybackiej 6. Karta z Buchenwaldu z 1945 r. umieszcza Martę Prełowską przy Rybackiej 3. Dziś pod Rybacką 3 zarejestrowane są firmy Wojciecha Tomasza i Wioletty Prełowskich. Jeśli Stefan (1939) pochodzi z tej rodziny, jeden telefon do Chełmna to wyjaśni.",en:"The Chełmno address list of about 1925 records Jan Prełowski and Marja Prełowska, house owner, at Rybacka 6. The Buchenwald card of 1945 places Marta Prełowska at Rybacka 3. Today businesses of Wojciech Tomasz and Wioletta Prełowski are registered at Rybacka 3. If Stefan (1939) comes from this family, one phone call to Chełmno will tell."}},
 {id:"s12",ln:"kowalczyk",st:"verified",img:"img/gizycko_lotzen_pocztowka_widok_miasta.jpg",p:"greg",t:{pl:"Z Mazowsza na Mazury, z Mazur do Kanady",en:"From Mazowsze to Masuria, from Masuria to Canada"},d:{pl:"Po 1945 r. Henryk z Groszek i Teresa z okolic Warszawy osiedli w Kętrzynie, dawnym Rastenburgu, jak tysiące Mazowszan. Grzegorz urodził się w Giżycku w 1970 r., dorastał w Kętrzynie i Olsztynie, 20 sierpnia 1989 r. wyjechał do Niemiec, 23 sierpnia 1991 r. ożenił się z Barbarą z Torunia, a 25 maja 1992 r. wylądowali w Kanadzie. Patricia urodziła się w Mississaudze w lipcu 1992 r., Alexander w 1998 r.",en:"After 1945 Henryk from Groszki and Teresa from near Warsaw settled in Kętrzyn, the former Rastenburg, like thousands of Mazovians. Greg was born in Giżycko in 1970, grew up in Kętrzyn and Olsztyn, left for Germany on 20 August 1989, married Barbara of Toruń on 23 August 1991, and they landed in Canada on 25 May 1992. Patricia was born in Mississauga in July 1992, Alexander in 1998."}}
];
function drawStories(){ const v=document.getElementById("v-stories"); v.innerHTML=`<h3>${t("stories_h")}</h3><p class="lead">${t("stories_p")}</p><div class="grid">${STORIES.map(s=>`<article class="story"><img loading="lazy" src="${s.img}" alt=""><div class="b"><div class="k"><span class="status" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${STC[s.st]};margin-right:6px"></span>${t("st_"+s.st)} · ${t("ln_"+s.ln)}</div><h4>${esc(tx(s.t))}</h4><p>${esc(tx(s.d))}</p><div class="acts"><button class="pri" data-p="${s.p}">${t("focus")}</button><button data-img="${s.img}">${L==="pl"?"Powiększ":"Enlarge"}</button></div></div></article>`).join("")}</div>`;
  v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>setMain(b.dataset.p)); v.querySelectorAll("[data-img]").forEach(b=>b.onclick=()=>{ const d=DOCS.find(x=>x.file===b.dataset.img); if(d) openLB(DOCS.indexOf(d),DOCS); else openLB(0,[{file:b.dataset.img,t:{en:"",pl:""},d:{en:"",pl:""}}]); }); }

let dk="all", dl="all";
function drawDocs(){ const v=document.getElementById("v-docs"); const kinds=["all","record","wartime","grave","address","press","photo","map"]; const list=DOCS.filter(x=>(dk==="all"||x.kind===dk)&&(dl==="all"||x.ln===dl)).sort((a,b)=>(a.year||0)-(b.year||0));
  v.innerHTML=`<h3>${t("docs_h")}</h3><p class="lead">${t("docs_p")}</p><div class="filters">${kinds.map(k=>`<button data-k="${k}" aria-pressed="${dk===k}">${t("k_"+k)}</button>`).join("")}</div><div class="filters">${["all","zakierski","prelowski","draminski","kowalczyk"].map(k=>`<button data-l="${k}" aria-pressed="${dl===k}">${k==="all"?t("k_all"):t("ln_"+k)}</button>`).join("")}</div>
  <div class="docgrid">${list.map(x=>`<button class="doc" data-id="${x.id}"><img loading="lazy" src="${x.file}" alt=""><div class="b"><div class="y">${x.year||""} · ${t("k_"+x.kind)}</div><div class="t">${esc(tx(x.t))}</div><span class="pill" style="background:${x.rel==="verified-line"?"var(--verified)":x.rel==="possible-kin"?"var(--possible)":"var(--unknown)"}">${t("rel_"+(x.rel==="verified-line"?"verified":x.rel==="possible-kin"?"possible":"context"))}</span></div></button>`).join("")}</div>`;
  v.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{dk=b.dataset.k;drawDocs();}); v.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{dl=b.dataset.l;drawDocs();}); v.querySelectorAll(".doc").forEach(b=>b.onclick=()=>openLB(list.findIndex(x=>x.id===b.dataset.id),list)); }

function drawMap(){ const v=document.getElementById("v-map"); const W=780,H=640, lo0=13.8,lo1=24.4,la0=48.9,la1=55.0; const X=lo=>(lo-lo0)/(lo1-lo0)*W, Y=la=>(la1-la)/(la1-la0)*H*0.98+8;
  const cnt=p=>PEOPLE.filter(q=>q.bp&&p.m.test(q.bp)).length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><path class="land" d="M${PL_OUTLINE.map(([a,b])=>X(a)+","+Y(b)).join(" L")} Z"/>`;
  PLACES.forEach((p,i)=>{ const x=X(p.lo),y=Y(p.la),c=cnt(p); const r=6+Math.min(c,20)*0.9; s+=p.cand?`<circle class="cand" cx="${x}" cy="${y}" r="9"/>`:`<circle class="pt" data-i="${i}" cx="${x}" cy="${y}" r="${r}" fill="var(--brick)" opacity=".85"/>`; s+=`<text x="${x+r+4}" y="${y+4}" font-weight="700">${p.n}</text>${c?`<text class="cap" x="${x+r+4}" y="${y+18}">${c} ${t("people")}</text>`:""}`; });

  <p style="margin-top:20px">${pl?"<strong>Zasada pierwsza.</strong> Żaden przodek nie trafia do drzewa bez źródła. Etykiety: <em>przekaz rodzinny</em> (wiedza Grzegorza), <em>potwierdzone w aktach</em> (zapis obejrzany w indeksie lub na skanie), <em>prawdopodobne</em> (jeden mocny wniosek z akt), <em>możliwe</em> (zgodność nazwiska, miejsca i czasu bez dowodu). Linia przerywana w drzewie oznacza powiązanie możliwe lub prawdopodobne. Luki pokazujemy jako puste pola, nie zgadujemy.":"<strong>Rule one.</strong> No ancestor enters the tree without a source. Labels: <em>family record</em> (Greg's knowledge), <em>verified record</em> (an entry seen in the index or on the scan), <em>probable</em> (one strong inference from records), <em>possible</em> (surname, place and timing match without proof). A dashed line in the tree marks a possible or probable link. Gaps are shown as empty boxes, never guessed."}</p>
  <p>${pl?"<strong>Źródła.</strong> Geneteka (indeks ksiąg metrykalnych Polskiego Towarzystwa Genealogicznego) i Metryki, Pomorskie Towarzystwo Genealogiczne (diecezja pelplińska), Skanoteka i szukajwarchiwach.gov.pl (Archiwa Państwowe), straty.pl i katalogi IPN, baza ofiar Muzeum Auschwitz, Arolsen Archives (Buchenwald, Stutthof), ecemetery.eu (cmentarze toruńskie), Kujawsko-Pomorska Biblioteka Cyfrowa (prasa i księgi adresowe 1908–1976), Słownik Geograficzny Królestwa Polskiego, nazwiska-polskie.pl, Wikimedia Commons, Fortepan i mapywig.org (zdjęcia i mapy). Każdy przypis podaje rok, numer aktu, parafię i indeksującego.":"<strong>Sources.</strong> Geneteka (the Polish Genealogical Society's index of parish registers) and Metryki, the Pomeranian Genealogical Society (Pelplin diocese), Skanoteka and szukajwarchiwach.gov.pl (State Archives), straty.pl and the IPN catalogues, the Auschwitz Museum victims' database, Arolsen Archives (Buchenwald, Stutthof), ecemetery.eu (Toruń cemeteries), the Kujawsko-Pomorska Digital Library (press and address books 1908–1976), the Geographical Dictionary of the Kingdom of Poland, nazwiska-polskie.pl, Wikimedia Commons, Fortepan and mapywig.org (photographs and maps). Each citation gives year, act number, parish and the volunteer indexer."}</p>
  <p>${pl?"<strong>Dlaczego pokolenie lat 30. jest najtrudniejsze.</strong> Akty urodzenia są w Polsce zamknięte przez 100 lat, śluby i zgony przez 80. Dlatego rodzice Henryka, Teresy, Stefana i Heleny nie są w żadnym publicznym indeksie, a ich własne akty może zamówić tylko zstępny. Poniżej lista dokumentów, które wypełnią puste pola.":"<strong>Why the 1930s generation is the hard part.</strong> Polish birth records stay closed for 100 years, marriages and deaths for 80. That is why the parents of Henryk, Teresa, Stefan and Helena are in no public index, and their own records can be ordered only by a descendant. Below is the list of documents that will fill the empty boxes."}</p>

let ti=-1; const tourEl=document.getElementById("tour");
function tourGo(i){ if(i<0||i>=TOUR.length){ tourEl.hidden=true; ti=-1; return; } ti=i; const s=TOUR[i]; upDepth=Math.max(upDepth,3); setMain(s.p,{mode:s.mode}); document.getElementById("tourK").textContent=`${t("tour_of")} ${i+1} / ${TOUR.length}`; document.getElementById("tourP").textContent=tx(s.t); tourEl.hidden=false; }
document.getElementById("tourBtn").onclick=()=>tourGo(0); document.getElementById("tourNext").onclick=()=>tourGo(ti+1); document.getElementById("tourPrev").onclick=()=>tourGo(Math.max(0,ti-1)); document.getElementById("tourX").onclick=()=>tourGo(-1);
document.addEventListener("keydown",e=>{ if(ti>=0&&!lb.open){ if(e.key==="ArrowRight") tourGo(ti+1); if(e.key==="ArrowLeft") tourGo(Math.max(0,ti-1)); if(e.key==="Escape") tourGo(-1); } });

document.getElementById("lang-en").onclick=()=>{ L="en"; try{localStorage.setItem("ft-lang","en");}catch(e){} render(); };
document.querySelectorAll("[data-fs]").forEach(b=>{ b.onclick=()=>{ document.documentElement.style.setProperty("--fs",b.dataset.fs+"px"); document.querySelectorAll("[data-fs]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); try{localStorage.setItem("ft-fs",b.dataset.fs);}catch(e){} if(view==="tree") drawChart(); }; });
try{ const fs=localStorage.getItem("ft-fs"); if(fs){ document.documentElement.style.setProperty("--fs",fs+"px"); document.querySelectorAll("[data-fs]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.fs===fs?"true":"false")); } else document.querySelector('[data-fs="18"]').setAttribute("aria-pressed","true"); }catch(e){}
readHash(); window.addEventListener("hashchange",()=>{ readHash(); render(); }); window.addEventListener("resize",()=>{ if(view==="tree") drawChart(); });
