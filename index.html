ik (official channel)", "src": "https://www.youtube.com/watch?v=Eg_Aa_hR1mw", "url": "https://www.youtube.com/watch?v=Eg_Aa_hR1mw", "embed": "https://www.youtube-nocookie.com/embed/Eg_Aa_hR1mw", "duration": "09:39"}]}, {"id": "gutkowo", "name": {"en": "Gutkowo (Olsztyn)", "pl": "Gutkowo (Olsztyn)"}, "de": "Göttkendorf", "lat": 53.8019, "lon": 20.4061, "summary": {"en": "Gutkowo began in 1352, when the Warmian cathedral chapter gave 60 łany to a Prussian named Godeken; the village is named after him. Its brick church of St Lawrence was built around 1375–1400 and consecrated in 1500. It is one of the two oldest churches in Olsztyn, with a terracotta frieze of the Wise Virgins, a timber tower of 1778 and a communion window once used for lepers. Napoleon is said to have watched the battle of 3 February 1807 from its tower. The village was strongly Polish-speaking: in 1861 438 of its 450 people spoke Polish, and between the wars it had a Polish reading room. The parish dates from 1871. After 1957 it was run by the Salesians, with ks. Henryk Jendryczka (1972–79) and ks. Jan Sposób (from 1979) as pastors in the years the family lived in Olsztyn. Olsztyn absorbed Gutkowo in stages, in 1966 and 1987. Witold Henryk and Teresa Kowalczyk rest in its parish cemetery.", "pl": "Gutkowo powstało w 1352 r., gdy kapituła warmińska nadała 60 łanów Prusowi Godekenowi; od jego imienia pochodzi nazwa wsi. Ceglany kościół św. Wawrzyńca zbudowano ok. 1375–1400 r., a konsekrowano w 1500 r. To jedna z dwóch najstarszych świątyń Olsztyna, z terakotowym fryzem panien mądrych, drewnianą wieżą z 1778 r. i okienkiem, przez które podawano komunię trędowatym. Według tradycji z jego wieży Napoleon obserwował bitwę 3 lutego 1807 r. Wieś była silnie polska: w 1861 r. po polsku mówiło 438 z 450 mieszkańców, a w okresie międzywojennym działała tu polska czytelnia. Parafię erygowano w 1871 r. Od 1957 r. prowadzą ją salezjanie; w latach olsztyńskich rodziny proboszczami byli ks. Henryk Jendryczka (1972–1979) i ks. Jan Sposób (od 1979 r.). Olsztyn wchłaniał Gutkowo etapami, w 1966 i 1987 r. Na cmentarzu parafialnym spoczywają Witold Henryk i Teresa Kowalczykowie."}, "timeline": [{"y": 1352, "en": "village founded by the Warmian chapter (locator Godeken)", "pl": "założenie wsi przez kapitułę warmińską (zasadźca Godeken)"}, {"y": 1375, "en": "St Lawrence's church built", "pl": "budowa kościoła św. Wawrzyńca"}, {"y": 1500, "en": "church consecrated, 26 Apr", "pl": "konsekracja kościoła, 26 kwietnia"}, {"y": 1778, "en": "upper wooden stage of the tower", "pl": "górna drewniana kondygnacja wieży"}, {"y": 1807, "en": "Napoleon on the tower, 3 Feb", "pl": "Napoleon na wieży, 3 lutego"}, {"y": 1871, "en": "parish erected, 7 Mar; parish cemetery in use", "pl": "erygowanie parafii, 7 marca; cmentarz parafialny"}, {"y": 1884, "en": "railway halt", "pl": "przystanek kolejowy"}, {"y": 1920, "en": "plebiscite: 475 for Prussia, 69 for Poland", "pl": "plebiscyt: 475 za Prusami, 69 za Polską"}, {"y": 1954, "en": "ks. Ignacy Tokarczuk parish priest", "pl": "proboszcz ks. Ignacy Tokarczuk"}, {"y": 1957, "en": "Salesians take over the parish", "pl": "parafię przejmują salezjanie"}, {"y": 1966, "en": "parts of Gutkowo incorporated into Olsztyn, 1 Jan", "pl": "włączenie części Gutkowa do Olsztyna, 1 stycznia"}, {"y": 1968, "en": "church in the monument register (no. 987), 27 Mar", "pl": "wpis kościoła do rejestru zabytków (nr 987), 27 marca"}, {"y": 1972, "en": "ks. Henryk Jendryczka SDB parish priest", "pl": "proboszcz ks. Henryk Jendryczka SDB"}, {"y": 1979, "en": "ks. Jan Sposób SDB parish priest, July", "pl": "proboszczem zostaje ks. Jan Sposób SDB, lipiec"}, {"y": 1987, "en": "291.73 ha of Gutkowo added to Olsztyn, 14 Nov", "pl": "włączenie 291,73 ha Gutkowa do Olsztyna, 14 listopada"}, {"y": 1989, "en": "Witold Henryk Kowalczyk buried here (data.js)", "pl": "pochówek Witolda Henryka Kowalczyka"}, {"y": 2007, "en": "conservation uncovers Gothic murals", "pl": "prace konserwatorskie odsłaniają gotyckie malowidła"}, {"y": 2017, "en": "Teresa Kowalczyk buried here (data.js)", "pl": "pochówek Teresy Kowalczyk"}], "family": [{"person": "greg", "from": 1975, "to": 1989, "role": {"en": "grew up in or around Gutkowo", "pl": "dorastał w Gutkowie lub w okolicy"}}, {"person": "henryk", "from": 1989, "to": 1989, "role": {"en": "buried in the parish cemetery, plot I/IV/07", "pl": "pochowany na cmentarzu parafialnym, kwatera I/IV/07"}}, {"person": "teresa", "from": 2017, "to": 2017, "role": {"en": "buried in the parish cemetery, plot I/IV/07", "pl": "pochowana na cmentarzu parafialnym, kwatera I/IV/07"}}], "sources": ["https://pl.wikipedia.org/wiki/Gutkowo_(Olsztyn)", "https://encyklopedia.warmia.mazury.pl/index.php/Gutkowo", "https://pl.wikipedia.org/wiki/Kościół_św._Wawrzyńca_w_Olsztynie", "https://dzieje.pl/node/27037", "https://pl.wikipedia.org/wiki/Parafia_św._Wawrzyńca_w_Olsztynie", "http://archwarmia.pl/parafie/olsztyn-swietego-wawrzynca/", "https://czasopisma.uwm.edu.pl/index.php/sw/article/download/204/166/333", "https://api.sejm.gov.pl/eli/acts/DU/1965/333/text.pdf", "https://api.sejm.gov.pl/eli/acts/MP/1987/290/text.pdf", "https://jakiwniosek.pl/instytucje/szkola-podstawowa/olsztyn/36859-szkola-podstawowa-nr-19-im-mikolaja-kopernika-w-olsztynie", "https://encyklopedia.warmia.mazury.pl/index.php/Zesp%C3%B3%C5%82_Szk%C3%B3%C5%82_Mechaniczno-Energetycznych_im._Tadeusza_Ko%C5%9Bciuszki_w_Olsztynie", "https://radioolsztyn.pl/olsztynski-zespol-szkol-samochodowych-swietuje-80-lecie-istnienia/01840178", "https://pl.wikipedia.org/wiki/I_Liceum_Og%C3%B3lnokszta%C5%82c%C4%85ce_im._Adama_Mickiewicza_w_Olsztynie", "https://pl.wikipedia.org/wiki/III_Liceum_Og%C3%B3lnokszta%C5%82c%C4%85ce_im._Miko%C5%82aja_Kopernika_w_Olsztynie"], "group": "greg", "media": [{"kind": "photo", "file": "img/wave6/gutkowo_kosciol_panoramio.jpg", "place": "gutkowo", "year": 2015, "t": {"en": "St Lawrence's church, Gutkowo, 2015", "pl": "Kościół św. Wawrzyńca w Gutkowie, 2015"}, "d": {"en": "The village church of Göttkendorf/Gutkowo, now within Olsztyn.", "pl": "Wiejski kościół Göttkendorf/Gutkowa, dziś w granicach Olsztyna."}, "credit": "Krzysztof Rakowski / CC BY-SA 3.0 (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Ko%C5%9Bci%C3%B3%C5%82ek_w_Gutkowie_-_panoramio.jpg"}, {"kind": "photo", "file": "img/wave6/gutkowo_kosciol_2012.jpg", "place": "gutkowo", "year": 2012, "t": {"en": "Gutkowo church, 2012", "pl": "Kościół w Gutkowie, 2012"}, "d": {"en": "", "pl": ""}, "credit": "Archetyp / CC BY-SA 3.0 pl (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Olsztyn_-_Gutkowo,_ko%C5%9Bci%C3%B3%C5%82_1.jpg"}, {"kind": "photo", "file": "img/wave6/gutkowo_kosciol_wnetrze_2010.jpg", "place": "gutkowo", "year": 2010, "t": {"en": "Gutkowo church, statue niche, 2010", "pl": "Kościół w Gutkowie, figura we wnęce, 2010"}, "d": {"en": "", "pl": ""}, "credit": "S.Czachorowski / CC BY-SA 3.0 (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Kosciol_w_Gutkowie_sc_29.JPG"}, {"kind": "map", "file": "img/wave6/map_MTB_1944_Gottkendorf_Gutkowo.jpg", "place": "gutkowo", "year": 1944, "t": {"en": "Topographic map 1:25,000, sheet 2188 Göttkendorf, 1944", "pl": "Mapa 1:25 000, arkusz 2188 Göttkendorf (Gutkowo), 1944"}, "d": {"en": "Southern part of the sheet: Göttkendorf village and church, Diwitten (Dywity), the edge of Allenstein.", "pl": "Południowa część arkusza: wieś i kościół Göttkendorf, Diwitten (Dywity), skraj Allenstein."}, "credit": "Deutsche Heereskarte (OKH/GenStdH), scan UC Berkeley / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/German_maps/series/025K_TK25/2188_Goettkendorf_XI.1944_uniberk_C057608625.jpg"}]}, {"id": "barczewo", "name": {"en": "Barczewo", "pl": "Barczewo"}, "de": "Wartenburg", "lat": 53.8303, "lon": 20.6928, "summary": {"en": "Barczewo, the German Wartenburg, is a small Warmian town about 15 km north-east of Olsztyn, chartered by the bishop of Warmia in 1364. It has two Gothic churches: St Anne's, begun in 1386, and the former Franciscan church of St Andrew with its Renaissance monument to the Batory brothers. The Franciscan friary later became a notorious prison, where Erich Koch, the Nazi Gauleiter of East Prussia, died in 1986 and where political prisoners were held in the 1980s. The town is the birthplace of the composer Feliks Nowowiejski (1877). In 1946 it was briefly named Nowowiejsk after him, then Barczewo after the priest and Polish activist Walenty Barczewski. Its 1894 synagogue is the last one standing in Warmia. Teresa Kowalczyk, née Dramińska, died here on 18 February 2017. She was buried beside her husband in Gutkowo.", "pl": "Barczewo, niemiecki Wartenburg, to małe warmińskie miasto ok. 15 km na północny wschód od Olsztyna; prawa miejskie nadał mu biskup warmiński w 1364 r. Ma dwa gotyckie kościoły: św. Anny, budowany od 1386 r., i dawny franciszkański św. Andrzeja z renesansowym pomnikiem braci Batorych. W dawnym klasztorze franciszkanów urządzono więzienie; w 1986 r. zmarł w nim Erich Koch, nazistowski gauleiter Prus Wschodnich, a w latach 80. przetrzymywano tu więźniów politycznych. Tu urodził się kompozytor Feliks Nowowiejski (1877). W 1946 r. miasto krótko nosiło nazwę Nowowiejsk, a potem otrzymało imię księdza i działacza polskiego Walentego Barczewskiego. Synagoga z 1894 r. jest ostatnią zachowaną na Warmii. Tu 18 lutego 2017 r. zmarła Teresa Kowalczyk z domu Dramińska. Spoczęła obok męża w Gutkowie."}, "timeline": [{"y": 1364, "en": "town rights, 4 Jul", "pl": "prawa miejskie, 4 lipca"}, {"y": 1386, "en": "St Anne's church begun", "pl": "początek budowy kościoła św. Anny"}, {"y": 1877, "en": "Feliks Nowowiejski born", "pl": "narodziny Feliksa Nowowiejskiego"}, {"y": 1894, "en": "synagogue built", "pl": "budowa synagogi"}, {"y": 1946, "en": "named Nowowiejsk, then Barczewo, 4 Dec", "pl": "nazwa Nowowiejsk, potem Barczewo, 4 grudnia"}, {"y": 1986, "en": "Erich Koch dies in Barczewo prison", "pl": "śmierć Ericha Kocha w więzieniu w Barczewie"}, {"y": 2017, "en": "Teresa Kowalczyk dies here, 18 Feb (data.js)", "pl": "śmierć Teresy Kowalczyk, 18 lutego"}], "family": [{"person": "teresa", "from": 2017, "to": 2017, "role": {"en": "died here, 18 Feb 2017", "pl": "tu zmarła, 18 lutego 2017"}}], "sources": ["https://pl.wikipedia.org/wiki/Barczewo"], "group": "greg", "media": [{"kind": "photo", "file": "img/wave6/barczewo_brama_2007.jpg", "place": "barczewo", "year": 2007, "t": {"en": "Barczewo, bridge gate, 2007", "pl": "Barczewo, brama mostowa, 2007"}, "d": {"en": "", "pl": ""}, "credit": "Maly LOLek / Public domain (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Barczewo_brama_mostowa.jpg"}, {"kind": "photo", "file": "img/wave6/barczewo_staw_2011.jpg", "place": "barczewo", "year": 2011, "t": {"en": "Barczewo, prison pond, 2011", "pl": "Barczewo, Staw Więzienny, 2011"}, "d": {"en": "", "pl": ""}, "credit": "Lodzia69 / CC BY-SA 3.0 (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Barczewo_Staw_Wi%C4%99zienny.jpg"}, {"kind": "map", "file": "img/wave6/map_MTB_1936_Wartenburg_Barczewo.jpg", "place": "barczewo", "year": 1936, "t": {"en": "Messtischblatt 1:25,000, sheet 2190 Wartenburg, 1936", "pl": "Mapa 1:25 000 (Messtischblatt) 2190 Wartenburg (Barczewo), 1936"}, "d": {"en": "", "pl": ""}, "credit": "Reichsamt für Landesaufnahme / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/German_maps/series/025K_TK25/2190_Wartenburg_1936.jpg"}]}, {"id": "torun", "name": {"en": "Toruń, 1955–1992", "pl": "Toruń w latach 1955–1992"}, "de": "Thorn", "lat": 53.0156, "lon": 18.6192, "summary": {"en": "Barbara was born in Toruń on 30 November 1966 and grew up in a city that nearly doubled in her childhood: about 106,000 people in 1960, 130,000 in 1970, 173,000 in 1980 and almost 200,000 by 1990. The growth came from new industry on the right bank: the Elana polyester-fibre works (first fibre at Christmas 1963, at its peak about 7,000 workers), the Merinotex worsted mill (1965), Apator switchgear, Towimor ship fittings, the Polchem chemical plant and the dressings works founded in 1951 and known today as TZMO. Workers were housed in large prefabricated estates: Młodych and Tysiąclecia in the 1960s, Rubinkowo (1968–80) beside Elana, and Na Skarpie from the late 1970s. For the 500th anniversary of Copernicus's birth in 1973 the university got its new campus at Bielany, and in 1975 Toruń became a voivodeship capital. In August 1980 Towimor and Apator struck in solidarity with Gdańsk; on 28 November 1981 about 29,000 people marched through the city, and under martial law 211 people from the voivodeship were interned. Her grandparents Julian and Zofia Zakierski and her father Stefan lie in St George's cemetery on Gałczyńskiego street.", "pl": "Barbara urodziła się w Toruniu 30 listopada 1966 r. i dorastała w mieście, które w czasie jej dzieciństwa niemal się podwoiło: ok. 106 tys. mieszkańców w 1960 r., 130 tys. w 1970, 173 tys. w 1980 i prawie 200 tys. w 1990 r. Wzrost dała nowa prawobrzeżna przemysłówka: Elana (pierwsze włókno poliestrowe w Boże Narodzenie 1963 r., w szczycie ok. 7 tys. pracowników), przędzalnia czesankowa Merinotex (1965), Apator, Towimor, Polchem i założone w 1951 r. zakłady opatrunkowe, dziś TZMO. Załogi zamieszkały w wielkich osiedlach z wielkiej płyty: Młodych i Tysiąclecia w latach 60., Rubinkowie (1968–1980) obok Elany i Na Skarpie od końca lat 70. Na 500-lecie urodzin Kopernika w 1973 r. uniwersytet dostał miasteczko akademickie na Bielanach, a w 1975 r. Toruń został stolicą województwa. W sierpniu 1980 r. Towimor i Apator strajkowały solidarnie z Gdańskiem; 28 listopada 1981 r. przez miasto przeszedł marsz ok. 29 tys. osób, a w stanie wojennym z województwa internowano 211 osób. Dziadkowie Barbary, Julian i Zofia Zakierscy, oraz jej ojciec Stefan spoczywają na cmentarzu św. Jerzego przy ul. Gałczyńskiego."}, "timeline": [{"y": 1945, "en": "24 Aug: Nicolaus Copernicus University (UMK) founded, continuing Wilno's Stefan Batory University.", "pl": "24 VIII: powołanie Uniwersytetu Mikołaja Kopernika, kontynuatora wileńskiego USB."}, {"y": 1951, "en": "Dressings works founded (today TZMO); Drosed, the first industrial poultry plant in Poland, starts.", "pl": "Powstają zakłady opatrunkowe (dziś TZMO) i Drosed, pierwszy w kraju przemysłowy zakład drobiarski."}, {"y": 1958, "en": "Large estates begin: Zjednoczenia (1958–61), Młodych (1958–66), Tysiąclecia (1961–64).", "pl": "Ruszają wielkie osiedla: Zjednoczenia (1958–61), Młodych (1958–66), Tysiąclecia (1961–64)."}, {"y": 1963, "en": "24–25 Dec: first polyester fibre at Elana (enterprise founded 1961).", "pl": "24–25 XII: pierwsze włókno poliestrowe w Elanie (przedsiębiorstwo od 1961 r.)."}, {"y": 1964, "en": "St George's cemetery address changes from ul. św. Jerzego to ul. Gałczyńskiego.", "pl": "Cmentarz św. Jerzego zmienia adres z ul. św. Jerzego na ul. Gałczyńskiego."}, {"y": 1965, "en": "Merinotex worsted mill begins production.", "pl": "Rusza produkcja w przędzalni czesankowej Merinotex."}, {"y": 1966, "en": "30 Nov: Barbara Maria Prełowska born in Toruń.", "pl": "30 XI: w Toruniu rodzi się Barbara Maria Prełowska."}, {"y": 1968, "en": "Rubinkowo estate under construction (1968–80), beside Elana.", "pl": "Budowa osiedla Rubinkowo (1968–1980) obok Elany."}, {"y": 1973, "en": "Feb: 500th anniversary of Copernicus's birth; UMK campus at Bielany built for the jubilee; international conferences.", "pl": "II: 500-lecie urodzin Kopernika; na jubileusz powstaje miasteczko UMK na Bielanach; konferencje międzynarodowe."}, {"y": 1975, "en": "Toruń becomes capital of the new Toruń voivodeship.", "pl": "Toruń stolicą nowego województwa toruńskiego."}, {"y": 1976, "en": "1 Apr: parishes of Our Lady Victorious and St George (ul. Podgórna) and St Michael erected.", "pl": "1 IV: erygowane parafie MB Zwycięskiej i św. Jerzego (ul. Podgórna) oraz św. Michała Archanioła."}, {"y": 1980, "en": "21 Aug: solidarity strike at Towimor; 28 Aug Apator joins; 30 Aug inter-factory strike committee; 24 Nov St Maximilian Kolbe parish on Rubinkowo.", "pl": "21 VIII: strajk solidarnościowy w Towimorze; 28 VIII dołącza Apator; 30 VIII MKS; 24 XI parafia św. Maksymiliana Kolbego na Rubinkowie."}, {"y": 1981, "en": "25 May Freedom March; 28 Nov protest march of about 29,000; 13 Dec martial law, 14 Dec four-hour strike at Towimor. Toruń is also the centre of the party 'horizontal structures' reform movement.", "pl": "25 V Marsz Wolności; 28 XI marsz protestacyjny ok. 29 tys. osób; 13 XII stan wojenny, 14 XII czterogodzinny strajk w Towimorze. Toruń to także ośrodek ruchu „struktur poziomych” w PZPR."}, {"y": 1982, "en": "1 and 3 May: the largest martial-law street protests in the region, 288 detained; 22 Jun 'Elana group' trial.", "pl": "1 i 3 V: największe w regionie zamieszki stanu wojennego, 288 zatrzymanych; 22 VI wyrok w procesie „grupy elanowskiej”."}, {"y": 1987, "en": "16 Nov: parish of the Body and Blood of Christ for Na Skarpie.", "pl": "16 XI: parafia Najświętszego Ciała i Krwi Chrystusa na Skarpie."}, {"y": 1991, "en": "Jul: Soviet troops leave Toruń. 23 Aug: Barbara marries Greg (place not yet recorded).", "pl": "VII: wojska radzieckie opuszczają Toruń. 23 VIII: ślub Barbary i Grzegorza (miejsce jeszcze nieustalone)."}, {"y": 1992, "en": "25 Mar: diocese of Toruń created. Barbara emigrates to Canada.", "pl": "25 III: utworzenie diecezji toruńskiej. Barbara emigruje do Kanady."}], "family": [{"person": "barbara", "from": 1966, "to": 1992, "role": {"en": "born and grew up here", "pl": "urodzona i wychowana"}}, {"person": "stefan", "from": null, "to": 2025, "role": {"en": "came for military service, married, stayed; died 15 Jul 2025, grave K/10/21 St George's", "pl": "przybył na służbę wojskową, ożenił się i został; zm. 15 VII 2025, grób K/10/21 na cm. św. Jerzego"}}, {"person": "helena", "from": null, "to": null, "role": {"en": "moved from Osówka as a young woman", "pl": "przeprowadziła się z Osówki jako młoda kobieta"}}, {"person": "julian_z1909", "from": null, "to": 1994, "role": {"en": "died in Toruń 2 Oct 1994; grave K/10/20 St George's", "pl": "zm. w Toruniu 2 X 1994; grób K/10/20 na cm. św. Jerzego"}}, {"person": "zofia", "from": null, "to": 2002, "role": {"en": "died in Toruń 10 Feb 2002; grave K/10/20", "pl": "zm. w Toruniu 10 II 2002; grób K/10/20"}}, {"person": "janina", "from": null, "to": null, "role": {"en": "sister, grew up in Toruń (presumed)", "pl": "siostra, dorastała w Toruniu (przypuszczalnie)"}}, {"person": "anna", "from": null, "to": null, "role": {"en": "sister (presumed Toruń)", "pl": "siostra (przypuszczalnie Toruń)"}}, {"person": "aleksandra", "from": null, "to": null, "role": {"en": "sister (presumed Toruń)", "pl": "siostra (przypuszczalnie Toruń)"}}, {"person": "agnieszka", "from": 1975, "to": null, "role": {"en": "youngest sister (presumed Toruń)", "pl": "najmłodsza siostra (przypuszczalnie Toruń)"}}], "sources": ["https://pl.wikipedia.org/wiki/Toru%C5%84", "https://pl.wikipedia.org/wiki/Historia_Torunia", "https://pl.wikipedia.org/wiki/Elana_(Toru%C5%84)", "https://pl.wikipedia.org/wiki/Apator", "https://www.wiadomoscihandlowe.pl/przemysl-i-producenci/tzmo-podwojny-jubileusz-70-30-2397991", "https://repozytorium.umk.pl/bitstream/handle/item/4713/W.%20Rozynkowski-%20Rozw%C3%B3j%20sieci%20parafialnej%20w%20Toruniu.pdf?sequence=1", "https://pl.wikipedia.org/wiki/Cmentarz_%C5%9Bw._Jerzego_w_Toruniu", "https://encysol.pl/es/encyklopedia/hasla-rzeczowe/44437,Region-Torunski-NSZZ-Solidarnosc.html", "https://zpe.gov.pl/a/przeczytaj/DtOgRgUJk", "https://apcz.umk.pl/RTOR/article/view/52242", "https://cmentarnik.net/g/389710", "https://pl.wikipedia.org/wiki/II_Liceum_Og%C3%B3lnokszta%C5%82c%C4%85ce_im._Kr%C3%B3lowej_Jadwigi_w_Toruniu"], "group": "barbara", "media": [{"kind": "video", "place": "torun", "year": 1973, "t": {"en": "Copernicus 500th anniversary celebrated in Toruń, 1973 (AP Archive)", "pl": "Obchody 500. rocznicy urodzin Kopernika w Toruniu, 1973 (AP Archive)"}, "d": {"en": "AP newsreel dated 14 Feb 1973: Poland celebrates the 500th anniversary of Copernicus's birth in his home town.", "pl": "Materiał AP z 14.02.1973: obchody 500-lecia urodzin Kopernika w Toruniu."}, "credit": "AP Archive (official channel)", "src": "https://www.youtube.com/watch?v=VcrBKph_7d8", "url": "https://www.youtube.com/watch?v=VcrBKph_7d8", "embed": "https://www.youtube-nocookie.com/embed/VcrBKph_7d8", "duration": "02:09"}, {"kind": "video", "place": "torun", "year": 1949, "t": {"en": "Torun – Poland (1949), British Pathé", "pl": "Toruń (1949), British Pathé"}, "d": {"en": "Unissued 9-second clip: elevated views of Toruń and an old house (Pathé film ID 2288.02).", "pl": "Niewykorzystany 9-sekundowy materiał: widoki Torunia z góry."}, "credit": "British Pathé (official channel)", "src": "https://www.youtube.com/watch?v=hgqacGi5f0Q", "url": "https://www.youtube.com/watch?v=hgqacGi5f0Q", "embed": "https://www.youtube-nocookie.com/embed/hgqacGi5f0Q", "duration": "00:08"}, {"kind": "video", "place": "torun", "year": 1961, "t": {"en": "Toruń teatralny – theatre festival (PKF 27B/61)", "pl": "Toruń teatralny. Festiwal teatralny (PKF 27B/61)"}, "d": {"en": "Issue 1 Jul 1961.", "pl": "Wydanie 1.07.1961."}, "credit": "PKF / WFDiF (rights WFDiF)", "src": "https://repozytorium.fn.org.pl/?q=pl/node/10587", "url": "https://repozytorium.fn.org.pl/?q=pl/node/10587", "embed": null, "duration": "00:50"}, {"kind": "video", "place": "torun", "year": 1962, "t": {"en": "Teleskop – the observatory at Toruń (PKF 44B/62)", "pl": "Teleskop w obserwatorium w Toruniu (PKF 44B/62)"}, "d": {"en": "Radio telescope and Prof. Wilhelmina Iwanowska. Issue 29 Oct 1962.", "pl": "Radioteleskop i prof. Wilhelmina Iwanowska. Wydanie 29.10.1962."}, "credit": "PKF / WFDiF (rights WFDiF)", "src": "https://repozytorium.fn.org.pl/?q=pl/node/10718", "url": "https://repozytorium.fn.org.pl/?q=pl/node/10718", "embed": null, "duration": "00:53"}, {"kind": "video", "place": "torun", "year": 1965, "t": {"en": "Kongres Historii Nauki – Kraków and Toruń (PKF 36A/65)", "pl": "Kongres Historii Nauki. Kraków i Toruń (PKF 36A/65)"}, "d": {"en": "Scientists visit Toruń market square, Copernicus House and the town hall. Issue 31 Aug 1965.", "pl": "Naukowcy w Toruniu: Rynek, Dom Kopernika, Ratusz. Wydanie 31.08.1965."}, "credit": "PKF / WFDiF (rights WFDiF)", "src": "https://repozytorium.fn.org.pl/?q=pl/node/10626", "url": "https://repozytorium.fn.org.pl/?q=pl/node/10626", "embed": null, "duration": "01:16"}, {"kind": "video", "place": "torun", "year": 1971, "t": {"en": "Do-Ro – Marinotex worsted mill, Toruń (PKF 33A/71)", "pl": "Do-Ro. Toruńska Przędzalnia Czesankowa Marinotex (PKF 33A/71)"}, "d": {"en": "Women at the looms and the works culture house. Issue 18 Aug 1971.", "pl": "Pracownice przy krosnach i zakładowy dom kultury. Wydanie 18.08.1971."}, "credit": "PKF / WFDiF (rights WFDiF)", "src": "https://repozytorium.fn.org.pl/?q=pl/node/9623", "url": "https://repozytorium.fn.org.pl/?q=pl/node/9623", "embed": null, "duration": "01:19"}, {"kind": "video", "place": "torun", "year": 1979, "t": {"en": "Sport z gracją – rhythmic gymnastics championships in Toruń (PKF 24A/79)", "pl": "Sport z gracją. Mistrzostwa Polski w gimnastyce artystycznej, Toruń (PKF 24A/79)"}, "d": {"en": "Issue 13 Jun 1979.", "pl": "Wydanie 13.06.1979."}, "credit": "PKF / WFDiF (rights WFDiF)", "src": "https://repozytorium.fn.org.pl/?q=pl/node/11600", "url": "https://repozytorium.fn.org.pl/?q=pl/node/11600", "embed": null, "duration": null}, {"kind": "video", "place": "torun", "year": 1986, "t": {"en": "Kometa – Toruń university observatory (PKF 12/86)", "pl": "Kometa (PKF 12/86)"}, "d": {"en": "The Toruń university observatory during Halley's comet. Issue 19 Mar 1986.", "pl": "Obserwatorium Uniwersytetu Toruńskiego. Wydanie 19.03.1986."}, "credit": "PKF / WFDiF (rights WFDiF)", "src": "https://repozytorium.fn.org.pl/?q=pl/node/9355", "url": "https://repozytorium.fn.org.pl/?q=pl/node/9355", "embed": null, "duration": "01:51"}]}, {"id": "osowka_czernikowo", "name": {"en": "Osówka and Czernikowo", "pl": "Osówka i Czernikowo"}, "de": "Czernikowo 1942–45: Schwarzendorf; Osówka: UNVERIFIED (\"Ossowka: Espe\" in the Kreis Leipe list may be this village or another)", "lat": 52.9158, "lon": 18.9742, "summary": {"en": "Helena Zakierska was born on 9 August 1936 at Osówka, a village about 5 km south-east of Czernikowo in the old Dobrzyń land, now in gmina Czernikowo, Toruń county (565 inhabitants in 2021). Osówka has never had its own church: its people were baptised, married and buried through St Bartholomew's parish at Czernikowo. That brick Gothic church is dated to about 1370, was rebuilt about 1641, gained a transept, chancel, two chapels and sacristies in 1904, was consecrated in 1910, and was entered in the monument register as A/707 on 9 September 1964; its working bell was cast in 1707. Czernikowo itself is first recorded in 1309. Under the partitions the district lay in the Russian-ruled Kingdom of Poland (Lipno county, Płock governorate). In 1939 it was annexed to the Reich as Landkreis Leipe in the Marienwerder district of Reichsgau Danzig-Westpreußen; Czernikowo was renamed Schwarzendorf. Poles here suffered arrests, expulsions and killings, and partisans were active; the Red Army arrived in January 1945. After the war the parish stayed in the diocese of Włocławek and the gmina belonged to Włocławek voivodeship from 1975 to 1998.", "pl": "Helena Zakierska urodziła się 9 sierpnia 1936 r. w Osówce, wsi ok. 5 km na południowy wschód od Czernikowa, w dawnej ziemi dobrzyńskiej, dziś w gminie Czernikowo w powiecie toruńskim (565 mieszkańców w 2021 r.). Osówka nigdy nie miała własnego kościoła: jej mieszkańców chrzczono, żeniono i chowano w parafii św. Bartłomieja w Czernikowie. Ten gotycki ceglany kościół datowany jest na ok. 1370 r., przebudowano go ok. 1641 r., w 1904 r. dobudowano transept, prezbiterium, dwie kaplice i zakrystie, w 1910 r. go konsekrowano, a 9 września 1964 r. wpisano do rejestru zabytków pod nr A/707; używany dzwon odlano w 1707 r. Samo Czernikowo wzmiankowane jest od 1309 r. W czasie zaborów okolica leżała w Królestwie Polskim pod panowaniem rosyjskim (powiat lipnowski, gubernia płocka). W 1939 r. wcielono ją do Rzeszy jako Landkreis Leipe w rejencji kwidzyńskiej Okręgu Rzeszy Gdańsk-Prusy Zachodnie; Czernikowo przemianowano na Schwarzendorf. Polaków aresztowano, wysiedlano i mordowano, działała partyzantka; Armia Czerwona weszła w styczniu 1945 r. Po wojnie parafia pozostała w diecezji włocławskiej, a gmina w latach 1975–1998 należała do województwa włocławskiego."}, "timeline": [{"y": 1309, "en": "First record of Czernikowo.", "pl": "Pierwsza wzmianka o Czernikowie."}, {"y": 1370, "en": "c. 1370: Gothic church of St Bartholomew (completed c. 1449 per the infobox).", "pl": "Ok. 1370: gotycki kościół św. Bartłomieja (ukończony ok. 1449 wg infoboksu)."}, {"y": 1641, "en": "c. 1641: church rebuilt; renovations 1719, 1798.", "pl": "Ok. 1641: przebudowa kościoła; remonty 1719 i 1798."}, {"y": 1756, "en": "Earliest surviving Czernikowo baptisms indexed in Geneteka (births 1756–1911).", "pl": "Najstarsze zindeksowane chrzty z Czernikowa w Genetece (urodzenia 1756–1911)."}, {"y": 1815, "en": "Area falls to the Russian-ruled Kingdom of Poland (Lipno county, Płock governorate).", "pl": "Okolica w Królestwie Polskim pod zaborem rosyjskim (pow. lipnowski, gub. płocka)."}, {"y": 1863, "en": "Skirmishes of the January Uprising near Czernikowo.", "pl": "Potyczki powstania styczniowego w okolicy Czernikowa."}, {"y": 1904, "en": "Church enlarged: transept, chancel, chapels of Our Lady and St Isidore; consecrated 1910.", "pl": "Rozbudowa kościoła: transept, prezbiterium, kaplice MB i św. Izydora; konsekracja 1910."}, {"y": 1915, "en": "Russian army leaves; German occupation in WWI.", "pl": "Wycofanie Rosjan; okupacja niemiecka w czasie I wojny."}, {"y": 1918, "en": "Part of independent Poland (Warsaw voivodeship).", "pl": "W niepodległej Polsce (woj. warszawskie)."}, {"y": 1936, "en": "9 Aug: Helena Zakierska born at Osówka.", "pl": "9 VIII: w Osówce rodzi się Helena Zakierska."}, {"y": 1939, "en": "26 Oct: annexed to the Reich, Landkreis Leipe, Regierungsbezirk Marienwerder; arrests, expulsions, killings.", "pl": "26 X: wcielenie do Rzeszy, Landkreis Leipe, rejencja kwidzyńska; aresztowania, wysiedlenia, mordy."}, {"y": 1945, "en": "January: Red Army enters Czernikowo.", "pl": "Styczeń: Armia Czerwona wkracza do Czernikowa."}, {"y": 1964, "en": "9 Sep: church entered in the monument register, A/707.", "pl": "9 IX: kościół wpisany do rejestru zabytków, nr A/707."}, {"y": 1966, "en": "1966–70: renovation and partial re-Gothicisation of the church.", "pl": "1966–1970: remont i częściowa regotycyzacja kościoła."}, {"y": 1975, "en": "Gmina Czernikowo in Włocławek voivodeship (to 1998).", "pl": "Gmina Czernikowo w woj. włocławskim (do 1998)."}], "family": [{"person": "helena", "from": 1936, "to": null, "role": {"en": "born at Osówka 9 Aug 1936", "pl": "urodzona w Osówce 9 VIII 1936"}}, {"person": "julian_z1909", "from": 1909, "to": null, "role": {"en": "baptised at Czernikowo (act 214/1909); Helena's father", "pl": "ochrzczony w Czernikowie (akt 214/1909); ojciec Heleny"}}, {"person": "zofia", "from": null, "to": null, "role": {"en": "Helena's mother; marriage parish unknown", "pl": "matka Heleny; parafia ślubu nieznana"}}, {"person": "waclaw_z", "from": 1905, "to": null, "role": {"en": "married Julia Hinc at Czernikowo, 1905", "pl": "ślub z Julią Hinc w Czernikowie, 1905"}}, {"person": "julianna_hinc", "from": 1889, "to": null, "role": {"en": "baptised at Czernikowo 1889", "pl": "ochrzczona w Czernikowie 1889"}}, {"person": "irena_sib", "from": null, "to": null, "role": {"en": "Helena's sister", "pl": "siostra Heleny"}}, {"person": "waclaw_sib", "from": null, "to": null, "role": {"en": "Helena's brother", "pl": "brat Heleny"}}, {"person": "jozef_sib", "from": null, "to": null, "role": {"en": "Helena's youngest brother", "pl": "najmłodszy brat Heleny"}}], "sources": ["https://en.wikipedia.org/wiki/Os%C3%B3wka,_Kuyavian-Pomeranian_Voivodeship", "https://www.polskawliczbach.pl/wies_Osowka_czernikowo_kujawsko_pomorskie", "https://pl.wikipedia.org/wiki/Czernikowo", "https://pl.wikipedia.org/wiki/Ko%C5%9Bci%C3%B3%C5%82_%C5%9Bw._Bart%C5%82omieja_w_Czernikowie", "https://de.wikipedia.org/wiki/Landkreis_Leipe", "https://en.wikipedia.org/wiki/Reichsgau_Danzig-West_Prussia", "https://geneteka.genealodzy.pl/index.php?op=gt&lang=pol&w=02kp"], "group": "barbara", "media": []}, {"id": "steklin", "name": {"en": "Steklin", "pl": "Steklin"}, "de": "UNVERIFIED (not in the 1942 Kreis Leipe renaming list as read)", "lat": 52.9333, "lon": 19.0131, "summary": {"en": "Steklin, about 3 km from Osówka and the second-largest village in gmina Czernikowo (1,142 people in 2011, 998 in 2021), is the home village of the Hinc and Zakierski families. A small economic stronghold (gród) of the 12th–13th century stood here, a satellite of Czernikowo. In the late 18th century Steklin and Czernikowo passed to the Nałęcz family, and in the mid-19th century a late-classicist manor house was built with a park and an avenue running down to the lake. The parish registers of Czernikowo show the Hinc family at Steklin and Obrowo from at least the 1770s. Leonard Hinc married at Czernikowo in 1870 and raised nine children at Steklin; the youngest, Julia, married Wacław Zakierski in 1905, and their children Kazimiera (1906), Czesław (1907) and Julian (1909), Helena's father, were born here, with later children at neighbouring Szkleniec. Steklin shared Czernikowo's history: Russian partition until 1915, Polish from 1918, annexed to the Reich in 1939–45, then Włocławek voivodeship from 1975 to 1998. Julian later moved to Toruń, where he died in 1994.", "pl": "Steklin, ok. 3 km od Osówki, druga co do wielkości wieś gminy Czernikowo (1142 mieszkańców w 2011 r., 998 w 2021 r.), to gniazdo rodzin Hinców i Zakierskich. W XII–XIII w. stał tu niewielki gród gospodarczy, zaplecze Czernikowa. Pod koniec XVIII w. Steklin i Czernikowo przeszły w ręce Nałęczów, a w połowie XIX w. wzniesiono tu późnoklasycystyczny dwór z parkiem i aleją schodzącą ku jezioru. Księgi parafii Czernikowo notują Hinców w Steklinie i Obrowie co najmniej od lat 70. XVIII w. Leonard Hinc ożenił się w Czernikowie w 1870 r. i wychował w Steklinie dziewięcioro dzieci; najmłodsza, Julia, wyszła w 1905 r. za Wacława Zakierskiego, a ich dzieci Kazimiera (1906), Czesław (1907) i Julian (1909), ojciec Heleny, urodziły się tutaj, kolejne zaś w sąsiednim Szkleńcu. Steklin dzielił losy Czernikowa: zabór rosyjski do 1915 r., Polska od 1918 r., wcielenie do Rzeszy w latach 1939–1945, a w latach 1975–1998 województwo włocławskie. Julian przeniósł się później do Torunia, gdzie zmarł w 1994 r."}, "timeline": [{"y": 1200, "en": "12th–13th c.: small economic stronghold near Czernikowo.", "pl": "XII–XIII w.: niewielki gród gospodarczy koło Czernikowa."}, {"y": 1770, "en": "1770s: Hinc family recorded at Steklin/Obrowo in the Czernikowo registers.", "pl": "Lata 70. XVIII w.: Hincowie w Steklinie i Obrowie w księgach Czernikowa."}, {"y": 1790, "en": "Late 18th c.: Steklin and Czernikowo pass to the Nałęcz family.", "pl": "Koniec XVIII w.: Steklin i Czernikowo przechodzą na Nałęczów."}, {"y": 1850, "en": "Mid-19th c.: late-classicist manor house and park built.", "pl": "Poł. XIX w.: budowa późnoklasycystycznego dworu z parkiem."}, {"y": 1870, "en": "7 Feb: Leonard Hinc marries Katarzyna Plewa at Czernikowo.", "pl": "7 II: ślub Leonarda Hinca z Katarzyną Plewą w Czernikowie."}, {"y": 1889, "en": "Julia (Julianna) Hinc born at Steklin.", "pl": "W Steklinie rodzi się Julia (Julianna) Hinc."}, {"y": 1905, "en": "Wacław Zakierski marries Julia Hinc at Czernikowo (act 12).", "pl": "Ślub Wacława Zakierskiego z Julią Hinc w Czernikowie (akt 12)."}, {"y": 1909, "en": "21 Nov: Julian Zakierski, Helena's father, born at Steklin.", "pl": "21 XI: w Steklinie rodzi się Julian Zakierski, ojciec Heleny."}, {"y": 1939, "en": "Annexed to the Reich with the rest of the gmina.", "pl": "Wcielony do Rzeszy wraz z całą gminą."}, {"y": 1975, "en": "Włocławek voivodeship (to 1998).", "pl": "Województwo włocławskie (do 1998)."}], "family": [{"person": "leonard_hinc", "from": 1847, "to": null, "role": {"en": "born and farmed at Steklin", "pl": "urodzony i gospodarujący w Steklinie"}}, {"person": "julianna_hinc", "from": 1889, "to": null, "role": {"en": "born at Steklin", "pl": "urodzona w Steklinie"}}, {"person": "waclaw_z", "from": 1905, "to": 1930, "role": {"en": "farmed at Steklin and Szkleniec", "pl": "gospodarował w Steklinie i Szkleńcu"}}, {"person": "kazimiera_z1906", "from": 1906, "to": null, "role": {"en": "born at Steklin", "pl": "urodzona w Steklinie"}}, {"person": "czeslaw_z1907", "from": 1907, "to": null, "role": {"en": "born at Steklin", "pl": "urodzony w Steklinie"}}, {"person": "julian_z1909", "from": 1909, "to": null, "role": {"en": "born at Steklin; Helena's father", "pl": "urodzony w Steklinie; ojciec Heleny"}}], "sources": ["https://pl.wikipedia.org/wiki/Steklin", "https://www.citypopulation.de/en/poland/localities/bydgoskotorunski/czernikowo/0861802__steklin", "https://pl.wikipedia.org/wiki/Czernikowo", "https://geneteka.genealodzy.pl/index.php?op=gt&lang=pol&w=02kp"], "group": "barbara", "media": []}, {"id": "chelmno", "name": {"en": "Chełmno", "pl": "Chełmno"}, "de": "Kulm (1941–45: Kulm (Weichsel)); street: Fischerstraße = ul. Rybacka", "lat": 53.3508, "lon": 18.4297, "summary": {"en": "Chełmno, above the Vistula 40 km north of Toruń, is one of the oldest towns of the region: first named in 1065, given its charter, the Kulm law, on 28 December 1233, a Hanseatic member, Polish again from 1466, Prussian from 1772 and Polish once more from 22 January 1920. Its Fara church of the Assumption and its Renaissance town hall survive. In 1940 papers the Prełowski household lived at Rybacka 3 (Fischerstraße 3): Marta née Szczęsna, widow since 1912 of a farm labourer. Her son Stefan, born on 3 September 1910, passed his matura at the state boys' gymnasium in 1929. The town was occupied on 5 September 1939 and became Kulm in the Bromberg district of Reichsgau Danzig-Westpreußen. Between 12 October and 11 November 1939 the local Selbstschutz shot 2,000–2,500 people of the Chełmno land, teachers, priests, officials and craftsmen among them, in the Rybieniec forest at Klamry, 6 km east. Stefan, by then in Lwów, was on the first transport of Polish prisoners to Auschwitz on 14 June 1940, number 614. The Red Army entered on 27–28 January 1945. Whether this is Barbara's line is a possibility, not yet proven.", "pl": "Chełmno, na wzgórzu nad Wisłą 40 km na północ od Torunia, to jedno z najstarszych miast regionu: wzmiankowane w 1065 r., lokowane na prawie chełmińskim 28 grudnia 1233 r., członek Hanzy, od 1466 r. znów polskie, od 1772 r. pruskie i ponownie polskie od 22 stycznia 1920 r. Przetrwały fara Wniebowzięcia NMP i renesansowy ratusz. W dokumentach z 1940 r. dom Prełowskich mieszkał przy ul. Rybackiej 3 (Fischerstraße 3): Marta z Szczęsnych, od 1912 r. wdowa po robotniku rolnym. Jej syn Stefan, urodzony 3 września 1910 r., zdał w 1929 r. maturę w państwowym gimnazjum męskim. Miasto zajęto 5 września 1939 r.; jako Kulm weszło do rejencji bydgoskiej Okręgu Rzeszy Gdańsk-Prusy Zachodnie. Od 12 października do 11 listopada 1939 r. miejscowy Selbstschutz rozstrzelał w lesie Rybieniec pod Klamrami, 6 km na wschód, 2000–2500 mieszkańców ziemi chełmińskiej, w tym nauczycieli, księży, urzędników i rzemieślników. Stefan, wówczas już we Lwowie, trafił 14 czerwca 1940 r. do pierwszego transportu Polaków do Auschwitz, numer 614. Armia Czerwona weszła 27–28 stycznia 1945 r. Czy to linia Barbary, pozostaje możliwością, nie dowodem."}, "timeline": [{"y": 1065, "en": "First mention (Culmen) in a charter of Bolesław II for Mogilno abbey.", "pl": "Pierwsza wzmianka (Culmen) w dokumencie Bolesława II dla Mogilna."}, {"y": 1233, "en": "28 Dec: Kulm charter (prawo chełmińskie); renewed 1251.", "pl": "28 XII: przywilej chełmiński; odnowiony 1251."}, {"y": 1466, "en": "Second Peace of Toruń: back to the Polish Crown (Royal Prussia).", "pl": "II pokój toruński: powrót do Korony (Prusy Królewskie)."}, {"y": 1772, "en": "13 Sep: Prussian rule after the First Partition.", "pl": "13 IX: pod panowaniem pruskim po I rozbiorze."}, {"y": 1912, "en": "The farm-labourer father of the Rybacka 3 household dies.", "pl": "Umiera ojciec rodziny z Rybackiej 3, robotnik rolny."}, {"y": 1915, "en": "Józef Prełowski of Culm wounded in the Prussian army (casualty list 11 Oct 1915).", "pl": "Józef Prełowski z Chełmna ranny w armii pruskiej (lista strat 11 X 1915)."}, {"y": 1920, "en": "22 Jan: Haller's troops enter; Chełmno returns to Poland.", "pl": "22 I: wkraczają wojska Hallera; Chełmno wraca do Polski."}, {"y": 1925, "en": "c. 1925 address book: Jan Prełowski, Rybacka 6.", "pl": "Księga adresowa ok. 1925: Jan Prełowski, Rybacka 6."}, {"y": 1929, "en": "Stefan Prełowski (b. 1910) passes the matura at the state boys' gymnasium.", "pl": "Stefan Prełowski (ur. 1910) zdaje maturę w państwowym gimnazjum męskim."}, {"y": 1939, "en": "5 Sep occupied; 12 Oct–11 Nov Klamry/Rybieniec executions, 2,000–2,500 victims; 26 Nov Landkreis Kulm assigned to Regierungsbezirk Bromberg.", "pl": "5 IX zajęcie miasta; 12 X–11 XI egzekucje w Klamrach (las Rybieniec), 2000–2500 ofiar; 26 XI Landkreis Kulm w rejencji bydgoskiej."}, {"y": 1940, "en": "14 Jun: Stefan Prełowski (1910) on the first Polish transport to Auschwitz, no. 614; mother still at Fischerstraße 3.", "pl": "14 VI: Stefan Prełowski (1910) w pierwszym transporcie Polaków do Auschwitz, nr 614; matka wciąż przy Fischerstraße 3."}, {"y": 1941, "en": "21 May: town renamed Kulm (Weichsel).", "pl": "21 V: zmiana nazwy na Kulm (Weichsel)."}, {"y": 1944, "en": "Germans force prisoners to exhume and burn the Klamry bodies.", "pl": "Niemcy zmuszają więźniów do ekshumacji i spalenia zwłok w Klamrach."}, {"y": 1945, "en": "27–28 Jan: Soviet 70th Army enters; 10 Feb Stefan (1910) moved to Buchenwald, no. 128398.", "pl": "27–28 I: wkracza 70. Armia radziecka; 10 II Stefan (1910) przeniesiony do Buchenwaldu, nr 128398."}, {"y": 2005, "en": "20 Apr: Old Town declared a Historic Monument.", "pl": "20 IV: Stare Miasto pomnikiem historii."}], "family": [{"person": "prelowski_nn", "from": null, "to": 1912, "role": {"en": "farm labourer, died 1912", "pl": "robotnik rolny, zm. 1912"}}, {"person": "marta_szcz", "from": 1912, "to": 1940, "role": {"en": "widow at Rybacka 3", "pl": "wdowa przy Rybackiej 3"}}, {"person": "stefan_p1910", "from": 1910, "to": 1930, "role": {"en": "born here; matura 1929; Auschwitz no. 614", "pl": "urodzony tu; matura 1929; Auschwitz nr 614"}}, {"person": "kazimierz_p1896", "from": 1896, "to": 1967, "role": {"en": "buried Chełmno parish cemetery (kinship possible)", "pl": "pochowany na cm. parafialnym (pokrewieństwo możliwe)"}}, {"person": "jan_p1899", "from": 1899, "to": 1963, "role": {"en": "Rybacka 6 c. 1925 (kinship possible)", "pl": "Rybacka 6 ok. 1925 (pokrewieństwo możliwe)"}}, {"person": "tomasz_p1902", "from": 1902, "to": 1977, "role": {"en": "buried Chełmno (kinship possible)", "pl": "pochowany w Chełmnie (pokrewieństwo możliwe)"}}, {"person": "josef_p_ww1", "from": null, "to": null, "role": {"en": "Prussian soldier, wounded 1915", "pl": "żołnierz pruski, ranny 1915"}}, {"person": "prelowski_nn_son", "from": null, "to": null, "role": {"en": "hypothetical father of Stefan (1939) — POSSIBLE only", "pl": "hipotetyczny ojciec Stefana (1939) — tylko możliwe"}}], "sources": ["https://pl.wikipedia.org/wiki/Che%C5%82mno", "https://pl.wikipedia.org/wiki/Zbrodnia_w_Klamrach", "https://de.wikipedia.org/wiki/Landkreis_Kulm", "https://en.wikipedia.org/wiki/Reichsgau_Danzig-West_Prussia", "https://www.auschwitz.org/en/museum/news/first-there-were-the-poles,368.html", "https://en.wikipedia.org/wiki/First_mass_transport_to_Auschwitz_concentration_camp"], "group": "barbara", "media": [{"kind": "photo", "file": "img/wave6/chelmno_culm_rynek_1914.jpg", "place": "chelmno", "year": 1914, "t": {"en": "Culm (Chełmno), market square, postcard 1914", "pl": "Culm (Chełmno), rynek, pocztówka 1914"}, "d": {"en": "", "pl": ""}, "credit": "Conrad Junga, Bromberg / Public domain (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Culm_(Weichsel),_Westpreu%C3%9Fen_-_Marktplatz_(Zeno_Ansichtskarten).jpg"}, {"kind": "photo", "file": "img/wave6/chelmno_rynek_ratusz_1923_1930.jpg", "place": "chelmno", "year": 1923, "t": {"en": "Chełmno, market square and town hall, 1923–1930", "pl": "Chełmno, rynek i ratusz, 1923–1930"}, "d": {"en": "", "pl": ""}, "credit": "Unknown author / Public domain (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Chelmno_-_rynek,_ratusz,_stara_wieza_wodna_1923-1930_(70974254).jpg"}, {"kind": "photo", "file": "img/wave6/chelmno_kosciol_klasztorny_1935_1939.jpg", "place": "chelmno", "year": 1935, "t": {"en": "Chełmno, convent church, 1935–1939", "pl": "Chełmno, kościół klasztorny, 1935–1939"}, "d": {"en": "", "pl": ""}, "credit": "Unknown author / Public domain (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Chelmno_n._W._-_widok_na_kosciol_klasztorny._1935-1939_(70963151).jpg"}, {"kind": "photo", "file": "img/wave6/chelmno_widok_ogolny_1910_1920.jpg", "place": "chelmno", "year": 1910, "t": {"en": "Chełmno, general view, 1910–1920", "pl": "Chełmno, widok ogólny, 1910–1920"}, "d": {"en": "", "pl": ""}, "credit": "Unknown author / Public domain (Wikimedia Commons)", "src": "https://commons.wikimedia.org/wiki/File:Culm_i._Westpr._-_Total_-_Chelmno_-_widok_ogolny._1910-1920_(70963213).jpg"}, {"kind": "map", "file": "img/wave6/map_WIG_1938_Grudziadz_Chelmno.jpg", "place": "chelmno", "year": 1938, "t": {"en": "Military map 1:100,000, sheet Grudziądz, 1938: Chełmno and the Vistula", "pl": "Mapa WIG 1:100 000, arkusz Grudziądz, 1938: Chełmno i Wisła"}, "d": {"en": "Western part of sheet P35 S27 with Chełmno and Świecie.", "pl": "Zachodnia część arkusza P35 S27: Chełmno i Świecie."}, "credit": "Wojskowy Instytut Geograficzny / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/WIG_maps/series/100K_300dpi/P35_S27_GRUDZIADZ_1938_300dpi.jpg"}, {"kind": "map", "file": "img/wave6/map_MTB_1906_Culm_Chelmno.jpg", "place": "chelmno", "year": 1906, "t": {"en": "Messtischblatt 1:25,000, sheet 2676 Culm, 1906", "pl": "Mapa 1:25 000 (Messtischblatt) 2676 Culm (Chełmno), 1906"}, "d": {"en": "", "pl": ""}, "credit": "Königlich Preußische Landesaufnahme / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/German_maps/series/025K_TK25/2676_Culm_1906.jpg"}]}, {"id": "kosemin_zawidz", "name": {"en": "Kosemin and Zawidz (Sierpc county)", "pl": "Kosemin i Zawidz (powiat sierpecki)"}, "de": "Landkreis Sichelberg (Sierpc), Regierungsbezirk Zichenau; village names UNVERIFIED", "lat": 52.8628, "lon": 19.8897, "summary": {"en": "Greg's mother Teresa Dramińska was born at Kosemin on 26 September 1935, in Zawidz parish, Sierpc county, in northern Mazovia. Kosemin (Kossemin in the 19th-century gazetteer) gave its name to a rural gmina, seated at Zawidz, until 1954, and was itself the seat of a gromada from 1954 to 1961; about 220 people live there today. The parish village, Zawidz Kościelny (officially just Zawidz since 1999), a few kilometres south, is first recorded in 1350, when Duke Bolesław III of Płock granted it to the brothers Wojciech and Mikołaj Nagórka; the parish dates from about 1391. Its church of St Martin is wooden, the third on the site after churches of the 16th century and 1605; it was consecrated in 1877, kept Baroque altars and a 17th-century font, was renovated in 1947, painted by Antoni Rochowicz in 1957, and ceased to serve the liturgy in 1987. Here Antoni Dramiński and Zofia Karczewska, both of Kosemin, married on 24 May 1922. In 1939 Sierpc county was annexed as Landkreis Sichelberg in Regierungsbezirk Zichenau, attached to East Prussia. Teresa's uncle Czesław, a Home Army soldier from Kosemin, was arrested in 1944 and survived Stutthof.", "pl": "Matka Grzegorza, Teresa Dramińska, urodziła się w Koseminie 26 września 1935 r., w parafii Zawidz w powiecie sierpeckim, na północnym Mazowszu. Kosemin (w XIX-wiecznym Słowniku geograficznym „Kossemin”) do 1954 r. dawał nazwę gminie wiejskiej z siedzibą w Zawidzu, a w latach 1954–1961 sam był siedzibą gromady; mieszka tu dziś ok. 220 osób. Wieś parafialna, Zawidz Kościelny (od 1999 r. oficjalnie Zawidz), kilka kilometrów na południe, wzmiankowana jest w 1350 r., gdy książę płocki Bolesław III nadał ją braciom Wojciechowi i Mikołajowi Nagórkom; parafia powstała ok. 1391 r. Kościół św. Marcina jest drewniany, trzeci na tym miejscu po świątyniach z XVI w. i z 1605 r.; konsekrowano go w 1877 r., zachował barokowe ołtarze i XVII-wieczną chrzcielnicę, odnowiono go w 1947 r., w 1957 r. ozdobił polichromią Antoni Rochowicz, a w 1987 r. przestał pełnić funkcje liturgiczne. Tu 24 maja 1922 r. pobrali się Antoni Dramiński i Zofia Karczewska, oboje z Kosemina. W 1939 r. powiat sierpecki wcielono do Rzeszy jako Landkreis Sichelberg w rejencji ciechanowskiej, przyłączonej do Prus Wschodnich. Wuj Teresy, Czesław, żołnierz AK z Kosemina, aresztowany w 1944 r., przeżył Stutthof."}, "timeline": [{"y": 1350, "en": "Zawidz ('Zavicz') granted by Duke Bolesław III of Płock to the Nagórka brothers.", "pl": "Książę płocki Bolesław III nadaje Zawidz („Zavicz”) braciom Nagórkom."}, {"y": 1391, "en": "c. 1391: Zawidz parish established.", "pl": "Ok. 1391: powstanie parafii Zawidz."}, {"y": 1605, "en": "Second wooden church built (first in the early 16th c.).", "pl": "Budowa drugiego drewnianego kościoła (pierwszy z 1. poł. XVI w.)."}, {"y": 1877, "en": "Present wooden church of St Martin consecrated.", "pl": "Konsekracja obecnego drewnianego kościoła św. Marcina."}, {"y": 1892, "en": "Stanisław Dramiński marries Teofila Wiśniewska at Zawidz.", "pl": "Ślub Stanisława Dramińskiego z Teofilą Wiśniewską w Zawidzu."}, {"y": 1897, "en": "22 Nov: Antoni Dramiński born at Kosemin.", "pl": "22 XI: w Koseminie rodzi się Antoni Dramiński."}, {"y": 1922, "en": "24 May: Antoni Dramiński marries Zofia Karczewska at Zawidz (act 32).", "pl": "24 V: ślub Antoniego Dramińskiego z Zofią Karczewską w Zawidzu (akt 32)."}, {"y": 1935, "en": "26 Sep: Teresa Dramińska born at Kosemin.", "pl": "26 IX: w Koseminie rodzi się Teresa Dramińska."}, {"y": 1939, "en": "26 Oct: Sierpc county annexed as Landkreis Sichelberg, Regierungsbezirk Zichenau (East Prussia).", "pl": "26 X: powiat sierpecki wcielony jako Landkreis Sichelberg, rejencja ciechanowska (Prusy Wschodnie)."}, {"y": 1944, "en": "Czesław Dramiński of Kosemin (Home Army) arrested by the Gestapo; Stutthof no. 50534; survived.", "pl": "Czesław Dramiński z Kosemina (AK) aresztowany przez Gestapo; Stutthof nr 50534; przeżył."}, {"y": 1947, "en": "Church renovated; 1957 polychromy by Antoni Rochowicz.", "pl": "Remont kościoła; 1957 polichromia Antoniego Rochowicza."}, {"y": 1954, "en": "Gmina Kosemin abolished; Kosemin gromada 1954–61.", "pl": "Likwidacja gminy Kosemin; gromada Kosemin 1954–1961."}, {"y": 1987, "en": "Wooden church ceases to serve the liturgy.", "pl": "Drewniany kościół przestaje pełnić funkcje liturgiczne."}], "family": [{"person": "teresa", "from": 1935, "to": null, "role": {"en": "born at Kosemin", "pl": "urodzona w Koseminie"}}, {"person": "antoni_dram", "from": 1897, "to": null, "role": {"en": "born at Kosemin; married at Zawidz 1922", "pl": "urodzony w Koseminie; ślub w Zawidzu 1922"}}, {"person": "zofia_karcz", "from": 1902, "to": null, "role": {"en": "born in Zawidz parish; of Kosemin in 1922", "pl": "urodzona w parafii Zawidz; z Kosemina w 1922"}}, {"person": "stanislaw_dram", "from": 1892, "to": 1915, "role": {"en": "married at Zawidz 1892", "pl": "ślub w Zawidzu 1892"}}, {"person": "teofila_wis", "from": 1892, "to": null, "role": {"en": "married twice at Zawidz (1892, 1915)", "pl": "dwa śluby w Zawidzu (1892, 1915)"}}, {"person": "czeslaw_dram", "from": 1910, "to": 1944, "role": {"en": "farmer at Kosemin, Home Army, Stutthof survivor", "pl": "gospodarz w Koseminie, AK, przeżył Stutthof"}}], "sources": ["https://pl.wikipedia.org/wiki/Kosemin", "https://pl.wikipedia.org/wiki/Zawidz_Ko%C5%9Bcielny", "https://www.polskawliczbach.pl/wies_Kosemin", "https://en.wikipedia.org/wiki/Regierungsbezirk_Zichenau", "https://straty.pl/"], "group": "barbara", "media": [{"kind": "map", "file": "img/wave6/map_WIG_1935_Sierpc.jpg", "place": "zawidz", "year": 1935, "t": {"en": "Military map 1:100,000, sheet Sierpc, 1935", "pl": "Mapa WIG 1:100 000, arkusz Sierpc, 1935"}, "d": {"en": "Sierpc and its surroundings (P37 S29); Zawidz lies just east, on the Raciąż sheet.", "pl": "Sierpc i okolice (P37 S29); Zawidz leży tuż na wschód, na arkuszu Raciąż."}, "credit": "Wojskowy Instytut Geograficzny / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/WIG_maps/series/100K_300dpi/P37_S29_SIERPC_1935_300dpi_bcuj298337-288239.jpg"}, {"kind": "map", "file": "img/wave6/map_WIG_1935_Raciaz_Kosemin_Zawidz.jpg", "place": "kosemin", "year": 1935, "t": {"en": "Military map 1:100,000, sheet Raciąż, 1935: Kosemin and Zawidz", "pl": "Mapa WIG 1:100 000, arkusz Raciąż, 1935: Kosemin i Zawidz"}, "d": {"en": "Western part of the sheet (P37 S30) with Kosemin, Zawidz Kościelny and the Sierpc road.", "pl": "Zachodnia część arkusza (P37 S30): Kosemin, Zawidz Kościelny, droga do Sierpca."}, "credit": "Wojskowy Instytut Geograficzny / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/WIG_maps/series/100K_300dpi/P37_S30_RACIAZ_1935_300dpi_bcuj298338-288240.jpg"}]}, {"id": "groszki_kaluszyn", "name": {"en": "Groszki Stare and Kałuszyn (Mińsk county)", "pl": "Stare Groszki i Kałuszyn (powiat miński)"}, "de": "General Government, Distrikt Warschau (1939–44); Kreis UNVERIFIED", "lat": 52.2033, "lon": 21.9067, "summary": {"en": "Greg's father Henryk (Witold Henryk) Kowalczyk was born on 31 October 1932 at Groszki Stare, a small village about 6 km east of Kałuszyn (122 people in 2021). The 1827 survey counted 17 houses and 107 people there, and the Kowalczyk and Łachniak families appear in the Kałuszyn registers from the 1790s. Kałuszyn, the parish town, got town rights before 1662 (1718 by another account) and was overwhelmingly Jewish: 80% in 1827, 82% in 1921, 7,256 Jews in 1931. Its neo-Gothic church of the Assumption and St Stanislaus, by the architect Józef Pius Dziekoński, dates from the late 19th century. In September 1939 the war reached Groszki itself: on 8 September, according to the historian Zygmunt Mańkowski, about 600 people were killed by German bombing on the road at Stare Groszki and Marysin. A bomb killed 42 in Kałuszyn on 10 September, and on the night of 11–12 September Gen. Wincenty Kowalski's 1st Legions Infantry Division routed the German 44th Infantry Regiment there. The Germans set up a ghetto in 1940 and liquidated it from 25 September 1942: up to 1,000 people were shot, the rest sent to Treblinka. Henryk's second cousin Czesław was shot by German gendarmes in 1943.", "pl": "Ojciec Grzegorza, Henryk (Witold Henryk) Kowalczyk, urodził się 31 października 1932 r. w Starych Groszkach, małej wsi ok. 6 km na wschód od Kałuszyna, na wschód od Warszawy (122 mieszkańców w 2021 r.). W 1827 r. było tu 17 domów i 107 mieszkańców, a Kowalczykowie i Łachniakowie występują w księgach kałuszyńskich od lat 90. XVIII w. Kałuszyn, miasteczko parafialne, prawa miejskie otrzymał przed 1662 r. (wg innej wersji w 1718 r.) i był w przeważającej mierze żydowski: 80% w 1827 r., 82% w 1921 r., 7256 Żydów w 1931 r. Neogotycki kościół Wniebowzięcia NMP i św. Stanisława, dzieło architekta Józefa Piusa Dziekońskiego, pochodzi z końca XIX w. We wrześniu 1939 r. wojna dotarła do samych Groszek: 8 września, według historyka Zygmunta Mańkowskiego, na drodze przy Starych Groszkach i Marysinie od niemieckich bomb zginęło ok. 600 osób. 10 września bomba zabiła w Kałuszynie 42 osoby, a w nocy z 11 na 12 września 1 Dywizja Piechoty Legionów gen. Wincentego Kowalskiego rozbiła tam niemiecki 44. pułk piechoty. Niemcy utworzyli getto w 1940 r. i likwidowali je od 25 września 1942 r.: do tysiąca osób rozstrzelano, resztę wywieziono do Treblinki. Kuzyn Henryka, Czesław, zginął z rąk niemieckich żandarmów w 1943 r."}, "timeline": [{"y": 1662, "en": "Kałuszyn has town rights before this year (another account: 1718, granted by Augustus II at the Opacki family's request).", "pl": "Kałuszyn ma prawa miejskie przed 1662 r. (wg innej wersji 1718, nadane przez Augusta II staraniem Opackich)."}, {"y": 1790, "en": "1790s: Łachniak family recorded at Groszki, house 6.", "pl": "Lata 90. XVIII w.: Łachniakowie w Groszkach, dom nr 6."}, {"y": 1827, "en": "Groszki: 17 houses, 107 people; Kałuszyn 80% Jewish.", "pl": "Groszki: 17 domów, 107 mieszkańców; Kałuszyn w 80% żydowski."}, {"y": 1831, "en": "Three battles at Kałuszyn in the November Uprising (17 Feb, 2 Apr, 10 Jul).", "pl": "Trzy bitwy pod Kałuszynem w powstaniu listopadowym (17 II, 2 IV, 10 VII)."}, {"y": 1892, "en": "7 Feb: Antoni Kowalczyk marries Feliksa Łachniak at Kałuszyn.", "pl": "7 II: ślub Antoniego Kowalczyka z Feliksą Łachniak w Kałuszynie."}, {"y": 1899, "en": "28 Sep: Wacław Kowalczyk, Greg's grandfather, born at Groszki.", "pl": "28 IX: w Groszkach rodzi się Wacław Kowalczyk, dziadek Grzegorza."}, {"y": 1921, "en": "Kałuszyn: 5,033 Jews, 82% of the town.", "pl": "Kałuszyn: 5033 Żydów, 82% mieszkańców."}, {"y": 1932, "en": "31 Oct: Witold Henryk Kowalczyk born at Groszki Stare.", "pl": "31 X: w Starych Groszkach rodzi się Witold Henryk Kowalczyk."}, {"y": 1939, "en": "8 Sep: c. 600 killed by bombing on the road at Stare Groszki–Marysin (Mańkowski); 10 Sep 42 killed in Kałuszyn; 11–12 Sep battle of Kałuszyn; town set on fire.", "pl": "8 IX: ok. 600 zabitych w nalocie na drodze Stare Groszki–Marysin (Mańkowski); 10 IX 42 zabitych w Kałuszynie; 11–12 IX bitwa pod Kałuszynem; podpalenie miasta."}, {"y": 1940, "en": "Open ghetto set up in Kałuszyn (Judenrat from Nov 1939); c. 4,000 inmates by Dec 1941.", "pl": "Otwarte getto w Kałuszynie (Judenrat od XI 1939); ok. 4 tys. osób w XII 1941."}, {"y": 1942, "en": "From 25 Sep: ghetto liquidated, up to 1,000 shot, 2,000–3,000 deported to Treblinka; 9 Dec second ghetto liquidated.", "pl": "Od 25 IX: likwidacja getta, do 1000 rozstrzelanych, 2–3 tys. wywiezionych do Treblinki; 9 XII likwidacja drugiego getta."}, {"y": 1943, "en": "29 Nov: Czesław Kowalczyk (b. 1925, Groszki Stare) shot in a reprisal at Ryczyca.", "pl": "29 XI: Czesław Kowalczyk (ur. 1925, Stare Groszki) rozstrzelany w odwecie w Ryczycy."}, {"y": 1975, "en": "Siedlce voivodeship (to 1998).", "pl": "Województwo siedleckie (do 1998)."}], "family": [{"person": "henryk", "from": 1932, "to": null, "role": {"en": "born at Groszki Stare", "pl": "urodzony w Starych Groszkach"}}, {"person": "waclaw_k", "from": 1899, "to": null, "role": {"en": "born at Groszki; Greg's grandfather", "pl": "urodzony w Groszkach; dziadek Grzegorza"}}, {"person": "marianna_bucz", "from": null, "to": null, "role": {"en": "Greg's grandmother; parish unknown", "pl": "babka Grzegorza; parafia nieznana"}}, {"person": "antoni_k2", "from": 1870, "to": null, "role": {"en": "born at Groszki; married at Kałuszyn 1892", "pl": "urodzony w Groszkach; ślub w Kałuszynie 1892"}}, {"person": "feliksa_lach", "from": 1868, "to": null, "role": {"en": "born at Groszki", "pl": "urodzona w Groszkach"}}, {"person": "franciszek_k1864", "from": 1864, "to": 1922, "role": {"en": "born and died at Groszki", "pl": "urodzony i zmarły w Groszkach"}}, {"person": "bronislaw_k", "from": 1889, "to": null, "role": {"en": "born at Groszki; married at Kałuszyn 1910", "pl": "urodzony w Groszkach; ślub w Kałuszynie 1910"}}, {"person": "czeslaw_k1925", "from": 1925, "to": 1943, "role": {"en": "born at Groszki Stare; shot at Ryczyca 1943", "pl": "urodzony w Starych Groszkach; rozstrzelany w Ryczycy 1943"}}, {"person": "antoni_k", "from": 1842, "to": 1871, "role": {"en": "farmer at Groszki; died there 1871", "pl": "gospodarz w Groszkach; zm. tamże 1871"}}], "sources": ["https://pl.wikipedia.org/wiki/Stare_Groszki", "https://pl.wikipedia.org/wiki/Ka%C5%82uszyn", "https://en.wikipedia.org/wiki/Ka%C5%82uszyn", "https://pl.wikipedia.org/wiki/Bitwa_pod_Ka%C5%82uszynem_(1939)", "https://www.yahadmap.org/en/ka-uszyn-mazovian-poland/village-1151", "https://www.jewishgen.org/yizkor/kaluszyn/kal314.html", "https://www.tracesofwar.com/sights/85878", "https://commons.wikimedia.org/wiki/Category:Church_of_the_Assumption_in_Ka%C5%82uszyn", "https://sztetl.org.pl/pl/miejscowosci/k/536-kaluszyn"], "group": "barbara", "media": [{"kind": "map", "file": "img/wave6/map_WIG_1937_Minsk_Mazowiecki_Kaluszyn.jpg", "place": "kaluszyn", "year": 1937, "t": {"en": "Military map 1:100,000, sheet Mińsk Mazowiecki, 1937: Kałuszyn", "pl": "Mapa WIG 1:100 000, arkusz Mińsk Mazowiecki, 1937: Kałuszyn"}, "d": {"en": "North-eastern part of sheet P40 S33, from Mińsk Mazowiecki to Kałuszyn.", "pl": "Północno-wschodnia część arkusza P40 S33, od Mińska Mazowieckiego po Kałuszyn."}, "credit": "Wojskowy Instytut Geograficzny / Public domain (age; pre-1945 state map)", "src": "http://maps.mapywig.org/m/WIG_maps/series/100K_300dpi/P40_S33_MINSK_MAZOWIECKI_1937_300dpi_bcuj298417-288765.jpg"}]}, {"id": "szczecin", "name": {"en": "Szczecin (doubtful birthplace)", "pl": "Szczecin (wątpliwe miejsce urodzenia)"}, "de": "Stettin", "lat": 53.4285, "lon": 14.5528, "summary": {"en": "The family remembers Stefan Prełowski as born 'near Szczecin' on 4 January 1939. On that date Szczecin was Stettin, capital of the Prussian province of Pomerania, a German city of some 380,000 people from 1940. The Red Army took it on 26 April 1945, Polish administration became permanent on 5 July 1945, the name Szczecin was adopted on 4 October 1945, and the German population was expelled in 1946–47; about 70% of the new settlers came from central Poland. A Polish Catholic birth there in January 1939 is not impossible but would be unusual, and the city's grave register shows no Prełowski buried before 1955. The likelier reading is that his family moved to the Szczecin area after 1945, as many Pomeranian families did, and that he grew up there before army service brought him to Toruń. A Stanisław Prełowski (1900–1955) and a Pryłowski family lie in Szczecin's Central Cemetery: possible kin, unproven. Barbara's full birth act or her parents' marriage act from USC Toruń will settle it.", "pl": "Rodzina pamięta, że Stefan Prełowski urodził się 4 stycznia 1939 r. „pod Szczecinem”. W tym dniu Szczecin był niemieckim Stettinem, stolicą pruskiej prowincji Pomorze, od 1940 r. miastem ok. 380 tys. mieszkańców. Armia Czerwona zajęła go 26 kwietnia 1945 r., polska administracja objęła go na stałe 5 lipca 1945 r., nazwę Szczecin przyjęto 4 października 1945 r., a ludność niemiecką wysiedlono w latach 1946–1947; ok. 70% nowych mieszkańców przybyło z Polski centralnej. Polski katolicki poród w tym mieście w styczniu 1939 r. nie jest wykluczony, ale byłby czymś wyjątkowym, a miejski rejestr grobów nie zna żadnego Prełowskiego pochowanego przed 1955 r. Bardziej prawdopodobne, że rodzina przeniosła się w okolice Szczecina po 1945 r., jak wiele rodzin pomorskich, i Stefan tam dorastał, zanim służba wojskowa przywiodła go do Torunia. Na Cmentarzu Centralnym leżą Stanisław Prełowski (1900–1955) i rodzina Pryłowskich: możliwi krewni, niepotwierdzeni. Rozstrzygnie to odpis zupełny aktu urodzenia Barbary albo akt małżeństwa jej rodziców z USC Toruń."}, "timeline": [{"y": 1939, "en": "4 Jan: Stefan Prełowski born, place per family 'near Szczecin' (UNVERIFIED). Stettin is German.", "pl": "4 I: narodziny Stefana Prełowskiego, wg rodziny „pod Szczecinem” (NIEPOTWIERDZONE). Stettin jest niemiecki."}, {"y": 1945, "en": "26 Apr Red Army captures Stettin; 5 Jul permanent Polish administration; 4 Oct renamed Szczecin.", "pl": "26 IV Armia Czerwona zajmuje Stettin; 5 VII stała administracja polska; 4 X nazwa Szczecin."}, {"y": 1946, "en": "22 Feb: systematic expulsion of Germans begins (to late 1947).", "pl": "22 II: początek systematycznych wysiedleń Niemców (do końca 1947)."}, {"y": 1955, "en": "25 Dec: Stanisław Prełowski (b. 1900) dies; Central Cemetery 25B/7/10, buried alone.", "pl": "25 XII: umiera Stanisław Prełowski (ur. 1900); Cmentarz Centralny 25B/7/10, pochowany sam."}], "family": [{"person": "stefan", "from": 1939, "to": null, "role": {"en": "birthplace per family memory — doubtful", "pl": "miejsce urodzenia wg pamięci rodzinnej — wątpliwe"}}, {"person": "stanislaw_p1900", "from": null, "to": 1955, "role": {"en": "died and buried in Szczecin; possible father of Stefan", "pl": "zmarł i pochowany w Szczecinie; możliwy ojciec Stefana"}}], "sources": ["https://en.wikipedia.org/wiki/Szczecin", "https://cmentarze.szczecin.pl/chapter_11975.asp", "https://www.findagrave.com/memorial/266715673"], "group": "barbara", "media": []}];
const QUESTIONS={"greg": [{"en": "Why were you born in Giżycko when the family lived in Kętrzyn? Was it the Giżycko county hospital on ul. Warszawska, or did the family live in Giżycko c. 1965–72?", "pl": "Dlaczego urodziłeś się w Giżycku, skoro rodzina mieszkała w Kętrzynie? Czy był to szpital powiatowy w Giżycku przy ul. Warszawskiej, czy rodzina mieszkała w Giżycku ok. 1965–72?"}, {"en": "Where and when were you baptised (St Bruno's in Giżycko, St George's or St Catherine's in Kętrzyn)? Same question for Wiesław. Where did your parents marry?", "pl": "Gdzie i kiedy zostałeś ochrzczony (św. Brunona w Giżycku, św. Jerzego lub św. Katarzyny w Kętrzynie)? To samo pytanie o Wiesława. Gdzie wzięli ślub twoi rodzice?"}, {"en": "Your addresses in Kętrzyn (1970–75) and in Olsztyn (1975–89). Did you live in Gutkowo itself (which street?), in Likusy, or in a city estate? And which side of the 1966/1987 city boundary?", "pl": "Twoje adresy w Kętrzynie (1970–75) i w Olsztynie (1975–89). Czy mieszkaliście w samym Gutkowie (przy jakiej ulicy?), w Likusach, czy na osiedlu w mieście? Po której stronie granicy miasta z 1966/1987 r.?"}, {"en": "Which primary school did you attend? Was it SP 19 at ul. Bałtycka 151, or a different school before 1975 in Kętrzyn?", "pl": "Do której szkoły podstawowej chodziłeś? Czy była to SP 19 przy ul. Bałtyckiej 151, czy przed 1975 r. inna szkoła w Kętrzynie?"}, {"en": "Which secondary school did you attend (technikum mechaniczne at the Kościuszko school, the Samochodówka, a liceum, or another)? Which years, and did you start studies before leaving?", "pl": "Do której szkoły średniej chodziłeś (technikum mechaniczne w szkole im. Kościuszki, Samochodówka, liceum czy inna)? W jakich latach i czy zacząłeś studia przed wyjazdem?"}, {"en": "Were you an altar server, or did you make your First Communion or Confirmation at St Lawrence's in Gutkowo? Do you remember ks. Jendryczka or ks. Jan Sposób?", "pl": "Czy byłeś ministrantem, czy przystępowałeś do Pierwszej Komunii lub bierzmowania u św. Wawrzyńca w Gutkowie? Czy pamiętasz ks. Jendryczkę lub ks. Jana Sposoba?"}, {"en": "Where did your father work in Kętrzyn and in Olsztyn (Stomil? another plant)? Why did the family move in 1975?", "pl": "Gdzie pracował twój ojciec w Kętrzynie i w Olsztynie (Stomil? inny zakład)? Dlaczego rodzina przeprowadziła się w 1975 r.?"}, {"en": "Your memories of the Stomil strikes (Aug 1980, Dec 1981) or martial law in Olsztyn.", "pl": "Twoje wspomnienia ze strajków w Stomilu (sierpień 1980, grudzień 1981) lub ze stanu wojennego w Olsztynie."}, {"en": "Why was your mother in Barczewo in 2017 (living there, care home, hospital)?", "pl": "Dlaczego twoja mama była w 2017 r. w Barczewie (mieszkała tam, dom opieki, szpital)?"}, {"en": "Do you have family photos of the Gutkowo church, school, home, or the 1989 funeral?", "pl": "Czy masz rodzinne zdjęcia kościoła w Gutkowie, szkoły, domu albo pogrzebu z 1989 r.?"}], "barbara": [{"en": "Which primary school (szkoła podstawowa, number and street) did you attend in Toruń, and from which year?", "pl": "Do której szkoły podstawowej w Toruniu chodziłaś (numer, ulica) i od którego roku?"}, {"en": "Which secondary school did you attend (liceum, technikum, liceum medyczne, ekonomik)? Candidate names only: II LO im. Królowej Jadwigi, I LO im. Kopernika, Zespół Szkół Ekonomicznych — none confirmed.", "pl": "Do jakiej szkoły średniej chodziłaś (liceum, technikum, liceum medyczne, ekonomik)? Tylko kandydatki: II LO im. Królowej Jadwigi, I LO im. Kopernika, Zespół Szkół Ekonomicznych — żadna niepotwierdzona."}, {"en": "Every address the family lived at in Toruń, with years (street, estate: Rubinkowo, Na Skarpie, Bydgoskie Przedmieście, Mokre…).", "pl": "Wszystkie adresy rodziny w Toruniu z latami (ulica, osiedle: Rubinkowo, Na Skarpie, Bydgoskie Przedmieście, Mokre…)."}, {"en": "In which church were you baptised, and in which parish did you take First Communion and confirmation?", "pl": "W którym kościele zostałaś ochrzczona, a w której parafii przyjęłaś I Komunię i bierzmowanie?"}, {"en": "Where were you and Greg married on 23 Aug 1991: which registry office (USC) and which church?", "pl": "Gdzie wzięliście ślub 23 VIII 1991 r.: w którym USC i w którym kościele?"}, {"en": "Where did your parents Stefan and Helena marry (USC Toruń? which church?) and in what year?", "pl": "Gdzie i w którym roku pobrali się rodzice, Stefan i Helena (USC Toruń? który kościół?)?"}, {"en": "Where did your father work (Elana, Apator, Towimor, Polchem, Merinotex…)? And your mother?", "pl": "Gdzie pracował tata (Elana, Apator, Towimor, Polchem, Merinotex…)? A mama?"}, {"en": "Did your father ever say which town he grew up in, or mention Chełmno, ul. Rybacka, or relatives in Szczecin? Is his army service book (książeczka wojskowa) still in the family?", "pl": "Czy tata mówił, w jakim mieście dorastał, czy wspominał Chełmno, ul. Rybacką albo krewnych w Szczecinie? Czy w rodzinie zachowała się jego książeczka wojskowa?"}, {"en": "Which army unit or barracks in Toruń did your father serve in, and in which years?", "pl": "W której jednostce lub koszarach w Toruniu służył tata i w których latach?"}, {"en": "What was your grandmother Zofia Zakierska's maiden name, and where did she come from?", "pl": "Jakie było nazwisko panieńskie babci Zofii Zakierskiej i skąd pochodziła?"}, {"en": "When did your mother's family leave Osówka for Toruń, and did anyone stay on the farm? Do you remember visiting Osówka, Steklin or Czernikowo church?", "pl": "Kiedy rodzina mamy przeniosła się z Osówki do Torunia i czy ktoś został na gospodarstwie? Czy pamiętasz wizyty w Osówce, Steklinie albo w kościele w Czernikowie?"}, {"en": "Do you or your sisters remember the martial-law period (Dec 1981) in Toruń — strikes, curfews, anyone in the family interned or active in Solidarity?", "pl": "Czy Ty lub siostry pamiętacie stan wojenny w Toruniu (XII 1981) — strajki, godzinę milicyjną, czy ktoś z rodziny był internowany lub działał w Solidarności?"}, {"en": "Are there family photos of Toruń homes, school class photos, First Communion, or the 1991 wedding that could be scanned for the tree?", "pl": "Czy są rodzinne zdjęcia toruńskich mieszkań, klasowe, z I Komunii albo ze ślubu w 1991 r., które można zeskanować do drzewa?"}]};

    return L==="pl"?"pokrewieństwo nieustalone":"relationship not established"; }
  const {up,down}=best; const pl=L==="pl";

  if(up===1&&down===1) return pl?(sx==="M"?"brat":"siostra"):(sx==="M"?"brother":"sister");

  const deg=Math.min(up,down)-1, rem=Math.abs(up-down);
  return pl?`${sx==="M"?"kuzyn":"kuzynka"} ${deg}. stopnia${rem?` (${rem} pok. różnicy)`:""}`:`${["","first","second","third","fourth","fifth"][deg]||deg+"th"} cousin${rem?" "+rem+"× removed":""}`; }
